function enrichBuiltInLessons(){
 const byId={};
 for(const c of curriculum) for(const l of c.lessons) byId[l.id]={course:c,lesson:l};
 for(const [id,entry] of Object.entries(byId)){
  const l=entry.lesson, c=entry.course;
  if(lessonTeachingAssets[id]) l.teachingAsset=lessonTeachingAssets[id];
  if(l.beginnerExpanded) continue;
  const assetForPrimer=lessonTeachingAssets[id]||l.teachingAsset||{};
  const primerCore=(assetForPrimer.explanations||[])[0]||l.summary;
  const primerWhy=(assetForPrimer.explanations||[])[1]||l.exercise||'用一个最小输入验证这条规则。';
  const primer=beginnerPrimers[id]||`先把“${l.title}”看成一个需要解决的具体问题：${l.summary}。本节最重要的规则是：${primerCore}。为什么这条规则重要？${primerWhy} 初学时先掌握这条主线，再逐步补齐边界条件、工具细节和目标硬件差异。`;
  const commonMistakes={
   'l-pointer':'常见错误：混淆数组和指针、忘记缓冲区长度、使用已经失效的地址。排查时逐个确认地址来源、对象生命周期、访问宽度和索引边界。',
   'l-memory':'常见错误：把“RAM 还有空闲”当成栈一定够用；忘记 .data/.bss 的启动初始化；释放后继续使用指针。用 map 文件、栈高水位和资源统计验证，而不要只凭估算。',
   'l-volatile':'常见错误：认为 volatile 自动线程安全。检查共享变量是否会被 ISR/任务同时读写、读改写是否可被打断、临界区是否过长。',
   'l-mmio':'常见错误：直接照搬普通变量的读改写方式。先查寄存器访问属性、复位值、写 1 清零规则和外设时钟。',
   'l-startup':'常见错误：把 main 当作第一条执行语句。若 main 未命中断点，应向 Reset_Handler、向量表、栈顶、.data/.bss 初始化和时钟配置回溯。',
   'l-linker':'常见错误：只看编译错误，不看链接错误和 map 文件。修改地址前确认芯片实际内存容量、保留区和启动代码假设。',
   'l-irq':'常见错误：在 ISR 中做阻塞、长循环或大量日志。检查中断标志清除方式、优先级、共享变量与中断嵌套。',
   'l-uart':'常见错误：把一次接收回调当成一条完整消息。测试半包、粘包、非法长度、校验失败、超时和缓冲区溢出。',
   'l-dma':'常见错误：CPU 正在读取 DMA 正在写入的缓冲区。画出缓冲区所有权状态，验证事件顺序；有 D-Cache 的目标还要检查维护操作。',
   'l-sync':'常见错误：用一个全局变量代替同步机制，或在持锁时执行阻塞操作。明确资源唯一所有者、超时、锁顺序和 ISR API 约束。',
   'l-unit-test':'常见错误：只测试正常输入。补充空输入、边界值、非法参数、资源不足和失败恢复路径，并确保测试失败时能指出原因。',
   'l-mmu-cache':'常见错误：把地址转换、访问权限和缓存混为一谈。分别确认地址映射、访问属性和 DMA/CPU 数据一致性要求。',
   'l-bootloader':'常见错误：跳转前没有清理中断/向量表/栈状态，或未验证应用镜像。按目标芯片启动规范逐项核对。'
  };
  const pitfalls=commonMistakes[id]||`常见错误：只记住术语却没有确认输入、输出、边界条件和失败路径。遇到问题时先稳定复现，再一次只改变一个因素；保留编译选项、目标芯片、日志和测试步骤，避免凭印象猜原因。`;
  const qa = buildLessonQuestionAnswers(c,l,primer,pitfalls);
  const steps = buildLessonSteps(c,l);
  const exerciseAnswer = buildLessonExerciseAnswer(c,l);
  l.exerciseAnswer = exerciseAnswer;
  const examplePrinciple=(l.teachingAsset&&l.teachingAsset.explanations&&l.teachingAsset.explanations[0])||l.summary;
  l.sections.push(
   {teachingPart:true,heading:'核心原理：先把这件事讲明白',body:[primer,`读本课示例时首先抓住这一点：${examplePrinciple} 不必先背所有术语，先弄清输入是什么、机制如何改变数据/状态、边界在哪里，再看后续例子。`] },
   {teachingPart:true,heading:'一步一步推演：从输入到可验证结果',steps},
   {teachingPart:true,heading:'关键问题与直接答案',qa},
   {teachingPart:true,heading:'常见误区：现象、原因与排查',diagnostic:[
     {label:'高风险误区',text:pitfalls},
     {label:'先查什么',text:lessonDiagnosticOrder(c,l)},
     {label:'判断修复有效',text:'在相同配置与输入下重新运行原复现步骤，再补至少一个边界用例；保存期望值、实际值以及编译/工具/硬件证据。'}
   ]}
  );
  l.teachingQA=qa;
  l.beginnerExpanded=true;
  l.beginnerExpanded=true;
 }
}

function allCourses(){
 const deletedCourses=new Set(state.deletedCourseIds||[]),deletedLessons=new Set(state.deletedLessonIds||[]);
 const base=[...curriculum,...(state.customCourses||[])].filter(c=>!deletedCourses.has(c.id));
 return base.map(c=>{
  const ce=(state.courseEdits||{})[c.id]||{};
  const authored=[...(c.lessons||[]),...(((state.addedLessons||{})[c.id])||[])];
  const lessons=authored.filter(l=>!deletedLessons.has(l.id)).map(l=>({...l,...((state.lessonEdits||{})[l.id]||{})}));
  return {...c,...ce,lessons};
 });
}

function lessonContentForEditor(l){
 if(l.userEdited&&typeof l.editableContent==='string')return l.editableContent;
 const parts=[];
 const parentCourse=findLesson(l.id)?.course||null;
 (l.sections||[]).forEach(sec=>{
  const out=[`## ${sec.heading||'内容'}`];
  (sec.body||[]).forEach(x=>out.push(String(x)));
  (sec.bullets||[]).forEach(x=>out.push(`- ${x}`));
  if(sec.code)out.push('```c\n'+sec.code+'\n```');
  (sec.qa||[]).forEach(x=>out.push(`问题：${x.q}\n答案：${x.a}`));
  (sec.steps||[]).forEach((x,i)=>out.push(`${i+1}. ${x.title}：${x.text}`));
  (sec.diagnostic||[]).forEach(x=>out.push(`${x.label}：${x.text}`));
  parts.push(out.join('\n\n'));
 });
 if(l.teachingAsset){const a=l.teachingAsset;const x=[`## ${a.codeTitle||a.title||'针对性工程示例'}`];if(a.problem)x.push(`要解决的问题：${a.problem}`);if(a.code)x.push('```'+(a.language||'c')+'\n'+a.code+'\n```');if(a.note)x.push('工程说明：'+a.note);if(a.explanation)x.push('示例说明：'+a.explanation);if(Array.isArray(a.explanations)&&a.explanations.length)x.push('### 逐段说明\n'+a.explanations.map((text,i)=>`${i+1}. ${text}`).join('\n'));if(a.trace)x.push('执行追踪：'+(Array.isArray(a.trace)?a.trace.join('；'):a.trace));if(a.pitfall)x.push('注意：'+a.pitfall);if(parentCourse){const worked=buildWorkedExample(parentCourse,l);if(worked){x.push(`### 示例问题\n${worked.prompt}\n\n### 答案与推导\n${worked.answer}`);}else{x.push(`### 示例分析\n应用场景：${l.summary||l.title}\n\n参考分析：${lessonReferenceAnswers[l.id]||buildLessonExerciseAnswer(parentCourse,l)}`);}x.push('### 动手方法\n先写预期值，运行或单步执行，再记录实际结果；若结果不同，指出第一个不一致的步骤。');}parts.push(x.join('\n\n'));}
 if(l.teachingQA?.length)parts.push('## 常见问题与答案\n'+l.teachingQA.map(x=>`问题：${x.q}\n答案：${x.a}`).join('\n\n'));
 return parts.join('\n\n').trim();
}
function renderEditableLessonText(source){
 const lines=String(source||'').replace(/\r/g,'').split('\n');let out='',i=0;
 while(i<lines.length){let line=lines[i];if(!line.trim()){i++;continue;}
  if(/^```/.test(line.trim())){const lang=line.trim().slice(3).trim();const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i].trim()))code.push(lines[i++]);if(i<lines.length)i++;out+=`<pre><code class="language-${esc(lang||'text')}">${esc(code.join('\n'))}</code></pre>`;continue;}
  const h=line.match(/^#{1,3}\s+(.+)$/);if(h){out+=`<h3>${esc(h[1])}</h3>`;i++;continue;}
  if(/^\s*[-*•]\s+/.test(line)){const arr=[];while(i<lines.length&&/^\s*[-*•]\s+/.test(lines[i]))arr.push(lines[i++].replace(/^\s*[-*•]\s+/,''));out+='<ul>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';continue;}
  if(/^\s*\d+[.)、]\s+/.test(line)){const arr=[];while(i<lines.length&&/^\s*\d+[.)、]\s+/.test(lines[i]))arr.push(lines[i++].replace(/^\s*\d+[.)、]\s+/,''));out+='<ol>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>';continue;}
  if(/^>\s?/.test(line)){const arr=[];while(i<lines.length&&/^>\s?/.test(lines[i]))arr.push(lines[i++].replace(/^>\s?/,''));out+=`<blockquote>${arr.map(esc).join('<br>')}</blockquote>`;continue;}
  const para=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^```/.test(lines[i].trim())&&!/^#{1,3}\s+/.test(lines[i])&&!/^\s*[-*•]\s+/.test(lines[i])&&!/^\s*\d+[.)、]\s+/.test(lines[i])&&!/^>\s?/.test(lines[i]))para.push(lines[i++]);out+=`<p>${para.map(esc).join('<br>')}</p>`;
 }
 return `<div class="editable-lesson-body">${out||'<p>还没有正文内容。点击“编辑本节内容”补充知识。</p>'}</div>`;
}

function lessonVisualKind(course, lesson, section, sectionIndex){
 if(section.teachingPart) return 'none';
 const id=lesson.id, h=section.heading||'', topic=(lesson.title+' '+h+' '+(section.body||[]).join(' ')).toLowerCase(), cid=course.id;
 // Only draw a figure when a spatial, bit-level, timing, or event relationship materially helps.
 if(id==='l-pointer'){
  if(/指针表达|地址/.test(h)) return 'pointer';
  if(/数组与指针|数组|长度/.test(h)) return 'array';
 }
 if(id==='l-memory'){
  if(/常见内存区域/.test(h)) return 'segments';
  if(/局部变量|生命周期/.test(h)) return 'lifetime';
 }
 if(id==='l-bitops' && /常见操作/.test(h)) return 'bits';
 if(id==='l-number' && /数值表示|补码/.test(h)) return 'signed-bits';
 if(id==='l-endian'){
  if(/大端与小端/.test(h)) return 'endian';
  if(/对齐和填充/.test(h)) return 'alignment';
 }
 if(id==='l-mmio' && /一次寄存器访问/.test(h)) return 'mmio';
 if(id==='l-mmu-cache' && /Cache 为什么|一致|缓存副本/.test(h)) return 'cache-dma';
 if(id==='l-startup' && /典型启动序列/.test(h)) return 'startup';
 if(id==='l-linker' && /编译和链接|链接脚本/.test(h)) return 'linker';
 if(id==='l-bootloader' && /跳转前|交接/.test(h)) return 'boot-handoff';
 if(id==='l-abi-eabi' && /函数调用|参数|栈帧/.test(h)) return 'abi-call';
 if(id==='l-read-assembly' && /观察简单结构/.test(h)) return 'assembly-flow';
 if(id==='l-gpio' && /上下拉|输出类型/.test(h)) return 'open-drain';
 if(id==='l-irq' && /中断处理路径/.test(h)) return 'irq-path';
 if(id==='l-timer' && /基本计算/.test(h)) return 'timer-calc';
 if(id==='l-pwm' && /PWM 参数/.test(h)) return 'pwm-wave';
 if(id==='l-uart' && /帧格式/.test(h)) return 'uart-frame';
 if(id==='l-i2c' && /事务|时序|START|应答/i.test(h)) return 'i2c-transaction';
 if(id==='l-i2c-spi' && /选型和排障|如何选|区别|比较/.test(h)) return 'bus-compare';
 if(id==='l-spi' && /模式|时钟|采样|片选/i.test(h)) return 'spi-mode';
 if(id==='l-adc' && /采样时间与源阻抗/.test(h)) return 'adc-sampling';
 if(id==='l-dma' && /所有权|缓冲区|数据流/.test(h+' '+topic)) return 'dma-ownership';
 if(id==='l-task-context' && /任务状态|状态变化/.test(h)) return 'task-state';
 if(id==='l-sync' && /互斥|队列|同步|优先级反转/.test(h+' '+topic)) return 'sync-model';
 if(id==='l-fsm' && /状态|转移|事件/.test(h+' '+topic)) return 'state-machine';
 if(id==='l-module-management' && /模块边界|依赖|初始化|终止化/.test(h)) return 'dependency';
 if(id==='l-unit-test' && /测试应该|测试用例/.test(h+' '+topic)) return 'test-cycle';
 if(id==='l-coverage-static' && /覆盖率|静态分析/.test(h+' '+topic)) return 'coverage';
 if(id==='l-performance-analysis' && /测量|指标|优化/.test(h+' '+topic)) return 'measurement-loop';
 return 'none';
}
function selectLessonVisuals(course, lesson){
 const selected=new Map(), seen=new Set();
 const sections=lesson.sections||[];
 for(let i=0;i<sections.length;i++){
  const sec=sections[i]; if(sec.teachingPart) continue;
  const kind=lessonVisualKind(course,lesson,sec,i);
  if(kind==='none'||seen.has(kind)) continue;
  // No more than two figures per lesson, and no repeated diagram type within a lesson.
  if(selected.size>=2) break;
  selected.set(i,kind); seen.add(kind);
 }
 return selected;
}

function renderLessonSectionFigure(course, lesson, section, sectionIndex, kind='none'){
 if(kind==='none') return '';
 const flow=(nodes)=>`<div class="lesson-figure-flow">${nodes.map((n,i)=>`${i?'<span class="lesson-figure-arrow">→</span>':''}<div class="lesson-figure-node"><strong>${esc(n[0])}</strong><small>${esc(n[1])}</small></div>`).join('')}</div>`;
 let title='', body='', explanation='', label='按需图解';
 if(kind==='pointer'){
  title='指针保存地址，解引用访问原对象'; label='对象与地址';
  body=`<div class="lesson-figure-compare"><article><strong>对象 value</strong><p>地址：0x2000 0010<br>内容：42</p></article><article><strong>指针变量 p</strong><p>保存的值：0x2000 0010<br>p 自己也有地址</p></article></div><div style="text-align:center;margin:10px 0;color:#4f7657;font-size:12px;font-weight:800">p = &amp;value　→　*p = 100 会修改 value</div>`;
  explanation='左边是被指向的对象，右边是指针变量。p 保存 value 的地址；`*p` 沿这个地址访问 value。p 自己的存储位置和 p 保存的地址不是同一个概念。';
 }else if(kind==='array'){
  title='数组元素连续，合法下标必须小于长度'; label='数组边界';
  body=`<div class="lesson-figure-bits">${[['0','a[0] = 10'],['1','a[1] = 20'],['2','a[2] = 30']].map(x=>`<div class="lesson-figure-bit"><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div><div style="text-align:center;margin-top:8px;font-size:11px;color:#637767">长度 len = 3　合法范围：0 ≤ index < 3</div>`;
  explanation='数组保存固定数量的连续元素，`a[1]` 访问第二个元素，结果为 20。`a[3]` 已越界；指针不会自动记住缓冲区长度，因此函数接口必须传长度。';
 }else if(kind==='segments'){
  title='固件映像中的主要内存区域'; label='内存布局';
  body=`<div class="lesson-figure-memory"><div class="mem-address">Flash</div><div class="mem-block"><span>.text / .rodata</span><small>机器码与只读常量</small></div><div class="mem-address">RAM</div><div class="mem-block"><span>.data</span><small>初值由映像复制到 RAM</small></div><div class="mem-address">RAM</div><div class="mem-block"><span>.bss</span><small>启动阶段清零</small></div><div class="mem-address">RAM</div><div class="mem-block"><span>stack / heap</span><small>调用现场与动态对象，预算需单独核算</small></div></div>`;
  explanation='这是职责示意，不是固定地址图。链接脚本决定各段放在哪里；启动代码初始化 .data/.bss；栈预算还要考虑最深调用链、中断嵌套和局部大对象。';
 }else if(kind==='lifetime'){
  title='对象生命周期决定地址何时有效'; label='生命周期';
  body=flow([['进入函数','局部自动对象开始有效'],['执行期间','允许在有效范围内访问'],['函数返回','对象生命周期结束'],['保留旧地址','可能形成悬空指针']]);
  explanation='地址数值即使仍留在寄存器或变量里，也不代表对象还存在。不能返回局部自动变量的地址后继续解引用。';
 }else if(kind==='bits'||kind==='signed-bits'){
  title=kind==='bits'?'掩码只关注指定的位':'同一位模式要结合类型解释'; label='位模式';
  const bits=kind==='bits'?'00001000':'11111111';
  body=`<div class="lesson-figure-bits">${bits.split('').map((b,i)=>`<div class="lesson-figure-bit ${b==='1'?'on':''}"><strong>${b}</strong><small>bit ${7-i}</small></div>`).join('')}</div>${kind==='bits'?'<p style="font-size:11px;text-align:center;color:#687a6e;margin:8px 0 0">mask = 1u &lt;&lt; 3 = 0x08；只定位 bit 3</p>':'<div class="lesson-figure-compare" style="margin-top:8px"><article><strong>uint8_t</strong><p>255</p></article><article><strong>8 位补码 int8_t</strong><p>-1</p></article></div>'}`;
  explanation=kind==='bits'?'按位与用来检测掩码对应位，按位或可置位，按位与取反掩码可清位。注意硬件寄存器可能有专门写入语义。':'位模式没有脱离类型的固定数值含义。先确认位宽、signed/unsigned 语义和转换规则，避免仅看调试器的十六进制显示。';
 }else if(kind==='endian'){
  title='0x12345678 的内存字节顺序'; label='字节序';
  body=`<div class="lesson-figure-compare"><article><strong>小端（低地址 → 高地址）</strong><p><code>78　56　34　12</code></p></article><article><strong>大端（低地址 → 高地址）</strong><p><code>12　34　56　78</code></p></article></div>`;
  explanation='字节序描述一个多字节数值分散到内存后，字节从低地址到高地址如何排列。协议字段应按协议约定解码，不能直接假设目标 CPU 的端序。';
 }else if(kind==='alignment'){

 const {course:c,lesson:l}=found, idx=c.lessons.findIndex(x=>x.id===l.id),done=isDone(l.id),p=courseProgress(c);
 const visualMap=selectLessonVisuals(c,l);
 const renderQA=(qas)=>`<div class="lesson-qa-list">${(qas||[]).map(x=>`<div class="lesson-qa-item"><div class="lesson-qa-q">问题：${esc(x.q)}</div><div class="lesson-qa-a"><strong>答案：</strong>${esc(x.a)}</div></div>`).join('')}</div>`;
 const renderSteps=(steps)=>`<div class="lesson-step-list">${(steps||[]).map((x,i)=>`<div class="lesson-step-card"><span class="lesson-step-num">${i+1}</span><div><strong>${esc(x.title)}</strong><span>${esc(x.text)}</span></div></div>`).join('')}</div>`;
 const renderDiag=(items)=>`<div class="lesson-diagnostic-list">${(items||[]).map(x=>`<div class="lesson-diagnostic-item"><strong>${esc(x.label)}</strong><span>${esc(x.text)}</span></div>`).join('')}</div>`;
 const renderSection=(s,sectionIndex)=>{

13)}</span></button></div>`}function renderSettings(){return `${pageHead('偏好与数据','管理工作台称呼与个人数据备份。所有内容默认保存在当前浏览器。')}<div class="settings-grid"><section class="setting-card"><h3>工作台偏好</h3><p>自定义显示称呼，让个人学习空间更贴合你的使用习惯。</p><form id="settings-form" data-form="settings"><div class="field"><label for="profile-name">工作台称呼</label><input id="profile-name" name="profileName" maxlength="30" value="${esc(state.profileName||'学习者')}" placeholder="例如：小林" /></div><button class="btn primary" type="submit">保存偏好</button></form><div class="setting-row"><div><strong>课程内容</strong><span>内置知识地图与自定义课程均可长期编辑</span></div><span class="pill green">${allCourses().length} 门</span></div><div class="setting-row"><div><strong>本地学习数据</strong><span>记录、进度、资源、可编辑课程、知识卡片</span></div><span class="pill">${state.records.length+state.notes.length+state.resources.length} 项+</span></div></section><section class="setting-card"><h3>数据备份与迁移</h3><p>这套静态网站不需要账号，数据由浏览器本地保存。换设备前请先导出。</p><div class="setting-actions"><button class="btn primary" data-action="export-data">${icon('download',15)} 导出全部数据 JSON</button><label class="btn" for="import-file" style="cursor:pointer">${icon('upload',15)} 导入备份 JSON</label><input id="import-file" type="file" accept="application/json,.json" style="display:none" /></div><div class="notice"><strong>重要说明：</strong>GitHub Pages 只负责托管静态网站。学习记录和自定义内容存储在本机浏览器的 localStorage，不会自动同步到 GitHub 或其他设备。公开发布站点时，请勿把私人记录写入代码文件。</div><div class="setting-row" style="margin-top:12px"><div><strong>恢复初始数据</strong><span>清除当前浏览器的学习进度、自定义内容与记录</span></div><button class="btn danger small" data-action="reset-data">重置</button></div></section></div><section class="setting-card" style="margin-top:17px"><h3>如何发布到 GitHub Pages</h3><p>网站是一个无构建步骤的纯 HTML/CSS/JavaScript 页面，适合直接放进仓库根目录。</p><div class="task-list"><div class="task-row"><div class="lesson-index">01</div><div class="task-copy"><strong>创建仓库并上传 index.html</strong><div class="sub">建议仓库命名为 embedded-learning-hub。若使用 GitHub Free，GitHub Pages 通常需要公开仓库。</div></div></div> function renderSearch(){const q=ui.query.trim().toLowerCase();const found=[];if(q){allCourses().forEach(c=>{if((c.title+c.desc+c.category).toLowerCase().includes(q))found.push({type:'course',id:c.id,title:c.title,desc:`${c.category} · ${c.desc}`});c.lessons.forEach(l=>{if((l.title+l.summary+(l.editableContent||'')+(l.sections||[]).map(s=>(s.body||[]).join(' ')).join(' ')).toLowerCase().includes(q))found.push({type:'lesson',id:l.id,title:l.title,desc:`${c.title} · ${l.summary}`})})});state.notes.forEach(n=>{if((n.title+n.content+n.category).toLowerCase().includes(q))found.push({type:'note',id:n.id,title:n.title,desc:`我的知识库 · ${n.content}`})});state.resources.forEach(r=>{if((r.title+r.desc+r.category+r.url).toLowerCase().includes(q))found.push({type:'resource',id:r.id,title:r.title,desc:`${r.category} · ${r.desc}`})});state.records.forEach(r=>{if((r.title+r.content+r.next+r.category).toLowerCase().includes(q))found.push({type:'record',id:r.id,title:r.title,desc:`每日记录 · ${r.content||'没有补充内容'}`})})}return `${pageHead('搜索结果',q?`关键词：“${esc(ui.query)}” · 找到 ${found.length} 项相关内容。`:'输入关键词，跨课程、笔记、资源和每日记录检索。')}<form id="search-page-form" class="inline-search" style="width:min(520px,100%);margin-bottom:19px">${icon('search',16)}<input name="q" value="${esc(ui.query)}" placeholder="例如：volatile、DMA、HardFault…" /><button class="btn small" type="submit">搜索</button></form><div class="search-results">${found.slice(0,80).map(f=>`<button class="search-result" data-action="search-open" data-type="${f.type}" data-id="${f.id}"><span class="sr-icon">${icon(f.type==='course'?'book':f.type==='lesson'?'code':f.type==='note'?'library':f.type==='resource'?'link':'note',19)}</span><span style="min-width:0"><strong>${esc(f.title)}</strong><small>${esc(f.desc).slice(0,180)}</small></span><span style="margin-left:auto;color:#9ba69d">${icon('chevron',16)}</span></button>`).join('')||`<div class="empty"><strong>${q?'没有找到匹配内容':'开始搜索你的学习库'}</strong>${q?'试试更短的关键词，例如“内存”“中断”或“UART”。':'搜索会覆盖课程内容、个人知识卡片、资源收藏和学习记录。'}</div>`}</div>`}

placeholder="下一步准备做什么？">${esc(r.next||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn" data-action="cancel-record-edit">取消修改</button><button class="btn primary" type="submit">${icon('check',15)} 保存修改</button></div></form></section></div>`;const d=stampDate(r.date);return `<div class="modal-backdrop" data-action="backdrop-close"><section class="modal record-modal" role="dialog" aria-modal="true" aria-label="学习记录详情"><div class="modal-head"><div><h2>学习记录详情</h2><p>完整查看你的学习收获、问题与下一步行动。</p></div><button class="modal-close" data-action="close-modal" aria-label="关闭">${icon('close',16)}</button></div><div class="record-detail-top"><div class="record-detail-date"><strong>${d.day}</strong><span>${d.month}</span></div><div class="record-detail-heading"><h3>${esc(r.title||'未命名记录')}</h3><p>记录日期：${esc(r.date||'未填写日期')}</p></div></div><div class="record-detail-meta"><span>${icon('book',14)} ${esc(r.category||'学习')}</span><span>${icon('clock',14)} ${Number(r.minutes)||0} 分钟</span><span>${icon('calendar',14)} ${esc(displayDate(r.date,{year:'numeric',month:'long',day:'numeric',weekday:'long'}))}</span>${r.updatedAt?`<span>${icon('checkcircle',14)} 已编辑</span>`:''}</div><section class="record-detail-section"><h3>学习收获 / 卡点</h3><div class="record-detail-text ${r.content?'':'record-detail-empty'}">${esc(r.content||'尚未填写学习收获或遇到的卡点。点击下方“编辑记录”补充内容。')}</div></section><section class="record-detail-section"><h3>下一步行动</h3><div class="record-detail-text ${r.next?'':'record-detail-empty'}">${esc(r.next||'尚未设置下一步行动。')}</div></section><div class="record-detail-actions"><div class="record-detail-actions-left"><button class="btn danger" data-action="delete-item" data-type="record" data-id="${esc(r.id)}">${icon('trash',14)} 删除记录</button></div><div class="record-detail-actions-right"><button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="edit-record">${icon('note',15)} 编辑记录</button></div></div></section></div>`}
