function icon(name, size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[name]||SVG.spark}</svg>`}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function uid(prefix='item'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function dateOffset(offset){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayStr(){return dateOffset(0)}
function displayDate(value, opts={month:'short',day:'numeric'}){if(!value)return '未设置';const d=new Date(value+'T12:00:00');return isNaN(d)?value:new Intl.DateTimeFormat('zh-CN',opts).format(d)}
function stampDate(value){const d=new Date(value+'T12:00:00');return isNaN(d)?{day:'--',month:'--'}:{day:d.getDate(),month:`${d.getMonth()+1}月`}}
function lesson(id,title,minutes,summary,sections,takeaways,exercise){return {id,title,minutes,summary,sections,takeaways,exercise}}
const curriculum = [
 {id:'c-programming',title:'嵌入式 C 语言与内存',category:'基础知识',level:'基础',duration:'4.5 小时',color:'mint',icon:'code',code:'C / MEMORY',desc:'从指针、内存布局到 volatile 与位操作，建立编写可靠固件所需的 C 语言基础。',lessons:[
  lesson('l-pointer','指针、数组与地址',25,'指针保存的是对象的地址。理解地址、类型与内存访问之间的关系，是读懂驱动代码的第一步。',[{heading:'1. 指针表达什么？',body:['在 C 语言中，指针对象保存一个地址；指针类型告诉编译器应如何解释该地址处的数据。`uint32_t *p` 表示 p 指向一个 uint32_t 对象，而不是“一个整数值”。'],code:'uint32_t value = 42;\nuint32_t *p = &value;\n*p = 100;   // 修改 value\n// value == 100'},{heading:'2. 数组与指针并不完全相同',body:['数组是一段连续存储的对象；在多数表达式中，数组名会转换为指向首元素的指针，但数组本身不是指针变量。函数参数中的 `int a[]` 会调整为 `int *a`，所以需要额外传入长度。'],bullets:['始终确认指针指向的对象是否仍然存活。','访问数组前确认索引范围，越界属于未定义行为。','不要返回局部自动变量的地址。']},{heading:'3. 在驱动开发中怎么用？',body:['寄存器访问、DMA 缓冲区、协议解析都涉及指针。读写前要确认地址来源、对齐要求、对象生命周期和访问权限。']}],['明确 &x、*p 与数组下标的含义。','知道指针类型影响解引用时的读写宽度。','访问缓冲区时始终同时管理长度。'],'写一个安全的缓冲区读取函数：传入指针和长度，读取前判断索引是否越界。'),
  lesson('l-memory','栈、堆、静态区与生命周期',30,'内存布局决定变量何时存在、在哪里分配，以及故障出现时该从哪里排查。',[{heading:'1. 常见内存区域',body:['典型 MCU 程序映像包含 Flash 中的代码与只读常量，以及 RAM 中的已初始化数据、零初始化数据、堆和栈。链接脚本决定这些段的地址和大小。'],bullets:['text/rodata：通常位于非易失存储器。','data：初始值保存在映像中，启动时复制到 RAM。','bss：启动时清零。','stack：保存调用现场、局部变量和中断现场；具体使用受 ABI 与编译器影响。','heap：动态分配使用的区域，许多固件项目会限制甚至禁用它。']},{heading:'2. 为什么局部变量容易出问题？',body:['自动局部变量一般在函数活动期间有效。函数返回后，其生命周期结束；保存其地址并在外部使用，会形成悬空指针。大的局部数组还可能消耗大量栈空间。'],code:'int *bad(void) {\n    int local = 7;\n    return &local; // 错误：返回局部对象地址\n}'},{heading:'3. 如何检查内存占用？',body:['查看链接器 map 文件和 ELF 段信息，确认静态 RAM、Flash 的使用量；估算最深调用链、递归、局部数组和中断嵌套对栈的影响。']}],['区分变量的存储期与内存区域。','能解释 .data 复制和 .bss 清零。','知道 map 文件是内存占用分析的入口。'],'查看一个固件工程生成的 map 文件，找出最大几个 RAM 对象，并估算任务栈和主栈占用。'),
  lesson('l-volatile','volatile、const 与寄存器访问',28,'volatile 用于表达对对象的访问具有可观察性，常见于硬件寄存器与异步更新的状态，但它不是通用的线程同步工具。',[{heading:'1. volatile 的作用',body:['编译器通常可以合并、移除或重排普通内存访问。对 volatile 对象的访问必须按语言规则保留为可观察操作，避免轮询寄存器时读操作被简单地优化掉。'],code:'#define STATUS_REG (*(volatile uint32_t *)0x40000000u)\nwhile ((STATUS_REG & (1u << 0)) == 0u) {\n    // 等待硬件状态位置位\n}'},{heading:'2. 它不能保证什么？',body:['volatile 不保证操作原子性，不会自动建立线程间 happens-before 关系，也不能替代 RTOS 的互斥锁、原子操作或正确的临界区设计。复合读改写操作仍可能发生竞态。']},{heading:'3. const 与 volatile 可以组合',body:['const 限制通过该限定类型的表达式修改对象；volatile 描述访问语义。只读状态寄存器可根据芯片头文件定义为 `volatile const`，但具体定义必须遵从芯片厂商提供的寄存器描述。'],bullets:['硬件寄存器定义优先使用官方 CMSIS / 芯片头文件。','跨主循环与 ISR 共享数据时，分析原子性和同步要求。','不要把“加了 volatile”当作线程安全证明。']}],['volatile 常用于 MMIO 和异步变化的状态。','volatile 不等于 atomic，也不等于 mutex。','寄存器地址、位定义和访问宽度应以芯片手册为准。'],'用自己的话解释：主循环和中断共同修改一个计数器时，为什么仅添加 volatile 未必足够？'),
  lesson('l-bitops','位运算与寄存器字段',22,'位运算是配置外设、检查状态位和构建协议字段的基础。先理解掩码，再进行读改写。',[{heading:'1. 常见操作',body:['左移常用于构造位掩码，按位与用于检查位，按位或用于置位，按位取反再与可用于清位。参与运算的整数宽度与有符号性会影响结果。'],code:'uint32_t mask = (1u << 3);\nreg |= mask;       // 置位 bit 3\nreg &= ~mask;      // 清除 bit 3\nif ((reg & mask) != 0u) {\n    // bit 3 已置位\n}'},{heading:'2. 常见陷阱',body:['确保移位次数小于操作数位宽；使用无符号常量避免不必要的符号扩展；清位前确认掩码宽度；对于有读清、副作用或写 1 清零语义的寄存器，不要照搬普通 RAM 的读改写模式。']}],['用括号明确位运算优先级。','使用合适宽度的无符号类型。','寄存器的写入语义必须查参考手册。'],'实现 set_bits(value, mask)、clear_bits(value, mask) 与 test_bits(value, mask)，为边界情况写出测试。')
 ]},
 {id:'c-computer',title:'计算机底层与数字基础',category:'底层原理',level:'基础',duration:'3.5 小时',color:'blue',icon:'layers',code:'BITS / CPU',desc:'理解二进制、补码、字节序、内存映射与总线，为读懂芯片手册建立底层模型。',lessons:[
  lesson('l-number','二进制、补码与有符号数',20,'CPU 以位和字节存储数据；同一组 bit 如何解释，取决于数据类型和编码约定。',[{heading:'1. 数值表示',body:['一个 n 位无符号整数的范围为 0 到 2ⁿ−1。常见 n 位二进制补码有符号整数范围为 −2⁽ⁿ⁻¹⁾ 到 2⁽ⁿ⁻¹⁾−1。C 标准对整数类型范围有具体规则，实际项目应关注目标 ABI。']},{heading:'2. 补码的直觉',body:['在固定宽度下，负数通常使用二进制补码表示。例如 8 位数中，−1 的位模式是 11111111。最高位经常作为有符号数的符号位理解，但位模式本身没有天然的正负含义。'],code:'8-bit unsigned:  1111 1111 = 255\n8-bit two\'s complement: 1111 1111 = -1'},{heading:'3. 为什么固件工程师需要知道？',body:['协议字段、寄存器位、ADC 原始值、符号扩展和类型转换经常出错。调试时将变量以十六进制和二进制查看，通常比只看十进制更容易发现位错误。']}],['能够计算 n 位无符号数范围。','能用十六进制表达位掩码。','区分位模式与数值解释。'],'将 0x3C、0xA5 转成二进制，并分别解释为 8 位无符号值。'),
  lesson('l-endian','字节序、对齐与结构体填充',22,'多字节数值写入内存时有字节序；CPU 访问对象还可能受到对齐和 ABI 规则影响。',[{heading:'1. 大端与小端',body:['以 0x12345678 为例，按地址从低到高排列时，小端存储为 78 56 34 12，大端存储为 12 34 56 78。字节序影响多字节对象的内存表示，不改变整数在 C 表达式中的数学含义。']},{heading:'2. 对齐和填充',body:['处理器或总线可能对某些宽度的非对齐访问有额外代价，甚至不支持。结构体成员之间也可能插入 padding，以满足每个成员的对齐要求。不要假设 `sizeof(struct)` 等于成员大小之和。']},{heading:'3. 协议处理建议',body:['网络协议应明确字段字节序和长度；不要直接把外部字节缓冲区强制转换成结构体指针，除非布局、对齐、别名和字节序都得到保证。更稳妥的做法是按字段解码。']}],['能手算一个 32 位整数的大小端字节序。','知道结构体 padding 会影响 sizeof。','协议解析应显式处理字节序与边界。'],'为 4 字节缓冲区写一个小端解码函数，并检查输入长度不足时的行为。'),
  lesson('l-mmio','内存映射 I/O 与总线',28,'MCU 将外设控制寄存器映射到地址空间，CPU 通过 load/store 指令与外设交互。',[{heading:'1. Memory-mapped I/O',body:['在许多 MCU 中，Flash、SRAM 和外设寄存器处于统一地址空间的不同区域。读取一个外设寄存器看似普通内存读取，但该地址可能具有硬件副作用，例如清除状态或弹出 FIFO 数据。']},{heading:'2. 一次寄存器访问',body:['CPU 发起访问后，互连/总线将请求送到目标从设备。访问宽度、权限、时钟门控和外设复位状态都可能影响行为。具体总线名称和时序由芯片架构决定。'],bullets:['先打开外设总线时钟，再访问该外设寄存器。','参考寄存器描述中的 reset value、access type 和 side effect。','写 1 清零（W1C）寄存器需要专门处理。']},{heading:'3. 查手册的顺序',body:['从芯片数据手册确认资源和引脚复用；从参考手册查寄存器、时钟和中断；从勘误表确认已知硅缺陷；再使用厂商 SDK/CMSIS 头文件完成实现。']}],['能够解释 MMIO 与普通 RAM 的不同。','知道外设访问依赖时钟、复位、地址和访问语义。','芯片手册是驱动实现的事实依据。'],'选择一个 GPIO 寄存器，记录基地址、偏移、复位值，以及置位/清位的正确方式。')
 ]},
 {id:'c-mcu',title:'MCU 启动流程与系统架构',category:'底层原理',level:'进阶',duration:'3 小时',color:'slate',icon:'cpu',code:'RESET / STARTUP',desc:'从复位向量、启动文件到链接脚本，追踪固件从上电到 main() 的完整路径。',lessons:[
  lesson('l-startup','从复位到 main()',26,'main() 不是芯片上电后执行的第一条 C 语句；在它之前还有硬件复位与启动代码。',[{heading:'1. 典型启动序列',body:['上电或复位后，CPU 从架构定义的复位入口开始执行。以 Cortex-M 为例，向量表开头包含初始主栈指针和 Reset_Handler 地址；之后启动代码建立 C 运行环境。']},{heading:'2. C 运行时初始化',body:['启动代码通常会把初始化数据从 Flash 复制到 RAM，把 .bss 清零，可能配置 FPU 或时钟，并调用运行库初始化函数，最后进入 main()。具体顺序取决于启动文件、工具链和芯片供应商。'],code:'Reset / Vector table\n        ↓\nReset_Handler\n        ↓\n.data copy + .bss zero\n        ↓\nSystemInit / runtime init\n        ↓\nmain()'},{heading:'3. 常见启动故障',body:['若程序停在启动阶段，检查向量表地址、栈顶地址、链接脚本、时钟配置、初始化函数和硬件 fault 状态。调试时可在 Reset_Handler、SystemInit 与 main() 入口设置断点。']}],['能画出复位到 main 的路径。','知道 .data 复制和 .bss 清零发生在 main 前。','启动文件与链接脚本共同决定内存布局。'],'在调试器中从复位开始单步，记录 Reset_Handler、SystemInit 和 main 的执行顺序。'),
  lesson('l-linker','链接脚本、段与 map 文件',24,'编译器产生目标文件后，链接器根据内存布局将代码和数据安排到 Flash、RAM 等区域。',[{heading:'1. 编译和链接的分工',body:['预处理展开头文件和宏，编译器生成汇编或目标文件，汇编器生成机器码目标文件，链接器解析符号并安排段地址，最终形成 ELF、HEX 或 BIN 等产物。']},{heading:'2. 链接脚本做什么？',body:['链接脚本描述内存区域以及 section 到区域的映射。栈、堆、向量表和初始化数据位置不应凭感觉修改；更改前必须确认芯片的实际存储器地址、启动文件期望和 bootloader 布局。']},{heading:'3. 阅读 map 文件',body:['map 文件展示符号地址、段大小和内存分配情况，可用来排查 Flash/RAM 超限、意外拉入的大型库或静态对象。搭配 ELF 符号表工具能定位占空间较大的函数和对象。']}],['能描述预处理、编译、汇编、链接的顺序。','知道 map 文件可用于内存占用分析。','改变链接布局前应核实芯片和启动约束。'],'找出一个 ELF 生成的 map 文件，记录 .text、.data、.bss 的大小与地址。')
 ]},
 {id:'c-gpio',title:'GPIO、EXTI 与中断',category:'外设驱动',level:'基础',duration:'3 小时',color:'mint',icon:'zap',code:'GPIO / IRQ',desc:'掌握引脚模式、上下拉、复用功能和中断服务程序的设计要点。',lessons:[
  lesson('l-gpio','GPIO 输入输出与引脚复用',25,'GPIO 驱动不仅是拉高或拉低一个引脚，还涉及电气属性、复用功能和外部电路。',[{heading:'1. 配置前先确认',body:['查看目标引脚是否支持需要的功能、板级原理图是否将其连接到其他器件，以及电压域是否匹配。配置模式一般包括输入、推挽输出、开漏输出和复用功能等。']},{heading:'2. 上下拉与输出类型',body:['上拉/下拉为输入提供默认电平，但数值应结合外部电路和功耗要求选择。开漏输出只能主动拉低，释放后由上拉电阻获得高电平，常见于 I²C 等共享线路。推挽输出则可主动驱动高低电平。']},{heading:'3. GPIO 排障清单',body:['检查 GPIO 时钟、模式寄存器、输出数据寄存器、引脚复用、板级连线和负载。用示波器或逻辑分析仪验证真实引脚波形，不要只依赖软件返回值。']}],['能解释推挽和开漏输出的区别。','知道复用功能可能与 GPIO 配置互斥。','软件配置和板级电气设计必须同时检查。'],'配置一个 LED 输出，并明确 LED 是高电平点亮还是低电平点亮。'),
  lesson('l-irq','中断、NVIC 与 ISR 设计',28,'中断让 CPU 在事件发生时转入处理程序。可靠的 ISR 应短小、可预测，并与主循环/任务正确交互。',[{heading:'1. 中断处理路径',body:['外设检测到事件后设置状态位并发出中断请求；中断控制器按照使能、挂起状态和优先级等规则决定是否进入 CPU 异常处理流程。具体寄存器由 MCU 架构和芯片实现定义。']},{heading:'2. ISR 里要做什么？',body:['尽快确认事件并清除正确的中断标志，保存必要的最少信息，然后退出。耗时的协议解析、日志格式化、阻塞等待和动态内存操作通常应放到主循环或任务中。'],bullets:['注意优先级分组和抢占关系。','共享数据时考虑原子性、临界区和编译器可见性。','检查中断标志是否读清、写 1 清零或需要特定顺序。']},{heading:'3. 中断与轮询',body:['轮询实现简单但响应时间受循环路径影响；中断可减少无效检查并改善响应，但带来共享状态、重入和时序分析的复杂度。高频事件还要考虑 CPU 占用与中断风暴。']}],['中断标志清除方式必须查手册。','ISR 保持短小，长任务延后处理。','分析中断优先级和共享变量竞态。'],'画出“外设中断—ISR 置标志—主循环消费”的数据流，并标注共享变量的保护方式。')
 ]},
 {id:'c-timer',title:'定时器、输入捕获与 PWM',category:'外设驱动',level:'进阶',duration:'3 小时',color:'amber',icon:'clock',code:'TIMER / PWM',desc:'使用硬件定时器实现周期调度、脉冲计数、PWM 输出与输入测量。',lessons:[
  lesson('l-timer','定时器时基与溢出',23,'通用定时器通常由计数器、预分频器和自动重装载寄存器共同决定计数频率与周期。',[{heading:'1. 基本计算',body:['若定时器输入时钟为 f_timer，预分频系数为 PSC+1，计数周期由 ARR+1 个计数 tick 组成，则常见向上计数配置下的更新频率近似为 f_update = f_timer / ((PSC+1)(ARR+1))。实际定时器时钟可能与 CPU 时钟不同，需要查时钟树。']},{heading:'2. 更新事件',body:['计数器达到边界后可能产生更新事件和中断/DMA 请求。是否立即更新预分频器、自动重装载值何时生效、计数器是否重复计数，取决于具体外设配置。']},{heading:'3. 不要用忙等代替硬件时基',body:['用软件循环计数延时容易受到编译优化、Flash wait-state 和中断的影响；需要稳定时序时，应尽可能使用硬件定时器并验证误差。']}],['能从定时器时钟、PSC 和 ARR 估算周期。','确认芯片时钟树中定时器时钟来源。','硬件事件通常比软件忙等更可控。'],'若定时器时钟为 72 MHz，目标更新频率为 1 kHz，选择一组合理的 PSC 和 ARR，并写出计算过程。'),
  lesson('l-pwm','PWM、占空比与输入捕获',25,'PWM 通过周期性改变输出的高电平比例控制平均功率；输入捕获则记录边沿时刻来测量信号。',[{heading:'1. PWM 参数',body:['若周期为 T、有效高电平时间为 Ton，占空比 D = Ton/T。计数器频率与周期共同决定 PWM 频率，比较寄存器控制输出翻转点。占空比 0% 与 100% 的边界行为要参考具体芯片。']},{heading:'2. 输入捕获与测量',body:['输入捕获在选定边沿将计数器值锁存到捕获寄存器。相邻两次捕获值的差可计算周期；当计数器回绕时需要用足够宽度的无符号运算处理溢出。']},{heading:'3. 常见问题',body:['频率不对时优先查计时器内核时钟、PSC、ARR 和输出通道映射。占空比不对时再核对比较值、极性、预装载及引脚复用。']}],['会计算 PWM 频率和占空比。','输入捕获可用于周期、频率和脉宽测量。','示波器验证实际波形与理论值。'],'输出 2 kHz、25% 占空比 PWM；列出时钟、分频、周期和比较值的计算。')
 ]},
 {id:'c-protocol',title:'UART、I²C 与 SPI 通信',category:'外设驱动',level:'进阶',duration:'4 小时',color:'blue',icon:'radio',code:'UART / I²C / SPI',desc:'从时序、电气特性与协议边界入手，掌握三种常见串行外设总线的调试方法。',lessons:[
  lesson('l-uart','UART：波特率、帧格式与缓冲',25,'UART 常用于日志、控制台和点对点通信。它通常不提供应用层消息边界，需要固件自行设计帧协议。',[{heading:'1. 帧格式',body:['常见 UART 配置由波特率、数据位、校验位和停止位组成，例如 115200、8 数据位、无校验、1 停止位（8N1）。收发双方必须匹配配置，且要考虑时钟偏差。']},{heading:'2. 收发策略',body:['轮询适合早期验证；中断适合中低速异步收发；DMA 常用于连续或大块数据。使用环形缓冲区时，明确生产者/消费者、满/空判定、溢出处理和并发访问规则。'],code:'// 环形缓冲区设计关注点\nhead: 写入位置\ntail: 读取位置\nnext(head) == tail  // 一种常见的“满”判定\nhead == tail        // 一种常见的“空”判定'},{heading:'3. 消息分帧',body:['可使用长度字段、分隔符、固定长度或同步字+长度+校验等方法分帧。解析器应处理半包、粘包、非法长度、超时与校验失败，不能假设一次接收回调对应一条完整消息。']}],['串口波特率不是应用层消息边界。','环形缓冲区需要明确满、空和溢出策略。','接收解析器必须容忍分段和异常数据。'],'设计一个含同步字、长度、命令、载荷和 CRC 的串口帧格式。'),
  lesson('l-i2c-spi','I²C 与 SPI：如何选总线',27,'I²C 通过地址与共享两线连接多个器件；SPI 使用时钟、数据线和片选信号，常见于高速外设。',[{heading:'1. I²C 的特征',body:['典型 I²C 使用 SCL、SDA 两根线，线路为开漏并通过上拉电阻释放到高电平。总线上有地址、起始/停止条件、ACK/NACK；拉伸时钟、多主机与速率等级需要根据器件和系统支持情况确认。']},{heading:'2. SPI 的特征',body:['典型 SPI 使用 SCK、MOSI、MISO 与 CS/NSS。CPOL 和 CPHA 决定时钟空闲电平和采样相位。SPI 没有统一的设备地址和标准化应用层协议，片选时序由器件数据手册决定。']},{heading:'3. 选型和排障',body:['I²C 节省引脚并支持地址化器件，但吞吐率、总线电容和上拉设计需留意；SPI 通常吞吐更高，但需要更多信号线。排障时先确认接线、电压、电平、时序模式，再用逻辑分析仪核对波形。']}],['能画出 I²C 与 SPI 的信号线。','SPI 需要确认 CPOL/CPHA。','I²C 上拉与总线电容影响上升沿。'],'阅读一个传感器数据手册，提取地址、寄存器读取时序、最大速率和异常处理要求。')
 ]},
 {id:'c-dma',title:'ADC、DMA 与数据采集',category:'外设驱动',level:'进阶',duration:'3.5 小时',color:'rose',icon:'signal',code:'ADC / DMA',desc:'理解 ADC 采样、参考电压、DMA 缓冲区和连续数据流的配合方式。',lessons:[
  lesson('l-adc','ADC 采样、量化与误差',24,'ADC 将模拟电压量化为数字码值，分辨率、参考电压、采样时间和输入源阻抗共同影响结果。',[{heading:'1. 理想量化关系',body:['对 n 位理想 ADC，其输出码约为 0 到 2ⁿ−1。若输入范围为 0 到 Vref，则量化步长可粗略理解为 Vref/2ⁿ；实际器件的码值边界和传输特性应以数据手册定义为准。']},{heading:'2. 采样时间与源阻抗',body:['采样保持电容需要时间通过输入路径充电。若信号源阻抗较高或采样窗口太短，输入可能来不及稳定，造成读数偏差。多通道扫描时还要关注通道切换后的建立时间。']},{heading:'3. 从原始码到物理量',body:['标定偏移、增益和参考电压后，才可以将码值换算为电压或工程量。对噪声敏感的应用可考虑合理的模拟滤波、过采样或数字滤波，但需要评估响应延迟。']}],['分清 ADC 分辨率与有效精度。','采样时间与输入源阻抗有关。','物理量换算需考虑参考电压与校准。'],'若 12 位 ADC 的参考电压为 3.3 V，计算理想量化步长，并说明它为什么不等于总测量误差。'),
  lesson('l-dma','DMA、双缓冲与数据一致性',25,'DMA 可以在外设和内存之间搬运数据，减少 CPU 逐字节处理的负担，但缓冲区所有权必须清晰。',[{heading:'1. 典型数据流',body:['例如定时器触发 ADC 转换，DMA 将结果写入 RAM，半传输或传输完成事件通知软件处理数据块。触发源、DMA 请求映射、数据宽度和缓冲区地址必须匹配芯片实现。']},{heading:'2. 缓冲区所有权',body:['DMA 正在写的区域不应被软件当成稳定快照读取。双缓冲、半缓冲或队列化块处理可以分离生产者与消费者。若芯片带数据缓存，需要按架构要求处理 cache clean/invalidate；无缓存的 Cortex-M0/M3 等系统则没有相同的 D-cache 一致性问题。']},{heading:'3. 错误处理',body:['处理 DMA 错误、过载、丢块和超时；不要在高频中断中执行大量运算。需要连续采集时，设计明确的缓冲区状态机和最坏处理时间预算。']}],['DMA 只负责传输，不自动保证应用数据一致。','明确 DMA 与 CPU 对缓冲区的所有权。','带数据缓存的处理器要检查 cache coherency。'],'画出 ADC + DMA 循环采样的状态图，并标记 half-transfer / transfer-complete 事件后各自可访问的缓冲区。')
 ]},
 {id:'c-rtos',title:'RTOS 任务与并发',category:'实时系统',level:'进阶',duration:'4.5 小时',color:'amber',icon:'layers',code:'TASK / SYNC',desc:'建立任务划分、调度、队列、信号量和互斥锁的基本模型。',lessons:[
  lesson('l-task','任务、调度与实时性',26,'RTOS 将程序组织为多个独立任务，但任务数量并不会自动带来实时性。',[{heading:'1. 任务与调度',body:['任务通常具有自己的栈、状态和优先级。调度器根据就绪状态、优先级和调度策略选择运行任务。抢占式调度中，高优先级就绪任务可能打断低优先级任务；时间片、tickless 和调度锁等行为依内核配置而定。']},{heading:'2. 实时性看什么？',body:['实时系统关注事件发生到结果完成的截止期限，而不仅是平均速度。需要分析中断延迟、任务执行时间、阻塞时间、优先级反转、最坏执行路径与共享资源争用。']},{heading:'3. 任务拆分建议',body:['按职责划分采集、控制、通信和日志任务；通过队列传递数据和事件；为每个任务定义周期、优先级、栈大小、阻塞点和故障恢复策略。避免多个任务无规则地共享大量可变全局状态。']}],['任务是调度单元，不是硬件线程的简单复制。','明确周期、截止期、阻塞点与优先级。','关注最坏时延，而不是只看平均运行速度。'],'为传感器采集、控制算法、通信发送、日志输出设计任务表：周期、优先级、输入输出和阻塞操作。'),
  lesson('l-sync','队列、信号量、互斥锁与优先级反转',30,'不同同步原语表达不同意图：数据传递、事件通知和共享资源保护不应混为一谈。',[{heading:'1. 选择合适的原语',body:['队列传递带数据的消息；二值信号量常用于任务间事件通知；计数信号量可表示可用资源数量；互斥锁用于保护共享资源，并可能支持优先级继承。具体语义依 RTOS 实现而定。']},{heading:'2. 优先级反转',body:['低优先级任务持有锁，高优先级任务等待锁，中优先级任务反复抢占低优先级任务，可能导致高优先级任务被长时间阻塞。优先级继承等协议可缓解部分情况，但不能替代合理的临界区设计。']},{heading:'3. 设计规则',body:['限制持锁时间，不要在持锁期间执行不可控阻塞；规定锁顺序以降低死锁风险；禁止在 ISR 中调用不能从中断上下文使用的 API；按所使用 RTOS 文档确认 FromISR 等专用接口。']}],['队列适合传数据；互斥锁适合保护共享资源。','同步 API 是否可在 ISR 调用必须查具体 RTOS 文档。','长临界区和无序加锁容易引起实时性问题。'],'分析两个任务共享 UART 的方案：由一个通信任务独占 UART，还是多个任务用 mutex 保护？比较可维护性与延迟。')
 ]},
 {id:'c-debug',title:'编译、调试与工程工具链',category:'工程实践',level:'进阶',duration:'3 小时',color:'slate',icon:'terminal',code:'BUILD / DEBUG',desc:'掌握从构建日志、map 文件到断点、调用栈和故障寄存器的工程化排障方法。',lessons:[
  lesson('l-toolchain','从源代码到固件映像',22,'一个可重复的固件构建流程，依赖编译器、链接器、启动文件、芯片头文件、链接脚本和构建配置。',[{heading:'1. 构建产物',body:['ELF 通常包含符号和调试信息，便于调试器定位源代码；HEX/BIN 常用于烧录。不同工具链提供不同转换与查看命令，先确认目标芯片和 ABI。']},{heading:'2. 警告与优化级别',body:['尽量处理编译警告，尤其是类型转换、未使用结果、格式字符串和未初始化变量等。优化级别会改变指令布局、变量可见性与时序，所以调试构建与发布构建表现可能不同。']},{heading:'3. 可复现构建',body:['将依赖版本、编译宏、编译器版本、链接脚本和烧录步骤记录在仓库中。避免依赖某台电脑上的隐藏配置；CI 可进一步帮助验证每次提交都能构建。']}],['知道 ELF、HEX 和 BIN 的不同用途。','编译成功不代表链接布局和运行时行为正确。','将工具链版本与关键构建配置纳入版本管理。'],'为一个固件仓库写出从 clean build 到烧录、运行验证的最短步骤清单。'),
  lesson('l-debug','断点、调用栈与 HardFault',28,'嵌入式调试需要结合软件状态与硬件状态；只在出错行附近猜测通常效率很低。',[{heading:'1. 由外向内缩小范围',body:['先复现并记录输入条件；检查供电、时钟、复位和连线；再看寄存器、关键变量、调用栈和异常状态。使用逻辑分析仪或示波器验证外部时序。']},{heading:'2. 观察 HardFault',body:['Cortex-M 的 fault 排查通常需要查看堆栈中的异常现场、PC/LR/xPSR，以及适用核心提供的 CFSR、HFSR、BFAR、MMFAR 等状态寄存器。具体寄存器可用性和解释依内核配置而定。']},{heading:'3. 让问题可复现',body:['保存固件版本、编译选项、复现步骤、输入数据和日志。对于偶发问题，记录重启原因、异常计数、堆栈高水位、队列溢出次数和关键状态转移，常比大量打印更有效。']}],['调试现场应同时包含 PC、调用栈与外设状态。','HardFault 状态寄存器需按内核手册解读。','可复现步骤和固件版本是排障证据。'],'模拟一次故障复盘：写出复现步骤、最小观察点、可能根因、验证实验和修复后的回归测试。')
 ]},
 {id:'c-reliable',title:'固件可靠性与小型项目',category:'工程实践',level:'进阶',duration:'4 小时',color:'rose',icon:'wrench',code:'WATCHDOG / FSM',desc:'将状态机、错误处理、看门狗和测试方法组合成可维护的固件设计。',lessons:[
  lesson('l-fsm','状态机与错误处理',24,'显式状态机可以将复杂控制逻辑整理为可测试的状态、事件和转移，而不是散落在多层 if-else 中。',[{heading:'1. 状态机模型',body:['定义有限的状态集合、触发事件、守卫条件和状态动作。对于每种状态与事件组合，明确合法转移及非法输入的处理方式。'],code:'IDLE --start--> RUNNING\nRUNNING --done--> COMPLETE\nRUNNING --fault--> ERROR\nERROR --reset--> IDLE'},{heading:'2. 错误码和恢复',body:['为错误定义稳定的含义、来源和恢复策略。临时通信错误可以有限重试，关键配置错误可能进入安全状态；避免忽略返回值或在错误路径中无限阻塞。']},{heading:'3. 可测试性',body:['把状态转移规则与硬件驱动尽量分离，让状态机在主机环境下也能测试。通过模拟事件和故障输入验证所有重要路径。']}],['状态机显式记录合法状态转移。','为错误定义检测、传播、记录与恢复策略。','把业务逻辑和硬件访问适度解耦有利测试。'],'为一个温度监控节点设计状态机：INIT、IDLE、SAMPLE、ALARM、FAULT，并标注触发事件。'),
  lesson('l-watchdog','看门狗、日志与交付检查',24,'可靠性来自可观测性和故障恢复设计，不是简单打开看门狗选项。',[{heading:'1. 看门狗的正确喂法',body:['看门狗应反映关键任务是否仍然推进，而不只是某个循环还在执行。多任务系统可由健康监测模块综合各任务心跳、进度和截止期后决定是否喂狗。具体窗口和复位原因由芯片看门狗实现决定。']},{heading:'2. 日志设计',body:['日志应包含时间戳或事件顺序、模块、错误码和必要上下文。中断中通常避免格式化长字符串；高频日志需限流，避免日志本身改变实时行为或掩盖故障。']},{heading:'3. 最小交付清单',body:['确认干净构建、静态检查、关键驱动测试、故障路径测试、版本标识、升级/回滚策略、看门狗行为和现场诊断方式。把验证结果和已知限制写入 README。']}],['喂狗策略应检查系统健康而非单一循环活性。','日志要平衡诊断价值、内存和实时开销。','每个版本应有可追溯的构建标识与验证记录。'],'为一个小型固件项目写一份发布前 checklist，至少包括构建、接口、异常、功耗、恢复和版本信息。')
 ]}
];
function makeSeedTasks(){const defs=[
 ['第 1 周','整理 C 指针、数组、结构体与生命周期','基础知识',0,40,'高'],['第 1 周','复习二进制、补码、位运算与字节序','底层原理',1,35,'中'],['第 1 周','读懂 .data、.bss、栈和 map 文件','底层原理',2,45,'高'],['第 1 周','追踪一次复位到 main() 的启动流程','MCU 架构',3,45,'高'],['第 1 周','完成一个位操作小练习并写下测试','动手练习',4,40,'中'],
 ['第 2 周','配置 GPIO 输出并验证真实引脚电平','GPIO',7,40,'高'],['第 2 周','绘制外部中断到主循环的事件流','中断',8,45,'高'],['第 2 周','计算定时器分频与 1 kHz 更新频率','定时器',9,40,'中'],['第 2 周','输出指定频率和占空比的 PWM','PWM',10,50,'高'],
 ['第 3 周','实现 UART 接收环形缓冲区设计','通信',14,50,'高'],['第 3 周','用逻辑分析仪分析一次 I²C/SPI 事务','通信',15,45,'中'],['第 3 周','整理 ADC 原始码到物理量的换算','ADC',16,40,'中'],['第 3 周','画出 DMA 双缓冲的所有权流转','DMA',17,45,'高'],

function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultState();const parsed=JSON.parse(raw);const base=defaultState();return {...base,...parsed,completedLessons:Array.isArray(parsed.completedLessons)?parsed.completedLessons:[],tasks:Array.isArray(parsed.tasks)?parsed.tasks:base.tasks,records:Array.isArray(parsed.records)?parsed.records:[],resources:Array.isArray(parsed.resources)?parsed.resources:base.resources,notes:Array.isArray(parsed.notes)?parsed.notes:[],customCourses:Array.isArray(parsed.customCourses)?parsed.customCourses:[]};}catch(e){return defaultState();}}

function allCourses(){return [...curriculum,...state.customCourses]}
function allLessons(){return allCourses().flatMap(c=>c.lessons.map(l=>({...l,courseId:c.id,courseTitle:c.title,courseCategory:c.category}))) }
function findCourse(id){return allCourses().find(c=>c.id===id)}
function findLesson(id){for(const c of allCourses()){const l=c.lessons.find(x=>x.id===id);if(l)return {course:c,lesson:l};}return null}
function isDone(id){return state.completedLessons.includes(id)}
function courseProgress(c){const done=c.lessons.filter(l=>isDone(l.id)).length;return {done,total:c.lessons.length,pct:c.lessons.length?Math.round(done/c.lessons.length*100):0}}
function totalStudyMinutes(){return state.records.reduce((n,r)=>n+(Number(r.minutes)||0),0)}
function completedTasks(){return state.tasks.filter(t=>t.done).length}
function weekTasks(week){return state.tasks.filter(t=>t.week===week)}
function weekProgress(week){const arr=weekTasks(week);return arr.length?Math.round(arr.filter(t=>t.done).length/arr.length*100):0}
function weekStudyMinutes(){const now=new Date();const day=(now.getDay()+6)%7;const start=new Date(now);start.setDate(now.getDate()-day);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(start.getDate()+7);return state.records.filter(r=>{const d=new Date((r.date||'')+'T12:00:00');return d>=start&&d<end;}).reduce((n,r)=>n+Number(r.minutes||0),0)}

function renderLearning(){if(ui.learningView==='course')return renderCourseDetail();if(ui.learningView==='lesson')return renderLessonDetail();const cats=['全部','基础知识','底层原理','外设驱动','实时系统','工程实践'];let courses=allCourses();if(ui.courseFilter!=='全部')courses=courses.filter(c=>c.category===ui.courseFilter);if(ui.courseSearch.trim()){const q=ui.courseSearch.trim().toLowerCase();courses=courses.filter(c=>(c.title+c.desc+c.category+c.lessons.map(l=>l.title+' '+l.summary).join(' ')).toLowerCase().includes(q));}const lessonTotal=allLessons().length,doneTotal=allLessons().filter(l=>isDone(l.id)).length;return `${pageHead('学习地图','一张从 C 语言、计算机底层到驱动、RTOS 与工程实践的知识地图。',button('＋ 自定义课程','open-modal','primary','data-modal="course"'))}<div class="panel" style="margin-bottom:18px;padding:16px 19px"><div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><strong style="font-size:12px">整体学习进度</strong><div class="muted" style="font-size:10px;margin-top:4px">已完成 ${doneTotal} / ${lessonTotal} 个知识单元</div></div><div style="width:min(400px,100%);flex:1">${progressLine(lessonTotal?doneTotal/lessonTotal*100:0)}</div><strong style="font-size:14px;color:var(--green)">${lessonTotal?Math.round(doneTotal/lessonTotal*100):0}%</strong></div></div><div class="catalog-tools"><div class="filter-row" style="margin:0">${cats.map(c=>`<button class="filter-chip ${ui.courseFilter===c?'active':''}" data-action="course-filter" data-filter="${c}">${c}</button>`).join('')}</div><form id="course-search-form" class="inline-search">${icon('search',15)}<input name="q" value="${esc(ui.courseSearch)}" placeholder="搜索知识点…" /></form></div><div class="course-grid">${courses.map(renderCourseCard).join('')||`<div class="empty" style="grid-column:1/-1"><strong>没有找到匹配的课程</strong>换一个关键词，或创建自己的课程模块。</div>`}</div><div class="footer-note">课程按知识域组织；完成每课后会自动累计个人进度</div>`}
function renderCourseCard(c){const p=courseProgress(c);return `<article class="course-card" data-action="open-course" data-id="${c.id}" tabindex="0" role="button" aria-label="打开${esc(c.title)}"><div class="course-cover ${c.color||'mint'}"><div class="cover-orbit"></div><div class="cover-mark">${icon(c.icon||'book',25)}</div><span class="cover-code">${esc(c.code||'MY MODULE')}</span></div><div class="course-body"><div class="course-meta"><span class="pill ${c.category==='外设驱动'?'blue':c.category==='工程实践'?'rose':c.category==='实时系统'?'amber':'green'}">${esc(c.category)}</span><span class="muted" style="font-size:10px">${esc(c.level||'自定义')}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="course-footer"><span>${c.lessons.length} 个知识单元 · ${esc(c.duration||'自定义')}</span><strong>${p.pct}%</strong></div><div class="course-progress"><span style="width:${p.pct}%"></span></div></div></article>`}
function renderCourseDetail(){const c=findCourse(ui.courseId);if(!c){ui.learningView='catalog';return renderLearning()}const p=courseProgress(c);return `<button class="back-link" data-action="back-learning">${icon('left',14)} 返回学习地图</button><div class="course-hero" style="background:${c.color==='blue'?'#e5edf4':c.color==='amber'?'#f8ead8':c.color==='rose'?'#f4e3df':c.color==='slate'?'#e9ece9':'#e5eee4'}"><div class="course-hero-mark">${icon(c.icon||'book',40)}</div><div class="course-hero-content"><span class="pill">${esc(c.category)}</span><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p><div class="course-hero-stats"><span>${icon('book',12)} ${c.lessons.length} 个知识单元</span><span>${icon('clock',12)} ${esc(c.duration||'自定义时长')}</span><span>${icon('checkcircle',12)} 已完成 ${p.done}/${p.total}</span></div></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">课程内容</div><div class="panel-sub">点击任一知识单元进入完整内容，完成后可继续下一节。</div></div><span class="pill green">${p.pct}% 完成</span></div><div style="margin-bottom:17px">${progressLine(p.pct)}</div><div class="lesson-list">${c.lessons.map((l,i)=>`<button class="lesson-row" data-action="open-lesson" data-id="${l.id}"><span class="lesson-index ${isDone(l.id)?'done':''}">${isDone(l.id)?icon('check',15):String(i+1).padStart(2,'0')}</span><span class="lesson-row-copy"><strong>${esc(l.title)}</strong><span>${l.minutes||20} 分钟 · ${isDone(l.id)?'已完成':'待学习'} · ${esc(l.summary).slice(0,56)}${l.summary.length>56?'…':''}</span></span><span class="lesson-tail">${icon('chevron',18)}</span></button>`).join('')}</div></div>`}
function renderLessonDetail(){const found=findLesson(ui.lessonId);if(!found){ui.learningView='catalog';return renderLearning()}const {course:c,lesson:l}=found;const idx=c.lessons.findIndex(x=>x.id===l.id),done=isDone(l.id),p=courseProgress(c);const sectionHtml=(l.sections||[]).map(s=>`<section class="lesson-section"><h3>${esc(s.heading)}</h3>${(s.body||[]).map(t=>`<p>${esc(t).replace(/`([^`]+)`/g,'<code>$1</code>')}</p>`).join('')}${s.bullets?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${s.code?`<pre class="code-block">${esc(s.code)}</pre>`:''}</section>`).join('');return `<button class="back-link" data-action="back-course">${icon('left',14)} 返回「${esc(c.title)}」</button><div class="lesson-layout"><article class="lesson-article"><div class="lesson-topline"><span>${esc(c.category)}</span><span>·</span><span>${esc(c.title)}</span><span>·</span><span>${l.minutes||20} 分钟</span></div><h2>${esc(l.title)}</h2><div class="lesson-summary">${esc(l.summary)}</div>${sectionHtml}<div class="takeaway-box"><h4>关键要点</h4><ul>${(l.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div class="exercise-box"><h4>动手练习 / 自测</h4><p>${esc(l.exercise||'用自己的话总结本节内容，并写下一条还未解决的问题。')}</p><div style="margin-top:11px">${button('把练习记录到每日记录','lesson-to-record','soft',`data-id="${l.id}" data-title="${esc(l.title)}"`)}</div></div><div class="lesson-actions"><button class="btn" data-action="lesson-prev" ${idx===0?'disabled':''}>${icon('left',14)} 上一节</button><button class="btn ${done?'soft':'primary'}" data-action="toggle-lesson" data-id="${l.id}">${done?icon('checkcircle',15)+' 已完成 · 取消标记':'标记为已完成 '+icon('check',15)}</button><button class="btn" data-action="lesson-next" ${idx===c.lessons.length-1?'disabled':''}>下一节 ${icon('arrow',14)}</button></div></article><aside class="lesson-sidebar"><div class="side-panel"><h4>本课程进度</h4><div class="side-progress"><span>${p.done} / ${p.total} 课</span><strong>${p.pct}%</strong></div>${progressLine(p.pct)}<div class="side-lesson-list" style="margin-top:12px">${c.lessons.map((x,i)=>`<button class="side-lesson ${x.id===l.id?'active':''} ${isDone(x.id)?'done':''}" data-action="open-lesson" data-id="${x.id}"><span class="side-dot">${isDone(x.id)?'✓':i+1}</span><span>${esc(x.title)}</span></button>`).join('')}</div></div><div class="side-panel"><h4>学习提示</h4><p style="font-size:11px;color:#829087;line-height:1.8;margin:0">建议先独立理解概念，再结合目标 MCU 的数据手册验证。遇到芯片相关差异，以具体型号的参考手册和勘误表为准。</p></div></aside></div>`}
function renderPlans(){const total=state.tasks.length,done=completedTasks(),pct=total?Math.round(done/total*100):0;const weeks=['第 1 周','第 2 周','第 3 周','第 4 周'];return `${pageHead('学习计划','默认路线按每天约 30–60 分钟设计。你可以勾选、改期、添加自己的目标。',button('＋ 添加任务','open-modal','primary','data-modal="task"'))}<div class="plan-summary"><div class="plan-hero"><div class="target-ring">${pct}%</div><div><strong>四周路线进行中</strong><span>目标：从底层基础走到一个可解释、可调试的小型固件项目</span><div style="margin-top:11px;width:min(260px,48vw)">${progressLine(pct)}</div></div></div><div class="plan-mini"><small>已完成任务</small><strong>${done}<span style="font-size:12px;color:#89968c"> / ${total}</span></strong><span>保持节奏</span></div><div class="plan-mini"><small>本周记录时长</small><strong>${(weekStudyMinutes()/60).toFixed(1)}<span style="font-size:12px">h</span></strong><span>目标 ${Number(state.targetHours)||5}h</span></div><div class="plan-mini"><small>自定义任务</small><strong>${state.tasks.filter(t=>t.custom).length}</strong><span>由你添加</span></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">四周执行路线</div><div class="panel-sub">完成任务会自动保存；任何一天都可以改计划，不必追求一次做到完美。</div></div><span class="pill green">${pct}% 完成</span></div>${weeks.map((w,i)=>{const arr=weekTasks(w);const wp=weekProgress(w);return `<div class="week-block"><div class="week-heading"><div class="week-badge">0${i+1}</div><div><strong>${['建立底层认知','掌握基础外设','打通数据链路','面向可靠性交付'][i]}</strong><span>${w} · ${arr.filter(t=>t.done).length}/${arr.length} 项</span></div><div class="progress-line"><span style="width:${wp}%"></span></div></div>${arr.length?arr.sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(t=>`<div class="plan-task ${t.done?'completed':''}"><button class="check-control ${t.done?'done':''}" data-action="toggle-task" data-id="${t.id}" aria-label="切换任务完成状态">${t.done?icon('check',12):''}</button><div class="task-copy"><strong>${esc(t.title)}</strong><div class="task-meta"><span>${esc(t.category||'自定义')}</span><span>·</span><span>${t.minutes||30} 分钟</span><span>·</span><span>${displayDate(t.due)}</span></div></div><div class="task-right"><span class="priority ${esc(t.priority||'中')}">${esc(t.priority||'中')}优先级</span>${t.custom?`<button class="icon-btn" data-action="delete-item" data-type="task" data-id="${t.id}" aria-label="删除任务">${icon('trash',14)}</button>`:''}</div></div>`).join(''):`<div class="empty">本周任务还没有安排。点击右上角添加你的第一项任务。</div>`}</div>`}).join('')}</div><div class="notice"><strong>计划原则：</strong>先完成“可验证的学习结果”，而不是只看视频时长。每周至少产出一次实践记录：代码、波形截图、时序图、故障分析或一段能讲清楚的总结。</div>`}
function renderRecords(){const records=[...state.records].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));const selected=ui.recordFilter==='全部'?records:records.filter(r=>r.category===ui.recordFilter);const total=selected.reduce((n,r)=>n+Number(r.minutes||0),0);return `${pageHead('每日记录','把今天理解了什么、哪里卡住、下一步做什么写下来。学习才真正有迹可循。')}<div class="record-layout"><section class="form-panel"><h3>记录一笔学习</h3><p>不需要长篇大论，真实而具体的一小段就足够。</p><form id="record-form" data-form="record"><div class="field"><label for="rec-title">今天学了什么 *</label><input id="rec-title" name="title" required maxlength="100" placeholder="例如：理解 UART 环形缓冲区" /></div><div class="field-row"><div class="field"><label for="rec-date">学习日期</label><input id="rec-date" type="date" name="date" value="${todayStr()}" required /></div><div class="field"><label for="rec-minutes">投入时长（分钟）</label><input id="rec-minutes" type="number" name="minutes" min="1" max="1440" value="30" required /></div></div><div class="field"><label for="rec-category">学习类别</label><select id="rec-category" name="category"><option>基础知识</option><option>底层原理</option><option>外设驱动</option><option>实时系统</option><option>工程实践</option><option>阅读与整理</option><option>自定义</option></select></div><div class="field"><label for="rec-content">学习收获 / 卡点</label><textarea id="rec-content" name="content" placeholder="今天理解了什么？做了哪个实验？还没搞懂什么？"></textarea></div><div class="field"><label for="rec-next">下一步行动</label><textarea id="rec-next" name="next" style="min-height:62px" placeholder="例如：用逻辑分析仪确认 ACK 时序"></textarea></div><button class="btn primary" type="submit" style="width:100%;justify-content:center">${icon('plus',15)} 保存学习记录</button></form></section><section><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:15px"><div class="stat-card" style="min-height:96px"><div class="stat-head"><span>记录条数</span>${icon('note',15)}</div><div class="stat-value" style="font-size:24px">${records.length}</div><div class="stat-foot">选择条件后查看筛选结果</div></div><div class="stat-card" style="min-height:96px"><div class="stat-head"><span>筛选时长</span>${icon('clock',15)}</div><div class="stat-value" style="font-size:24px">${(total/60).toFixed(total%60===0?0:1)}<span style="font-size:11px"> h</span></div><div class="stat-foot">对应当前列表</div></div></div><div class="records-head"><div><h3>学习时间线</h3><span>共 ${selected.length} 条记录</span></div><select id="record-filter" aria-label="筛选记录类别" style="border:1px solid var(--line);border-radius:9px;background:white;padding:8px;font-size:11px;color:#66766a"><option ${ui.recordFilter==='全部'?'selected':''}>全部</option>${['基础知识','底层原理','外设驱动','实时系统','工程实践','阅读与整理','自定义'].map(c=>`<option ${ui.recordFilter===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="record-list">${selected.length?selected.map(renderRecordCard).join(''):`<div class="empty"><strong>${records.length?'没有符合条件的记录':'第一条记录从今天开始'}</strong>${records.length?'请切换类别筛选。':'把刚学到的一个概念、一段实验或一个疑问记在左边。'}</div>`}</div></section></div>`}
function renderRecordCard(r){const d=stampDate(r.date);return `<article class="record-card"><div class="record-card-top"><div class="record-date"><strong>${d.day}</strong><span>${d.month}</span></div><div class="record-main"><h4>${esc(r.title)}</h4>${r.content?`<p>${esc(r.content)}</p>`:`<p class="muted">未填写学习收获</p>`}<div class="record-bits"><span>${esc(r.category||'学习')}</span><span>${r.minutes||0} 分钟</span><span>${esc(r.date||'')}</span></div></div><button class="icon-btn" data-action="delete-item" data-type="record" data-id="${r.id}" aria-label="删除记录">${icon('trash',14)}</button></div>${r.next?`<div class="record-next"><b>下一步：</b>${esc(r.next)}</div>`:''}</article>`}
function renderResources(){const cats=['全部','官方文档','工具与调试','学习教程','自定义'];const resources=ui.resourceFilter==='全部'?state.resources:state.resources.filter(r=>r.category===ui.resourceFilter);return `${pageHead('资源收藏','优先收藏一手资料、参考手册与工具文档；把“以后再看”变成可检索的入口。',button('＋ 添加资源','open-modal','primary','data-modal="resource"'))}<div class="filter-row">${cats.map(c=>`<button class="filter-chip ${ui.resourceFilter===c?'active':''}" data-action="resource-filter" data-filter="${c}">${c}</button>`).join('')}</div><div class="resource-grid">${resources.map(r=>`<article class="resource-card"><div class="resource-type"><div class="resource-icon">${icon(r.category==='工具与调试'?'terminal':r.category==='学习教程'?'book':'file',19)}</div><span class="pill">${esc(r.category)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.desc||'个人收藏资源。')}</p><div class="resource-foot"><span>${esc(r.tag||'MY RESOURCE')}</span><div style="display:flex;align-items:center;gap:10px"><a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">打开链接 ${icon('external',12)}</a>${r.custom?`<button class="icon-btn" data-action="delete-item" data-type="resource" data-id="${r.id}" aria-label="删除资源">${icon('trash',13)}</button>`:''}</div></div></article>`).join('')||`<div class="empty" style="grid-column:1/-1"><strong>这里还没有资源</strong>添加文档链接、教程或你常用的工具。</div>`}</div><div class="notice"><strong>使用建议：</strong>阅读芯片相关内容时，优先以目标型号的数据手册、参考手册、勘误表和官方头文件为准。社区文章适合辅助理解，但不要替代硬件规格依据。</div>`}
function renderKnowledge(){const notes=[...state.notes].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));return `${pageHead('我的知识库','沉淀自己的解释、代码片段、错误案例与设计决策。这里的内容完全由你决定。',button('＋ 写一条笔记','open-modal','primary','data-modal="note"'))}<div class="panel" style="margin-bottom:17px;background:#eaf1e7;border-color:#dce8da"><div style="display:flex;align-items:center;gap:14px"><div class="lesson-thumb" style="background:#d9e8d8;color:#476d4e">${icon('library',25)}</div><div><strong style="font-size:13px">把“知道”变成“自己的知识”</strong><p style="font-size:11px;color:#738575;margin:4px 0 0">推荐记录：关键概念解释、硬件排错过程、代码设计模式、常见陷阱、可复用清单。</p></div></div></div><div class="knowledge-grid">${notes.map(n=>`<article class="note-card"><div class="note-label">${esc(n.category||'MY NOTE')}</div><h3>${esc(n.title)}</h3><p>${esc(n.content)}</p><div class="note-footer"><span>${displayDate((n.createdAt||'').slice(0,10))}</span><button class="icon-btn" data-action="delete-item" data-type="note" data-id="${n.id}" aria-label="删除笔记">${icon('trash',13)}</button></div></article>`).join('')||`<div class="empty" style="grid-column:1/-1"><strong>你的知识库还是空白</strong>从一次驱动调试、一段代码或一个难点解释开始。</div>`}<article class="note-card" style="border-style:dashed;box-shadow:none;align-items:flex-start;justify-content:center"><div class="lesson-thumb" style="width:42px;height:42px">${icon('plus',22)}</div><h3>追加你自己的内容</h3><p>自定义分类不限于课程大纲。可以加入项目复盘、面试题、代码片段或日后想继续研究的问题。</p><button class="btn soft" data-action="open-modal" data-modal="note">新建知识卡片 ${icon('arrow',13)}</button></article></div>`}
function renderSettings(){return `${pageHead('偏好与数据','调整你的学习节奏，并定期备份记录。所有内容默认保存在当前浏览器。')}<div class="settings-grid"><section class="setting-card"><h3>学习偏好</h3><p>这些设置会影响工作台的显示和默认学习目标。</p><form id="settings-form" data-form="settings"><div class="field"><label for="profile-name">工作台称呼</label><input id="profile-name" name="profileName" maxlength="30" value="${esc(state.profileName||'学习者')}" placeholder="例如：小林" /></div><div class="field"><label for="target-hours">每周学习目标（小时）</label><input id="target-hours" name="targetHours" type="number" min="1" max="80" step="1" value="${Number(state.targetHours)||5}" required /><small>建议初期设置 3–7 小时，稳定之后再增加。</small></div><button class="btn primary" type="submit">保存偏好</button></form><div class="setting-row"><div><strong>课程内容</strong><span>内置知识地图与自定义课程均可长期编辑</span></div><span class="pill green">${allCourses().length} 门</span></div><div class="setting-row"><div><strong>本地学习数据</strong><span>任务、记录、进度、资源、知识卡片</span></div><span class="pill">${state.records.length+state.notes.length+state.tasks.filter(t=>t.custom).length} 项+</span></div></section><section class="setting-card"><h3>数据备份与迁移</h3><p>这套静态网站不需要账号，数据由浏览器本地保存。换设备前请先导出。</p><div class="setting-actions"><button class="btn primary" data-action="export-data">${icon('download',15)} 导出全部数据 JSON</button><label class="btn" for="import-file" style="cursor:pointer">${icon('upload',15)} 导入备份 JSON</label><input id="import-file" type="file" accept="application/json,.json" style="display:none" /></div><div class="notice"><strong>重要说明：</strong>GitHub Pages 只负责托管静态网站。学习记录和自定义内容存储在本机浏览器的 localStorage，不会自动同步到 GitHub 或其他设备。公开发布站点时，请勿把私人记录写入代码文件。</div><div class="setting-row" style="margin-top:12px"><div><strong>恢复初始数据</strong><span>清除当前浏览器的学习进度、自定义内容与记录</span></div><button class="btn danger small" data-action="reset-data">重置</button></div></section></div><section class="setting-card" style="margin-top:17px"><h3>如何发布到 GitHub Pages</h3><p>网站是一个无构建步骤的纯 HTML/CSS/JavaScript 页面，适合直接放进仓库根目录。</p><div class="task-list"><div class="task-row"><div class="lesson-index">01</div><div class="task-copy"><strong>创建仓库并上传 index.html</strong><div class="sub">建议仓库命名为 embedded-learning-hub。若使用 GitHub Free，GitHub Pages 通常需要公开仓库。</div></div></div><div class="task-row"><div class="lesson-index">02</div><div class="task-copy"><strong>打开 Settings → Pages</strong><div class="sub">在 Build and deployment 中选择 Deploy from a branch，分支选择 main，目录选择 /(root)，然后保存。</div></div></div><div class="task-row"><div class="lesson-index">03</div><div class="task-copy"><strong>打开发布地址并测试交互</strong><div class="sub">确认课程跳转、任务勾选、每日记录、数据导出/导入和移动端布局均正常。</div></div></div></div><p style="margin-top:15px"><a href="https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:var(--green);font-weight:700">查看 GitHub Pages 官方指南 ${icon('external',12)}</a></p></section>`}
function renderSearch(){const q=ui.query.trim().toLowerCase();const found=[];if(q){allCourses().forEach(c=>{if((c.title+c.desc+c.category).toLowerCase().includes(q))found.push({type:'course',id:c.id,title:c.title,desc:`${c.category} · ${c.desc}`});c.lessons.forEach(l=>{if((l.title+l.summary+(l.sections||[]).map(s=>(s.body||[]).join(' ')).join(' ')).toLowerCase().includes(q))found.push({type:'lesson',id:l.id,title:l.title,desc:`${c.title} · ${l.summary}`})})});state.notes.forEach(n=>{if((n.title+n.content+n.category).toLowerCase().includes(q))found.push({type:'note',id:n.id,title:n.title,desc:`我的知识库 · ${n.content}`})});state.resources.forEach(r=>{if((r.title+r.desc+r.category+r.url).toLowerCase().includes(q))found.push({type:'resource',id:r.id,title:r.title,desc:`${r.category} · ${r.desc}`})});state.records.forEach(r=>{if((r.title+r.content+r.next+r.category).toLowerCase().includes(q))found.push({type:'record',id:r.id,title:r.title,desc:`每日记录 · ${r.content||'没有补充内容'}`})})}return `${pageHead('搜索结果',q?`关键词：“${esc(ui.query)}” · 找到 ${found.length} 项相关内容。`:'输入关键词，跨课程、笔记、资源和每日记录检索。')}<form id="search-page-form" class="inline-search" style="width:min(520px,100%);margin-bottom:19px">${icon('search',16)}<input name="q" value="${esc(ui.query)}" placeholder="例如：volatile、DMA、HardFault…" /><button class="btn small" type="submit">搜索</button></form><div class="search-results">${found.slice(0,80).map(f=>`<button class="search-result" data-action="search-open" data-type="${f.type}" data-id="${f.id}"><span class="sr-icon">${icon(f.type==='course'?'book':f.type==='lesson'?'code':f.type==='note'?'library':f.type==='resource'?'link':'note',19)}</span><span style="min-width:0"><strong>${esc(f.title)}</strong><small>${esc(f.desc).slice(0,180)}</small></span><span style="margin-left:auto;color:#9ba69d">${icon('chevron',16)}</span></button>`).join('')||`<div class="empty"><strong>${q?'没有找到匹配内容':'开始搜索你的学习库'}</strong>${q?'试试更短的关键词，例如“内存”“中断”或“UART”。':'搜索会覆盖课程内容、个人知识卡片、资源收藏和学习记录。'}</div>`}</div>`}
function renderModal(){const type=ui.modal;const modalHead=({course:['添加自定义课程','新课程会出现在学习地图，可直接打开学习和标记完成。'],task:['添加计划任务','为目标安排日期与时长，之后可以勾选完成。'],resource:['添加资源收藏','保存官方文档、文章、工具或项目链接。'],note:['新建知识卡片','写下个人理解、代码思路、故障经验或补充内容。']})[type];let form='';if(type==='course')form=`<form data-form="course"><div class="field"><label>课程名称 *</label><input name="title" required maxlength="90" placeholder="例如：CAN 总线与报文设计" /></div><div class="field-row"><div class="field"><label>知识分类</label><select name="category"><option>基础知识</option><option>底层原理</option><option>外设驱动</option><option>实时系统</option><option>工程实践</option><option>自定义</option></select></div><div class="field"><label>课程级别</label><select name="level"><option>基础</option><option>进阶</option><option>深入</option><option>自定义</option></select></div></div><div class="field"><label>课程简介</label><textarea name="desc" style="min-height:65px" placeholder="这一模块希望解决什么问题？"></textarea></div><div class="field"><label>第一课标题 *</label><input name="lessonTitle" required maxlength="90" placeholder="例如：CAN 的物理层与仲裁" /></div><div class="field"><label>第一课内容 *</label><textarea name="lessonContent" required placeholder="写入你的知识内容、学习步骤或关键概念……"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">创建课程</button></div></form>`;if(type==='task')form=`<form data-form="task"><div class="field"><label>任务内容 *</label><input name="title" required maxlength="120" placeholder="例如：实现一个 UART 接收状态机" /></div><div class="field-row"><div class="field"><label>所属周</label><select name="week"><option>第 1 周</option><option>第 2 周</option><option>第 3 周</option><option>第 4 周</option><option>长期目标</option></select></div><div class="field"><label>计划日期</label><input type="date" name="due" value="${todayStr()}" /></div></div><div class="field-row"><div class="field"><label>预计时长（分钟）</label><input type="number" name="minutes" min="1" max="1440" value="30" /></div><div class="field"><label>优先级</label><select name="priority"><option>中</option><option>高</option><option>低</option></select></div></div><div class="field"><label>所属主题</label><input name="category" maxlength="40" placeholder="例如：驱动调试、阅读、项目实践" /></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">添加到计划</button></div></form>`;if(type==='resource')form=`<form data-form="resource"><div class="field"><label>资源名称 *</label><input name="title" required maxlength="100" placeholder="例如：目标芯片参考手册" /></div><div class="field"><label>链接 URL *</label><input name="url" required type="url" placeholder="https://…" /></div><div class="field-row"><div class="field"><label>分类</label><select name="category"><option>官方文档</option><option>工具与调试</option><option>学习教程</option><option>自定义</option></select></div><div class="field"><label>标签</label><input name="tag" maxlength="30" placeholder="例如：I2C / DEBUG" /></div></div><div class="field"><label>说明</label><textarea name="desc" style="min-height:65px" placeholder="这份资源能解决什么问题？"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">保存资源</button></div></form>`;if(type==='note')form=`<form data-form="note"><div class="field"><label>标题 *</label><input name="title" required maxlength="100" placeholder="例如：I²C 总线卡死的排查顺序" /></div><div class="field"><label>分类 / 标签</label><input name="category" maxlength="40" placeholder="例如：排错经验、代码模式、项目复盘" /></div><div class="field"><label>内容 *</label><textarea name="content" required style="min-height:150px" placeholder="记录自己的解释、示例、踩坑原因和可复用的方法……"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">保存到知识库</button></div></form>`;return `<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(modalHead[0])}"><div class="modal-head"><div><h2>${modalHead[0]}</h2><p>${modalHead[1]}</p></div><button class="modal-close" data-action="close-modal" aria-label="关闭">${icon('close',16)}</button></div>${form}</section></div>`}
function showToast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>root.innerHTML='',2800)}
function navigate(page){ui.page=page;ui.learningView='catalog';ui.courseId=null;ui.lessonId=null;ui.modal=null;renderApp();window.scrollTo({top:0,behavior:'smooth'});}
function openLesson(id){const found=findLesson(id);if(!found)return;ui.page='learning';ui.learningView='lesson';ui.courseId=found.course.id;ui.lessonId=id;renderApp();window.scrollTo({top:0,behavior:'smooth'});}
function openCourse(id){if(!findCourse(id))return;ui.page='learning';ui.learningView='course';ui.courseId=id;ui.lessonId=null;renderApp();window.scrollTo({top:0,behavior:'smooth'});}
function toggleTask(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;task.done=!task.done;save();renderApp();showToast(task.done?'已完成这项任务':'已恢复为待完成');}
function toggleLesson(id){const i=state.completedLessons.indexOf(id);if(i>=0)state.completedLessons.splice(i,1);else state.completedLessons.push(id);save();renderApp();showToast(i>=0?'已取消完成标记':'已记录课程进度');}
function removeItem(type,id){const map={task:'tasks',record:'records',resource:'resources',note:'notes',course:'customCourses'};const key=map[type];if(!key)return;state[key]=state[key].filter(x=>x.id!==id);if(type==='course'){const c=allCourses().find(x=>x.id===id);if(c)state.completedLessons=state.completedLessons.filter(lid=>!c.lessons.some(l=>l.id===lid));if(ui.courseId===id){ui.learningView='catalog';ui.courseId=null;}}save();renderApp();showToast('已删除内容');}
function exportData(){const payload={app:'Embedded Lab Learning Workspace',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`embedded-lab-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('备份文件已导出');}
function importData(text){try{const parsed=JSON.parse(text);const incoming=parsed.state||parsed;if(!incoming||typeof incoming!=='object'||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.records)||!Array.isArray(incoming.resources)||!Array.isArray(incoming.notes))throw new Error('文件结构不匹配');if(!confirm('导入备份会覆盖当前浏览器中的学习数据，建议先导出当前数据。是否继续？'))return;const base=defaultState();state={...base,...incoming,completedLessons:Array.isArray(incoming.completedLessons)?incoming.completedLessons:[],tasks:incoming.tasks,records:incoming.records,resources:incoming.resources,notes:incoming.notes,customCourses:Array.isArray(incoming.customCourses)?incoming.customCourses:[]};save();ui={...ui,page:'dashboard',learningView:'catalog',courseId:null,lessonId:null,modal:null};renderApp();showToast('数据导入成功');}catch(e){showToast('导入失败：文件不是有效的学习库 JSON 备份。');}}
document.addEventListener('click',function(e){const mobile=e.target.closest('#mobile-menu');if(mobile){document.getElementById('sidebar').classList.toggle('open');return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='backdrop-close'&&e.target===el){ui.modal=null;renderApp();return;}if(a==='close-modal'){ui.modal=null;renderApp();return;}if(a==='navigate'){navigate(el.dataset.page);return;}if(a==='open-modal'){ui.modal=el.dataset.modal;renderApp();return;}if(a==='open-course'){openCourse(el.dataset.id);return;}if(a==='continue-lesson'||a==='open-lesson'){openLesson(el.dataset.id);return;}if(a==='back-learning'){ui.learningView='catalog';ui.courseId=null;ui.lessonId=null;renderApp();return;}if(a==='back-course'){ui.learningView='course';ui.lessonId=null;renderApp();return;}if(a==='toggle-task'){toggleTask(el.dataset.id);return;}if(a==='toggle-lesson'){toggleLesson(el.dataset.id);return;}if(a==='course-filter'){ui.courseFilter=el.dataset.filter;renderApp();return;}if(a==='resource-filter'){ui.resourceFilter=el.dataset.filter;renderApp();return;}if(a==='delete-item'){if(confirm('确定删除这项内容吗？此操作无法自动撤销。'))removeItem(el.dataset.type,el.dataset.id);return;}if(a==='export-data'){exportData();return;}if(a==='reset-data'){if(confirm('确定重置吗？当前学习记录、自定义课程、计划和知识卡片都会从此浏览器删除。请先导出备份。')){state=defaultState();save();ui={page:'dashboard',learningView:'catalog',courseId:null,lessonId:null,courseFilter:'全部',courseSearch:'',recordFilter:'全部',resourceFilter:'全部',query:'',modal:null};renderApp();showToast('已恢复初始状态');}return;}if(a==='lesson-prev'||a==='lesson-next'){const f=findLesson(ui.lessonId);if(!f)return;const i=f.course.lessons.findIndex(l=>l.id===ui.lessonId);const next=f.course.lessons[i+(a==='lesson-next'?1:-1)];if(next)openLesson(next.id);return;}if(a==='lesson-to-record'){navigate('records');const title=el.dataset.title;setTimeout(()=>{const input=document.getElementById('rec-title');if(input)input.value=`学习：${title}`;const area=document.getElementById('rec-content');if(area)area.focus();},0);return;}if(a==='search-open'){const t=el.dataset.type,id=el.dataset.id;if(t==='course')openCourse(id);else if(t==='lesson')openLesson(id);else if(t==='note'){navigate('knowledge');}else if(t==='resource'){navigate('resources');}else if(t==='record'){navigate('records');}return;}});
document.addEventListener('submit',function(e){const form=e.target;if(form.id==='global-search'||form.id==='search-page-form'){e.preventDefault();const fd=new FormData(form);ui.query=String(fd.get('q')||'');ui.page='search';ui.learningView='catalog';renderApp();return;}if(form.id==='course-search-form'){e.preventDefault();ui.courseSearch=String(new FormData(form).get('q')||'');renderApp();return;}const type=form.dataset.form;if(!type)return;e.preventDefault();const fd=new FormData(form);const val=k=>String(fd.get(k)||'').trim();if(type==='record'){const r={id:uid('record'),title:val('title'),date:val('date')||todayStr(),minutes:Math.max(1,Math.min(1440,Number(val('minutes'))||30)),category:val('category')||'自定义',content:val('content'),next:val('next'),createdAt:new Date().toISOString()};if(!r.title)return;state.records.push(r);save();ui.recordFilter='全部';renderApp();showToast('学习记录已保存');return;}if(type==='task'){const t={id:uid('task'),title:val('title'),week:val('week')||'长期目标',due:val('due')||todayStr(),minutes:Math.max(1,Number(val('minutes'))||30),priority:val('priority')||'中',category:val('category')||'自定义',done:false,custom:true};state.tasks.push(t);save();ui.modal=null;renderApp();showToast('任务已添加到学习计划');return;}if(type==='course'){const title=val('title'),lessonTitle=val('lessonTitle'),lessonContent=val('lessonContent');if(!title||!lessonTitle||!lessonContent)return;const cid=uid('course'),lid=uid('lesson');const cat=val('category')||'自定义';const c={id:cid,title,category:cat,level:val('level')||'自定义',duration:'自定义',color:'mint',icon:'book',code:'MY MODULE',desc:val('desc')||'个人自定义学习模块。',custom:true,lessons:[{id:lid,title:lessonTitle,minutes:20,summary:lessonContent.slice(0,180),sections:[{heading:'学习内容',body:lessonContent.split(/\n+/).filter(Boolean)}],takeaways:['用自己的话解释本节核心概念。','结合目标芯片或一个小实验进行验证。'],exercise:'写下本节知识点的一个练习、实验或需要进一步确认的问题。'}]};state.customCourses.push(c);save();ui.modal=null;ui.page='learning';ui.learningView='course';ui.courseId=cid;ui.lessonId=null;renderApp();showToast('自定义课程已创建');return;}if(type==='resource'){const url=safeUrl(val('url'));if(url==='#'){showToast('请输入以 http:// 或 https:// 开头的有效链接');return;}state.resources.push({id:uid('resource'),title:val('title'),url,category:val('category')||'自定义',tag:val('tag')||'MY RESOURCE',desc:val('desc')||'个人收藏资源。',custom:true});save();ui.modal=null;ui.resourceFilter='全部';renderApp();showToast('资源已收藏');return;}if(type==='note'){state.notes.push({id:uid('note'),title:val('title'),category:val('category')||'MY NOTE',content:val('content'),createdAt:new Date().toISOString(),custom:true});save();ui.modal=null;renderApp();showToast('知识卡片已保存');return;}if(type==='settings'){state.profileName=val('profileName')||'学习者';state.targetHours=Math.max(1,Math.min(80,Number(val('targetHours'))||5));save();renderApp();showToast('偏好已保存');return;}});
document.addEventListener('change',function(e){if(e.target.id==='record-filter'){ui.recordFilter=e.target.value;renderApp();return;}if(e.target.id==='import-file'&&e.target.files&&e.target.files[0]){const file=e.target.files[0];file.text().then(importData).catch(()=>showToast('无法读取该文件'));e.target.value='';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;renderApp();}const card=e.target.closest('.course-card');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openCourse(card.dataset.id);}});
renderApp();
</script>
</body>
</html>
