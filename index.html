const allChapterSupplementSpecs = {"c-abi-assembly": [{"id": "l-asm-register-roles", "title": "常见寄存器与指令操作数", "minutes": 22, "summary": "认识通用寄存器、栈指针、链接寄存器和程序计数器在函数执行中的分工。", "concept": "寄存器是 CPU 内部执行指令时直接使用的工作位置。不同架构的命名和用途不同；以 Cortex-M/Arm 为例，通用寄存器承载参数、中间值和返回值，SP 指向当前栈，LR 常保存返回地址，PC 关联当前取指位置。", "process": "阅读反汇编时先识别函数入口、SP/LR 的使用、load/store、比较和跳转，再对照 C 源码推断变量如何流动。不要假定优化后的变量一定有固定寄存器。", "pitfall": "寄存器名和调用约定因 ISA/ABI 而异；不同架构的示例不能直接套用。调试器中显示的 PC 值也可能受流水线和异常状态影响。", "exercise": "对一段包含局部变量和函数调用的 C 代码做反汇编，标出至少 3 个寄存器的用途。", "takeaways": ["寄存器是执行现场的一部分。", "先识别读写、比较、分支和调用等指令类别。", "寄存器具体用途以目标架构与 ABI 为准。"]}, {"id": "l-asm-branches", "title": "比较、条件分支与循环的汇编形态", "minutes": 22, "summary": "把 if、switch 和循环映射到比较、条件跳转与回跳指令。", "concept": "高级语言的控制流最终要表示成机器可执行的分支。编译器可能把 if 转成条件跳转或条件执行，也可能把 switch 变成跳转表；循环通常包含条件判断、循环体、状态更新与回边。", "process": "先在源码标记控制条件和循环不变量，再在反汇编中找比较指令、标志位依赖和分支目标。分别用低优化和高优化构建，对比结构如何变化。", "pitfall": "不能把某一段反汇编永久对应到源码某一行。优化、内联、常量传播和分支预测相关变换都会改变指令形态。", "exercise": "编写一个含 if 和 for 循环的函数，比较 -O0 与 -O2 输出，解释分支路径。", "takeaways": ["汇编阅读重在追踪数据流和控制流。", "比较指令的结果通常通过标志位或条件码影响分支。", "优化级别会明显改变可见代码形态。"]}, {"id": "l-stack-frame-abi", "title": "栈帧布局与函数现场", "minutes": 22, "summary": "理解函数调用为什么需要保存局部状态、返回信息和部分寄存器。", "concept": "函数调用过程中，编译器可能为局部对象、溢出到内存的寄存器值、被调用者保存寄存器和临时数据安排栈帧。并非每个函数都有传统意义上的固定栈帧；叶函数、优化和帧指针省略都会改变形态。", "process": "在反汇编入口观察 SP 的调整和寄存器保存；在返回路径检查栈恢复。用调用栈窗口确认调用链，并将静态栈预算与最深调用路径联系起来。", "pitfall": "不要仅凭局部变量数量估计栈使用：对齐、寄存器分配、内联、异常/中断现场和编译选项都会影响结果。递归尤其难做静态上界证明。", "exercise": "找到两个不同优化级别下的函数序言/结尾，记录 SP 的变化和被保存的寄存器。", "takeaways": ["栈帧是调用约定与编译器实现共同作用的结果。", "叶函数不一定创建完整栈帧。", "栈预算要考虑调用深度与异常现场。"]}, {"id": "l-abi-args-return", "title": "参数传递、返回值与寄存器保存规则", "minutes": 22, "summary": "把函数参数、返回结果和调用者/被调用者保存规则联系起来。", "concept": "ABI 约定小型参数通常如何进入寄存器或栈、结果如何返回、哪些寄存器由调用者保存、哪些由被调用者恢复。结构体、浮点数、可变参数和大返回对象可能有额外规则。", "process": "查看工具链对应目标的 ABI 文档，写一个带多个参数、返回值和嵌套调用的小例子，再用反汇编观察参数落点与寄存器保存。跨模块接口要统一编译选项和 ABI。", "pitfall": "不能把某个 Arm 调用规则直接推广到 RISC-V、x86 或不同浮点 ABI。预编译库、启动汇编和内联汇编必须与同一 ABI 保持兼容。", "exercise": "选择目标工具链，记录 4 个整型参数、一个返回值和被调用者保存寄存器的规则，并在反汇编中验证。", "takeaways": ["ABI 是二进制层面的接口合同。", "参数、返回值和寄存器保存都有约定。", "跨库链接前确认架构、浮点 ABI 与工具链兼容。"]}], "c-debug": [{"id": "l-preprocessor-build", "title": "预处理、头文件与翻译单元", "minutes": 22, "summary": "理解宏展开、头文件包含和条件编译为什么会影响最终参与编译的代码。", "concept": "预处理器在编译前处理 #include、#define、条件编译与宏展开；一个 .c 文件及其包含内容形成一个翻译单元。头文件保护避免重复展开，但不能替代正确的声明与定义组织。", "process": "出现类型未定义或宏值异常时，生成预处理输出并检查实际展开内容。通过一致的宏配置管理平台差异，避免在多个文件中重复定义状态或函数实现。", "pitfall": "宏参数要括号化并警惕多次求值；头文件中通常放声明而不是可重复定义的普通外部对象。不同构建目标使用不同宏时，要检查每个翻译单元是否一致。", "exercise": "用交叉编译器输出一个源文件的预处理结果，找出一个宏展开和一个条件编译分支。", "takeaways": ["预处理在编译器解析 C 前运行。", "头文件组织影响翻译单元可见内容。", "宏展开输出是定位配置问题的直接证据。"]}, {"id": "l-compiler-flags", "title": "编译选项、警告级别与优化配置", "minutes": 22, "summary": "建立可重复的 Debug/Release 构建规则，理解警告和优化不是互相替代的。", "concept": "编译参数会影响语言模式、目标指令集、ABI、优化、调试信息和告警。Debug 与 Release 不应只靠一个开关区分，而要保持明确、可记录的配置。", "process": "把目标 CPU/ABI 参数与警告、优化、调试符号分层维护；逐项记录选项来源。开发阶段启用严格告警，发布阶段确认优化和链接参数后进行回归验证。", "pitfall": "警告清零不等于没有缺陷；优化可能揭示未定义行为，也会导致源码单步和变量观察不直观。更改 CPU/FPU/浮点 ABI 参数可能使预编译库不兼容。", "exercise": "列出当前工程的 CPU、ABI、优化、调试和警告选项，解释每组参数的作用。", "takeaways": ["构建结果由源代码与完整选项共同决定。", "告警、调试信息和优化各自解决不同问题。", "修改 ABI 相关选项前检查所有预编译库。"]}, {"id": "l-object-symbols", "title": "目标文件、符号表与重定位", "minutes": 22, "summary": "理解 .o 文件为什么还不是可独立烧录的完整固件，以及链接器如何解析外部引用。", "concept": "目标文件通常包含若干 section、符号表和重定位记录。源文件调用另一个源文件的函数时，编译器可先产生未最终确定的符号引用，由链接器合并后填入最终地址或生成相关重定位。", "process": "使用 `file`、`readelf -S -s -r`、`nm` 或目标平台对应工具查看一个 .o；分别检查段、未定义符号、定义符号和重定位项，再与最终 ELF 对照。", "pitfall": "符号可见性、弱符号、静态库成员抽取和垃圾回收段都会影响最终产物。仅看到函数源码并不代表它最终会被链接进固件。", "exercise": "对含两个源文件的小例子查看 .o 与最终 ELF 的符号差异，记录一个重定位如何被解析。", "takeaways": ["目标文件包含段、符号和重定位信息。", "链接器负责合并对象并解析引用。", "符号工具能解释未定义引用和意外占用。"]}, {"id": "l-repeatable-build", "title": "可重复构建、依赖与产物追溯", "minutes": 22, "summary": "让相同源代码、配置和工具链能够生成可解释、可复现的固件。", "concept": "可重复构建不仅意味着命令能再次执行，还要求依赖关系完整、工具版本与配置可追踪、构建输入明确。生成文件、环境变量或隐式 IDE 状态可能造成“本机能构建、别人不能复现”。", "process": "提供干净构建入口；记录工具链版本、目标板、配置宏与链接脚本；把构建日志和固件哈希写入发布记录；持续集成中运行 clean build 和回归测试。", "pitfall": "不要把本地生成的 .o 或旧库混入版本库。依赖漏写会让增量构建漏编译；路径、时间戳和环境变量也可能导致构建结果不同。", "exercise": "写一份发布清单，至少包含版本控制提交、工具链版本、配置、构建命令、产物哈希和测试结果。", "takeaways": ["构建可复现性需要显式输入与依赖。", "干净构建能发现被旧产物掩盖的问题。", "固件产物要能追溯到源代码与工具链。"]}], "c-hardware-engineering": [{"id": "l-logic-levels", "title": "逻辑电平、输入阈值与电压兼容", "minutes": 22, "summary": "区分逻辑 0/1 的电压范围、引脚绝对最大额定值和供电电压。", "concept": "数字输入不是“超过一半供电就一定算高电平”。数据手册会给出 VIH/VIL 输入阈值和绝对最大额定值；输出的 VOH/VOL 也受负载电流影响。两个器件电压域不同可能导致无法可靠识别或损坏。", "process": "核对 MCU 与外设的 I/O 电压、5V tolerance、上电次序及输出电流；把发送端 VOH/VOL 与接收端 VIH/VIL 对照，而不是仅看标称电压。", "pitfall": "绝对最大额定值是损坏边界，不是推荐工作条件。即使信号电平偶尔能识别，也可能没有噪声裕量或违反注入电流限制。", "exercise": "挑选一对 MCU 与传感器接口，按数据手册填写输出高/低电平、输入阈值和允许电压范围。", "takeaways": ["检查接收阈值而不只看标称电压。", "分清推荐工作条件和绝对最大额定值。", "电压域不兼容时考虑电平转换与上电次序。"]}, {"id": "l-pullup-open-drain", "title": "上拉电阻、开漏输出与总线电容", "minutes": 22, "summary": "理解开漏线路为什么需要上拉，以及上拉阻值如何影响边沿和功耗。", "concept": "开漏输出只能主动拉低；释放线路时需靠上拉电阻回到高电平。线路电容与上拉电阻形成 RC 上升过程，上拉过弱会拖慢上升沿，过强则提高低电平电流并可能超过器件灌电流能力。", "process": "从总线速率、允许上升时间、总线电容和器件电流限制估算阻值，再在实际板上测量上升时间与低电平电压。检查板上是否已经有多个并联上拉。", "pitfall": "不要仅照抄开发板上的电阻值；多块模块的上拉并联可能使等效阻值过低。线缆、探头和更多器件都会增加总线电容。", "exercise": "对 I²C 总线统计所有上拉电阻和设备电容，说明如何验证上升时间与低电平灌电流。", "takeaways": ["开漏信号依赖外部上拉恢复高电平。", "阻值需要结合电容、速度和灌电流计算。", "上拉太强和太弱都会导致问题。"]}, {"id": "l-power-decoupling", "title": "供电去耦、地参考与上电复位", "minutes": 22, "summary": "认识电源完整性、局部去耦和地参考如何影响 MCU 运行稳定性。", "concept": "数字器件在开关瞬间会产生电流变化。去耦电容为芯片附近的瞬态电流提供低阻抗路径；地回流路径不合理、电源压降或复位线噪声会带来偶发重启、通信错误和模拟测量噪声。", "process": "从芯片参考设计和原理图检查去耦电容的数量、容量和靠近位置；观察供电、RESET 与关键时钟/接口的波形；把故障发生时刻与负载突变和外设动作对应。", "pitfall": "只在电源入口放一个大电容不能替代芯片附近去耦。示波器长地线会引入测量伪影；复位脚和模拟地的处理应遵循具体器件参考设计。", "exercise": "绘制开发板的电源树，标出主电源、稳压器、MCU 去耦与外部负载，列出需要测量的节点。", "takeaways": ["电源与地是信号完整性的一部分。", "去耦布局和电流回路同样重要。", "电源压降和复位噪声可能伪装成软件故障。"]}, {"id": "l-scope-logic-analyzer", "title": "示波器与逻辑分析仪：选对观测工具", "minutes": 22, "summary": "区分模拟波形测量与数字协议解码，选择正确的探头、采样率和触发条件。", "concept": "示波器显示电压随时间变化，适合观察幅度、边沿、振铃和时序；逻辑分析仪适合记录数字电平并解码协议。探头带宽、采样率、接地和触发设置都会影响可见证据。", "process": "先提出可验证的问题，再选择测量点和触发条件；示波器重点看阈值、电压、上升时间和噪声，逻辑分析仪重点看时钟、数据、ACK、帧界限和相对时序。", "pitfall": "采样率不足可能漏掉短脉冲；错误探头衰减设置会使电压读数失真；长接地线可能制造振铃假象。逻辑分析仪不能证明模拟波形质量良好。", "exercise": "针对“SPI 读取偶发错误”制定一次测量计划，分别写出示波器和逻辑分析仪应观察哪些信号。", "takeaways": ["示波器看模拟信号质量与时序。", "逻辑分析仪看数字事件与协议关系。", "测量设置本身也可能导致错误结论。"]}], "c-gpio": [{"id": "l-gpio-clock-mux", "title": "GPIO 时钟、复用与安全初始化顺序", "minutes": 22, "summary": "理解引脚模式、外设复用和时钟使能的依赖顺序。", "concept": "一个引脚可能被配置为 GPIO、定时器通道、UART 或其他复用功能。即使设置了输出值，如果模式或复用选择不正确，引脚也不会输出期望波形；某些芯片还要求先打开 GPIO/外设时钟。", "process": "先核对封装引脚与原理图，再检查时钟、复用、模式、输出类型、上下拉与输出电平；在切换到输出模式前先设定安全电平，减少初始化瞬态。", "pitfall": "逻辑引脚名不一定对应封装上的物理编号；复用功能编号随芯片系列不同。不要把一个系列的寄存器配置复制到另一个系列。", "exercise": "为一个 UART TX 引脚列出从时钟使能到复用配置、波特率初始化和实测波形的顺序。", "takeaways": ["引脚复用决定信号最终连接到哪个内部外设。", "初始化次序会影响瞬态电平。", "以具体封装和参考手册核实每个脚。"]}, {"id": "l-gpio-input-debounce", "title": "输入上下拉、抖动与按键消抖", "minutes": 22, "summary": "从电气输入到稳定事件，理解上拉/下拉、噪声和机械抖动。", "concept": "未连接或高阻输入可能漂浮并随机变化；按键触点会在按下/释放时短暂抖动，导致一次动作被识别为多次边沿。消抖的目标是定义稳定判定规则，而不只是插入随意延时。", "process": "先用数据手册选择内部或外部上拉/下拉；然后定义采样周期和稳定时间，例如连续若干次一致才确认状态；若响应速度要求严格，可结合定时器与状态机。", "pitfall": "固定延时会阻塞主循环，且不一定适合所有按钮/开关。长线输入还可能需要硬件滤波、施密特触发输入或防护电路。", "exercise": "设计一个每 5 ms 采样、连续 4 次同值才改变状态的消抖算法，并列出按下与释放的测试序列。", "takeaways": ["输入必须有确定的电平状态。", "消抖是时间判定与状态管理问题。", "长线与强噪声输入还需检查硬件滤波。"]}, {"id": "l-exti-pending-priority", "title": "EXTI 线路、挂起标志与中断优先级", "minutes": 22, "summary": "把外部引脚事件、EXTI 映射、中断控制器和 ISR 连接起来。", "concept": "外部中断通常先把引脚边沿映射到 EXTI 线路，再设置挂起状态并向 NVIC/中断控制器请求服务。挂起标志、屏蔽位和优先级配置决定事件是否真正进入处理函数。", "process": "检查边沿选择、线路映射、屏蔽/使能和 pending 标志的清除语义；设置断点或翻转调试 GPIO，测量从引脚边沿到 ISR 的延迟。", "pitfall": "不同厂商/内核的 pending 位清除方式不完全相同；错误清除可能造成中断不断重入或丢失事件。多个引脚还可能共享中断向量。", "exercise": "画出一个按键外部中断从引脚到 ISR 的路径，并注明哪些状态要由软件读取或清除。", "takeaways": ["EXTI 线路配置与 NVIC 使能是不同层。", "pending 标志处理必须符合芯片语义。", "共享向量可能需要逐路检查挂起状态。"]}, {"id": "l-isr-deferred-work", "title": "ISR 延后处理、事件标志与临界区", "minutes": 22, "summary": "将中断中的即时响应与主循环/任务中的复杂处理分离。", "concept": "ISR 应优先完成确认事件、读取必要寄存器和保存少量数据等有界工作。协议解析、打印日志和等待资源通常放到任务或主循环处理，通过队列、事件或受保护的标志传递信息。", "process": "定义 ISR 与消费者之间的数据所有权、标志清除顺序和同步手段；检查共享数据读写是否原子，以及临界区是否足够短且不会在错误的上下文调用阻塞 API。", "pitfall": "仅使用 volatile 不能保证复合操作原子；在中断里使用不允许的 RTOS API 会破坏内核状态。多个事件合并成一个布尔标志时，也可能丢失事件计数。", "exercise": "把一个 UART 接收 ISR 改为“ISR 入队、任务解析”的结构，并说明队列满时的处理策略。", "takeaways": ["ISR 的工作应有界并尽快返回。", "中断到任务之间需要明确的数据传递机制。", "共享标志、计数和缓冲区需要分析竞态。"]}], "c-timer": [{"id": "l-timer-clock-math", "title": "定时器输入时钟、预分频和周期计算", "minutes": 22, "summary": "把时钟树与 PSC、ARR 等计数器参数换算成真实时间。", "concept": "定时器并不一定直接运行在 CPU 主频上。分频、总线时钟倍频规则和具体芯片的 timer clock 配置都会改变计数频率；向上计数时通常由预分频和自动重装载共同决定周期。", "process": "先从时钟树推导定时器输入频率，确认计数方向和更新事件规则，再计算 PSC/ARR 的组合；最后用输出比较或 GPIO 翻转测量实际周期。", "pitfall": "不同 MCU 对 APB 分频、倍频和计数器位宽的规则不同。忘记寄存器值常需加一，会使计算偏差；时钟改变后旧参数也可能失效。", "exercise": "目标定时器时钟为 48 MHz，设计 1 kHz 更新事件的 PSC/ARR，并列出可实现的几组组合。", "takeaways": ["先确认定时器输入时钟，而非直接使用 CPU 频率。", "计算时核实寄存器取值是否需要加一。", "用测量波形验证理论周期。"]}, {"id": "l-output-compare-capture", "title": "输出比较、输入捕获与计数模式", "minutes": 22, "summary": "区分定时输出、外部边沿计时和编码器计数等定时器用途。", "concept": "输出比较在计数器达到某个比较值时改变输出或产生事件；输入捕获把边沿到达时的计数器值锁存下来；编码器接口可根据两相信号变化累计位置。它们共享计数器资源，但工作模式不同。", "process": "先确定要产生还是测量信号，再选定时器通道、极性、输入滤波和计数配置。测量周期时计算相邻捕获值差，并处理计数器回绕；多通道功能要核实引脚映射与共享资源。", "pitfall": "不要把输入捕获寄存器更新事件与中断处理时刻混为一谈；高频输入可能在软件读取前覆盖捕获值。编码器模式还要考虑方向变化和计数回绕。", "exercise": "设计一个测量外部脉冲频率的方案，标注捕获值、计数时钟、溢出与滤波的处理。", "takeaways": ["输出比较适合确定时刻触发。", "输入捕获用于记录边沿到来的计数值。", "计数器回绕和事件频率必须纳入设计。"]}, {"id": "l-pwm-calibration-jitter", "title": "PWM 频率、占空比与输出精度", "minutes": 22, "summary": "理解 PWM 参数与实际输出波形之间的关系，并区分设定值和实测值。", "concept": "PWM 频率由定时器计数时钟、分频和周期决定，占空比由比较值与周期关系决定。分辨率、极性、预装载更新时刻以及外部驱动电路都会影响实际输出。", "process": "计算目标频率与占空比，选择能满足分辨率的计数范围；先配置安全输出，再启用通道。用示波器测量频率、高电平时间、边沿和变化时的毛刺。", "pitfall": "比较值超出周期、输出极性理解错误、运行时立即更改寄存器而不同步更新，都可能产生异常。PWM 是逻辑控制信号，不代表可以直接驱动任意电机或负载。", "exercise": "配置 20 kHz、25% 占空比 PWM，写出参数计算并用仪器验证周期和高电平持续时间。", "takeaways": ["频率与占空比分别由不同参数关系决定。", "更新方式可能影响占空比切换时的波形。", "负载驱动与 MCU 引脚电流能力要分开考虑。"]}, {"id": "l-timer-dma-encoder", "title": "定时器触发 DMA、编码器与高频采样", "minutes": 22, "summary": "了解定时器如何给 DMA 或采样过程提供稳定触发，减少软件时序抖动。", "concept": "定时器事件可作为 ADC 采样、DMA 请求或捕获/比较事件的触发来源，使采样间隔由硬件计数决定，而非由任务何时获得 CPU 决定。编码器接口则适合累计高频脉冲。", "process": "明确触发源、请求路由、定时器周期和 DMA 缓冲区大小；检查触发频率是否超过数据搬运和消费能力；通过计数器、回调计数或逻辑信号验证是否丢样。", "pitfall": "定时器请求与 DMA 通道映射依芯片而异；缓冲区消费过慢仍会造成覆盖。硬件触发更稳定，但并不自动保证所有数据都被及时处理。", "exercise": "设计一个定时器以 10 kHz 触发 ADC，再由 DMA 写入双缓冲的时序图，并估算每半缓冲区的数据量。", "takeaways": ["硬件触发有助于降低软件调度抖动。", "要核对定时器到外设/DMA 的请求路由。", "采样频率必须匹配搬运和处理吞吐量。"]}], "c-protocol": [{"id": "l-uart-frame", "title": "UART 帧结构、波特率误差与接收采样", "minutes": 22, "summary": "理解 UART 如何通过起始位、数据位、可选校验位和停止位传送字符。", "concept": "UART 没有独立时钟线，发送端和接收端通过约定波特率和帧格式维持采样时序。时钟偏差累积、极性配置或数据位数不一致，都会导致帧错误。", "process": "核对双方波特率、数据位、校验位、停止位和电平极性；用逻辑分析仪解码并观察帧错误、噪声错误与溢出标志，注意实际波特率来源和容差。", "pitfall": "UART 电平接口与 RS-232/RS-485 电气标准不是一回事；TTL UART 不能不经适当收发器直接接入工业总线。波特率写对也不代表时钟误差一定可接受。", "exercise": "计算一个 UART 字符在 115200 baud、8N1 下大致需要的线路时间，并列出设置不匹配的三种表现。", "takeaways": ["UART 帧格式要两端一致。", "波特率受时钟误差影响。", "逻辑协议与物理电平标准要分清。"]}, {"id": "l-uart-ring-buffer", "title": "UART 接收缓冲区、环形队列与溢出", "minutes": 22, "summary": "把持续到达的字节流安全地交接给较慢的解析逻辑。", "concept": "接收中断或 DMA 可能持续写入数据，应用层按自己的节奏解析。环形缓冲区通过读写索引复用一段内存；设计时需明确容量、满时策略、索引原子性和生产者/消费者关系。", "process": "根据最高字节速率和最坏消费者延迟估算缓冲容量；定义满时丢弃新数据、覆盖旧数据或报错策略；统计溢出次数，并用突发输入测试。", "pitfall": "不能仅通过数组大小猜容量足够；单生产者/单消费者也需要结合索引宽度、编译器与 MCU 原子性判断是否需临界区。DMA 写区不能同时被解析器当作稳定数据。", "exercise": "画出环形缓冲区的读写索引和满/空条件，并设计一个缓冲区满时不覆盖未读消息的策略。", "takeaways": ["字节流和业务消息是不同层次。", "容量应按速率与最坏延迟估算。", "溢出需要可观察的计数和明确策略。"]}, {"id": "l-i2c-transactions", "title": "I²C 起始、地址、ACK/NACK 与总线状态", "minutes": 22, "summary": "理解 I²C 一个完整事务中的时序条件、地址方向和应答机制。", "concept": "I²C 常用 SDA/SCL 两根开漏线，事务通过 START/Repeated START、地址、数据字节、ACK/NACK 和 STOP 等条件组织。主机和从机、读写方向、地址位宽都需明确。", "process": "先查器件地址是 7 位还是 10 位、寄存器地址宽度、是否需要 repeated start；使用逻辑分析仪解码地址和 ACK，在数据手册里核对写后读的具体事务要求。", "pitfall": "常见错误是把数据手册的 8 位地址字节与 7 位地址混淆，或无条件在写寄存器和读寄存器之间插入 STOP。总线被拉低还可能需要总线恢复策略。", "exercise": "为一个带 8 位寄存器地址的传感器画出“写寄存器地址后 repeated-start 读取两个字节”的完整事务。", "takeaways": ["I²C 地址和地址字节要区分。", "ACK/NACK 是事务状态证据。", "器件要求决定是否使用 repeated START。"]}, {"id": "l-i2c-recovery", "title": "I²C 超时、总线卡死与错误恢复", "minutes": 22, "summary": "建立总线超时、错误识别和恢复流程，避免外设异常后无限等待。", "concept": "I²C 可能因从机掉电、复位中断事务或线路异常而保持 SDA/SCL 为低。驱动需要区分地址 NACK、数据 NACK、仲裁丢失、总线忙和超时，并为故障定义恢复边界。", "process": "为每个等待条件设置超时；记录总线状态；按芯片与器件规范决定是否复位外设或执行 SCL 脉冲恢复；恢复后重新初始化并对关键器件状态进行核验。", "pitfall": "不要在未确认电路结构时随意驱动共享线路；总线恢复方法受多主设备和从机规范约束。反复无界重试会把局部故障扩展为系统卡死。", "exercise": "设计一次 I²C NACK 和一次 SDA 持续为低时的错误处理流程，写明超时、记录与恢复策略。", "takeaways": ["给总线等待设上限。", "错误类型应区分并被记录。", "恢复动作必须符合总线和器件约束。"]}, {"id": "l-spi-modes", "title": "SPI 的 CPOL/CPHA、片选与全双工时序", "minutes": 22, "summary": "掌握 SPI 时钟空闲极性、采样相位、片选规则和数据位顺序。", "concept": "SPI 通常使用 SCLK、MOSI、MISO 和片选。CPOL 规定空闲时钟电平，CPHA 规定相对于时钟边沿的采样时机；外设对模式、最高频率和片选保持时间有具体要求。", "process": "从器件手册提取 SPI mode、最大时钟、位序、命令与数据阶段，设置驱动后用逻辑分析仪检查首个采样边沿、片选拉低时间和返回数据阶段。", "pitfall": "SPI 没有统一的通用设备地址或固定帧格式；片选是否能在命令/数据之间拉高因器件而异。全双工意味着发送时通常也会接收一个字节，不能只处理 TX。", "exercise": "列出 mode 0 到 mode 3 的 CPOL/CPHA 组合，并针对一个外设说明如何由时序图选择正确模式。", "takeaways": ["CPOL 和 CPHA 描述两个不同的时钟属性。", "片选时序是协议的一部分。", "实际工作频率不能超过器件和板级约束。"]}, {"id": "l-protocol-framing-recovery", "title": "消息分帧、长度校验与协议状态恢复", "minutes": 22, "summary": "将 UART 等字节流解析成有边界、有校验、可恢复的消息。", "concept": "通信回调给出的数据片段不一定恰好等于一条消息。可靠解析器需要识别帧头、长度、有效负载、校验和或 CRC，并在输入被截断或损坏时恢复同步。", "process": "定义最大帧长并先检查长度，再读取完整字段；验证 CRC/校验；使用显式解析状态或缓冲区游标；超时或非法帧时丢弃有界数据并寻找下一帧头。", "pitfall": "未验证长度就复制负载会形成越界漏洞；仅靠固定延时分包容易受到传输节奏影响；若帧头也能出现在负载中，需要转义、固定长度或其他同步机制。", "exercise": "设计一个帧格式：同步字、长度、命令、负载和 CRC，并列出短帧、超长帧、CRC 错误和拼接帧的测试。", "takeaways": ["分帧逻辑与底层收发回调分离。", "验证长度之后才访问负载。", "错误恢复必须能重新找到帧边界。"]}], "c-dma": [{"id": "l-adc-analog-front-end", "title": "ADC 参考电压、输入阻抗与采样时间", "minutes": 22, "summary": "理解 ADC 码值不仅由分辨率决定，还受参考电压、采样电容和源阻抗影响。", "concept": "ADC 将输入电压量化成数字码。采样保持电路需要在有限采样时间内让内部电容接近输入电压；高源阻抗或采样时间太短会带来转换偏差。参考电压噪声和布局也直接影响结果。", "process": "核对输入量程与引脚保护要求，估算输入电压与参考电压关系，按数据手册选择采样时间；用稳定电压源或已知参考输入测量误差并记录偏移/增益。", "pitfall": "不要让输入电压超过参考/供电范围或绝对最大额定值；分压电阻过大可能需要更长采样时间或缓冲放大器。ADC 分辨率不等于实际精度。", "exercise": "为 12 位 ADC 和 3.3 V 参考电压计算理想量化步距，并分析输入源阻抗为什么可能需要更长采样时间。", "takeaways": ["分辨率与精度不是同一概念。", "采样时间要与源阻抗匹配。", "参考电压与模拟布局会影响实际测量。"]}, {"id": "l-adc-trigger-timing", "title": "ADC 触发、扫描序列与采样吞吐量", "minutes": 22, "summary": "把 ADC 单次转换、通道扫描、定时器触发和数据处理连成时序链。", "concept": "ADC 可能由软件、定时器或外部事件触发。多通道扫描时每个通道都有采样和转换时间，总吞吐量决定能否在下一次触发前完成；触发重叠行为要查具体外设实现。", "process": "列出通道数、每通道采样周期、转换周期和目标触发频率；确认是否启用连续模式、外部触发和过载标志；在目标上观察转换完成与 DMA 请求计数。", "pitfall": "将理论最高转换速率等同于实际可用采样率是常见错误。多路复用通道切换后可能需增加采样时间；同时还要考虑模拟输入建立时间与参考源稳定性。", "exercise": "设计 4 通道、每通道 1 kHz 的采样需求，估算转换吞吐量并写出需要确认的 ADC 时序参数。", "takeaways": ["触发频率与通道数共同决定数据吞吐量。", "要检查转换是否会重叠或丢失触发。", "通道切换可能需要更长采样时间。"]}, {"id": "l-dma-mode-completion", "title": "DMA 普通模式、循环模式与半传输事件", "minutes": 22, "summary": "理解一次性搬运、循环覆盖和半缓冲处理分别适用于什么数据流。", "concept": "DMA 能根据配置搬运外设和内存之间的数据；普通模式通常完成后停止，循环模式会重复使用缓冲区。有些实现提供半传输/全传输事件，让 CPU 处理已完成的一半数据。", "process": "从源/目的地址、数据宽度、递增方式、数量和请求源逐项配置；明确完成标志、中断触发频率以及何时重新启用；对循环缓冲区建立读写时序与数据量核算。", "pitfall": "数据宽度不匹配会导致步长错位；循环模式下处理不及时会读到被覆盖的数据；中断标志与 DMA 请求标志可能处于不同硬件模块。", "exercise": "比较普通模式、循环模式与半缓冲处理三种方案，按数据速率和消费者延迟选一种并解释原因。", "takeaways": ["DMA 配置不仅需要源地址与长度。", "半传输事件让 CPU 分块处理流数据。", "循环模式仍需要所有权与实时性设计。"]}, {"id": "l-dma-buffer-ownership", "title": "DMA 缓冲区所有权、覆盖与内存一致性", "minutes": 22, "summary": "把 DMA 和 CPU 看作两个独立访问缓冲区的执行主体，定义什么时候数据可读、可写和可复用。", "concept": "DMA 传输期间缓冲区内容可能持续改变。软件必须约定缓冲区当前由谁拥有；在带数据 Cache 的系统里，还要按架构要求维护一致性，且 cache line 对齐和缓冲区边界都可能重要。", "process": "设计显式状态：DMA 填充、已完成待处理、CPU 处理、重新交还 DMA；记录缓冲区切换序号并测试最坏处理耗时。根据芯片与内核文档执行必要的 cache clean/invalidate。", "pitfall": "volatile 不能修复 DMA/Cache 不一致；半缓冲事件发生后若处理时间超过另一半填充时间，依然会覆盖。不同芯片的 cache API 和对齐要求不可互换。", "exercise": "画出双缓冲的所有权状态转移，估算采集速率下每半缓冲有多少处理时间。", "takeaways": ["CPU 与 DMA 的数据所有权需要显式约定。", "Cache 维护不是普通变量限定符可以替代的。", "处理延迟必须小于缓冲区可用窗口。"]}], "c-rtos": [{"id": "l-task-priority-latency", "title": "任务优先级、抢占与响应时间", "minutes": 22, "summary": "理解就绪任务如何竞争 CPU，以及高优先级并不自动意味着系统设计正确。", "concept": "抢占式调度通常允许更高优先级的就绪任务抢占低优先级任务；实际响应时间还会受到关中断时间、临界区、不可抢占代码、同优先级策略和 ISR 负载影响。", "process": "为任务列出周期/事件触发、最坏执行时间、优先级、阻塞时间和截止期限；用跟踪或 GPIO 时间标记验证响应，再分析最坏情况而不只看平均 CPU 占用。", "pitfall": "过多高优先级任务会压制低优先级任务，长期忙等可能阻止其他工作执行。优先级只是一个调度参数，不是完成时间保证。", "exercise": "为传感采样、控制回路和日志任务设计优先级表，标出各自的截止期限与最长阻塞点。", "takeaways": ["就绪不代表任务立即运行。", "响应时间取决于执行、阻塞、中断与调度规则。", "优先级设计需要结合任务需求与最坏时延。"]}, {"id": "l-priority-inversion", "title": "优先级反转与互斥锁协议", "minutes": 22, "summary": "解释低优先级任务持有资源时，高优先级任务为什么可能被中优先级任务间接延迟。", "concept": "当低优先级任务持有高优先级任务需要的锁时，高优先级任务会阻塞；如果中优先级任务不断运行，低优先级任务无法及时释放锁，就会出现优先级反转。支持优先级继承的互斥锁可缓解特定情形。", "process": "先画出任务与资源的时间线；缩短临界区，避免持锁期间阻塞或调用未知回调；按 RTOS 文档判断 mutex 是否支持优先级继承，禁止用普通二值信号量随意替代互斥锁。", "pitfall": "优先级继承不是把所有实时性问题都解决；死锁、长临界区和资源等待链仍需要设计。ISR 通常不能获取普通互斥锁。", "exercise": "画出 L 持锁、H 等锁、M 抢占的时间线，再给出两条降低反转风险的设计措施。", "takeaways": ["反转源于共享资源等待链。", "缩短临界区并减少持锁阻塞。", "确认 RTOS 对 mutex 和优先级继承的真实支持。"]}, {"id": "l-queue-ownership", "title": "队列传值、指针消息与缓冲区所有权", "minutes": 22, "summary": "选择任务之间传递数据的方式，并防止异步消费者使用失效或正在改变的内存。", "concept": "队列传递小结构体值可以形成独立副本；传递指针开销更小，但必须规定对象由谁创建、何时释放、队列满时谁仍拥有数据，以及消费者完成后如何归还缓冲区。", "process": "先选择值传递还是指针传递；描述从生产者到队列到消费者的所有权转移；检查队列容量、满/空策略、超时和取消路径，必要时结合静态消息池。", "pitfall": "把局部变量地址投递给异步任务会产生悬空指针；队列成功入队不代表缓冲区今后不会被复用。丢弃消息时也需要明确释放责任。", "exercise": "设计 UART 接收任务向解析任务发送帧的方案，分别比较按值拷贝和指针+内存池。", "takeaways": ["队列机制和内存所有权是两个问题。", "异步指针消息必须有明确生命周期。", "队列满、取消和错误路径同样要管理资源。"]}, {"id": "l-rtos-timeouts", "title": "Tick、延时、超时与时间回绕", "minutes": 22, "summary": "区分固定延时、事件等待超时和真实时间期限，并避免时间回绕错误。", "concept": "RTOS tick 提供离散时间基准，tick 频率决定分辨率。相对延时只保证等待至少某个调度时间，不能替代对绝对周期或截止时间的设计；系统 tick 计数也可能回绕。", "process": "优先使用内核提供的超时/延时接口；周期任务考虑按绝对节拍推进避免累积漂移；计算期限差值时遵循目标 RTOS 的回绕规则，并记录单位。", "pitfall": "把毫秒数直接当 tick 数使用会导致平台相关错误；`delay` 不等于精确定时；阻塞等待事件时忘记超时会让系统永久等待。", "exercise": "用一个 100 ms 周期任务分别画出“执行后延时 100 ms”和“按绝对节拍每 100 ms 运行”的时间线。", "takeaways": ["tick 频率决定时间分辨率。", "相对延时会因执行时间造成周期漂移。", "超时与回绕应使用平台提供的安全接口。"]}, {"id": "l-critical-section-isr", "title": "临界区、原子操作与 ISR API 边界", "minutes": 22, "summary": "选择适当的共享状态保护方式，避免竞态和不必要地屏蔽中断。", "concept": "原子操作、短临界区、互斥锁和消息传递适用于不同上下文。ISR 通常不能阻塞，也不能使用任意任务级 API；某些 RTOS 提供专门的 FromISR 接口并要求触发调度请求。", "process": "列出共享数据参与者与允许的执行上下文；判断操作是否原子、是否需要多字段一致快照；优先用消息传递隔离共享状态，确实需要临界区时缩短保护范围。", "pitfall": "只添加 volatile 不会使 `counter++` 成为原子操作；在关中断区域里做长计算会损害中断延迟。跨核系统还可能需要内存屏障或锁，而不只是关本地中断。", "exercise": "找出一个主循环与 ISR 共享变量的例子，分别说明用原子操作、临界区和消息传递的适用边界。", "takeaways": ["保护机制要匹配读写者与执行上下文。", "ISR API 约束与任务 API 不同。", "临界区越长，对实时响应的影响越大。"]}], "c-reliable": [{"id": "l-fsm-transition-tests", "title": "状态机转移表、非法事件与状态不变量", "minutes": 22, "summary": "把状态机从 switch 语句提升为可以检查和测试的行为模型。", "concept": "状态机包含状态集合、事件、转移条件、动作和错误处理。转移表有助识别未定义的状态/事件组合，状态不变量则描述某个状态下必须始终成立的条件。", "process": "先列出状态与事件全集，再填转移表；为每条转移写入/退出动作和失败响应；通过测试覆盖正常转移、非法事件、重复事件、超时与恢复。", "pitfall": "默认分支静默忽略事件会掩盖协议错误；在动作中做过多阻塞操作会令转移难以预测。复杂状态组合可考虑分层状态机，但不要过早增加不必要复杂度。", "exercise": "为设备连接流程建立状态—事件转移表，并设计覆盖每条合法转移和至少两种非法事件的测试。", "takeaways": ["状态机需要显式定义非法事件行为。", "状态不变量帮助发现不一致状态。", "测试应覆盖转移边界和恢复路径。"]}, {"id": "l-error-recovery-strategy", "title": "故障分类、降级与恢复策略", "minutes": 22, "summary": "根据故障严重度选择重试、重新初始化、降级运行或安全停机。", "concept": "不是所有错误都适合重试。瞬时传输错误可有限重试；配置错误可能需要停止；传感器离线可进入降级状态；控制系统遇到不可信测量时可能需要进入安全输出。恢复策略要反映产品风险。", "process": "把错误分为可恢复、暂时不可用、配置/永久错误和安全关键错误；为每类定义次数上限、退避时间、记录内容、状态变化与人工恢复条件。", "pitfall": "无界重试会占满 CPU 或总线；连续复位可能形成启动循环；恢复成功也不代表数据可信，恢复后要重新同步状态并验证设备。", "exercise": "为 I²C 传感器定义 NACK、超时、CRC 错误和连续离线四种情况的恢复策略。", "takeaways": ["错误类型决定恢复动作。", "重试要有限并有退避和观测记录。", "恢复之后需要重新验证状态与数据可信性。"]}, {"id": "l-reset-cause-brownout", "title": "看门狗、棕断复位与复位原因记录", "minutes": 22, "summary": "区分软件重启、看门狗复位、掉电/欠压复位和外部复位，并将原因转成诊断证据。", "concept": "MCU 通常提供复位状态标志，用于识别部分复位来源；某些标志需要在启动早期读取并按手册清除。看门狗能恢复部分失控情况，但电源欠压或快速掉电可能需要不同的应对。", "process": "在覆盖标志的初始化代码之前保存复位原因；记录启动计数、固件版本、复位标志和关键错误信息；给看门狗喂狗条件绑定关键任务的真实进展，而不是无条件定时喂狗。", "pitfall": "复位标志的保留/清除规则与备份寄存器特性依芯片而异。掉电期间非易失日志写入也可能被中断，必须考虑数据完整性和耐久度。", "exercise": "为产品设计一个早期复位诊断记录，列出需要读取的标志、持久化方式和清除时机。", "takeaways": ["先区分复位来源再推断故障。", "看门狗应监督系统进展，不应被无条件喂养。", "持久化故障记录要考虑掉电完整性。"]}, {"id": "l-crash-record", "title": "HardFault 现场、崩溃记录与复现信息", "minutes": 22, "summary": "在系统崩溃后保留足够上下文，以便离线判断异常发生位置和原因。", "concept": "异常现场可能包括堆栈中的寄存器、当前 PC/LR/SP、异常状态寄存器、任务名和复位原因。能否安全采集、哪些寄存器有效，需要遵循具体内核异常模型和 RTOS 实现。", "process": "在异常处理路径尽量记录最小、可验证的数据；不要依赖动态分配或复杂日志；复位后把现场导出并利用 ELF、符号表和反汇编解析地址。测试故障记录路径，确认其本身不会递归触发故障。", "pitfall": "异常栈可能已经被破坏；中断屏蔽和存储权限可能限制能做的事。将地址直接对应源码行需要匹配的 ELF、编译选项和符号信息。", "exercise": "设计一个崩溃记录结构，包含 PC、LR、SP、异常状态和固件版本，并说明复位后如何解码。", "takeaways": ["崩溃现场必须与匹配的固件符号配合分析。", "异常处理程序本身要尽量简单可靠。", "记录路径需要通过故障注入做验证。"]}], "c-software-design": [{"id": "l-module-contract", "title": "模块接口契约、前置条件与副作用", "minutes": 22, "summary": "让接口的使用条件、成功结果、失败行为和副作用都可见。", "concept": "一个模块契约不仅是函数原型，还包括参数的有效范围、空指针允许性、缓冲区长度、线程/中断上下文、调用顺序、资源所有权和错误返回约定。", "process": "在接口注释和头文件中写出前置条件、输出约定与错误码；调用方先验证自己的输入；实现方再次保护会造成越界或硬件损害的边界。让契约能被单元测试验证。", "pitfall": "含糊地说“调用前要初始化”并不足够；需要说明谁初始化、失败时能否重试、调用是否阻塞、指针是否被保存以及何时失效。", "exercise": "为一个异步 UART 发送接口写出参数、长度、是否复制缓冲区、完成通知和错误返回契约。", "takeaways": ["接口契约要描述时序和资源，不止数据类型。", "所有权和生命周期应写清楚。", "把重要契约转换成可测试条件。"]}, {"id": "l-dependency-graph", "title": "依赖方向、循环依赖与分层边界", "minutes": 22, "summary": "通过依赖图判断模块结构是否清晰，避免底层反向调用应用逻辑。", "concept": "模块之间存在调用、数据、构建和初始化依赖。分层设计通常让应用依赖服务，服务依赖驱动接口，而底层驱动不应反向依赖具体业务；循环依赖会让测试和替换成本增加。", "process": "列出模块与直接依赖，画有向图并查找循环；将稳定接口放在合适的抽象层；通过回调、事件或依赖注入打破必要的反向通知，但避免过度架构化。", "pitfall": "只按目录名称判断层次是不够的，真正的依赖藏在 include、全局变量和回调中。为消除一个循环而引入大量间接跳转也可能让代码更难理解。", "exercise": "绘制一个包含应用、协议、设备驱动和板级支持的依赖图，标记并修复一个不合理的反向依赖。", "takeaways": ["依赖图比目录树更能显示真实耦合。", "稳定接口帮助隔离平台差异。", "打破循环依赖时要控制抽象复杂度。"]}, {"id": "l-resource-lifecycle", "title": "资源生命周期、初始化失败与逆序清理", "minutes": 22, "summary": "对外设、中断、定时器、缓冲区和 RTOS 对象统一设计创建、使用、停用和释放过程。", "concept": "资源往往存在依赖链：先初始化时钟和总线，再初始化设备；关闭时先停止使用者，再关闭设备和底层资源。多阶段初始化若中途失败，需要清理已成功申请的部分资源。", "process": "为每个资源定义 owner、创建点、可使用状态和释放点；将初始化写成可检查阶段；失败时沿已完成步骤逆序回滚；结束运行前取消回调、停止 DMA 并等待正在进行的操作完成。", "pitfall": "只在完全成功的路径上写清理，会造成部分初始化失败时的泄漏；重复释放和释放后回调也常见。关闭模块时要处理并发调用与正在等待的消费者。", "exercise": "为“打开 SPI 设备失败于第三步”的情况画资源清理路径，验证前两步建立的资源都能安全释放。", "takeaways": ["每个资源都需要明确所有者和生命周期。", "初始化失败要能清理部分成功的资源。", "关闭顺序要考虑并发使用和未完成的回调。"]}, {"id": "l-config-management", "title": "配置宏、运行时配置与平台差异管理", "minutes": 22, "summary": "区分编译期特性配置、板级配置和运行时参数，避免配置散落导致不可复现。", "concept": "编译期宏会改变不同翻译单元的代码结构；板级配置描述引脚、时钟和设备差异；运行时配置可根据产品版本或外部输入改变行为。三者应该有清晰来源和验证规则。", "process": "集中管理配置入口，为参数给出单位、范围和默认值；在构建记录中保留配置宏；在启动阶段验证外部配置的版本、范围和完整性，并为不同板型建立明确的配置组合。", "pitfall": "同名宏在不同文件中重复定义会造成构建不一致；运行时配置缺少范围验证可能引发除零、越界或危险输出；把产品配置与业务逻辑硬编码在一起增加维护成本。", "exercise": "为两个不同板型设计一份配置表，区分编译期、板级和运行时参数，并为非法值写验证策略。", "takeaways": ["配置要有单一可信来源。", "每个参数需要单位、范围与默认值。", "构建配置要可追溯、可复现。"]}], "c-quality-assurance": [{"id": "l-test-doubles", "title": "测试替身：Stub、Mock 与 Fake", "minutes": 22, "summary": "使用可控替代物隔离外设、时间和错误条件，以便稳定测试业务逻辑。", "concept": "测试替身用于替代真实依赖：Stub 返回预设响应，Mock 还可以检查调用行为，Fake 则提供简化但可工作的实现。不同替身适合不同验证目标，不应为了测试而把整个系统伪造得与真实行为完全不同。", "process": "优先给硬件、时钟、存储和通信定义窄接口；在测试中注入成功、超时、NACK、断电等响应；对重要时序和调用顺序只验证有业务意义的契约。", "pitfall": "过度 Mock 内部实现细节会让重构导致大量脆弱测试；Fake 与真实设备行为差异过大，则可能让测试通过而产品失败。关键驱动仍需在目标板验证。", "exercise": "为传感器驱动设计一个 Fake，模拟正常值、超时和非法码值，并验证上层告警逻辑。", "takeaways": ["测试替身隔离不稳定或难以控制的依赖。", "测试应检查业务契约而非所有内部调用细节。", "替身测试不能完全取代目标硬件验证。"]}, {"id": "l-static-analysis-workflow", "title": "静态分析告警分级与误报管理", "minutes": 22, "summary": "把静态分析从一次性扫描变成可追踪、可行动的缺陷管理流程。", "concept": "静态分析工具根据语法、控制流和数据流规则发现可疑路径。告警需要结合严重度、可达性和安全后果分析，再决定修复、验证误报或有理由地抑制。", "process": "先固定工具版本和规则集；对新告警按风险与模块归属分派；记录告警 ID、理由、证据和期限；在 CI 中防止新告警不断增长。对修复项添加回归测试。", "pitfall": "全局关闭规则或大面积忽略告警会失去质量信号；升级工具后告警数量变化不一定代表代码突然变差。要基于差异和规则变更审查。", "exercise": "建立一个静态分析告警处理模板，至少包含问题路径、风险、证据、修复/抑制理由和验证结果。", "takeaways": ["工具输出是待判断证据而非自动定罪。", "抑制告警应有具体理由和可审计记录。", "增量门禁有助控制新缺陷数量。"]}, {"id": "l-hil-integration-test", "title": "硬件在环测试与板级集成验证", "minutes": 22, "summary": "用真实 MCU/外设配合自动化测试验证主机单元测试无法覆盖的物理与时序行为。", "concept": "硬件在环或板级集成测试把固件运行在目标板上，以脚本、测试夹具、可控输入和仪器观察输出。它可验证引脚、电源状态、协议时序和目标工具链行为，但受设备成本、稳定性和测试覆盖限制。", "process": "先确定测试夹具的接线和安全边界；为输入设置可重复波形或设备模拟；记录固件版本、板卡序列/修订、仪器配置和期望输出；让测试结果自动保存并支持失败重跑。", "pitfall": "测试夹具自身也可能故障；不稳定的接触、时钟源与环境会造成 flaky tests。不可直接连接危险电压或高能负载，测试应满足电气隔离与安全要求。", "exercise": "为 GPIO 输出和 UART 回环各设计一项板级自动测试，说明输入、测量点、容差和失败判定。", "takeaways": ["单元测试验证逻辑，目标板测试验证真实集成。", "测试结果必须能追溯到固件和硬件版本。", "夹具与供电环境本身也要纳入验证。"]}, {"id": "l-ci-regression", "title": "持续集成、回归测试与发布门禁", "minutes": 22, "summary": "将构建、测试、分析和固件产物检查自动化，降低人为漏检。", "concept": "持续集成在代码变更后运行可重复的检查。嵌入式流水线通常要区分主机单元测试、交叉构建、静态分析、目标板测试与发布打包；不同阶段可以使用不同硬件资源与门禁条件。", "process": "为每次提交运行干净构建和快速测试；对主分支执行更完整的分析和目标板测试；保存固件、map、日志、版本信息和测试报告；发布前检查产物尺寸、签名/校验与版本策略。", "pitfall": "仅通过 CI 构建并不代表真实硬件行为正确；测试设备偶发离线需要单独记录，不能静默当作通过。发布门禁要清晰，避免人工绕过后没有审计记录。", "exercise": "画出一个从提交到发布的嵌入式 CI 流水线，分别标明主机测试、交叉构建、硬件测试、产物归档和发布门禁。", "takeaways": ["不同验证层互相补充而不是替代。", "固件产物和测试报告应可追溯。", "发布门禁必须有明确失败条件。"]}]};
function addAllChapterSupplements(){
 for(const [courseId,specs] of Object.entries(allChapterSupplementSpecs)){
  const c=curriculum.find(x=>x.id===courseId); if(!c) continue;
  const have=new Set(c.lessons.map(x=>x.id));
  for(const s of specs){
   if(have.has(s.id)) continue;
   c.lessons.push(lesson(s.id,s.title,s.minutes,s.summary,[
    {heading:'核心机制与边界',body:[s.concept]},
    {heading:'工程实践步骤',body:[s.process]},
    {heading:'常见误区与验证方法',body:[s.pitfall]}
   ],s.takeaways,s.exercise,''));
   have.add(s.id);
  }
 }
}
addAllChapterSupplements();

 'c-hardware-engineering':[[0,2,'01 · 电气接口与电源基础'],[3,4,'02 · 信号完整性与测量'],[5,5,'03 · 板级系统排障']],

const beginnerPrimers={
'l-pointer':'把内存想成一排有编号的储物格：地址是格子的编号，变量是格子里的对象，指针变量保存某个格子的地址。类型决定编译器按多大步长移动、一次读写多少字节，以及如何解释读出的位模式。数组是一组连续对象，数组名在很多表达式中会转换成首元素地址，但数组本身不是可以随意改指向的指针变量。',
'l-memory':'先区分“变量活多久”和“变量放在哪里”。局部自动变量通常随函数调用存在；静态存储期对象贯穿程序运行；动态分配对象由分配与释放规则管理。Flash/RAM 是硬件存储器，.data/.bss/stack/heap 则是程序映像和运行时对存储器的组织方式，二者不是完全同一层概念。',
'l-volatile':'编译器优化是为了让程序更快，但硬件寄存器和中断共享状态可能在 C 代码看不见的时刻发生变化。volatile 告诉编译器某些访问必须保留；它没有自动解决“两个执行上下文同时修改数据”的互斥、原子性或顺序问题。先问清楚谁在读、谁在写、能否同时发生，再决定是否需要 volatile、原子操作或临界区。',
'l-bitops':'把寄存器看成一张由多个开关位组成的控制面板。掩码 mask 用 1 标出关注的位：与运算用于筛选，或运算用于置位，取反后与运算常用于清位。普通 RAM 可按常规读改写，但外设寄存器可能有写 1 清零、读清除或保留位规则，必须先看手册。',
'l-number':'二进制是硬件存储位的方式，十六进制只是更紧凑的书写方式；数据类型才决定如何解释这些位。相同的 11111111，按 8 位无符号整数可解释为 255，按常见 8 位补码有符号数可解释为 -1。调试时要同时看位模式、类型宽度和有无符号属性。',
'l-endian':'字节序只回答“一个多字节对象拆成字节后，低地址先放哪一个字节”；它不决定单个字节内部的位序。结构体则可能因为成员对齐插入空隙。解析通信协议时应按协议规定逐字段解码，不要假定对端编译器的结构体布局与本机完全一致。',
'l-mmio':'普通 RAM 用来保存程序数据；内存映射外设地址背后可能是硬件寄存器，读写会触发真实硬件行为。访问某地址前要确认它属于哪个外设、时钟是否开启、访问宽度是否正确、寄存器是只读/读写还是带副作用。地址正确不代表外设已经准备好。',
'l-startup':'复位后 CPU 并不会神奇地直接运行 main。芯片先按架构规定找到复位入口，启动代码再准备 C 语言运行环境，例如设置栈、把带初值的全局变量复制到 RAM、清零零初始化区，最后才进入应用。若这些步骤出错，main 可能根本不会执行。',
'l-linker':'编译器主要把单个源文件翻译成目标文件；链接器把多个目标文件和库组合起来，解析符号引用，并按链接脚本安排代码和数据地址。map 文件是“最终内存布局的账本”，能帮助回答哪个对象占 RAM、哪个库占 Flash、某个函数最终放在哪里。',
'l-gpio':'GPIO 不是单纯的软件变量，而是连接到芯片引脚的电气接口。软件配置模式、输出类型、上下拉和复用功能，决定引脚怎样驱动或读取外部电路；板上 LED 可能是低电平点亮，因此“写 1”不一定意味着灯亮。软件设置和原理图、电压、电流限制要一起看。',
'l-irq':'中断是硬件事件通知 CPU 的机制。外设检测到事件后提出请求，控制器按使能和优先级规则决定是否让 CPU 暂停当前流程并进入 ISR。ISR 应尽快确认事件、保存最少信息并退出；耗时工作交给主循环或任务，避免长时间占用 CPU。',
'l-timer':'硬件定时器本质上是按输入时钟递增或递减的计数器。预分频器改变计数速度，自动重装载值决定计数周期；当计数到达设定边界时可以产生事件、中断或 DMA 请求。计算前先弄清输入时钟来自哪里，再把寄存器值换算成实际时间。',
'l-pwm':'PWM 用固定周期的数字波形控制平均输出效果。频率决定每秒重复多少次，占空比决定每个周期中高电平所占比例；输入捕获则反过来记录外部边沿发生时的计数器值，以便测量周期或脉宽。计算结果必须通过实际波形验证。',
'l-uart':'UART 负责把字节按约定的时序逐位发送，但它通常不定义“哪些字节合成一条业务消息”。波特率和帧格式要匹配，应用层还要自己定义分帧、长度、校验、超时与异常恢复。一次中断或一次 DMA 完成不一定等于收到完整消息。',
'l-i2c-spi':'I²C 和 SPI 都是芯片与外设交换数据的串行总线，但连接方式和时序规则不同。I²C 常用两根开漏线、地址和 ACK；SPI 常用时钟、数据线和片选，采样相位由 CPOL/CPHA 决定。选总线不能只比较速度，还要看器件支持、引脚、距离、上拉和时序。',
'l-adc':'ADC 把连续变化的模拟电压映射成有限数量的数字码。位数决定理想量化级数，但最终测量误差还受参考电压、噪声、偏移、增益、输入阻抗和采样时间影响。换算物理量时先确认码值范围与参考电压，再考虑校准和滤波。',
'l-dma':'DMA 是独立的数据搬运机制，能减少 CPU 逐个读取外设数据的负担，但它不会自动替应用管理缓冲区。关键问题是：当前哪一段缓冲区由 DMA 写、哪一段已稳定可供 CPU 读、何时切换所有权，以及带 Cache 的芯片是否需要维护缓存一致性。',
'l-task':'RTOS 任务是由内核调度的执行单元，通常有自己的栈、状态和优先级。调度器决定谁在何时运行，但任务拆分本身不保证实时性；还必须考虑最坏执行时间、阻塞、优先级、共享资源和截止期限。先定义每个任务的职责和输入输出，再决定优先级。',
'l-sync':'并发问题的核心不是“代码写在不同文件”，而是多个执行上下文可能交错访问同一资源。队列传递数据，信号量表达事件或资源计数，互斥锁保护共享资源；它们不能随意互换。设计时要定义资源所有者、等待方式、超时策略和锁的获取顺序。',
'l-toolchain':'固件构建是流水线：预处理展开宏和头文件，编译器生成汇编或目标文件，汇编器形成机器码，链接器解析符号并安排地址，最后再转换成烧录格式。每一步都可能失败；“编译通过”只说明某个阶段成功，不代表链接布局、启动和运行都正确。',
'l-debug':'调试不是随机试改代码，而是提出假设并收集证据。先稳定复现问题，记录固件版本和输入条件，再逐步检查 PC、SP、调用栈、关键变量、异常状态和硬件波形。每次实验尽量只改变一个因素，否则很难知道真正起作用的原因。',
'l-fsm':'状态机把程序行为明确写成“当前状态 + 输入事件 → 新状态 + 动作”。它适合处理初始化、连接、采样、告警和故障恢复等流程。比起多个互相影响的布尔变量，状态机更容易检查哪些转移合法、异常事件如何处理，以及每种状态下允许做什么。',
'l-watchdog':'看门狗是系统失去正常进展时触发恢复的硬件机制，不是万能的防死机按钮。如果程序卡死但仍持续喂狗，看门狗就失去了意义。可靠设计需要监控关键任务是否按预期推进，并记录复位原因、错误码和足够的现场信息。',
'l-cpu-registers':'C 变量是源代码层面的抽象，CPU 实际执行的是机器指令。寄存器是 CPU 内部高速工作位置；PC、SP、返回地址等信息帮助描述执行到了哪里、当前栈在哪里、函数如何返回。调试器同时展示源码和寄存器，是连接软件抽象与硬件执行的窗口。',
'l-makefile':'Make 的价值不仅是少敲几条命令，而是明确“哪个产物依赖哪些输入”。依赖关系正确时，只重建受影响的目标；依赖缺失时，改了头文件却没有重新编译，可能造成难以复现的问题。Makefile 应表达真实依赖，并让 clean build 可重复。',
'l-gcc-binutils':'交叉编译器在开发主机上运行，却生成目标 MCU 能执行的指令。工具链不仅有 GCC，还包括汇编器、链接器、归档工具、反汇编器和符号查看工具。遇到问题时，先确认目标架构、ABI、工具版本和编译选项，再查看产物，而不是只依赖 IDE 的成功提示。',
'l-linker-map-practice':'链接脚本不是普通配置文本，而是在告诉链接器：芯片有哪些内存区域、每个段应该放在哪里、哪些符号代表边界。重定位把目标文件中的符号引用修正为最终地址。修改脚本前必须核对芯片内存、Bootloader 保留区、向量表位置与启动代码预期。',
'l-gdb-practical':'断点回答“执行到这里时发生什么”，观察点回答“这个变量何时被改动”，调用栈回答“程序通过哪些函数走到这里”。有效调试要围绕一个明确问题设置最少观察点，并记录观察结果。调试器的观察点数量和能力取决于目标硬件与调试接口。',
'l-task-context':'任务切换时，内核需要保存当前任务以后继续运行所需的执行现场，再恢复另一个任务的现场。每个任务的栈必须足够容纳调用链、局部变量和可能的中断/异常开销；栈太小可能导致内存被覆盖，太大又会浪费有限 RAM。',
'l-rtos-memory':'动态内存管理的难点不止是“有没有内存”，还包括分配失败、释放遗漏、重复释放和碎片。长时间运行的固件若不断申请不同大小的内存，可能出现总空闲量看似足够、却找不到连续大块的情况。固定块内存池能让分配时间更可预测，但需提前规划块大小与数量。',
'l-rtos-device':'设备管理的目标是把硬件初始化、运行、错误和关闭过程变成清晰的生命周期。模块应说明资源由谁创建、谁使用、谁释放，以及失败时如何回滚。初始化顺序要遵循依赖关系，终止顺序通常反向处理，才能降低资源泄漏和使用未初始化设备的风险。',
'l-rtos-timers':'软件定时器通常由 RTOS 的定时器服务机制管理，它的回调执行时机和上下文受具体内核实现影响。定时器回调里做长时间运算或阻塞操作，可能拖慢其他定时器事件。要区分“需要在某时刻触发”与“必须在严格截止时间完成”，后者还要做实时性分析。',
'l-signal-integrity':'数字信号并不是理想的方波。真实线路有电阻、电容、电感和传播延迟，边沿太快、走线太长、回流路径差或负载不匹配时，可能出现振铃、过冲、串扰和误触发。软件看见的数据错误，有时根因在电气波形而不是协议代码。',
'l-hardware-debug':'硬件排障要把数据手册、参考手册、原理图和实测波形对应起来。数据手册说明器件能力和限制，参考手册描述寄存器行为，原理图说明板上实际连接，示波器/逻辑分析仪则提供真实信号证据。四者要相互印证，不能仅凭代码猜测硬件状态。',
'l-read-assembly':'汇编是机器指令的可读表示。读汇编不必一开始记住所有指令，而应先认出函数入口、参数使用、内存读写、条件跳转、函数调用和返回。将几行 C 与对应汇编对照，可以理解编译器如何实现变量、循环和函数调用。',
'l-abi-eabi':'ABI 是二进制层面的“接口合同”：函数参数放在哪里、返回值怎样传递、哪些寄存器由调用者或被调用者保存、栈怎样对齐、目标文件怎样表示符号，都需要遵循约定。违反 ABI 可能导致看似随机的崩溃，即使每个源文件单独编译都没有错误。',
'l-design-principles':'良好设计的目标是降低理解、修改和验证成本。模块应有清楚职责，接口应表达输入输出和错误，资源使用应可追踪。简单不是把代码写得短，而是让关键行为容易解释、异常路径容易检查、变化影响范围可控。',
'l-module-management':'模块化不仅是把代码拆成多个 .c 文件，还要明确模块边界、依赖方向、初始化顺序、资源所有权和错误传播。依赖关系越清楚，越容易独立测试；若多个模块互相调用并共同修改全局状态，改一个功能就可能影响整个系统。',
'l-error-management':'错误处理应让故障能够被检测、表达、传递、记录并按策略恢复。返回错误码能让上层决定是否重试、降级或进入安全状态；日志要记录有用上下文，但不能让低层模块随意输出大量信息，影响时序或淹没真正关键的错误。',
'l-project-layout':'目录结构是团队理解软件架构的地图。按层次、模块和测试组织文件，能帮助新人判断某项功能应该放在哪里、依赖什么、怎样验证。目录命名不是装饰；结构混乱会增加检索成本，并让模块边界越来越模糊。',
'l-developability':'可开发性指软件是否容易增加功能、定位问题和验证行为。为了可开发性，可以提供统一日志、资源统计、可替换的硬件接口、明确的配置入口和主机可运行的测试。开发期多一点可观察性，通常能减少后期排查现场问题的成本。',
'l-design-checklist':'设计原则只有落实到代码审查和测试清单中才会稳定发挥作用。每次新增模块时，检查职责、接口、依赖、初始化、错误路径、资源释放、日志和测试方式；清单不是官僚流程，而是帮助大脑避免遗漏的外部记忆。',
'l-unit-test':'单元测试把一个函数或模块放在可控条件下，给定输入并检查输出或副作用。测试的价值不在于写了多少行测试代码，而在于关键边界和失败路径是否被验证。尽量让业务逻辑与硬件寄存器访问分离，这样逻辑可以在电脑上快速测试。',
'l-coverage-static':'代码覆盖率回答测试执行到了哪些语句、分支或条件，但“执行过”不等于“验证正确”。静态分析不运行程序，通过规则和数据流发现潜在问题；它能补充人工审查与测试，但工具告警仍需结合上下文判断。',
'l-dynamic-analysis':'动态分析通过程序真实运行时的行为发现问题，例如越界访问、未定义行为、资源泄漏或竞态。它只能观察被测试路径，因此需要设计有代表性的输入和异常场景；测试没发现问题，并不等于问题不存在。',
'l-performance-analysis':'性能分析先测量再优化。嵌入式系统的约束包括 CPU 时间、最坏响应延迟、RAM、Flash、功耗和总线占用。先确定瓶颈和预算，再用计时器、周期计数器、GPIO 翻转或分析工具测量；不要凭感觉优化并让代码更难维护。',
'l-mmu-cache':'MMU、MPU 和 Cache 解决的是不同问题：MMU 主要提供地址转换与内存保护机制，MPU 在不少 MCU 中按区域配置访问权限，Cache 用来减少处理器访问较慢存储器的平均延迟。使用 DMA 或多核共享内存时，Cache 还会带来数据一致性问题。',
'l-bootloader':'Bootloader 是应用程序之前运行的一段固件，常负责检查镜像、升级、选择启动分区或跳转到应用。跳转不是简单调用函数：中断、向量表、栈指针、时钟、外设状态和应用镜像合法性都要按芯片与启动设计处理。'
};

const lessonTeachingAssets = {};
function addTeachingAsset(id, diagramTitle, nodes, codeTitle, language, code, explanations, note){
 lessonTeachingAssets[id]={diagramTitle,nodes,codeTitle,language,code,explanations,note:note||'代码用于解释核心机制。涉及寄存器地址、SDK API、编译参数或硬件时序的部分，需要按目标芯片和所用工具链核对后再用于真实项目。'};
}
addTeachingAsset('l-pointer','指针如何把“变量”和“地址”联系起来',[['变量对象','value 中保存 42'],['取地址','&value 得到地址'],['保存地址','p 指向 value'],['解引用','*p 访问原对象']], '示例：安全地读取缓冲区', 'C', String.raw`#include <stddef.h>
#include <stdint.h>
#include <stdbool.h>

bool read_u8(const uint8_t *buf, size_t len,
             size_t index, uint8_t *out)
{
    if (buf == NULL || out == NULL || index >= len) {
        return false;
    }
    *out = buf[index];
    return true;
}`, ['头文件提供固定宽度整数、size_t 和 bool。','buf 是只读数据缓冲区；len 描述可访问的元素个数，指针本身不携带长度。','先验证指针和输出参数，再验证 index 是否小于 len。','buf[index] 等价于 *(buf + index)；检查通过后才读取，并通过 out 返回结果。'], '这是一个可在主机端编译的示例。调用方还应确保 buf 指向的内存确实至少有 len 个字节。');
addTeachingAsset('l-memory','固件内存布局：代码、静态数据、堆与栈',[['Flash','代码与初始常量'],['启动初始化','复制 .data / 清零 .bss'],['RAM 静态区','全局与 static 对象'],['运行时栈','调用现场和局部量']], '示例：比较静态对象与局部对象', 'C', String.raw`#include <stdint.h>

static uint32_t boot_count;       // 通常进入 .bss
static uint32_t threshold = 100;  // 通常进入 .data

void sample(void)
{
    uint8_t temp[16];             // 常见为栈上的局部数组
    temp[0] = (uint8_t)threshold;
    boot_count += temp[0];
}`, ['未显式初始化的静态存储期对象会被初始化为零，常见实现将它们放入 .bss。','有非零初值的静态对象常放在 .data；其初值保存在固件映像中，启动时复制到 RAM。','temp 的生命周期通常只覆盖 sample() 调用期间，数组较大时会增加栈压力。','具体段名称和放置方式以链接脚本、编译器和 map 文件为准。'], 'C 语言标准规定对象存储期；.data/.bss 等段名是常见工具链实现方式，并非 C 语言本身的语法。');
addTeachingAsset('l-volatile','volatile 轮询：每次重新读取可观察状态',[['硬件更新','状态寄存器改变'],['CPU 读取','执行一次 load'],['判断条件','检查目标位'],['等待或继续','条件未满足则重读']], '示例：等待一个状态位（地址仅为示意）', 'C', String.raw`#include <stdint.h>

#define STATUS_REG (*(volatile const uint32_t *)0x40000000u)
#define READY_BIT  (1u << 0)

int wait_ready(void)
{
    while ((STATUS_REG & READY_BIT) == 0u) {
        /* 真实固件应按需求加入超时策略 */
    }

addTeachingAsset('l-bitops','位掩码怎样置位、清位和测试',[['原寄存器','例如 0000 1000'],['构造掩码','1u << bit'],['按位操作','OR / AND / NOT'],['检查结果','与掩码相与']], '示例：独立操作某一个 bit', 'C', String.raw`#include <stdint.h>

addTeachingAsset('l-endian','小端与大端：同一数值的字节排列',[['32 位整数','0x12345678'],['小端排列','低地址：78 56 34 12'],['大端排列','低地址：12 34 56 78'],['协议解码','按约定逐字节组合']], '示例：安全解码 4 字节小端值', 'C', String.raw`#include <stddef.h>

addTeachingAsset('l-startup','复位后，C 程序环境是怎样建立的',[['复位向量','取初始栈与入口'],['Reset_Handler','进入启动代码'],['初始化 RAM','复制 .data / 清零 .bss'],['运行 main','进入应用逻辑']], '示例：启动流程的概念伪代码', 'C-like pseudocode', String.raw`void Reset_Handler(void)

addTeachingAsset('l-linker','链接脚本把程序段安排进真实存储器',[['目标文件','代码段 / 数据段'],['链接脚本','描述 Flash 和 RAM'],['链接器','放置段并解析符号'],['map 文件','核实地址和占用']], '示例：链接脚本的最小结构（示意）', 'Linker script', String.raw`MEMORY

addTeachingAsset('l-irq','中断服务程序：先处理必要工作，再通知主流程',[['外设事件','设置中断标志'],['CPU 响应','保存必要现场'],['ISR 处理','快速读取 / 清标志'],['后续工作','投递事件给任务']], '示例：缩短中断服务程序', 'C', String.raw`#include <stdint.h>

addTeachingAsset('l-timer','用单调计时差值判断超时',[['记录起点','start = tick_now()'],['持续运行','主循环不阻塞'],['计算差值','now - start'],['达到期限','执行一次动作']], '示例：非阻塞定时判断', 'C', String.raw`#include <stdbool.h>

addTeachingAsset('l-pwm','PWM 占空比来自周期与比较值',[['计数器运行','计数 0 到 ARR'],['比较匹配','CNT 与 CCR 比较'],['输出翻转','产生高低电平'],['调节 CCR','改变占空比']], '示例：把百分比换算成比较值', 'C', String.raw`#include <stdbool.h>

addTeachingAsset('l-uart','UART 收发是字节流，帧边界要由协议定义',[['UART 外设','接收一个字节'],['环形缓冲区','暂存字节'],['协议解析','识别长度 / 分隔符'],['完整消息','校验并交付']], '示例：环形缓冲区写入一个字节', 'C', String.raw`#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
#define RX_CAPACITY 64u
static uint8_t rx_buf[RX_CAPACITY];
static size_t rx_head, rx_tail;

bool rx_push(uint8_t byte)
{
    size_t next = (rx_head + 1u) % RX_CAPACITY;
    if (next == rx_tail) return false; /* 缓冲区满 */
    rx_buf[rx_head] = byte;
    rx_head = next;
    return true;
}`, ['head 指向下一个写入位置，tail 指向下一个读取位置；具体定义需在整个模块中保持一致。','next 等于 tail 表示缓冲区满，因此环形队列会保留一个空位用于区分满和空。','写入数据后再推进 head，消费者才能看到新字节。','这个最小实现未处理多任务并发或中断同步；并发使用时需设计原子性与临界区。'], 'UART 通常只提供字节流，不会自动提供应用层消息边界。还要补充溢出策略、帧超时、校验和并发规则。');
addTeachingAsset('l-i2c-spi','I²C 与 SPI 的事务流程不同',[['准备总线','频率 / 模式 / 地址'],['启动事务','I²C START 或 SPI CS'],['传输数据','时序与应答'],['结束事务','STOP / 释放 CS']], '示例：把一次 I²C 读取封装成有错误返回的事务', 'C / HAL-style', String.raw`#include <stdbool.h>

addTeachingAsset('l-adc','ADC 原始码值转换为物理量',[['模拟输入','传感器电压'],['采样保持','在指定时刻取样'],['量化结果','N 位原始码值'],['标定换算','电压 / 工程单位']], '示例：把 ADC 码值换算为输入电压', 'C', String.raw`#include <stdint.h>

addTeachingAsset('l-dma','DMA 缓冲区有明确的所有权交接',[['CPU 准备','填充参数与地址'],['启动 DMA','移交缓冲区所有权'],['DMA 传输','CPU 避免冲突访问'],['完成通知','核验并接管数据']], '示例：用状态管理 DMA 缓冲区生命周期', 'C', String.raw`#include <stdbool.h>
#include <stddef.h>

addTeachingAsset('l-task','任务应明确周期、等待条件与职责',[['创建任务','入口 / 栈 / 优先级'],['就绪运行','由调度器分配 CPU'],['阻塞等待','延时 / 队列 / 信号量'],['事件唤醒','再次进入就绪态']], '示例：一个周期性任务（FreeRTOS 风格）', 'C / FreeRTOS-style', String.raw`#include "FreeRTOS.h"

addTeachingAsset('l-fsm','状态机把“当前状态”和“允许动作”明确下来',[['读取当前状态','IDLE / ACTIVE'],['收到事件','按条件选择分支'],['执行动作','校验并更新状态'],['产生新状态','等待下一个事件']], '示例：显式状态与事件处理', 'C', String.raw`typedef enum { ST_IDLE, ST_RUNNING, ST_ERROR } state_t;

{
    switch (s) {
    case ST_IDLE:    if (e == EV_START) return ST_RUNNING; break;

addTeachingAsset('l-watchdog','看门狗应由系统健康状态决定是否喂狗',[['各模块执行','任务 / 驱动推进'],['健康检查','进度与故障标志'],['确认系统健康','满足全部必要条件'],['喂看门狗','异常则允许复位']], '示例：不要让单个死循环无条件喂狗', 'C-like pseudocode', String.raw`void supervisor_step(void)

addTeachingAsset('l-makefile','Makefile 用依赖关系决定哪些目标需要重建',[['源文件 / 头文件','输入依赖'],['规则匹配','检查时间戳'],['执行配方','编译 / 链接'],['更新目标','仅重建受影响部分']], '示例：最小可增量构建的 Makefile', 'Makefile', String.raw`CC := arm-none-eabi-gcc

addTeachingAsset('l-rtos-timers','软件定时器到期后运行的回调不是“绝对精确时刻”',[['启动定时器','配置时长与模式'],['计时推进','tick / 定时器服务'],['超时到期','进入回调队列'],['回调处理','投递事件或更新状态']], '示例：定时器回调只发事件', 'C / RTOS-style', String.raw`#include "FreeRTOS.h"

        value = value * 10u + (unsigned long)(*p - '0');
        if (value > 100u) return false;
    }
    *out = (uint8_t)value;
    return true;
}`, ['函数名明确用途，输入文本和输出指针通过参数显式提供。','非法输入、空字符串和超范围值都会返回失败，而不是静默截断。','只有完全解析成功才修改 *out，减少失败时的部分更新。','示例仍需考虑超长文本造成的计算溢出；生产代码应使用更完善的范围检查。'], '这里演示接口契约，不代表所有项目都应采用相同错误表达方式。');
addTeachingAsset('l-module-management','模块初始化顺序应符合依赖方向',[['基础模块','时钟 / OS / 总线'],['驱动模块','依赖底层服务'],['服务模块','组合驱动能力'],['应用模块','使用稳定接口']], '示例：检查每一步初始化结果', 'C', String.raw`bool system_init(void)

addTeachingAsset('l-error-management','错误码让调用方决定如何恢复',[['操作失败','检测到超时 / 非法参数'],['表达原因','稳定错误码'],['记录上下文','模块 / 状态 / 参数'],['恢复策略','重试 / 降级 / 返回']], '示例：区分参数错误、超时和设备故障', 'C', String.raw`#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>

typedef enum {
    ERR_OK = 0,
    ERR_INVALID_ARG,
    ERR_TIMEOUT,
    ERR_DEVICE

result_t sensor_read(uint16_t *value)

addTeachingAsset('l-project-layout','目录树应反映职责和依赖关系',[['应用层','产品流程与状态机'],['服务层','协议 / 设备抽象'],['驱动层','GPIO / UART / SPI'],['平台层','启动 / 时钟 / 芯片']], '示例：一份便于定位代码的项目目录树', 'Text', String.raw`project/
  app/          # 产品流程、状态机
  services/     # 协议与设备抽象
  drivers/      # UART、GPIO、SPI 驱动

addTeachingAsset('l-developability','可开发性是“故障能否快速复现和定位”',[['可观测','日志 / 统计 / 版本'],['可复现','输入 / 条件 / 步骤'],['可定位','断点 / 符号 / 现场'],['可验证','回归测试 / 记录']], '示例：给关键错误记录足够上下文', 'C', String.raw`log_error("i2c_read failed: addr=0x%02X reg=0x%02X rc=%d state=%u",
          device_addr, reg_addr, (int)rc, (unsigned)driver_state);`, ['错误日志不仅说“失败”，还应说明哪个设备、哪个寄存器以及返回原因。','日志中不要输出密码、密钥或不应公开的敏感数据。','高频路径需要限制日志量，避免日志反过来影响实时性。','搭配固件版本、复现步骤和寄存器现场，才能让记录成为可用的调试证据。'], '日志格式和 API 按项目而异，嵌入式产品还要评估日志对时序、Flash 写入寿命和存储空间的影响。');
addTeachingAsset('l-design-checklist','把设计检查清单变成每次修改的固定步骤',[['接口检查','输入 / 输出 / 错误'],['资源检查','初始化 / 释放'],['并发检查','ISR / 任务 / 锁'],['验证检查','测试 / 日志 / 回归']], '示例：模块合入前的轻量自检', 'Checklist', String.raw`[ ] 参数和返回值语义明确
[ ] 所有错误路径都有处理
[ ] 缓冲区长度与索引有边界检查
[ ] 资源申请、停止和释放成对出现
[ ] ISR 与任务共享数据有同步设计
[ ] 至少覆盖一个失败场景的测试`, ['检查清单把容易遗漏的工程问题从记忆中外化出来。','重点不只是“有没有代码”，更要检查失败路径、资源所有权和并发访问。','每个项目可以依据硬件安全等级、团队规范和产品需求扩展清单。','清单完成不等于自动证明代码正确，仍需审查、测试和测量。'], '清单要短且有行动性；若项数过多却没人真正检查，反而会失去价值。');
addTeachingAsset('l-unit-test','单元测试把边界输入变成可重复检查',[['准备输入','正常 / 边界 / 错误'],['调用单元','尽量隔离硬件'],['检查预期','返回值 / 副作用'],['自动重复','回归防止再发']], '示例：测试一个边界检查函数', 'C', String.raw`#include <assert.h>

{
    if (value < 0 || value > 100) return -1;

}

int main(void)
{
    assert(clamp_percent(50) == 50);
    assert(clamp_percent(0) == 0);

addTeachingAsset('l-coverage-static','覆盖率告诉你测试走过哪里，静态分析检查代码结构',[['编写测试','设计输入和断言'],['执行程序','记录语句 / 分支'],['静态扫描','规则 / 数据流分析'],['人工复核','区分真问题与误报']], '示例：主机端编译测试并收集覆盖率', 'Shell', String.raw`gcc -Wall -Wextra -O0 --coverage test.c -o test
./test

# 静态分析工具命令与配置依工具链而定`, ['覆盖率编译选项会插入统计数据，执行测试才会产生运行记录。','gcov 报告被执行的代码区域，可帮助发现未覆盖分支。','覆盖率高不代表断言充分，也不代表未发现缺陷。','静态分析不运行程序，结果需要结合代码路径与工具规则人工复核。'], 'GNU coverage 选项适用于支持该功能的 GCC 主机/目标构建。目标架构和工具链能力可能不同。');
addTeachingAsset('l-dynamic-analysis','动态分析只能检查真正执行到的路径',[['构建分析版','打开运行时检测'],['准备输入','边界与错误场景'],['运行程序','观察内存 / 资源'],['复现问题','修复并回归验证']], '示例：在主机端使用 AddressSanitizer', 'Shell / C', String.raw`gcc -g -O1 -fsanitize=address,undefined \
    -fno-omit-frame-pointer test.c -o test_asan
./test_asan`, ['-fsanitize=address 能发现许多越界、释放后使用等内存错误。','undefined sanitizer 会检查部分未定义行为。','分析工具只看到实际运行的路径，输入覆盖不足仍可能漏掉问题。','这些工具多用于支持它们的主机环境；目标 MCU 可用的分析能力需要另行确认。'], '这是一种主机端测试方法，不代表所有交叉编译器或 MCU 都支持相同 sanitizer。');
addTeachingAsset('l-performance-analysis','先测量瓶颈，再做优化',[['提出假设','哪段代码慢 / 占 RAM'],['选择指标','周期 / 延迟 / 大小'],['采集数据','重复测量多组样本'],['优化验证','对比数据与回归']], '示例：测量某操作耗时的基本框架', 'C-like pseudocode', String.raw`uint32_t t0 = cycle_counter_read();

addTeachingAsset('l-mmu-cache','地址转换、访问权限和 Cache 是三类不同机制',[['CPU 地址','虚拟或物理地址'],['MMU / MPU','映射或访问权限'],['Cache','缓存数据副本'],['DMA 一致性','维护或共享策略']], '示例：DMA 前后缓存维护的概念顺序', 'C-like pseudocode', String.raw`prepare_buffer_for_dma_device(rx_buf, sizeof rx_buf);

addTeachingAsset('l-bootloader','安全跳转需要确认镜像与应用运行环境',[['复位 / Bootloader','读取启动条件'],['验证镜像','长度 / 地址 / 完整性'],['准备现场','中断 / VTOR / MSP'],['跳转应用','进入复位入口']], '示例：跳转前的检查清单式伪代码', 'C-like pseudocode', String.raw`if (!image_header_valid(slot)) return BOOT_ERR_HEADER;

addTeachingAsset('l-debug-breakpoints','观察点让调试器在对象发生变化时停下', [['设置基线','运行到目标函数'],['观察变量','监视指定对象'],['捕获现场','PC / 调用栈'],['确认写入者','回看首次变化']], 'GDB 示例：定位变量第一次被修改的位置', 'GDB', String.raw`# 先确认加载了与固件匹配的 ELF 符号

# 当 state 被写入时，GDB 通常会停在写入附近

info registers pc sp
list`, ['break 设置代码断点，watch 设置数据观察点；目标芯片可能只提供数量有限的硬件观察点。','观察点命中后，先读取变量值，再看调用栈和 PC，确认是谁、在哪条路径上修改它。','优化构建可能把变量放入寄存器、合并存储或删除局部变量，建议用带调试信息的构建复现。','如果修改来自 DMA 或外设，CPU 观察点不一定能按普通 CPU store 的方式捕获所有变化；要结合 DMA 中断、内存快照或总线观测。'], '命令以 GDB 为例；具体观察点能力、寄存器名称和调试行为取决于目标架构、探针和调试服务器。');
addTeachingAsset('l-alignment','用 sizeof 和 offsetof 观察结构体填充', [['成员大小','每种类型的大小'],['成员对齐','地址满足 ABI 约束'],['插入 padding','成员间或尾部填充'],['实测验证','sizeof / offsetof']], '示例：比较成员顺序与结构体布局', 'C', String.raw`#include <stddef.h>
#include <stdint.h>
#include <stdio.h>

typedef struct {
    uint8_t  type;
    uint32_t length;
    uint16_t flags;
} HeaderA;

typedef struct {
    uint32_t length;
    uint16_t flags;
    uint8_t  type;
} HeaderB;

int main(void)
{
    printf("A: size=%zu length=%zu flags=%zu\n",
           sizeof(HeaderA), offsetof(HeaderA, length), offsetof(HeaderA, flags));
    printf("B: size=%zu flags=%zu type=%zu\n",
           sizeof(HeaderB), offsetof(HeaderB, flags), offsetof(HeaderB, type));
    return 0;
}`, ['sizeof 给出该编译器下整个结构体的字节数；offsetof 给出成员相对结构体起始位置的偏移。','常见 32 位 ABI 下，HeaderA 可能在 type 后插入填充，使 length 满足 4 字节对齐；HeaderB 通常可减少填充。','不要硬编码某个编译器的结果；目标 ABI、编译选项和打包指令都会影响布局。','协议报文应逐字段按字节解码，避免直接把接收字节强制转换为结构体指针。'], '预期数值以目标编译器运行结果为准。结构体的内存布局不应直接被当作跨平台协议格式。');
addTeachingAsset('l-scope-logic-analyzer','示波器看电气波形，逻辑分析仪看数字事务', [['明确故障','SPI 读值偶发错误'],['示波器','幅度 / 过冲 / 边沿'],['逻辑分析仪','CS / SCLK / MOSI / MISO'],['对照预期','模式 / 时序 / 数据']], '示例：SPI 读错数据的测量计划', 'Measurement plan', String.raw`问题：SPI 偶发读值错位

1. 示波器测：SCLK / CS 的实际电平、边沿、过冲和振铃。
2. 逻辑分析仪解：CS、SCLK、MOSI、MISO 的字节、位序与采样边沿。
3. 对照数据手册：CPOL、CPHA、最高 SCLK、CS 建立/保持时间。
4. 关联代码现场：记录失败时的寄存器地址、返回状态和重试次数。
5. 判定：先找到第一个偏离预期的边沿或位，不从最终错误值倒猜。`, ['示波器呈现模拟电压随时间的变化，适合找过冲、振铃、幅度不足和上升/下降沿问题。','逻辑分析仪按阈值把信号解释为 0/1，并用协议解码器重建字节和事务，适合判断位序、应答和帧边界。','两种仪器都受探头接地、采样率、带宽和阈值设置影响；测量接法本身也可能改变被测电路。','先针对一条可重复的失败事务采集证据，并与一条成功事务对比。'], '这是测量工作单，不是可以直接执行的 shell 命令。根据电路电平、信号速度和探头负载选择合适的测量设置。');
addTeachingAsset('l-gpio-clock-mux','GPIO 初始化顺序要避免引脚短暂进入错误状态', [['准备外设','确认引脚与 AF 映射'],['使能时钟','GPIO / UART 时钟'],['预置安全状态','空闲电平与输出类型'],['选择复用','启用 UART TX'],['开始外设','配置参数后使能发送']], '示例：UART TX 引脚初始化步骤', 'C-like pseudocode', String.raw`/* 示意接口：请替换成目标芯片 HAL/LL 或寄存器操作 */

addTeachingAsset('l-timer-dma-encoder','定时器定义采样时刻，DMA 搬运数据，CPU 分段处理', [['定时器','每 100 μs 触发'],['ADC','采样并转换'],['DMA','写入循环缓冲'],['半传输事件','CPU 处理已完成半区'],['全传输事件','交接另一半并循环']], '示例：10 kHz 触发与双半缓冲设计', 'C-like pseudocode', String.raw`#define HALF_SAMPLES 32u

addTeachingAsset('l-queue-ownership','按值入队复制内容，指针入队必须转移所有权', [['生产者','取得完整帧'],['按值入队','队列复制结构体'],['指针入队','交付池中缓冲区地址'],['消费者','处理后归还缓冲区']], '示例：消息值拷贝与内存池指针交接', 'C-like pseudocode', String.raw`typedef struct {

} Frame;

/* 小帧可按值复制；具体 queue API 由 RTOS 决定 */

queue_send_copy(&frame, sizeof frame);

/* 大帧使用池：成功入队后生产者不能再改写该块 */
Frame *msg = frame_pool_acquire();

    fill_frame(msg);

/* 消费者处理后必须恰好归还一次 */`, ['按值队列复制的是整个消息对象，因此对象离开当前作用域后仍不影响队列中的副本，但大对象会产生复制成本。','指针队列只复制地址，不复制缓冲区内容；指针必须指向仍然有效的对象。','不能把局部栈变量的地址异步交给消费者后立即返回，否则消费者可能访问已失效对象。','定义单一所有权规则：入队失败谁负责释放、入队成功谁拥有、消费者何时归还；每个缓冲区恰好释放一次。'], 'queue_send_copy / queue_send_pointer / frame_pool_acquire 是示意接口。实际项目需按使用的 RTOS 队列语义、对齐和内存池实现调整。');
addTeachingAsset('l-critical-section-isr','volatile 不等于原子操作；临界区必须短且有边界', [['共享对象','ISR 与主循环都访问'],['判断原子性','读改写是否可被打断'],['选择机制','原子 / 临界区 / 消息'],['限制范围','只保护必要的几条指令']], '示例：在单核 MCU 上取得一致快照', 'C-like pseudocode', String.raw`/* 示意：使用 RTOS/架构提供的保存并恢复中断状态 API */

addTeachingAsset('l-fsm-transition-tests','转移表让合法路径和非法事件都可以被测试', [['当前状态','DISCONNECTED'],['事件','CONNECT / OK / TIMEOUT'],['规则查表','仅允许定义过的转移'],['验证结果','新状态 + 副作用']], '示例：显式状态转移与参考测试', 'C', String.raw`typedef enum { DISCONNECTED, CONNECTING, ONLINE, FAULT } State;
typedef enum { EV_CONNECT, EV_OK, EV_TIMEOUT, EV_CLOSE } Event;

State step(State s, Event e)
{
    if (s == DISCONNECTED && e == EV_CONNECT) return CONNECTING;
    if (s == CONNECTING && e == EV_OK) return ONLINE;
    if (s == CONNECTING && e == EV_TIMEOUT) return FAULT;
    if (s == ONLINE && e == EV_CLOSE) return DISCONNECTED;
    return s; /* 本例把非法事件定义为保持状态；产品也可返回错误 */

assert(step(CONNECTING, EV_OK) == ONLINE);
assert(step(CONNECTING, EV_TIMEOUT) == FAULT);
assert(step(ONLINE, EV_CLOSE) == DISCONNECTED);
assert(step(DISCONNECTED, EV_OK) == DISCONNECTED);`, ['先把“状态 + 事件 → 新状态”写成表，逐条说明合法转移和非法事件的政策。','状态变化之外，还应测试副作用，例如是否打开设备、释放锁、启动定时器或记录错误。','非法事件的处理必须是明确的设计选择；保持状态只是本例的选择，不是所有系统都适用。','不变量可写成断言，例如 ONLINE 状态必须有有效连接句柄；任何进入 FAULT 的路径都必须留下原因。'], '代码中的 assert 需要包含 <assert.h> 才能独立编译。真实状态机通常还返回动作/错误结果，而不是只返回新状态。');
addTeachingAsset('l-crash-record','崩溃记录要能校验有效性并保留复现现场', [['故障进入','捕获异常现场'],['记录字段','版本 / PC / LR / SP'],['一致性标记','magic / 长度 / CRC'],['重启读取','校验后解码与上报']], '示例：最小崩溃记录数据结构', 'C', String.raw`#include <stdint.h>

addTeachingAsset('l-config-management','编译期、板级与运行时配置应分层校验', [['编译期','功能裁剪 / 编译检查'],['板级配置','引脚 / 时钟 / 型号'],['运行时参数','从 Flash / 命令读取'],['校验策略','范围 / 组合约束 / 默认值']], '示例：配置参数定义与运行时检查', 'C', String.raw`#include <stdbool.h>

 if(id==='l-volatile') return {prompt:'一个 ISR 每次把 `count` 加一，主循环读取 count。只声明 `volatile uint32_t count` 是否保证读写不会丢失？',answer:'不能。若读改写会被中断打断或有多个执行上下文写入，就需要分析原子性和同步。应根据架构使用短临界区、原子操作或事件交接，且不要在 ISR 中调用阻塞 API。'};

 if(id==='l-linker') return {prompt:'编译没有报错，但链接提示 RAM 溢出，首先应该看什么？',answer:'检查 map 文件里 .data、.bss、静态大数组、栈/堆保留区和目标 RAM 容量；使用符号大小排序定位最大对象。不要盲目扩大 RAM 区域，先核实芯片真实容量和保留区。'};
 if(id==='l-mmio') return {prompt:'状态寄存器是“写 1 清零（W1C）”，为何不能用普通 RAM 的清位方法？',answer:'W1C 寄存器中写 1 表示清除对应标志，写 0 通常不清除。普通的读—改—写可能把读到的其他置位标志也写回，从而意外清除事件。应按参考手册规定的专用方式写入。'};
 if(id==='l-mmu-cache') return {prompt:'DMA 已把新数据写进 RAM，CPU 却读到旧内容，可能是什么原因？',answer:'若平台有数据 Cache，CPU 可能命中旧缓存副本。需要根据架构和芯片规则安排缓存维护、地址对齐和 DMA 内存区域属性；MPU/MMU 的权限配置与 Cache 一致性是不同问题。'};
 if(id==='l-gpio') return {prompt:'GPIO 已配置为输出却测不到预期电平，应先查哪些内容？',answer:'依次检查引脚复用、GPIO 时钟、输出模式/极性、供电与电压域、外部连线/负载，然后在引脚实际测波形。板上 LED 可能是低电平点亮，不可只凭逻辑电平名称判断功能。'};
 if(id==='l-irq') return {prompt:'ISR 收到字节后，为什么常把解析工作交给任务？',answer:'解析可能耗时且路径长度不确定，放在 ISR 中会增加中断延迟并影响其他实时任务。ISR 应快速确认事件并把数据/事件交给有容量约束的缓冲或队列，再由任务处理错误和超时。'};
 if(id==='l-timer') return {prompt:'定时器时钟为 72 MHz，PSC=71，ARR=999，按常见向上计数规则，更新频率是多少？',answer:'计数 tick=72 MHz/(71+1)=1 MHz；每个周期计数 ARR+1=1000 个 tick，所以更新频率=1 MHz/1000=1 kHz，周期=1 ms。需确认目标定时器实际使用这一计数规则。'};
 if(id==='l-pwm') return {prompt:'PWM 频率为 1 kHz、占空比为 25%，周期和高电平时间各是多少？',answer:'周期 T=1/f=1 ms；Ton=25%×1 ms=0.25 ms。实际 CCR 数值取决于计数模式、ARR 和输出极性，应用示波器测量确认。'};
 if(id==='l-uart') return {prompt:'UART 接收回调给了 6 个字节，这是否必然是一条完整协议消息？',answer:'不必然。消息可能被拆成多个片段，也可能多个帧合并到一次接收里。需要由解析器依据协议头、长度、校验和超时确认帧边界。'};
 if(id==='l-i2c') return {prompt:'I²C 已发出 START，但从设备返回 NACK，最先核对什么？',answer:'先核对地址位宽与地址值、读写位、从设备供电/复位、器件是否正在忙以及总线时序。再观察逻辑分析仪的实际地址和 ACK 时钟位，避免仅凭代码变量判断总线上发送了什么。'};
 if(id==='l-spi') return {prompt:'SPI 能读到数据但数值似乎错位，常见原因有哪些？',answer:'先核对 CPOL/CPHA、位序、字宽、CS 片选时机和 SCLK 频率；用逻辑分析仪比较实际采样边沿与数据手册要求。不要只改业务层解析。'};
 if(id==='l-dma') return {prompt:'DMA 缓冲区收到一半数据时，CPU 能否读取整个缓冲区？',answer:'只有协议和驱动明确保证已完成区域的所有权和稳定性时，CPU 才能读取该区域。否则 CPU 可能与 DMA 并发访问同一数据。使用明确的半传输/全传输事件或双缓冲状态管理，并留意 Cache 一致性。'};
 if(id==='l-unit-test') return {prompt:'函数返回了正确值，为什么测试还需要断言？',answer:'没有断言，测试只证明程序运行结束，不证明行为正确。断言把输入条件与预期结果关联起来；还应覆盖错误参数、边界、超时及资源不足。'};
 if(id==='l-coverage-static') return {prompt:'100% 语句覆盖能否证明所有条件组合都被测试？',answer:'不能。语句覆盖只说明语句被执行；分支覆盖关注条件的真/假结果，条件组合覆盖还更严格。无论哪种覆盖率都不能替代对输出和副作用的断言。'};
 return null;
}
function renderLessonExample(course, l){
 const a=l.teachingAsset;if(!a)return '';
 const ex=buildWorkedExample(course,l);
 const refAnswer=lessonReferenceAnswers[l.id]||buildLessonExerciseAnswer(course,l);
 const workedHtml=ex?`<div class="lesson-worked-case"><h4>看一个具体结果</h4><p><strong>示例问题：</strong>${esc(ex.prompt)}</p><div class="case-answer"><p><strong>答案与推导：</strong>${esc(ex.answer)}</p></div></div>`:`<div class="lesson-worked-case"><h4>把示例放回实际场景</h4><p><strong>应用场景：</strong>${esc(l.summary||l.title)}</p><p>读完上面的代码或工程步骤后，优先追踪输入、关键状态变化、结果，以及失败时的退出路径。</p><div class="case-answer"><p><strong>参考分析：</strong>${esc(refAnswer)}</p></div></div>`;
 return `<section class="lesson-example"><div class="lesson-example-head"><div class="lesson-example-heading"><h3>${esc(a.codeTitle)}</h3><p>示例围绕本节知识点。先追踪输入，再看关键状态或数据如何变化，最后用下方结论核对理解。</p></div><div class="lesson-code-tools"><span class="lesson-code-lang">${esc(a.language)}</span><button class="lesson-copy-btn" data-action="copy-lesson-code" data-id="${esc(l.id)}">复制示例</button></div></div><pre class="code-block"><code>${esc(a.code)}</code></pre><div class="lesson-code-note">${esc(a.note)}</div><div class="lesson-code-explain"><h4>逐段说明：读代码时重点看什么</h4><ol>${a.explanations.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>${workedHtml}<div class="lesson-code-note" style="border-top:1px solid #edf1ec;border-bottom:0"><strong>动手方法：</strong>先写预期值，运行或单步执行，再记录实际结果；若结果不同，指出第一个不一致的步骤。</div></section>`;
}

function copyLessonExample(text){
 const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();showToast(ok?'示例代码已复制':'复制受浏览器限制，请手动选择代码');};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('示例代码已复制')).catch(fallback);}else fallback();
}

{
    size_t offset = 0u;
    if (buf == NULL) return PARSE_ERROR;
    if (!find_sync(buf, available, &offset)) return NEED_MORE_OR_RESYNC;
    if (available - offset < HEADER_SIZE) return NEED_MORE;

    size_t payload_len = decode_length(buf + offset);
    if (payload_len > MAX_PAYLOAD) return BAD_LENGTH;
    size_t total = HEADER_SIZE + payload_len + CRC_SIZE;
    if (available - offset < total) return NEED_MORE;
    if (!frame_crc_ok(buf + offset, total)) return BAD_CRC;
    return FRAME_READY;
}`,['分帧的关键是先确认已有字节足够，再读取头字段；不能先读取长度字段再检查缓冲区长度。','`available - offset` 只能在确认 `offset <= available` 后使用；计算 total 前还应确保长度加法不会溢出。','半帧应保留等待后续字节；坏长度/坏 CRC 要进入明确的丢弃或重新同步路径，不能把不完整数据交给业务层。','以上为解析器结构示意；生产实现需要定义消费字节数、连续多帧、超时与同步字节出现在负载内的处理规则。'],noteTool);

default: break;
}
if (retry_count >= MAX_RETRIES) report_device_offline();`,['NACK 通常说明对方没有确认当前地址/数据；超时说明等待条件没有在期限内满足；SDA 持续为低则还要检查线路与器件状态。','三类故障的恢复操作不同，不应一律复位 MCU 或无限重发。','多主系统或器件不允许时，不能擅自打 GPIO 时钟脉冲；按芯片与从设备手册定义总线恢复。'],noteHw);

 if(id==='l-pointer') {q='指针里保存的是什么？解引用会发生什么？';a='指针对象保存的是一个对象的地址；`&value`取得对象地址，`*p`按指针类型访问它指向的对象。指针本身不保存数组长度，也不会延长对象的生命周期。';}
 else if(id==='l-memory') {q='为什么栈、堆、.data 和 .bss 不能混为一谈？';a='它们的用途和生命周期管理方式不同：栈通常承载调用现场，堆由动态分配策略管理，.data 保存有初始值的静态/全局对象并在启动时初始化，.bss 保存需零初始化的静态/全局对象。实际地址与大小看链接脚本和 map 文件。';}
 else if(id==='l-volatile') {q='volatile 能保证中断与主循环之间的并发安全吗？';a='不能。volatile 约束特定访问的编译器优化，但不自动提供原子性、互斥或任务间同步。共享数据还需按场景使用原子操作、短临界区或 RTOS 同步原语，并核对访问是否可被打断。';}
 else if(id==='l-bitops') {q='如何设置、清除和检测第 3 位？';a='先建立掩码 `uint32_t mask = 1u << 3;`；置位用 `value |= mask`，清位用 `value &= ~mask`，检测用 `(value & mask) != 0u`。访问硬件寄存器前仍要确认它是否允许普通读改写。';}
 else if(id==='l-number') {q='为什么同一组 8 位数据可以代表 255，也可以代表 -1？';a='位模式本身只是 8 个 0/1。按 `uint8_t` 解释 `11111111` 是 255；按常见 8 位二进制补码的有符号语义解释则是 -1。要先确认类型、位宽和转换规则，不能只看十六进制数值。';}
 else if(id==='l-endian') {q='0x12345678 在小端和大端机器上的字节顺序是什么？';a='按内存地址从低到高，小端为 `78 56 34 12`，大端为 `12 34 56 78`。字节序描述多字节值的字节排列，不改变 C 表达式中整数的数值；协议解析应按协议指定的顺序显式解码。结构体填充则是另一件事。';}
 else if(id==='l-mmio') {q='为什么访问外设寄存器不总是等同于读写普通 RAM？';a='外设寄存器可能有读清、写 1 清零、FIFO 弹出或只读等副作用，还可能依赖外设时钟、复位和访问宽度。必须查参考手册中的访问属性、复位值与副作用，再选择读写方式。';}
 else if(/pointer|array|buffer|字符串/.test(t.toLowerCase()) || /数组|缓冲区|指针/.test(t)) {q='怎样避免访问数组或缓冲区越界？';a='接口同时传入指针和长度；先检查指针、输出参数与长度，再确认索引满足 `index < len`，最后才读写。测试长度为 0、最后一个合法元素和第一个非法索引。';}
 else if(/启动|复位|向量表|bootloader/i.test(t)) {q='程序为什么可能还没到 main 就停住？';a='`main()` 之前要执行复位入口、运行环境初始化、.data 复制、.bss 清零，以及可能的时钟初始化。先从向量表、初始栈指针、Reset_Handler 和链接布局查起，再确认运行库初始化和 fault 状态。';}
 else if(/链接|map 文件|ELF|目标文件|重定位|工具链|GCC|Makefile|构建/.test(t)) {q='编译成功是否意味着最终固件布局正确？';a='不意味着。链接阶段还要解析符号、应用重定位并按链接脚本放置段。需要检查实际 ELF、map、符号表和内存区域大小，确认 Flash/RAM 边界、向量表和启动代码假设一致。';}
 else if(/汇编|ABI|EABI|栈帧|函数调用/.test(t)) {q='为什么调用方和被调用方必须遵守相同 ABI？';a='ABI 规定参数与返回值位置、寄存器保存责任、栈对齐和对象布局等二进制约定。约定不一致时，即使各自源码编译成功，组合运行也可能读错参数或破坏执行现场。应以目标架构 ABI 文档和反汇编为准。';}

 else if(/中断|EXTI|ISR|NVIC/.test(t)) {q='中断服务程序为什么通常应该短小？';a='ISR 会影响其他中断和任务的响应时间。应快速确认事件、清除正确标志、保存最少必要信息并退出，把协议解析、阻塞等待和复杂业务逻辑交给主循环或任务；共享数据还需正确同步。';}
 else if(/定时器|PWM|输入捕获|时基|溢出/.test(t)) {q='定时器的频率由哪些因素决定？';a='常见向上计数模式下，更新频率近似为 `f_timer / ((PSC + 1) × (ARR + 1))`。必须确认实际定时器输入时钟、计数模式、PSC/ARR 生效条件和更新事件定义，再用示波器或计数输入测量。';}
 else if(/UART|I²C|I2C|SPI|通信|协议|分帧|消息/.test(t)) {q='为什么一次接收回调不一定等于一条完整消息？';a='底层通常交付的是连续字节或一段传输数据，消息边界需要由协议定义。解析器应检查帧头、长度、校验、超时和缓冲区上限，并明确处理半包、粘包、无应答和错误恢复。';}
 else if(/ADC|DMA|采样|缓存一致性/.test(t)) {q='DMA 完成后，CPU 是否就可以无条件读取缓冲区？';a='不一定。要先确认对应缓冲区已完成且所有权已交给 CPU，长度和索引有效；带数据 Cache 的平台还需按芯片规范维护一致性，并检查对齐与覆盖风险。DMA API 的实际时机应以目标驱动实现为准。';}
 else if(/RTOS|任务|调度|优先级|队列|信号量|互斥|临界区|并发/.test(t) || cid==='c-rtos') {q='volatile 变量能否代替队列、互斥锁或信号量？';a='不能。volatile 不负责同步与资源所有权。队列适合传递数据/事件，互斥锁保护共享资源，信号量适合同步事件或资源计数；还要考虑优先级、超时、锁顺序以及 ISR 可用 API。';}
 else if(/状态机|看门狗|复位|故障恢复|可靠性/.test(t)) {q='看门狗应该在什么条件下喂狗？';a='应在系统确认关键任务和必要健康条件满足后喂狗，而不是在无条件循环里反复喂狗。需要定义超时阈值、故障记录、复位原因读取与恢复策略，避免任务死锁时仍持续喂狗。';}
 else if(/测试|覆盖率|静态分析|动态分析|性能|质量/.test(t) || cid==='c-quality-assurance') {q='覆盖率高是否代表程序没有缺陷？';a='不是。覆盖率表明哪些语句或分支被执行，不保证断言验证了正确结果，也不代表所有输入组合都覆盖。应结合需求、边界与错误路径、静态分析、动态检查和目标板回归。';}
 else if(/模块|接口|依赖|错误码|日志|项目布局|可开发性|设计原则/.test(t) || cid==='c-software-design') {q='一个可靠的模块接口至少要说清什么？';a='至少说明输入与长度约束、返回值和错误语义、资源所有权、阻塞/超时行为、调用上下文以及初始化/释放顺序。清晰契约能减少模块之间的隐式假设。';}
 else if(/MMU|MPU|Cache|缓存/.test(t)) {q='地址转换、访问保护和 Cache 分别解决什么问题？';a='MMU 通常负责地址映射/转换；MPU 常用于内存区域访问权限控制；Cache 通过保存数据副本降低访问延迟。它们作用不同，必须确认目标内核实际具备哪些能力以及 DMA 数据一致性规则。';}

const lessonReferenceAnswers = Object.freeze({"l-c-program-structure":"最小链路可分为：预处理（展开头文件/宏）→ 编译成目标文件 .o → 链接成带符号和地址信息的 ELF → objcopy 生成 HEX/BIN。HEX 通常带地址记录，BIN 是原始字节流；烧录地址由工具或烧录配置决定。保存完整命令和产物大小，确认 ELF 与烧录文件来自同一次构建。","l-c-types-width":"使用 sizeof 在目标交叉编译环境里实测，不能只按桌面电脑推断。典型 32 位 Arm EABI 常见结果是 char=1、short=2、int=4、long=4、指针=4、size_t=4 字节，但它们仍应以目标编译器输出为准；sizeof(char) 按定义恒为 1 个 C 字节。","l-c-integer-conversion":"安全窄化函数应在转换前检查范围：当 value <= UINT16_MAX 且 out != NULL 时写入 (uint16_t)value 并返回成功；否则返回失败且不改写输出。边界结果：65535 成功，65536 失败。使用 <stdint.h> 和 UINT16_MAX，不要先截断再检查。","l-c-expressions":"例如 `flags & (1u << 3)` 表示提取 bit 3；`(flags & (1u << 3)) != 0u` 才得到明确的真假值。移位前使用无符号类型，并保证移位量小于左操作数的位宽。复杂逻辑加括号，避免把按位与 `&` 与逻辑与 `&&` 混淆。","l-c-control-flow":"等待发送完成不能无限 while。应设置截止时间或最大轮询次数，在条件满足时返回 OK，超时则返回 TIMEOUT，并记录最后状态。循环体必须有变化/超时来源；如果在 RTOS 任务里等待，还应考虑阻塞等待而不是持续占用 CPU。","l-c-functions":"可以定义 `sensor_status_t sensor_read_id(uint8_t *id, uint32_t timeout_ms)`。契约应写明：id 不能为 NULL、timeout_ms 的单位、成功时才写入 *id、返回值区分超时/总线错误/校验失败，以及函数是否阻塞。调用方依据状态码处理，不读取失败时未定义的输出值。","l-c-macros-headers":"三个例子：include guard 防止头文件重复展开；`BOARD_REV_B` 选择板级引脚映射；`FEATURE_LOGGING` 控制日志功能是否编入。宏应该在统一配置头或构建参数中定义，并记录哪些翻译单元受其影响。像 `ARRAY_LEN(a)` 这样的 sizeof 宏只适用于真实数组，指针参数会得到错误结果。","l-c-scope-storage":"需要跨文件共享且确实属于模块公共接口的对象才考虑在头文件 `extern` 声明、在一个 .c 文件定义。只在当前文件使用的全局对象优先加 `static`；只在函数内临时使用的状态优先做局部变量；跨函数传递的业务状态通常更适合通过参数/结构体显式传递，减少隐式耦合。","l-c-arrays-strings":"小端 16 位读取可写成 `if (buf==NULL || out==NULL || off>len || len-off<2) return false; *out=(uint16_t)buf[off] | ((uint16_t)buf[off+1]<<8); return true;`。用 `off > len` 再检查 `len-off`，比直接判断 `off+2>len` 更不容易受到加法溢出影响。","l-c-aggregates":"用 `sizeof(Header)` 和 `offsetof(Header, member)` 观察目标 ABI 下的布局；例如 `uint8_t type; uint32_t len;` 中间常会插入 padding。线上协议不要直接把字节缓冲区强转成 struct；按字段逐字节解码端序和长度，才能避开 padding、对齐、字节序和编译器布局差异。","l-pointer":"示例：`bool read_u8(const uint8_t *buf,size_t len,size_t i,uint8_t *out){ if(!buf||!out||i>=len) return false; *out=buf[i]; return true; }`。关键顺序是先验证指针和长度，再解引用。调用者还需保证 buf 实际指向至少 len 个有效字节。","l-c-pointer-arithmetic":"数组表达式在多数表达式上下文衰变为指向第一个元素的指针；`array + 3` 的类型是 `uint16_t *`，它与 `&array[3]` 指向同一元素。地址跨度是 `3 * sizeof(uint16_t)` 个 C 字节，而不是简单增加 3 个字节。指针只能在同一个数组对象及其尾后一位范围内做有定义的运算。","l-c-function-pointers":"可定义 `struct SensorOps { bool (*read_id)(uint8_t *); bool (*read_temp)(int32_t *); };`，型号 A/B 分别提供自己的实现，公共业务只调用当前实例的函数指针。初始化时必须确保函数指针非 NULL、签名完全匹配，并明确回调运行上下文、超时和错误返回语义。","l-c-const":"`const uint8_t *p` 表示不能通过 p 修改它指向的数据；`uint8_t * const p` 表示 p 不能改指向，但可通过它写对象；`volatile uint32_t *p` 表示 p 指向的对象访问具有 volatile 限定。限定符修饰的位置很重要；const 和 volatile 都不会自动提供线程安全。","l-bitops":"通用 RAM 数值的实现为：`set = value | mask`，`clear = value & ~mask`，`test = (value & mask) != 0u`。测试包括 mask=0、最高位掩码和 value 全 0/全 1。真正的外设寄存器可能具有 W1C、读清零等副作用，不能不看手册就套用普通读改写。","l-volatile":"volatile 不会把 `count++` 变成原子操作，也不会提供互斥。若 ISR 和主循环同时更新计数，选择能保护整个读改写的短临界区、合适的原子对象，或通过队列/通知交接事件；同时确认目标架构访问宽度的原子性和 ISR API 限制。","l-c-isr-shared-data":"只需“至少通知一次”的按键事件可用事件标志或任务通知（重复事件是否合并要看机制）；每笔 DMA 完成数据都必须处理时，宜用队列、计数器或带所有权的缓冲区，不能用单个布尔标志，因为多个事件可能合并丢失。定义满队列策略并统计丢失数。","l-c-undefined-behavior":"审查清单：检查每次数组访问是否小于长度；每个指针在使用前是否非空且仍指向有效对象；有符号运算是否可能溢出；是否保存/返回局部对象地址；memcpy 区域是否重叠（重叠应用 memmove）。未定义行为的结果不保证稳定，不能以“当前编译器跑起来正常”作为正确性证据。","l-c-stack-frame":"先用 map/反汇编或编译器报告找出最大的局部数组，再沿最深调用路径相加，并把中断嵌套和 RTOS 任务栈单独算入。减小栈占用可用固定大小的模块私有缓冲区或专用内存池，但必须定义唯一所有者/互斥保护；把数组直接改成无保护全局变量可能引入竞态。","l-memory":"在 map 里定位 `.text/.rodata`、`.data`、`.bss` 的地址与大小，并按符号大小查找 RAM 大对象。任务栈和主栈不一定会表现为普通全局符号，需结合链接脚本预留区、RTOS 栈水位、最深调用和 ISR 嵌套估算。静态 RAM 用量不能代替运行时栈峰值。","l-c-heap":"先按峰值吞吐量估算最大在途消息数：至少考虑输入速率 × 最长处理延迟，再加突发余量。实时系统优先考虑编译期静态数组或固定大小块池，容量和耗尽行为更可预测；malloc 灵活但需要定义失败处理，并评估碎片、执行时间和生命周期。所有分配都必须有对应释放或归还路径。","l-c-memory-sections":"典型情况：函数机器码位于 `.text`；只读字符串常在 `.rodata`；有非零初值的全局/static 对象常在 `.data`；零初始化的全局/static 对象常在 `.bss`。具体段名及合并策略由工具链决定；用 `readelf -S`、`nm -S` 和 map 文件核对实际产物。","l-binary-hex":"8 位结果：0x3C = `00111100`，置位 bit 5、4、3、2；0xA5 = `10100101`，置位 bit 7、5、2、0；0x80 = `10000000`，只置位 bit 7。bit 编号通常从最低位 bit 0 开始。","l-number":"0x3C = `00111100` = 60；0xA5 = `10100101` = 165，二者按 8 位无符号解释都是非负数。若解释为 8 位补码有符号数，0xA5 的值则是 -91；位模式相同，数值解释取决于类型。","l-logic-bits":"0xA6 的二进制为 `10100110`，因此 bit 1、bit 2、bit 5 都为 1。清除 bit 5 的掩码是 `~(1u<<5)`，在 8 位范围内可写 0xDF；执行 `0xA6 & 0xDF` 得到 0x86。实际 C 表达式应按变量位宽明确类型。","l-fixed-float":"用 `uint16_t voltage_mV` 保存毫伏，范围 0–3300，1 个整数单位代表 1 mV；转换关系是 `voltage_mV = round(volts * 1000)`，显示时 `volts = voltage_mV / 1000.0`。uint16_t 足够容纳最大 3300。若来源是 ADC，还需区分 ADC 量化步距、参考误差和传感器误差。","l-mcu-mpu":"资源表至少从芯片数据手册/参考手册填写：内核与频率、Flash/SRAM 容量与地址、外设与 DMA 通道、是否有 MPU/MMU 与 Cache、外部存储接口、调试口和启动模式。不能仅凭 MCU/MPU 名称推断资源；记录芯片完整型号、封装和硅版本。","l-cpu-registers":"在断点前后记录 PC、SP 和调用栈：PC 表示当前/下一条执行位置（细节依架构），SP 指向当前栈位置，调用栈显示函数链。Cortex-M 常见 LR 保存返回地址；其他架构的寄存器分工可能不同。以目标架构手册和调试器寄存器视图为准。","l-fetch-decode":"在 `-O0` 下常见更多栈读写、显式分支和调试友好代码；`-O2` 可能常量传播、内联函数、消除死代码、把 if 转为条件指令或完全移除循环。不要假设某个固定指令序列；用相同源文件和架构选项比较 objdump 输出，解释能观察到的差异。","l-debug-breakpoints":"给目标变量设置 `watch state`，继续运行后在首次被写入时检查 `print state`、`bt` 和 PC。使用与固件匹配的 ELF 与调试信息；硬件观察点资源有限，优化可能使局部变量不可观察，DMA/外设写入也未必能由 CPU 数据观察点捕获。","l-address-space":"图中应标出 Flash/代码区、SRAM/数据区、外设寄存器窗口、系统控制区域以及 Bootloader/保留区。具体起止地址必须来自该型号参考手册；链接脚本中的 FLASH/RAM 区域应落在芯片真实容量内，且不可覆盖启动或安全保留区域。","l-memory-types":"频繁变化、需掉电保存的 20 个参数可使用 EEPROM 或 Data Flash；若 MCU 无独立 EEPROM，则用 Flash 日志/双槽版本化方案，并考虑擦写粒度、耐久次数、掉电原子性和 CRC。启动时选择最后一个校验有效版本；避免每次参数变化都反复擦同一扇区。","l-endian":"小端读取公式是 `value = (uint32_t)b[0] | ((uint32_t)b[1]<<8) | ((uint32_t)b[2]<<16) | ((uint32_t)b[3]<<24)`，前提是 len >= 4 且指针有效。长度不足应返回明确错误、不读缓冲区，也不改写输出。移位前转换到足够宽的无符号类型。","l-alignment":"常见 32 位 ABI 下，`{uint8_t,uint32_t,uint16_t}` 常为 12 字节，而按 4/2/1 字节降序排列通常为 8 字节；但确切结果由 ABI、编译器和选项决定。应实测 sizeof/offsetof 并说明填充位置，避免使用强制 packed 结构来直接解码未对齐协议数据。","l-bus-architecture":"典型路径是传感器信号 → 外设/控制器寄存器或 FIFO → 总线仲裁/时钟域转换 → DMA → SRAM → CPU 处理。潜在等待点包括共享总线争用、外设等待状态、DMA burst 抢占以及存储器/总线时钟不同步；具体瓶颈要根据系统架构和测量确认。","l-mmio":"记录目标参考手册给出的寄存器基地址、寄存器偏移、复位值和访问属性。GPIO 的置位/清位应优先使用芯片提供的原子 set/clear 寄存器；若使用读改写，确认不会与 ISR/其他执行上下文竞态，也确认寄存器没有 W1C/读清零等副作用。","l-memory-protection":"建议把代码/只读常量设为只读可执行或只读不可写，普通 RAM 设为可读写并尽可能不可执行，外设区按需读写，栈周边放置保护边界。MPU 区域大小/对齐和属性受内核限制；列出的策略还要测访问权限违规、DMA 绕过 CPU 检查等反例。","l-mmu-cache":"是否有 MMU/MPU/I-Cache/D-Cache 必须查询内核与芯片手册，而不能从 MCU 标签猜。DMA 接收时，在 CPU 读取前按平台规则失效相应缓存行并满足地址/长度对齐；DMA 发送前通常需要确保 CPU 写入对设备可见。具体 clean/invalidate 顺序需遵循目标芯片说明。","l-cache-dma":"发送方向：CPU 写缓冲区 → 按架构要求 clean/同步 → DMA 读取；接收方向：DMA 写 RAM → 完成事件 → 按平台要求 invalidate/同步 → CPU 读取。接收前后究竟何时失效、是否需要 clean，取决于 Cache 设计和驱动规范；同时禁止 CPU 与 DMA 同时拥有同一区域的写权限。","l-fault-exception":"对 Cortex-M 可记录固件构建版本/ID、异常栈中的 PC/LR/SP、xPSR 以及 CFSR/HFSR 等适用状态寄存器，并为记录加 magic、长度和 CRC。字段与寄存器名依内核而异；在异常处理程序里只保存最小可靠数据，重启后用匹配 ELF/map 符号化定位。","l-read-assembly":"编译时启用调试信息并输出汇编/反汇编；if 通常表现为比较与条件跳转，循环常表现为比较、回跳和退出分支，函数调用通常有 call/BL 及返回指令。优化后结构可能改变或被消除，应解释功能等价关系，而非期待固定指令数。","l-asm-register-roles":"先找出参数在哪些寄存器/栈位置、返回值在哪个位置，再观察临时运算寄存器和需要保存的寄存器。若目标是 Arm AAPCS，r0–r3 常用于前几个参数，r0 用于常见标量返回值；这只是特定 ABI 规则，其他架构请查对应文档。","l-asm-branches":"用相同源代码和 CPU 选项生成 -O0/-O2 汇编，给每个比较、条件跳转、回环和退出路径标注源代码位置。优化级别可能把循环改成不同计数方向、展开循环或移除无副作用代码；判断依据应是控制流与结果，而不是汇编外观必须相同。","l-stack-frame-abi":"记录函数入口和返回前 SP 的变化，识别保存寄存器指令和局部变量分配。-O0 常出现较明显栈帧；-O2 可能省略帧指针、内联函数或把局部量放寄存器而不建完整栈帧。最终解释应以实际反汇编和目标 ABI 为准。","l-abi-args-return":"先查目标 ABI 的参数寄存器、返回值位置、调用者/被调用者保存寄存器与栈对齐规则，再在一个有四个参数的函数上单步验证。如果目标是 Arm AAPCS，常见规则为前四个整型参数使用 r0–r3、标量返回值用 r0、r4–r11 由被调用者保存；以具体 ABI 版本为准。","l-abi-eabi":"调用图应表达：调用方把参数放到 ABI 指定的寄存器/栈槽 → 执行 call/BL 保存返回位置 → 被调用者按约定保存必要寄存器并建立栈帧 → 写入约定返回值 → 恢复现场并返回。寄存器编号、栈对齐和异常规则需按目标架构 ABI 文档核对。","l-reset-sources":"常见复位源包括上电/掉电复位、外部 NRST、看门狗、软件复位和低功耗唤醒复位，但具体类别依芯片。启动早期读取并保存复位原因标志，再按手册规定清除；RAM 是否保留、启动地址和外设复位状态不能跨型号推断。","l-vector-table":"Cortex-M 常见向量表首字是初始 MSP，第二项是 Reset_Handler 地址；随后是异常和中断入口。用 map/ELF 定位向量表与 Reset_Handler，确认向量表基址、栈顶位于有效 RAM、复位入口位于可执行区；其他内核格式可能不同。","l-startup":"常见顺序是复位向量 → Reset_Handler → SystemInit/时钟或低级初始化 → .data 复制与 .bss 清零 → C 运行库初始化 → main。具体项目可能交换部分步骤，因此以 startup 文件的实际调用链为准，逐个下断点记录是否到达。","l-data-bss-init":"`.data` 通常有运行地址 VMA（RAM）和加载地址 LMA（Flash），启动时从 LMA 复制到 VMA；`.bss` 则在进入 C 程序前清零。map 文件中应能找到区间起止符号；检查复制/清零循环边界，确保没有越过保留 RAM 或栈区。","l-runtime-init":"真实调用链应直接从 Reset_Handler 逐步跟踪，常见有 SystemInit、数据段初始化、C runtime 初始化、C++ 构造函数列表（若启用）和 main。每步的验证证据可以是断点命中、时钟寄存器值、全局变量初值或 map 中的边界符号；不要假设不同启动库顺序相同。","l-clock-init":"沿芯片时钟树从时钟源到 SYSCLK、总线分频和 UART/TIM 时钟逐层计算。UART 波特率分频公式及 APB 定时器时钟倍频规则由芯片规定；不要直接把 CPU 主频当成外设频率。把实际寄存器配置与目标波特率/计数公式对照，并测引脚波形。","l-linker":"从 map 文件记录各区域中 `.text/.rodata`、`.data/.bss` 的地址和大小，区分运行地址与加载地址。再核查最大静态对象、栈/堆保留量、向量表和 Bootloader 保留区是否重叠；RAM 溢出要按链接脚本与芯片容量定位，而不是盲目扩大区域。","l-elf-hex-bin":"ELF 通常包含段/节信息、符号与调试信息；Intel HEX 含记录地址和校验，BIN 是不带地址元数据的原始字节。用 `readelf`/`objdump` 查看 ELF，用 `objcopy -O ihex` 生成 HEX、`objcopy -O binary` 生成 BIN；BIN 的烧录起点必须由链接/烧录配置明确指定。","l-bootloader":"跳转前至少检查：镜像地址与长度合法、CRC/签名有效、版本策略允许、初始栈顶在有效 RAM、Reset_Handler 位于应用可执行区。随后按内核要求停用/清理中断和外设、设置向量表与 MSP，再跳转；这些动作高度依赖芯片，不能将通用伪代码直接用于产品。","l-startup-debug":"按层排查：确认烧录成功与复位来源 → 读取向量表与初始 SP → 在 Reset_Handler 下断点 → 检查 .data/.bss 区间与链接脚本 → 检查时钟初始化是否等待错误状态 → 查看 C 运行库和 fault 寄存器。每一步记录客观证据，找到第一个未满足的条件。","l-toolchain":"最短闭环为：清理旧产物 → 用记录好的配置进行交叉构建 → 检查 ELF/map 与尺寸 → 转换 HEX/BIN → 下载 → 从串口/LED/调试器验证最小功能 → 保存 commit、工具链版本和日志。构建成功只证明生成了产物，不代表烧录地址、硬件运行和功能都正确。","l-preprocessor-build":"用目标编译器的 `-E -dD source.c` 观察宏展开和条件编译后的源文件，并用 `-H` 或编译依赖查看包含链（具体选项依 GCC 版本）。检查展开后实际调用的函数/常量和分支；宏的定义位置与编译命令中的 `-D` 都可能改变结果。","l-compiler-flags":"记录 CPU/ISA（如 -mcpu/-mthumb）、ABI/FPU、优化级别、调试信息和告警设置。开发调试常用 `-Og -g3 -Wall -Wextra`，发布可能用 -O2；这只是起点，应结合工具链和项目规范选项。确保所有翻译单元使用兼容的 CPU、ABI、宏和浮点选项。","l-makefile":"最小 Makefile 要为每个 `.o` 声明源文件和头文件依赖，例如 `main.o: main.c config.h`、`sensor.o: sensor.c sensor.h config.h`；`app.elf: main.o sensor.o` 才链接。如果修改头文件后未重编依赖它的目标，通常是依赖关系缺失；可用 GCC `-MMD -MP` 自动生成依赖文件。","l-gcc-binutils":"先记录 `arm-none-eabi-gcc --version`，用 `size firmware.elf` 看段摘要，用 `arm-none-eabi-objdump -d` 查看指令、用 `nm -S --size-sort` 排序符号。工具前缀应匹配目标工具链；比较尺寸时固定编译选项，并确认分析的是最新 ELF。","l-object-symbols":"在 .o 文件中，跨文件函数常以未定义符号形式存在并带重定位记录；链接后这些符号被解析到最终地址，重定位被处理。用 `readelf -s -r file.o` 与最终 ELF 的 `nm`/`readelf -s` 对比，选一处符号记录其从 U/未定义到确定地址的变化。","l-linker-map-practice":"在 map 文件中查看内存区域起始和长度，并分别定位 `.text`、`.data`、`.bss` 的起始地址/大小以及最大的静态符号。注意 `.data` 的加载地址可能在 Flash、运行地址在 RAM；把结果与芯片实际容量和链接脚本核对。","l-repeatable-build":"发布清单应包含源码提交 ID、未提交改动状态、工具链/SDK 版本、所有宏与编译参数、链接脚本、完整命令、构建环境和产物 SHA-256。将这些元数据与测试结果绑定。要验证可重复构建，应在干净环境两次构建并比较可比产物，处理时间戳等非确定性因素。","l-gdb-practical":"用 `break` 定位入口、`watch` 观察意外变化、`bt` 看调用栈、`info registers` 看现场。设置观察点前先确保 ELF 符号匹配当前固件；首次异常时保存 PC/LR/SP、变量值和输入条件，再在相同条件下重复。硬件观察点数量和捕获方式依目标而异。","l-debug":"复盘记录要包含版本/构建参数、可重复步骤、预期与实际现象、首次异常 PC/调用栈/关键寄存器、候选根因、能区分候选的最小实验，以及修复后的回归结果。HardFault 要结合目标内核的异常栈和 fault 状态寄存器符号化，不能只凭最后执行的 C 行推断。","l-logic-levels":"表格应逐项抄录 MCU 输出 VOH/VOL 保证值、传感器输入 VIH/VIL 阈值、最大额定输入电压以及工作电源范围。逻辑高低兼容需满足驱动端保证值跨过接收端阈值，同时不违反绝对最大额定值；如果不满足，使用合适电平转换，不能仅因二者都叫 3.3 V 就假设兼容。","l-pullup-open-drain":"I²C 上升时间常近似 `tr ≈ 0.8473 × Rp × Cbus`，因此上限电阻约为 `Rp_max ≈ tr_max/(0.8473 Cbus)`；低电平灌电流给出下限 `Rp_min ≈ (VDD−VOL_max)/IOL_max`。计算要包括所有并联上拉、总线/引脚电容和器件能力，最后用示波器测上升时间并确认 VOL。","l-power-decoupling":"电源树应标出输入电源、稳压器、MCU 每组电源脚旁的去耦电容、模拟/数字电源与大负载。测量稳压器输出、MCU 电源脚附近纹波和复位线，记录负载切换瞬间；电容值/布局按芯片硬件指南与板级设计确定，不能只靠增大电容解决所有复位问题。","l-signal-integrity":"上拉过大/总线电容过大常导致 SDA/SCL 上升沿过慢；上拉过小会增加器件灌电流并使低电平电压升高；电平不兼容可能使输入阈值不满足或损坏器件。先量实际高/低电平、上升时间和波形，再对照电气规格，逐项排查电阻、线长、探头负载和器件阈值。","l-scope-logic-analyzer":"SPI 偶发错误：示波器看 CS/SCLK 的实际幅度、过冲、振铃、边沿与建立/保持时间；逻辑分析仪看 CPOL/CPHA、位序、MOSI/MISO 字节与 CS 事务边界。采集成功和失败两条事务，找到第一个不同的边沿/位，并确认探头接地和采样设置没有改变问题。","l-hardware-debug":"UART 无接收时依次确认：设备供电和共地、MCU 引脚是否真映射为 UART RX、时钟/波特率/帧格式、RX 引脚是否有物理波形、外设状态标志是否置位、IRQ/DMA 是否正常、环形缓冲区是否溢出。每一步都写下测量点和结果，避免同时修改多个设置。","l-gpio-clock-mux":"顺序可按：核对原理图和 AF 表 → 使能 GPIO/UART 时钟 → 预置安全/空闲输出状态（若芯片允许）→ 配置输出类型、上下拉、复用功能 → 配置 UART 波特率与帧格式 → 使能外设并测 TX 波形。实际寄存器顺序以目标芯片手册为准，不能把伪 API 当可直接烧录代码。","l-gpio":"先从原理图确定 LED 的连接方式：若 LED 通过电阻接 VDD、GPIO 下拉灌电流，通常低电平亮；若接 GND 由 GPIO 拉高驱动，通常高电平亮。再设输出模式并测引脚电压/电流，检查驱动能力和引脚复用，不要只根据代码变量名判断 LED 亮灭。","l-gpio-input-debounce":"每 5 ms 采样一次，维护连续相同样本计数；样本与候选状态相同则计数加一，不同则更新候选并重置计数。连续 4 次一致才更新稳定状态，并只在稳定态变化时发事件。测试序列中插入 1–3 次反跳应不触发，连续 4 次稳定值才触发；实际去抖时间取决于首次采样相位。","l-exti-pending-priority":"路径是引脚电平/边沿 → EXTI 线路配置 → pending 标志 → NVIC 使能与优先级 → ISR。ISR 里按外设定义检查/清除挂起标志（很多 W1C 标志需写 1 清除，不能读改写），然后交付事件。若共享多个线路或有优先级嵌套，需定义各自的标志和数据保护。","l-irq":"ISR 只确认来源、按硬件规则清除标志、更新一个可安全交接的事件/数据并尽快退出；主循环/任务读取事件后处理业务。单个标志会合并重复事件；每笔都要保留时用计数器、队列或缓冲区。共享变量要确认原子性，必要时用临界区或 RTOS 通知。","l-isr-deferred-work":"在 ISR 中仅把收到的数据放入有界 ring buffer/队列，并通知解析任务；任务负责分帧、CRC、超时和错误恢复。若队列满，应明确丢弃新数据、丢最旧数据、暂停接收或上报背压，并增加溢出计数；不可静默覆盖仍未处理的数据。","l-timer-clock-math":"需要 `(PSC+1)(ARR+1)=48,000,000/1000=48,000`。例如 PSC=47、ARR=999（48×1000）；也可 PSC=479、ARR=99（480×100）。两组都满足常见向上计数公式，但需确认定时器时钟确为 48 MHz、寄存器位宽容纳这些值以及更新事件配置。","l-timer":"选 PSC=71、ARR=999：计数时钟 `72 MHz/(71+1)=1 MHz`，周期计数为 `999+1=1000`，更新频率为 `1 MHz/1000=1 kHz`，周期 1 ms。前提是 timer clock 确实为 72 MHz 且使用常见向上计数公式。","l-output-compare-capture":"在已知计数频率 f_tick 下捕获相邻同类边沿的计数差 ΔN，则输入周期近似 `T=ΔN/f_tick`、频率 `f=f_tick/ΔN`。处理计数器回绕、输入滤波和噪声；低频需要累计多个周期，高频则需确认捕获寄存器和中断吞吐能力。","l-pwm":"例如 timer clock=48 MHz，PSC=47 后计数 tick=1 MHz；2 kHz 周期需要 500 个计数，因此 ARR=499；25% 高电平对应约 125 个计数，CCR 可取 125（计数/极性规则需核对）。周期应为 0.5 ms，高电平约 0.125 ms，最后用示波器实测。","l-pwm-calibration-jitter":"一种便于计算的示例：timer clock=48 MHz、PSC=0、ARR=2399，则 `48 MHz/(2400)=20 kHz`；25% 占空比对应约 600 个计数。测量周期应约 50 μs，高电平约 12.5 μs。具体 CCR 边界、预装载与中心对齐模式会改变公式，需用目标手册复核。","l-timer-dma-encoder":"10 kHz 触发间隔为 100 μs；每半区 32 个样本时，DMA 写满一半约 3.2 ms。半传输时处理前 32 项，全传输时处理后 32 项；CPU 必须在对应半区被 DMA 再次覆盖前处理完成。若每个触发扫描多通道，要按每次触发产生的总采样项重新估算带宽和时间。","l-uart-frame":"8N1 每字符包含 1 起始位、8 数据位、0 校验位、1 停止位，总计 10 位；115200 baud 下约 `10/115200 ≈ 86.8 μs`。设置不匹配常见表现是乱码、帧错误/溢出或完全收不到数据；时钟误差、线电平和采样配置也需考虑。","l-uart":"一种帧格式是同步字 2 字节 + 长度 2 字节 + 命令 1 字节 + 序号 1 字节 + 负载 N 字节 + CRC 2 字节。先校验长度不超过缓冲上限，再等完整帧并验证 CRC；要定义噪声后重新找同步字、超时以及未知命令的行为。字段宽度和端序应在双方协议中固定。","l-uart-ring-buffer":"若 ring 有 N 个槽且采用“空一格区分满/空”，空条件为 head==tail，满条件为 `(head+1)%N==tail`，可用容量是 N−1。生产者写数据后再发布 head，消费者读完再更新 tail；满时拒绝新字节并记录 overflow，不能覆盖未读数据。","l-i2c-transactions":"典型两字节读取顺序：START → 从地址+W → ACK → 寄存器地址 → ACK → repeated START → 从地址+R → ACK → 数据 1（主机 ACK）→ 数据 2（主机 NACK）→ STOP。7 位地址与 R/W 位的编码依控制器 API 而异；以芯片/传感器时序图和逻辑分析仪结果核对。","l-i2c-spi":"比较时记录：引脚数量/共享方式、有效速率、地址和片选方式、全双工能力、总线电容、设备数量、功耗与故障恢复。I²C 两线且支持寻址和 ACK，适合多器件低/中速共享；SPI 通常更快且全双工，但多需额外 CS、主从模式和布线。最终依目标传感器数据手册的必需时序选型。","l-spi-modes":"模式组合为：Mode 0 CPOL=0/CPHA=0；Mode 1 CPOL=0/CPHA=1；Mode 2 CPOL=1/CPHA=0；Mode 3 CPOL=1/CPHA=1。CPOL 定义 SCLK 空闲电平，CPHA 决定在第一个还是第二个有效边沿采样；具体应按从设备时序图确认，再用逻辑分析仪验证。","l-i2c-recovery":"NACK 应记录地址/寄存器/阶段并按限制次数重试或报告设备离线；超时应停止本次事务并释放驱动状态。若 SDA 持续为低，先确认总线确实卡死，再按芯片/器件允许的 bus-clear 流程切换 SCL 脉冲、生成 STOP 或复位控制器；多主总线不可擅自发恢复脉冲。","l-protocol-framing-recovery":"帧头后立即验证长度不超过最大帧长，再等待指定字节数并校验 CRC。短帧在超时后丢弃并回到找帧头状态；超长帧拒绝且不写越界；CRC 错误计数并重新同步；拼接帧需用长度边界连续解析，避免把一次接收回调当成一帧。","l-adc-analog-front-end":"12 位 ADC 的理想量化步距约为 `3.3 V / 4096 = 0.0008057 V ≈ 0.806 mV`。采样电容需要在采样时间内通过信号源阻抗充到足够接近输入电压；源阻抗高时要增加 acquisition time 或用缓冲放大器。量化步距不等于整体精度。","l-adc":"理想 12 位步距近似 `Vref/2^12 = 3.3/4096 ≈ 0.806 mV`。如果把码值 0–4095 映射到显示端点 0–3.3 V，常见换算会用 4095 作分母；二者描述的问题不同。实际总误差还包括参考电压、偏移/增益、非线性、噪声和采样时间。","l-adc-trigger-timing":"4 个通道每通道 1 kHz，理想最低转换吞吐量为 4,000 conversions/s；若每 1 ms 启动一次扫描，则每次触发应在下一个触发前完成全部 4 个通道。确认各通道采样时间+转换周期之和、最大 ADC 时钟、输入阻抗、扫描顺序和 DMA 带宽。","l-dma":"循环缓冲区可分两半：HT（half-transfer）到达时第一半已完成、DMA 通常在写第二半；TC（transfer-complete）到达时第二半已完成、DMA 将回绕。CPU 只处理已完成且未被 DMA 占用的半区，并要在下一次覆盖前处理完；还需处理 cache、对齐与溢出计数。","l-dma-mode-completion":"普通模式完成后 DMA 停止，适合有明确结束点的有限传输；循环模式适合连续采样，但必须持续处理完成事件；半缓冲处理可降低延迟但要求消费速度足够快。选择取决于数据是否连续、CPU 最坏处理时间和缓冲可用时长，不能仅按平均速度判断。","l-dma-buffer-ownership":"两半缓冲各自处于 DMA 写入、CPU 可读/处理、已处理等待 DMA 重新使用等状态。若每半区 N 个样本、每秒采样 Fs 次，单半区覆盖时间为 `N/Fs`；例如 N=32、Fs=10 kHz 时为 3.2 ms，CPU 必须在此时限内处理完。","l-task":"任务表给出周期/截止期限、优先级、WCET 或最长执行时间、输入输出、阻塞调用和栈预算。可以先将采样/控制放在满足截止期所需的优先级，通信次之、日志尽量低优先级，但最终必须基于最坏响应时间分析和测量调整，而不是把某一种排序当作固定规则。","l-task-priority-latency":"根据截止期限、周期和执行时间分配优先级，再计算高优先级任务被更高优先级工作与临界区阻塞后的响应时间。标注 UART 锁、Flash 写入等最长阻塞点；如果控制回路截止期是 5 ms，就必须验证其最坏响应小于 5 ms 并留有中断/抖动余量。","l-task-context":"常见任务状态包括 Ready、Running、Blocked（某些 RTOS 还区分 Suspended）。每个任务的栈大小应按最深调用、局部大对象、调用库与异常策略估算，再用栈高水位/溢出钩子验证；异常/中断使用独立栈的架构也要把它纳入预算。","l-sync":"单一 UART 由专用通信任务拥有，其他任务把消息送入队列，通常更容易统一帧顺序与超时；多任务直接共享并用 mutex 保护可行，但要处理锁等待、优先级继承和同步协议。若需要异步发送，API 还必须明确缓冲区在完成通知之前由谁持有。","l-priority-inversion":"时间线是：L 获取 mutex；H 运行并尝试同一 mutex 后阻塞；M 就绪并抢占 L，使 H 间接等待 M。降低风险可用优先级继承/优先级天花板协议、缩短持锁时间、避免持锁执行阻塞 I/O，并把共享资源集中到专用任务。","l-queue-ownership":"短消息可按值复制入队，发送返回后源对象可离开作用域；大帧可从固定池获取缓冲区并传指针，但成功入队后生产者不能再改写，消费者处理完归还。若入队失败，仍由生产者归还。不能把局部栈变量指针交给异步消费者。","l-rtos-memory":"定义 16 块固定长度内存池的状态，例如 FREE/IN_USE，分配成功减少空闲块，归还时必须恰好释放一次。空池策略可选超时等待、返回资源不足、丢弃低优先级消息或限流，必须可观察并有计数；避免在 ISR 中调用不可用的阻塞分配 API。","l-rtos-device":"init 建立时钟/引脚/中断与内部状态；read/write 执行有边界的 I/O；control 查询或设定模式/配置；close 停止中断/DMA、唤醒等待者并释放资源。每个函数应返回参数错误、超时、设备错误、忙/未初始化等明确状态，并规定并发、阻塞和重入语义。","l-rtos-timers":"启动定时器时记录请求 ID/状态；成功收到传感器响应时取消超时；到期回调只发出超时事件，不在回调里执行长阻塞恢复；任务据此记录错误并开始限次恢复。要防止旧的超时回调作用于新的请求，可用 generation/token 校验请求代次。","l-rtos-timeouts":"执行后延时 100 ms 的节拍是“执行耗时 + 100 ms”，若代码耗 3 ms，周期约 103 ms；按绝对节拍延时则目标时刻固定为 t0、t0+100、t0+200 ms。周期性任务通常用 absolute-delay API（例如 RTOS 的 delay-until 类 API）减少累积漂移，并正确处理 tick 回绕。","l-critical-section-isr":"单核 ISR 与主循环共享的短计数更新可用保存/恢复中断状态的短临界区；适合目标原子类型的计数可用 C 原子；要保留每笔事件/数据时优先用队列或通知配合缓冲区。临界区不适合多核/DMA 互斥，也不能在其中阻塞；ISR 只能调用 RTOS 指定的 FromISR 类 API（若有）。","l-fsm":"示例转移：INIT 在初始化成功后到 IDLE；IDLE 收到采样事件到 SAMPLE；SAMPLE 得到正常温度回 IDLE、超阈值到 ALARM、传感器/校验失败到 FAULT；ALARM 在温度低于带滞回的清除阈值后回 IDLE。每条转移要定义动作、错误记录和非法事件策略。","l-fsm-transition-tests":"测试表应至少覆盖 DISCONNECTED+CONNECT→CONNECTING、CONNECTING+OK→ONLINE、CONNECTING+TIMEOUT→FAULT、ONLINE+CLOSE→DISCONNECTED；再测试 DISCONNECTED+OK 等非法组合不发生意外副作用。每个测试断言新状态、动作调用次数和状态不变量，而不只检查函数返回。","l-error-recovery-strategy":"NACK：记录寄存器/地址，有限重试后标离线；超时：停止本次事务，必要时执行受控总线恢复；CRC 错误：拒绝该样本、计数并按协议重试；连续离线：进入降级/FAULT、停止无效控制输出并周期探测恢复。重试次数、退避与安全态需按产品风险明确。","l-watchdog":"发布清单可含：可重复构建/版本号、接口契约与错误路径、栈/堆/Flash/RAM 预算、静态分析和单元测试、硬件在环与时序测量、功耗/温升、异常恢复/看门狗、升级回滚、复位原因/崩溃记录和已知限制。看门狗应由健康监测决定喂狗，不应在无条件循环里喂。","l-reset-cause-brownout":"最早启动时读取并保存芯片复位状态寄存器（上电、外部复位、看门狗、软件复位/棕断等可用项），附时间/固件版本/上次崩溃摘要写入备份寄存器或保留 RAM，并加 magic/CRC。确认数据被持久化后再按手册清标志，避免过早清除导致证据丢失。","l-crash-record":"最小结构包含 magic、格式版本、固件构建 ID、PC/LR/SP、适用的 fault 状态寄存器和 checksum。复位后先校验 magic/版本/CRC，再用匹配的 ELF/map 符号化 PC 与调用路径；记录区要放在复位保留区域且避免故障处理程序内复杂 Flash 写入。","l-design-principles":"审查时每个函数应只有清楚职责、命名体现单位/所有权、参数和错误返回明确、所有资源路径成对释放，并能用最少日志上下文复现故障。把重复的硬件细节收敛到驱动接口；不要为了“抽象”制造没有稳定职责的层。","l-module-contract":"异步发送契约必须写明 buf 非空和 len 上限、函数是否立即复制数据、发送完成如何通知、超时/队列满/设备忙如何返回，以及回调所在上下文。若不复制，调用方必须让缓冲区一直有效到完成回调；不能只写“发送数据”而不说明所有权。","l-module-management":"初始化按依赖自底向上：时钟/板级支持 → GPIO/定时器等硬件驱动 → 传感器/协议服务 → 应用；终止化一般反向：停应用请求 → 停服务 → 关闭驱动 → 释放板级资源。每一步失败都只回滚已成功初始化的前序步骤。","l-dependency-graph":"推荐依赖方向：应用 → 服务/协议抽象 → 驱动接口 → 板级/芯片实现。若底层驱动包含并调用上层业务函数，就形成反向依赖；把业务回调变成由上层注册的接口，或抽到稳定的公共接口层，避免双向依赖和循环构建。","l-resource-lifecycle":"若 SPI 初始化第 3 步失败，按成功完成的步骤逆序清理第 2 步和第 1 步资源；每个资源状态应记录是否成功申请，避免释放未初始化对象。错误返回保留最初失败原因，清理失败另行记录，不能覆盖最主要故障。","l-project-layout":"可采用 `app/`、`services/`、`drivers/`、`board/`、`platform/`、`tests/`、`docs/` 目录。依赖向下指向较稳定/较底层接口；应用不应到处直接写芯片寄存器，板型和芯片差异集中在 board/platform，测试替身放 tests。按实际项目规模调整，不必保留空目录。","l-developability":"先定义接口如 `bool sensor_read_temp(int32_t *milli_c)`，用 FakeSensor 分别返回正常值、超时和非法码值，再验证上层报警逻辑在阈值上下的行为。假设备要能控制返回值和故障模式；真实硬件驱动由同一接口实现，业务逻辑不应依赖具体寄存器。","l-config-management":"按层分开：编译期宏控制功能裁剪；板级表确定引脚、时钟和外设实例；运行时参数存用户可调采样间隔/阈值。加载运行时值后做范围和组合校验，非法时拒绝或回退到安全默认值，并记录最终配置版本。不同板型必须在编译/启动时明确选中，不能靠未定义宏的隐式默认。","l-error-management":"四类错误可定义为参数错误、NACK/设备无响应、总线超时、CRC 校验失败。日志至少包括设备地址、寄存器、操作阶段、返回码、尝试次数、状态/时间戳和固件版本；恢复分别采用拒绝参数、有限重试/离线、总线恢复或丢弃坏帧，不能对所有错误无限重试。","l-design-checklist":"不超过十项的清单可包括：参数/长度校验、错误返回语义、并发/ISR 合法性、缓冲区所有权、超时策略、资源逆序释放、边界测试、静态分析、构建警告清零、日志与版本信息。适合自动化的至少有格式/告警检查、静态分析、单元测试与覆盖率门槛。","l-unit-test":"五个测试的期望分别是：有效帧被接受并解析字段正确；长度不足被拒绝且不越界；CRC 错误返回校验错误；未知命令返回明确错误码；超长长度在复制前被拒绝。每个测试要断言状态和副作用，不能以“函数没有崩溃”作为唯一标准。","l-test-doubles":"FakeSensor 可持有一个预设结果和状态：正常时返回 2500（例如 25.00°C，以接口单位为准），故障模式分别返回 TIMEOUT 和 INVALID_CODE。上层测试应断言正常数据不报警、温度越限报警、超时进入故障处理、非法码值不被当作有效温度。Stub 提供固定响应，Mock 还检查交互，Fake 实现可控的简化行为。","l-coverage-static":"两个独立条件 A、B 的组合可用 TT、TF、FT、FF 四个场景（如果代码短路求值，仍要注意 B 在 A=false 时可能不执行）。为每种组合写预期返回值断言。语句/分支覆盖说明路径执行情况，不证明输出正确，也不一定等于条件组合覆盖。","l-static-analysis-workflow":"告警模板至少记录：规则 ID/工具版本、文件行号和数据路径、潜在后果与风险等级、可复现证据、是否真实缺陷、修复提交或抑制理由、回归测试与审查者。抑制必须有范围和原因，并可复查；不能仅以“误报”作为无证据的结论。","l-dynamic-analysis":"准备固定输入和版本，先用故意错误的 `buf[index]`（例如 buf 长度为 4、index=4）复现越界，再改为先检查 `index < len`。主机端可用 AddressSanitizer 检查越界；修复后重复同一用例并增加 index=0、index=len−1、index=len 的测试。","l-hil-integration-test":"GPIO 测试：输出 1 kHz 设定波形，在指定引脚测量频率/占空比并与需求容差比较；UART 回环测试：发送固定字节序列，测 RX/TX 连接点并比对回收数据、长度和超时。容差、测试点和超时值应来自产品需求/硬件规格，自动记录失败波形与板号。","l-performance-analysis":"建立相同输入、优化参数和硬件条件下的基线，测量多次周期数/执行时间、最大观测延迟、栈高水位和 RAM/Flash 大小。若任务周期 1 ms，可将执行预算设为产品截止期的一部分并为中断/调度留余量；具体限值应由系统预算定义，不能把平均值代替最坏情况。","l-ci-regression":"流水线可按提交/格式与静态分析 → 主机单元测试 → 交叉编译与 ELF/map/尺寸检查 → 固件产物与哈希归档 → 可用时进行硬件在环测试 → 发布审批/版本签名。任何阶段失败都应阻止发布；归档工具链、配置和测试报告以便同一提交可追溯复现。"});

function buildLessonExerciseAnswer(course, lesson){
 const id=lesson.id, cid=course.id;
 if (lessonReferenceAnswers[id]) return lessonReferenceAnswers[id];
 if(id==='l-pointer') return '参考实现：`bool read_at(const uint8_t *buf, size_t len, size_t i, uint8_t *out) { if (buf == NULL || out == NULL || i >= len) return false; *out = buf[i]; return true; }`。检查顺序是先验证指针和长度，再访问 `buf[i]`。调用方还必须确保 `buf` 实际指向至少 len 字节的有效对象。';
 if(id==='l-memory') return '先打开 map 文件，分别记录 `.text/.rodata`、`.data`、`.bss` 的地址和大小；从 ELF 符号大小排序找到大对象。栈预算应额外分析最深调用链、局部大数组和中断嵌套，不能仅凭 `.bss` 估算。';
 if(id==='l-volatile') return '仅加 volatile 不能保证复合读改写原子。若主循环只读取 ISR 单向更新的数据，可能还要检查该类型访问是否原子；若双方都修改，使用短临界区、原子操作或合适同步原语，并确认不会从高优先级 ISR 调用不允许的阻塞 API。';
 if(id==='l-bitops') return '`set_bits(v,m) = v | m`；`clear_bits(v,m) = v & ~m`；`test_bits(v,m) = (v & m) != 0`。测试可包括 v=0、v 全 1、m=0、最高有效位掩码；对特殊语义寄存器不可直接照搬这些 RAM 运算。';
 if(id==='l-number') return '8 位二进制：0x3C = `00111100`，无符号值为 60；0xA5 = `10100101`，无符号值为 165。对 8 位补码有符号数，0xA5 表示 -91（反码加一可验证：0x5B=91），但 C 类型转换与目标实现仍须遵循所用类型的规则。';
 if(id==='l-endian') return '小端解码可组合为 `b[0] | (b[1] << 8) | (b[2] << 16) | (b[3] << 24)`，并在移位前把每字节转换到 `uint32_t`。传入长度必须至少为 4。结构体 padding 需要用 `sizeof`/`offsetof` 在目标编译器上实测，而不能根据一台电脑的布局硬编码。';
 if(id==='l-startup') return '参考顺序：复位入口/向量表 → Reset_Handler → 初始化 `.data` → 清零 `.bss` → 运行库/芯片时钟初始化（按启动文件实际顺序）→ `main()`。在调试器里设置这些断点并逐步确认第一处未到达的位置。';
 if(id==='l-linker') return '从 map 文件记录每个内存区域的起始地址、长度和已用字节；核对 `.text/.rodata` 是否在 Flash，`.data/.bss` 是否在 RAM，并确认栈、堆、向量表与 Bootloader 保留区不重叠。最终结论以真实链接配置、ELF 和芯片容量为准。';
 if(id==='l-timer') return '一个常见解法是 PSC=71、ARR=999：计数 tick 为 72 MHz/(71+1)=1 MHz，1000 个 tick 是 1 ms，即 1 kHz 更新。前提是定时器输入时钟确实为 72 MHz，且目标定时器使用 PSC+1、ARR+1 的常见向上计数规则。';
 if(id==='l-pwm') return '先算周期 `T=1/f`，再用 `Ton=D×T`。例如 1 kHz、25% 占空比时，周期为 1 ms、高电平时间为 0.25 ms。比较寄存器具体应写多少取决于计数范围、输出极性和芯片计数模式，最后需测实际波形。';
 if(id==='l-gpio') return '先核对原理图中 LED 的接法（接 VDD 还是接 GND），再确认引脚复用、GPIO 时钟、输出类型和驱动电流限制。若低电平点亮，软件写 LOW 可能代表点亮；最终用引脚电压验证，不能假设所有板子都高电平点亮。';
 if(id==='l-irq') return '主循环/任务应通过明确的事件变量、队列或 RTOS 通知接收 ISR 交付的信息。ISR 快速确认并清除正确中断标志；共享多字段数据要定义一致性保护。中断标志的清除规则以该外设参考手册为准。';
 if(id==='l-uart') return '排查顺序可按：核对两端波特率/数据位/校验/停止位 → 确认 TX/RX 接线与共地 → 测 RX 引脚是否有正确波形 → 检查外设时钟与 RX 标志/中断/DMA → 验证环形缓冲区、分帧和超时。注意一次 DMA 半满/完成回调仍可能只代表字节片段。';
 if(id==='l-i2c') return '若 SDA/SCL 一直为高，先确认供电和上拉；若上升沿过慢，检查上拉电阻、总线电容和速率；若有 START 但 NACK，检查 7 位地址、读写方向、设备供电和时序；若总线被拉低，按目标器件的 bus recovery 规则处理，勿盲目切换 GPIO。';
 if(id==='l-spi') return '依次核对 CPOL/CPHA 模式、位序、时钟频率、片选极性与传输长度，然后观察 CS/SCLK/MOSI/MISO。逻辑分析仪解码值错误时，先检查采样边沿和位序，而不是立刻归因于业务协议。';
 if(id==='l-adc') return '先依据 ADC 位数和参考电压建立理想换算，再核对采样时间、输入源阻抗、参考电压误差和校准。一次原始值不等于准确电压；用已知输入点测多个值，分析偏移、增益与噪声。';
 if(id==='l-dma') return '为每个缓冲区定义 `DMA_OWNED → COMPLETE/READY → CPU_PROCESSING → FREE_TO_DMA` 状态；只有 DMA 已结束且所有权已交给 CPU 才处理。检查缓冲区索引、完成事件、覆盖计数、对齐以及目标平台所需的 Cache 维护。';
 if(id==='l-unit-test') return '五类测试的期望：有效帧被接受；长度不足被拒绝且不越界；校验错误被拒绝；未知命令返回明确错误；超长帧在写入缓冲区前就被限制/拒绝。每条测试都要断言结果，而不是仅检查函数有没有崩溃。';
 if(id==='l-coverage-static') return '对两个条件 `A` 和 `B` 至少按 `TT、TF、FT、FF` 设计组合（若有短路求值，还应确认 B 在 A=false 时未必执行）。每个用例写明输出断言。覆盖率工具说明执行了哪里，断言才检查结果是否正确。';
 if(id==='l-mmu-cache') return '查处理器/芯片配置确认 MMU、MPU、I-Cache 和 D-Cache 是否存在。DMA 接收缓存时，通常要在 CPU 使用数据前按平台要求处理缓存失效、对齐与内存属性；发送方向通常需要确保设备能看到 CPU 最新数据。具体操作和顺序不能跨平台照搬。';
 if(id==='l-bootloader') return '检查清单应至少包含：镜像地址/长度合法、完整性或签名验证通过、向量表地址正确、初始栈顶在有效 RAM、复位入口在允许的可执行区、Bootloader 中断与外设现场已按芯片规则处理、失败时可恢复。具体跳转由目标内核的启动规范决定。';
 if(cid==='c-timer') return '先确认目标定时器输入时钟，再根据所用模式写出计数 tick、周期和比较值的公式。选择一组能整除目标频率的 PSC/ARR，最后用示波器测频率、占空比与抖动。';
 if(cid==='c-protocol') return '给出正常事务的一条预期波形/字节序列，并至少定义 NACK、超时、错误校验和长度越界的结果。验证时把数据手册参数、逻辑分析仪解码和驱动返回状态三者对应起来。';
 if(cid==='c-dma') return '画出缓冲区所有权状态，明确 DMA 何时开始/完成、CPU 何时可读、处理何时完成及何时归还缓冲区；再加上缓冲区满、来不及处理和缓存一致性的验证。';

 if(cid==='c-software-design') return '给每个接口标明参数与长度、返回值、错误传播、调用上下文、阻塞/超时、资源所有者和清理责任；然后用调用图检查依赖方向，并用失败测试验证错误处理。';
 if(cid==='c-debug') return '保存工具链版本和完整构建命令；首先定位失败发生在预处理、编译、链接、下载还是运行阶段，再针对该阶段检查产物、符号、地址或运行现场。修复后按原配置重现并回归。';
 return `参考解法：先把“${lesson.exercise||lesson.title}”改写成可判定的输入和预期结果；按照本课的步骤拆分实现，补充一个正常输入、一个边界输入和一个失败场景。${lesson.summary} 最终通过代码运行、计算、工具输出或目标板测量中的一种方式验证，并写出为什么该结果符合预期。`;
