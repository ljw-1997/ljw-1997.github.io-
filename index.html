.record-detail-top{display:flex;gap:15px;align-items:center;margin-bottom:22px}

.record-detail-heading{min-width:0;flex:1}
.record-detail-heading h3{font-size:20px;line-height:1.5;letter-spacing:-.35px;margin:0 0 8px;overflow-wrap:anywhere}
.record-detail-heading p{font-size:12px;color:#87948a;margin:0;line-height:1.7}
.record-detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.record-detail-meta span{display:inline-flex;align-items:center;gap:6px;background:#f3f6f2;border:1px solid #e8eee7;border-radius:9px;padding:7px 10px;font-size:11px;color:#64756a}
.record-detail-section{border:1px solid #e8eee7;border-radius:14px;padding:15px 16px;margin-bottom:12px;background:#fff}
.record-detail-section h3{font-size:12px;margin:0 0 9px;color:#526b58}

/* Contextual in-section teaching diagrams: the lesson uses several small, meaningful figures instead of one opening diagram followed by uninterrupted prose. */

/* Teaching redesign: fewer, topic-specific figures; visible answers and worked examples. */
.lesson-objectives{margin:14px 0 19px;padding:14px 16px;border:1px solid #e2e9df;border-radius:13px;background:#fbfcfa}
.lesson-objectives h3{font-size:12px;margin:0 0 9px;color:#3b5841}
.lesson-objectives ol{margin:0;padding-left:20px;display:grid;gap:5px;color:#68786c;font-size:11px;line-height:1.75}
.lesson-qa-list{display:grid;gap:10px;margin:10px 0 2px}
.lesson-qa-item{border:1px solid #e6ebe4;border-radius:11px;background:#fff;padding:12px 13px}
.lesson-qa-q{font-size:12px;font-weight:800;color:#344d39;margin-bottom:6px}
.lesson-qa-a{font-size:11px;color:#657568;line-height:1.85;white-space:normal}
.lesson-qa-a strong{color:#4b7252}
.lesson-step-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 2px}
.lesson-step-card{border:1px solid #e5ebe3;background:#fff;border-radius:10px;padding:11px;display:flex;gap:9px;align-items:flex-start}
.lesson-step-num{flex:none;width:23px;height:23px;border-radius:7px;background:#e8f1e6;color:#4d7554;display:grid;place-items:center;font-size:10px;font-weight:800}
.lesson-step-card strong{display:block;font-size:11px;color:#3d5442;margin-bottom:4px}
.lesson-step-card span{display:block;font-size:10px;color:#7c897f;line-height:1.7}
.lesson-worked-case{border:1px solid #e2eae0;border-radius:12px;margin:14px 0 0;padding:13px 14px;background:#f8fbf7}
.lesson-worked-case h4{font-size:12px;margin:0 0 9px;color:#3c5c42}
.lesson-worked-case p{font-size:11px;color:#637467;line-height:1.8;margin:5px 0}
.lesson-worked-case .case-answer{padding:9px 11px;border-left:3px solid #8fb391;background:#fff;border-radius:0 8px 8px 0;margin-top:8px}
.lesson-answer-details{margin-top:9px;border-top:1px solid #e7ede5;padding-top:9px}
.lesson-answer-details summary{cursor:pointer;color:#4b7252;font-size:11px;font-weight:800}
.lesson-answer-details p{margin:8px 0 0;font-size:11px;line-height:1.8;color:#627366;white-space:pre-wrap}
.lesson-diagnostic-list{display:grid;gap:7px;margin-top:8px}
.lesson-diagnostic-item{display:grid;grid-template-columns:75px 1fr;gap:9px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e9eee7;font-size:10px;line-height:1.7}
.lesson-diagnostic-item strong{color:#55765a}
.lesson-diagnostic-item span{color:#718075}

.lesson-inline-figure{margin:13px 0 17px;padding:13px 14px 12px;border:1px solid #e0e9df;border-radius:13px;background:linear-gradient(150deg,#f8fbf7 0%,#fff 74%);}
.lesson-inline-figure-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.lesson-inline-figure-kicker{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;border-radius:6px;background:#e8f1e6;color:#55785c;font-size:9px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.lesson-inline-figure-title{font-size:12px;font-weight:800;color:#354e39;line-height:1.5;}
.lesson-figure-flow{display:flex;align-items:stretch;gap:5px;}
.lesson-figure-node{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:10px 9px;border:1px solid #e1e9e0;border-radius:9px;background:#fff;position:relative;}
.lesson-figure-node:nth-of-type(1){background:#f0f6ef}.lesson-figure-node:nth-of-type(2){background:#f0f4f9}.lesson-figure-node:nth-of-type(3){background:#fff7eb}.lesson-figure-node:nth-of-type(4){background:#f9efec}
.lesson-figure-node strong{font-size:10px;line-height:1.45;color:#3d5542;overflow-wrap:anywhere;}
.lesson-figure-node small{font-size:9px;line-height:1.6;color:#7a887e;overflow-wrap:anywhere;}
.lesson-figure-arrow{align-self:center;flex:none;color:#8da590;font-size:16px;font-weight:700;padding:0 1px;}
.lesson-figure-explain{display:flex;align-items:flex-start;gap:6px;margin-top:9px;padding:8px 10px;border-radius:8px;background:#f1f6ef;color:#66766a;font-size:10px;line-height:1.75;}
.lesson-figure-explain strong{color:#4a6c50;white-space:nowrap;}
.lesson-figure-memory{display:grid;grid-template-columns:56px 1fr;gap:5px 9px;align-items:center;}
.lesson-figure-memory .mem-address{font-size:9px;color:#9aa59a;text-align:right;font-family:ui-monospace,monospace;}
.lesson-figure-memory .mem-block{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 9px;border-radius:7px;border:1px solid #e0e8df;background:#fff;}
.lesson-figure-memory .mem-block span{font-size:10px;font-weight:800;color:#405744;min-width:70px;}
.lesson-figure-memory .mem-block small{font-size:9px;color:#7c897f;line-height:1.5;}
.lesson-figure-bits{display:flex;align-items:stretch;gap:5px;justify-content:center;flex-wrap:wrap;}
.lesson-figure-bit{min-width:33px;flex:1;max-width:72px;border:1px solid #dce7db;border-radius:7px;background:#fff;text-align:center;overflow:hidden;}
.lesson-figure-bit strong{display:block;padding:7px 2px;font-size:16px;color:#456b4b;font-family:ui-monospace,monospace;}
.lesson-figure-bit.on strong{background:#4e7655;color:#fff;}
.lesson-figure-bit small{display:block;padding:4px 2px;background:#f5f8f3;color:#879488;font-size:8px;}
.lesson-figure-layers{display:grid;gap:5px;max-width:590px;margin:0 auto;}
.lesson-figure-layer{padding:8px 11px;border:1px solid #dfe8dd;border-radius:7px;background:#fff;text-align:center;}
.lesson-figure-layer strong{display:block;font-size:10px;color:#405a45;}
.lesson-figure-layer small{font-size:9px;color:#839087;line-height:1.55;}
.lesson-figure-down{text-align:center;color:#90a892;font-size:13px;line-height:1.1;}
.lesson-figure-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.lesson-figure-compare article{padding:10px;border-radius:9px;border:1px solid #e0e8df;background:#fff;min-width:0;}
.lesson-figure-compare article:first-child{border-top:3px solid #86a987;}.lesson-figure-compare article:last-child{border-top:3px solid #d9ae70;}
.lesson-figure-compare strong{display:block;margin-bottom:5px;font-size:10px;color:#405744;}
.lesson-figure-compare p{margin:0;font-size:9px;line-height:1.7;color:#7b887e;}
.lesson-figure-timeline{overflow-x:auto;}
.lesson-figure-timeline svg{display:block;width:100%;min-width:320px;height:auto;}
.lesson-figure-checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.lesson-figure-check{padding:9px 7px;border:1px solid #e1e8e0;border-radius:8px;background:#fff;min-width:0;}
.lesson-figure-check b{display:flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:#eaf2e8;color:#4f7555;font-size:10px;margin-bottom:6px;}

function icon(name, size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[name]||SVG.spark}</svg>`}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function uid(prefix='item'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function dateOffset(offset){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayStr(){return dateOffset(0)}
function displayDate(value, opts={month:'short',day:'numeric'}){if(!value)return '未设置';const d=new Date(value+'T12:00:00');return isNaN(d)?value:new Intl.DateTimeFormat('zh-CN',opts).format(d)}
function stampDate(value){const d=new Date(value+'T12:00:00');return isNaN(d)?{day:'--',month:'--'}:{day:d.getDate(),month:`${d.getMonth()+1}月`}}
function lesson(id,title,minutes,summary,sections,takeaways,exercise,reference){return {id,title,minutes,summary,sections,takeaways,exercise,reference:reference||''}}
const curriculum = [
 {id:'c-programming',title:'嵌入式 C 语言与内存',category:'基础知识',level:'基础',duration:'4.5 小时',color:'mint',icon:'code',code:'C / MEMORY',desc:'从指针、内存布局到 volatile 与位操作，建立编写可靠固件所需的 C 语言基础。',lessons:[
  lesson('l-pointer','指针、数组与地址',25,'指针保存的是对象的地址。理解地址、类型与内存访问之间的关系，是读懂驱动代码的第一步。',[{heading:'1. 指针表达什么？',body:['在 C 语言中，指针对象保存一个地址；指针类型告诉编译器应如何解释该地址处的数据。`uint32_t *p` 表示 p 指向一个 uint32_t 对象，而不是“一个整数值”。'],code:'uint32_t value = 42;\nuint32_t *p = &value;\n*p = 100;   // 修改 value\n// value == 100'},{heading:'2. 数组与指针并不完全相同',body:['数组是一段连续存储的对象；在多数表达式中，数组名会转换为指向首元素的指针，但数组本身不是指针变量。函数参数中的 `int a[]` 会调整为 `int *a`，所以需要额外传入长度。'],bullets:['始终确认指针指向的对象是否仍然存活。','访问数组前确认索引范围，越界属于未定义行为。','不要返回局部自动变量的地址。']},{heading:'3. 在驱动开发中怎么用？',body:['寄存器访问、DMA 缓冲区、协议解析都涉及指针。读写前要确认地址来源、对齐要求、对象生命周期和访问权限。']}],['明确 &x、*p 与数组下标的含义。','知道指针类型影响解引用时的读写宽度。','访问缓冲区时始终同时管理长度。'],'写一个安全的缓冲区读取函数：传入指针和长度，读取前判断索引是否越界。'),
  lesson('l-memory','栈、堆、静态区与生命周期',30,'内存布局决定变量何时存在、在哪里分配，以及故障出现时该从哪里排查。',[{heading:'1. 常见内存区域',body:['典型 MCU 程序映像包含 Flash 中的代码与只读常量，以及 RAM 中的已初始化数据、零初始化数据、堆和栈。链接脚本决定这些段的地址和大小。'],bullets:['text/rodata：通常位于非易失存储器。','data：初始值保存在映像中，启动时复制到 RAM。','bss：启动时清零。','stack：保存调用现场、局部变量和中断现场；具体使用受 ABI 与编译器影响。','heap：动态分配使用的区域，许多固件项目会限制甚至禁用它。']},{heading:'2. 为什么局部变量容易出问题？',body:['自动局部变量一般在函数活动期间有效。函数返回后，其生命周期结束；保存其地址并在外部使用，会形成悬空指针。大的局部数组还可能消耗大量栈空间。'],code:'int *bad(void) {\n    int local = 7;\n    return &local; // 错误：返回局部对象地址\n}'},{heading:'3. 如何检查内存占用？',body:['查看链接器 map 文件和 ELF 段信息，确认静态 RAM、Flash 的使用量；估算最深调用链、递归、局部数组和中断嵌套对栈的影响。']}],['区分变量的存储期与内存区域。','能解释 .data 复制和 .bss 清零。','知道 map 文件是内存占用分析的入口。'],'查看一个固件工程生成的 map 文件，找出最大几个 RAM 对象，并估算任务栈和主栈占用。'),
  lesson('l-volatile','volatile、const 与寄存器访问',28,'volatile 用于表达对对象的访问具有可观察性，常见于硬件寄存器与异步更新的状态，但它不是通用的线程同步工具。',[{heading:'1. volatile 的作用',body:['编译器通常可以合并、移除或重排普通内存访问。对 volatile 对象的访问必须按语言规则保留为可观察操作，避免轮询寄存器时读操作被简单地优化掉。'],code:'#define STATUS_REG (*(volatile uint32_t *)0x40000000u)\nwhile ((STATUS_REG & (1u << 0)) == 0u) {\n    // 等待硬件状态位置位\n}'},{heading:'2. 它不能保证什么？',body:['volatile 不保证操作原子性，不会自动建立线程间 happens-before 关系，也不能替代 RTOS 的互斥锁、原子操作或正确的临界区设计。复合读改写操作仍可能发生竞态。']},{heading:'3. const 与 volatile 可以组合',body:['const 限制通过该限定类型的表达式修改对象；volatile 描述访问语义。只读状态寄存器可根据芯片头文件定义为 `volatile const`，但具体定义必须遵从芯片厂商提供的寄存器描述。'],bullets:['硬件寄存器定义优先使用官方 CMSIS / 芯片头文件。','跨主循环与 ISR 共享数据时，分析原子性和同步要求。','不要把“加了 volatile”当作线程安全证明。']}],['volatile 常用于 MMIO 和异步变化的状态。','volatile 不等于 atomic，也不等于 mutex。','寄存器地址、位定义和访问宽度应以芯片手册为准。'],'用自己的话解释：主循环和中断共同修改一个计数器时，为什么仅添加 volatile 未必足够？'),
  lesson('l-bitops','位运算与寄存器字段',22,'位运算是配置外设、检查状态位和构建协议字段的基础。先理解掩码，再进行读改写。',[{heading:'1. 常见操作',body:['左移常用于构造位掩码，按位与用于检查位，按位或用于置位，按位取反再与可用于清位。参与运算的整数宽度与有符号性会影响结果。'],code:'uint32_t mask = (1u << 3);\nreg |= mask;       // 置位 bit 3\nreg &= ~mask;      // 清除 bit 3\nif ((reg & mask) != 0u) {\n    // bit 3 已置位\n}'},{heading:'2. 常见陷阱',body:['确保移位次数小于操作数位宽；使用无符号常量避免不必要的符号扩展；清位前确认掩码宽度；对于有读清、副作用或写 1 清零语义的寄存器，不要照搬普通 RAM 的读改写模式。']}],['用括号明确位运算优先级。','使用合适宽度的无符号类型。','寄存器的写入语义必须查参考手册。'],'实现 set_bits(value, mask)、clear_bits(value, mask) 与 test_bits(value, mask)，为边界情况写出测试。')
 ]},
 {id:'c-computer',title:'计算机底层与数字基础',category:'底层原理',level:'基础',duration:'3.5 小时',color:'blue',icon:'layers',code:'BITS / CPU',desc:'理解二进制、补码、字节序、内存映射与总线，为读懂芯片手册建立底层模型。',lessons:[
  lesson('l-number','二进制、补码与有符号数',20,'CPU 以位和字节存储数据；同一组 bit 如何解释，取决于数据类型和编码约定。',[{heading:'1. 数值表示',body:['一个 n 位无符号整数的范围为 0 到 2ⁿ−1。常见 n 位二进制补码有符号整数范围为 −2⁽ⁿ⁻¹⁾ 到 2⁽ⁿ⁻¹⁾−1。C 标准对整数类型范围有具体规则，实际项目应关注目标 ABI。']},{heading:'2. 补码的直觉',body:['在固定宽度下，负数通常使用二进制补码表示。例如 8 位数中，−1 的位模式是 11111111。最高位经常作为有符号数的符号位理解，但位模式本身没有天然的正负含义。'],code:'8-bit unsigned:  1111 1111 = 255\n8-bit two\'s complement: 1111 1111 = -1'},{heading:'3. 为什么固件工程师需要知道？',body:['协议字段、寄存器位、ADC 原始值、符号扩展和类型转换经常出错。调试时将变量以十六进制和二进制查看，通常比只看十进制更容易发现位错误。']}],['能够计算 n 位无符号数范围。','能用十六进制表达位掩码。','区分位模式与数值解释。'],'将 0x3C、0xA5 转成二进制，并分别解释为 8 位无符号值。'),
  lesson('l-endian','字节序、对齐与结构体填充',22,'多字节数值写入内存时有字节序；CPU 访问对象还可能受到对齐和 ABI 规则影响。',[{heading:'1. 大端与小端',body:['以 0x12345678 为例，按地址从低到高排列时，小端存储为 78 56 34 12，大端存储为 12 34 56 78。字节序影响多字节对象的内存表示，不改变整数在 C 表达式中的数学含义。']},{heading:'2. 对齐和填充',body:['处理器或总线可能对某些宽度的非对齐访问有额外代价，甚至不支持。结构体成员之间也可能插入 padding，以满足每个成员的对齐要求。不要假设 `sizeof(struct)` 等于成员大小之和。']},{heading:'3. 协议处理建议',body:['网络协议应明确字段字节序和长度；不要直接把外部字节缓冲区强制转换成结构体指针，除非布局、对齐、别名和字节序都得到保证。更稳妥的做法是按字段解码。']}],['能手算一个 32 位整数的大小端字节序。','知道结构体 padding 会影响 sizeof。','协议解析应显式处理字节序与边界。'],'为 4 字节缓冲区写一个小端解码函数，并检查输入长度不足时的行为。'),
  lesson('l-mmio','内存映射 I/O 与总线',28,'MCU 将外设控制寄存器映射到地址空间，CPU 通过 load/store 指令与外设交互。',[{heading:'1. Memory-mapped I/O',body:['在许多 MCU 中，Flash、SRAM 和外设寄存器处于统一地址空间的不同区域。读取一个外设寄存器看似普通内存读取，但该地址可能具有硬件副作用，例如清除状态或弹出 FIFO 数据。']},{heading:'2. 一次寄存器访问',body:['CPU 发起访问后，互连/总线将请求送到目标从设备。访问宽度、权限、时钟门控和外设复位状态都可能影响行为。具体总线名称和时序由芯片架构决定。'],bullets:['先打开外设总线时钟，再访问该外设寄存器。','参考寄存器描述中的 reset value、access type 和 side effect。','写 1 清零（W1C）寄存器需要专门处理。']},{heading:'3. 查手册的顺序',body:['从芯片数据手册确认资源和引脚复用；从参考手册查寄存器、时钟和中断；从勘误表确认已知硅缺陷；再使用厂商 SDK/CMSIS 头文件完成实现。']}],['能够解释 MMIO 与普通 RAM 的不同。','知道外设访问依赖时钟、复位、地址和访问语义。','芯片手册是驱动实现的事实依据。'],'选择一个 GPIO 寄存器，记录基地址、偏移、复位值，以及置位/清位的正确方式。')
 ]},
 {id:'c-mcu',title:'MCU 启动流程与系统架构',category:'底层原理',level:'进阶',duration:'3 小时',color:'slate',icon:'cpu',code:'RESET / STARTUP',desc:'从复位向量、启动文件到链接脚本，追踪固件从上电到 main() 的完整路径。',lessons:[
  lesson('l-startup','从复位到 main()',26,'main() 不是芯片上电后执行的第一条 C 语句；在它之前还有硬件复位与启动代码。',[{heading:'1. 典型启动序列',body:['上电或复位后，CPU 从架构定义的复位入口开始执行。以 Cortex-M 为例，向量表开头包含初始主栈指针和 Reset_Handler 地址；之后启动代码建立 C 运行环境。']},{heading:'2. C 运行时初始化',body:['启动代码通常会把初始化数据从 Flash 复制到 RAM，把 .bss 清零，可能配置 FPU 或时钟，并调用运行库初始化函数，最后进入 main()。具体顺序取决于启动文件、工具链和芯片供应商。'],code:'Reset / Vector table\n        ↓\nReset_Handler\n        ↓\n.data copy + .bss zero\n        ↓\nSystemInit / runtime init\n        ↓\nmain()'},{heading:'3. 常见启动故障',body:['若程序停在启动阶段，检查向量表地址、栈顶地址、链接脚本、时钟配置、初始化函数和硬件 fault 状态。调试时可在 Reset_Handler、SystemInit 与 main() 入口设置断点。']}],['能画出复位到 main 的路径。','知道 .data 复制和 .bss 清零发生在 main 前。','启动文件与链接脚本共同决定内存布局。'],'在调试器中从复位开始单步，记录 Reset_Handler、SystemInit 和 main 的执行顺序。'),
  lesson('l-linker','链接脚本、段与 map 文件',24,'编译器产生目标文件后，链接器根据内存布局将代码和数据安排到 Flash、RAM 等区域。',[{heading:'1. 编译和链接的分工',body:['预处理展开头文件和宏，编译器生成汇编或目标文件，汇编器生成机器码目标文件，链接器解析符号并安排段地址，最终形成 ELF、HEX 或 BIN 等产物。']},{heading:'2. 链接脚本做什么？',body:['链接脚本描述内存区域以及 section 到区域的映射。栈、堆、向量表和初始化数据位置不应凭感觉修改；更改前必须确认芯片的实际存储器地址、启动文件期望和 bootloader 布局。']},{heading:'3. 阅读 map 文件',body:['map 文件展示符号地址、段大小和内存分配情况，可用来排查 Flash/RAM 超限、意外拉入的大型库或静态对象。搭配 ELF 符号表工具能定位占空间较大的函数和对象。']}],['能描述预处理、编译、汇编、链接的顺序。','知道 map 文件可用于内存占用分析。','改变链接布局前应核实芯片和启动约束。'],'找出一个 ELF 生成的 map 文件，记录 .text、.data、.bss 的大小与地址。')
 ]},
 {id:'c-gpio',title:'GPIO、EXTI 与中断',category:'外设驱动',level:'基础',duration:'3 小时',color:'mint',icon:'zap',code:'GPIO / IRQ',desc:'掌握引脚模式、上下拉、复用功能和中断服务程序的设计要点。',lessons:[
  lesson('l-gpio','GPIO 输入输出与引脚复用',25,'GPIO 驱动不仅是拉高或拉低一个引脚，还涉及电气属性、复用功能和外部电路。',[{heading:'1. 配置前先确认',body:['查看目标引脚是否支持需要的功能、板级原理图是否将其连接到其他器件，以及电压域是否匹配。配置模式一般包括输入、推挽输出、开漏输出和复用功能等。']},{heading:'2. 上下拉与输出类型',body:['上拉/下拉为输入提供默认电平，但数值应结合外部电路和功耗要求选择。开漏输出只能主动拉低，释放后由上拉电阻获得高电平，常见于 I²C 等共享线路。推挽输出则可主动驱动高低电平。']},{heading:'3. GPIO 排障清单',body:['检查 GPIO 时钟、模式寄存器、输出数据寄存器、引脚复用、板级连线和负载。用示波器或逻辑分析仪验证真实引脚波形，不要只依赖软件返回值。']}],['能解释推挽和开漏输出的区别。','知道复用功能可能与 GPIO 配置互斥。','软件配置和板级电气设计必须同时检查。'],'配置一个 LED 输出，并明确 LED 是高电平点亮还是低电平点亮。'),
  lesson('l-irq','中断、NVIC 与 ISR 设计',28,'中断让 CPU 在事件发生时转入处理程序。可靠的 ISR 应短小、可预测，并与主循环/任务正确交互。',[{heading:'1. 中断处理路径',body:['外设检测到事件后设置状态位并发出中断请求；中断控制器按照使能、挂起状态和优先级等规则决定是否进入 CPU 异常处理流程。具体寄存器由 MCU 架构和芯片实现定义。']},{heading:'2. ISR 里要做什么？',body:['尽快确认事件并清除正确的中断标志，保存必要的最少信息，然后退出。耗时的协议解析、日志格式化、阻塞等待和动态内存操作通常应放到主循环或任务中。'],bullets:['注意优先级分组和抢占关系。','共享数据时考虑原子性、临界区和编译器可见性。','检查中断标志是否读清、写 1 清零或需要特定顺序。']},{heading:'3. 中断与轮询',body:['轮询实现简单但响应时间受循环路径影响；中断可减少无效检查并改善响应，但带来共享状态、重入和时序分析的复杂度。高频事件还要考虑 CPU 占用与中断风暴。']}],['中断标志清除方式必须查手册。','ISR 保持短小，长任务延后处理。','分析中断优先级和共享变量竞态。'],'画出“外设中断—ISR 置标志—主循环消费”的数据流，并标注共享变量的保护方式。')
 ]},
 {id:'c-timer',title:'定时器、输入捕获与 PWM',category:'外设驱动',level:'进阶',duration:'3 小时',color:'amber',icon:'clock',code:'TIMER / PWM',desc:'使用硬件定时器实现周期调度、脉冲计数、PWM 输出与输入测量。',lessons:[
  lesson('l-timer','定时器时基与溢出',23,'通用定时器通常由计数器、预分频器和自动重装载寄存器共同决定计数频率与周期。',[{heading:'1. 基本计算',body:['若定时器输入时钟为 f_timer，预分频系数为 PSC+1，计数周期由 ARR+1 个计数 tick 组成，则常见向上计数配置下的更新频率近似为 f_update = f_timer / ((PSC+1)(ARR+1))。实际定时器时钟可能与 CPU 时钟不同，需要查时钟树。']},{heading:'2. 更新事件',body:['计数器达到边界后可能产生更新事件和中断/DMA 请求。是否立即更新预分频器、自动重装载值何时生效、计数器是否重复计数，取决于具体外设配置。']},{heading:'3. 不要用忙等代替硬件时基',body:['用软件循环计数延时容易受到编译优化、Flash wait-state 和中断的影响；需要稳定时序时，应尽可能使用硬件定时器并验证误差。']}],['能从定时器时钟、PSC 和 ARR 估算周期。','确认芯片时钟树中定时器时钟来源。','硬件事件通常比软件忙等更可控。'],'若定时器时钟为 72 MHz，目标更新频率为 1 kHz，选择一组合理的 PSC 和 ARR，并写出计算过程。'),
  lesson('l-pwm','PWM、占空比与输入捕获',25,'PWM 通过周期性改变输出的高电平比例控制平均功率；输入捕获则记录边沿时刻来测量信号。',[{heading:'1. PWM 参数',body:['若周期为 T、有效高电平时间为 Ton，占空比 D = Ton/T。计数器频率与周期共同决定 PWM 频率，比较寄存器控制输出翻转点。占空比 0% 与 100% 的边界行为要参考具体芯片。']},{heading:'2. 输入捕获与测量',body:['输入捕获在选定边沿将计数器值锁存到捕获寄存器。相邻两次捕获值的差可计算周期；当计数器回绕时需要用足够宽度的无符号运算处理溢出。']},{heading:'3. 常见问题',body:['频率不对时优先查计时器内核时钟、PSC、ARR 和输出通道映射。占空比不对时再核对比较值、极性、预装载及引脚复用。']}],['会计算 PWM 频率和占空比。','输入捕获可用于周期、频率和脉宽测量。','示波器验证实际波形与理论值。'],'输出 2 kHz、25% 占空比 PWM；列出时钟、分频、周期和比较值的计算。')
 ]},
 {id:'c-protocol',title:'UART、I²C 与 SPI 通信',category:'外设驱动',level:'进阶',duration:'4 小时',color:'blue',icon:'radio',code:'UART / I²C / SPI',desc:'从时序、电气特性与协议边界入手，掌握三种常见串行外设总线的调试方法。',lessons:[
  lesson('l-uart','UART：波特率、帧格式与缓冲',25,'UART 常用于日志、控制台和点对点通信。它通常不提供应用层消息边界，需要固件自行设计帧协议。',[{heading:'1. 帧格式',body:['常见 UART 配置由波特率、数据位、校验位和停止位组成，例如 115200、8 数据位、无校验、1 停止位（8N1）。收发双方必须匹配配置，且要考虑时钟偏差。']},{heading:'2. 收发策略',body:['轮询适合早期验证；中断适合中低速异步收发；DMA 常用于连续或大块数据。使用环形缓冲区时，明确生产者/消费者、满/空判定、溢出处理和并发访问规则。'],code:'// 环形缓冲区设计关注点\nhead: 写入位置\ntail: 读取位置\nnext(head) == tail  // 一种常见的“满”判定\nhead == tail        // 一种常见的“空”判定'},{heading:'3. 消息分帧',body:['可使用长度字段、分隔符、固定长度或同步字+长度+校验等方法分帧。解析器应处理半包、粘包、非法长度、超时与校验失败，不能假设一次接收回调对应一条完整消息。']}],['串口波特率不是应用层消息边界。','环形缓冲区需要明确满、空和溢出策略。','接收解析器必须容忍分段和异常数据。'],'设计一个含同步字、长度、命令、载荷和 CRC 的串口帧格式。'),
  lesson('l-i2c-spi','I²C 与 SPI：如何选总线',27,'I²C 通过地址与共享两线连接多个器件；SPI 使用时钟、数据线和片选信号，常见于高速外设。',[{heading:'1. I²C 的特征',body:['典型 I²C 使用 SCL、SDA 两根线，线路为开漏并通过上拉电阻释放到高电平。总线上有地址、起始/停止条件、ACK/NACK；拉伸时钟、多主机与速率等级需要根据器件和系统支持情况确认。']},{heading:'2. SPI 的特征',body:['典型 SPI 使用 SCK、MOSI、MISO 与 CS/NSS。CPOL 和 CPHA 决定时钟空闲电平和采样相位。SPI 没有统一的设备地址和标准化应用层协议，片选时序由器件数据手册决定。']},{heading:'3. 选型和排障',body:['I²C 节省引脚并支持地址化器件，但吞吐率、总线电容和上拉设计需留意；SPI 通常吞吐更高，但需要更多信号线。排障时先确认接线、电压、电平、时序模式，再用逻辑分析仪核对波形。']}],['能画出 I²C 与 SPI 的信号线。','SPI 需要确认 CPOL/CPHA。','I²C 上拉与总线电容影响上升沿。'],'阅读一个传感器数据手册，提取地址、寄存器读取时序、最大速率和异常处理要求。')
 ]},
 {id:'c-dma',title:'ADC、DMA 与数据采集',category:'外设驱动',level:'进阶',duration:'3.5 小时',color:'rose',icon:'signal',code:'ADC / DMA',desc:'理解 ADC 采样、参考电压、DMA 缓冲区和连续数据流的配合方式。',lessons:[
  lesson('l-adc','ADC 采样、量化与误差',24,'ADC 将模拟电压量化为数字码值，分辨率、参考电压、采样时间和输入源阻抗共同影响结果。',[{heading:'1. 理想量化关系',body:['对 n 位理想 ADC，其输出码约为 0 到 2ⁿ−1。若输入范围为 0 到 Vref，则量化步长可粗略理解为 Vref/2ⁿ；实际器件的码值边界和传输特性应以数据手册定义为准。']},{heading:'2. 采样时间与源阻抗',body:['采样保持电容需要时间通过输入路径充电。若信号源阻抗较高或采样窗口太短，输入可能来不及稳定，造成读数偏差。多通道扫描时还要关注通道切换后的建立时间。']},{heading:'3. 从原始码到物理量',body:['标定偏移、增益和参考电压后，才可以将码值换算为电压或工程量。对噪声敏感的应用可考虑合理的模拟滤波、过采样或数字滤波，但需要评估响应延迟。']}],['分清 ADC 分辨率与有效精度。','采样时间与输入源阻抗有关。','物理量换算需考虑参考电压与校准。'],'若 12 位 ADC 的参考电压为 3.3 V，计算理想量化步长，并说明它为什么不等于总测量误差。'),
  lesson('l-dma','DMA、双缓冲与数据一致性',25,'DMA 可以在外设和内存之间搬运数据，减少 CPU 逐字节处理的负担，但缓冲区所有权必须清晰。',[{heading:'1. 典型数据流',body:['例如定时器触发 ADC 转换，DMA 将结果写入 RAM，半传输或传输完成事件通知软件处理数据块。触发源、DMA 请求映射、数据宽度和缓冲区地址必须匹配芯片实现。']},{heading:'2. 缓冲区所有权',body:['DMA 正在写的区域不应被软件当成稳定快照读取。双缓冲、半缓冲或队列化块处理可以分离生产者与消费者。若芯片带数据缓存，需要按架构要求处理 cache clean/invalidate；无缓存的 Cortex-M0/M3 等系统则没有相同的 D-cache 一致性问题。']},{heading:'3. 错误处理',body:['处理 DMA 错误、过载、丢块和超时；不要在高频中断中执行大量运算。需要连续采集时，设计明确的缓冲区状态机和最坏处理时间预算。']}],['DMA 只负责传输，不自动保证应用数据一致。','明确 DMA 与 CPU 对缓冲区的所有权。','带数据缓存的处理器要检查 cache coherency。'],'画出 ADC + DMA 循环采样的状态图，并标记 half-transfer / transfer-complete 事件后各自可访问的缓冲区。')
 ]},
 {id:'c-rtos',title:'RTOS 任务与并发',category:'实时系统',level:'进阶',duration:'4.5 小时',color:'amber',icon:'layers',code:'TASK / SYNC',desc:'建立任务划分、调度、队列、信号量和互斥锁的基本模型。',lessons:[
  lesson('l-task','任务、调度与实时性',26,'RTOS 将程序组织为多个独立任务，但任务数量并不会自动带来实时性。',[{heading:'1. 任务与调度',body:['任务通常具有自己的栈、状态和优先级。调度器根据就绪状态、优先级和调度策略选择运行任务。抢占式调度中，高优先级就绪任务可能打断低优先级任务；时间片、tickless 和调度锁等行为依内核配置而定。']},{heading:'2. 实时性看什么？',body:['实时系统关注事件发生到结果完成的截止期限，而不仅是平均速度。需要分析中断延迟、任务执行时间、阻塞时间、优先级反转、最坏执行路径与共享资源争用。']},{heading:'3. 任务拆分建议',body:['按职责划分采集、控制、通信和日志任务；通过队列传递数据和事件；为每个任务定义周期、优先级、栈大小、阻塞点和故障恢复策略。避免多个任务无规则地共享大量可变全局状态。']}],['任务是调度单元，不是硬件线程的简单复制。','明确周期、截止期、阻塞点与优先级。','关注最坏时延，而不是只看平均运行速度。'],'为传感器采集、控制算法、通信发送、日志输出设计任务表：周期、优先级、输入输出和阻塞操作。'),
  lesson('l-sync','队列、信号量、互斥锁与优先级反转',30,'不同同步原语表达不同意图：数据传递、事件通知和共享资源保护不应混为一谈。',[{heading:'1. 选择合适的原语',body:['队列传递带数据的消息；二值信号量常用于任务间事件通知；计数信号量可表示可用资源数量；互斥锁用于保护共享资源，并可能支持优先级继承。具体语义依 RTOS 实现而定。']},{heading:'2. 优先级反转',body:['低优先级任务持有锁，高优先级任务等待锁，中优先级任务反复抢占低优先级任务，可能导致高优先级任务被长时间阻塞。优先级继承等协议可缓解部分情况，但不能替代合理的临界区设计。']},{heading:'3. 设计规则',body:['限制持锁时间，不要在持锁期间执行不可控阻塞；规定锁顺序以降低死锁风险；禁止在 ISR 中调用不能从中断上下文使用的 API；按所使用 RTOS 文档确认 FromISR 等专用接口。']}],['队列适合传数据；互斥锁适合保护共享资源。','同步 API 是否可在 ISR 调用必须查具体 RTOS 文档。','长临界区和无序加锁容易引起实时性问题。'],'分析两个任务共享 UART 的方案：由一个通信任务独占 UART，还是多个任务用 mutex 保护？比较可维护性与延迟。')
 ]},
 {id:'c-debug',title:'编译、调试与工程工具链',category:'工程实践',level:'进阶',duration:'3 小时',color:'slate',icon:'terminal',code:'BUILD / DEBUG',desc:'掌握从构建日志、map 文件到断点、调用栈和故障寄存器的工程化排障方法。',lessons:[
  lesson('l-toolchain','从源代码到固件映像',22,'一个可重复的固件构建流程，依赖编译器、链接器、启动文件、芯片头文件、链接脚本和构建配置。',[{heading:'1. 构建产物',body:['ELF 通常包含符号和调试信息，便于调试器定位源代码；HEX/BIN 常用于烧录。不同工具链提供不同转换与查看命令，先确认目标芯片和 ABI。']},{heading:'2. 警告与优化级别',body:['尽量处理编译警告，尤其是类型转换、未使用结果、格式字符串和未初始化变量等。优化级别会改变指令布局、变量可见性与时序，所以调试构建与发布构建表现可能不同。']},{heading:'3. 可复现构建',body:['将依赖版本、编译宏、编译器版本、链接脚本和烧录步骤记录在仓库中。避免依赖某台电脑上的隐藏配置；CI 可进一步帮助验证每次提交都能构建。']}],['知道 ELF、HEX 和 BIN 的不同用途。','编译成功不代表链接布局和运行时行为正确。','将工具链版本与关键构建配置纳入版本管理。'],'为一个固件仓库写出从 clean build 到烧录、运行验证的最短步骤清单。'),
  lesson('l-debug','断点、调用栈与 HardFault',28,'嵌入式调试需要结合软件状态与硬件状态；只在出错行附近猜测通常效率很低。',[{heading:'1. 由外向内缩小范围',body:['先复现并记录输入条件；检查供电、时钟、复位和连线；再看寄存器、关键变量、调用栈和异常状态。使用逻辑分析仪或示波器验证外部时序。']},{heading:'2. 观察 HardFault',body:['Cortex-M 的 fault 排查通常需要查看堆栈中的异常现场、PC/LR/xPSR，以及适用核心提供的 CFSR、HFSR、BFAR、MMFAR 等状态寄存器。具体寄存器可用性和解释依内核配置而定。']},{heading:'3. 让问题可复现',body:['保存固件版本、编译选项、复现步骤、输入数据和日志。对于偶发问题，记录重启原因、异常计数、堆栈高水位、队列溢出次数和关键状态转移，常比大量打印更有效。']}],['调试现场应同时包含 PC、调用栈与外设状态。','HardFault 状态寄存器需按内核手册解读。','可复现步骤和固件版本是排障证据。'],'模拟一次故障复盘：写出复现步骤、最小观察点、可能根因、验证实验和修复后的回归测试。')
 ]},
 {id:'c-reliable',title:'固件可靠性与小型项目',category:'工程实践',level:'进阶',duration:'4 小时',color:'rose',icon:'wrench',code:'WATCHDOG / FSM',desc:'将状态机、错误处理、看门狗和测试方法组合成可维护的固件设计。',lessons:[
  lesson('l-fsm','状态机与错误处理',24,'显式状态机可以将复杂控制逻辑整理为可测试的状态、事件和转移，而不是散落在多层 if-else 中。',[{heading:'1. 状态机模型',body:['定义有限的状态集合、触发事件、守卫条件和状态动作。对于每种状态与事件组合，明确合法转移及非法输入的处理方式。'],code:'IDLE --start--> RUNNING\nRUNNING --done--> COMPLETE\nRUNNING --fault--> ERROR\nERROR --reset--> IDLE'},{heading:'2. 错误码和恢复',body:['为错误定义稳定的含义、来源和恢复策略。临时通信错误可以有限重试，关键配置错误可能进入安全状态；避免忽略返回值或在错误路径中无限阻塞。']},{heading:'3. 可测试性',body:['把状态转移规则与硬件驱动尽量分离，让状态机在主机环境下也能测试。通过模拟事件和故障输入验证所有重要路径。']}],['状态机显式记录合法状态转移。','为错误定义检测、传播、记录与恢复策略。','把业务逻辑和硬件访问适度解耦有利测试。'],'为一个温度监控节点设计状态机：INIT、IDLE、SAMPLE、ALARM、FAULT，并标注触发事件。'),
  lesson('l-watchdog','看门狗、日志与交付检查',24,'可靠性来自可观测性和故障恢复设计，不是简单打开看门狗选项。',[{heading:'1. 看门狗的正确喂法',body:['看门狗应反映关键任务是否仍然推进，而不只是某个循环还在执行。多任务系统可由健康监测模块综合各任务心跳、进度和截止期后决定是否喂狗。具体窗口和复位原因由芯片看门狗实现决定。']},{heading:'2. 日志设计',body:['日志应包含时间戳或事件顺序、模块、错误码和必要上下文。中断中通常避免格式化长字符串；高频日志需限流，避免日志本身改变实时行为或掩盖故障。']},{heading:'3. 最小交付清单',body:['确认干净构建、静态检查、关键驱动测试、故障路径测试、版本标识、升级/回滚策略、看门狗行为和现场诊断方式。把验证结果和已知限制写入 README。']}],['喂狗策略应检查系统健康而非单一循环活性。','日志要平衡诊断价值、内存和实时开销。','每个版本应有可追溯的构建标识与验证记录。'],'为一个小型固件项目写一份发布前 checklist，至少包括构建、接口、异常、功耗、恢复和版本信息。')
 ]}
];

const cc=curriculum.find(c=>c.id==='c-computer');
cc.lessons.push(lesson('l-cpu-registers','寄存器、指令与 CPU 执行现场',22,'CPU 不直接执行 C 语言，而是按机器指令读写寄存器和内存。理解关键寄存器，有助于读懂调用栈、中断现场和调试器窗口。',[{heading:'1. 把寄存器理解成 CPU 的工作台',body:['通用寄存器暂存数据和中间结果。不同处理器还会提供 PC（程序计数器）、SP（栈指针）、LR（链接寄存器）或状态寄存器；名称和细节随架构而变化。','PC 与下一条指令的位置有关，SP 标记当前栈顶附近的位置，LR 在部分架构中保存返回所需的信息。不要把某种 CPU 的寄存器规则直接套到另一种架构。']},{heading:'2. 中断与调试现场',body:['发生异常或中断时，硬件和启动代码会按架构规则保存、恢复部分执行现场。调试器可同时查看源代码、寄存器、内存与反汇编。若程序跑飞，PC、SP 和调用栈往往是重要证据。']},{heading:'3. 断点与数据观察点',body:['软件断点用于停在指定执行位置；数据观察点用于发现某个地址何时被读写。观察点数量和支持的访问类型受芯片与调试器限制。']}],['能解释 PC 与 SP 的大致作用。','知道寄存器和异常现场与处理器架构有关。','执行路径问题看断点，变量何时变化可看观察点。'],'在调试器里观察一个函数调用前后的 PC、SP 与调用栈，并记录变化。','原书第 1 章：寄存器、启动、中断、断点与数据断点。'));

const dc=curriculum.find(c=>c.id==='c-debug');
dc.title='GNU 工具链：构建、分析与调试';
dc.desc='把 Make、GCC、Binutils、链接器和 GDB 串成可重复的固件开发流程，学会用工具验证猜想，而不是只会点击 IDE 按钮。';
dc.duration='6.5 小时';
dc.lessons.push(
 lesson('l-makefile','Makefile：让构建过程可重复',28,'Make 是构建流程的调度器：它根据目标、依赖和命令判断哪些文件需要重新生成。',[{heading:'1. 一条规则怎么读',body:['Makefile 的基本结构是“目标: 依赖”，下面用 Tab 开头的命令负责生成目标。源文件更新后，Make 根据依赖决定哪些产物需要重建。'],code:'app: main.o sensor.o\n\t$(CC) main.o sensor.o -o app\n\nmain.o: main.c sensor.h\n\t$(CC) -c main.c -o main.o'},{heading:'2. 自动变量与伪目标',body:['`$@` 表示当前目标，`$<` 通常表示第一个依赖，`$^` 表示全部依赖。`.PHONY: clean` 声明 clean 是一个动作，而不是磁盘文件。传统 Makefile 的配方命令通常需要以 Tab 开头。']},{heading:'3. 依赖关系决定增量构建是否正确',body:['如果漏掉头文件依赖，改了头文件却没有重新编译，旧目标文件就可能混进固件。应明确源文件、头文件、链接库、编译宏与生成文件之间的依赖，并可用编译器生成 `.d` 依赖文件。']}],['知道目标、依赖与命令各自的职责。','懂得头文件依赖会影响增量构建正确性。','把 clean、all、test 等动作设计为明确的目标。'],'写一个含两个源文件的最小 Makefile，修改头文件后观察哪些目标会重新生成。','原书第 3 章：Makefile 规则、依赖管理、复用与调试。'),
 lesson('l-gcc-binutils','GCC 与 Binutils：看懂编译产物',28,'编译成功不代表固件一定能运行。编译器选项、目标架构、ABI、链接配置和最终产物都需要检查。',[{heading:'1. 从 C 到固件映像',body:['常见流程是预处理、编译、汇编、链接。预处理展开头文件和宏；编译器生成汇编或中间表示；汇编器形成目标文件；链接器解析符号并分配最终地址。交叉编译器在开发电脑上运行，但产物给目标处理器执行。']},{heading:'2. 高频选项',body:['`-I` 指定头文件目录，`-D` 定义宏，`-g` 生成调试信息，`-Og` 常用于保留一定调试体验，`-O2` 更偏向性能优化，`-Wall -Wextra` 打开更多警告。实际支持项与效果依工具链而定。'],code:'arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -g -Og -Wall -Wextra -Iinclude -c main.c -o build/main.o'},{heading:'3. 让工具替你查证',body:['`objdump` 可查看反汇编，`nm` 可查看符号，`size` 汇总各段大小，`addr2line` 可尝试把地址映射回源码，`objcopy` 可转换为 HEX/BIN，`ar` 与 `ranlib` 常用于静态库。保留带符号的 ELF，能帮助之后定位现场地址。']}],['能解释预处理、编译、汇编和链接的分工。','知道编译选项会影响诊断、体积、性能和调试体验。','ELF、map 与符号信息是故障分析证据。'],'找一个构建产物，记录工具链版本，使用 size 查看段大小，再用 objdump 或 nm 检查符号。','原书第 4—5 章：GCC、交叉编译与 Binutils 工具集。'),
 lesson('l-linker-map-practice','链接脚本、重定位与 map 文件',24,'链接器不仅把文件拼在一起，还要解决符号地址并把程序段放到真实存储器位置。嵌入式项目中的链接配置会直接影响启动和内存占用。',[{heading:'1. 目标文件中的地址还没完全确定',body:['单独编译的目标文件可能引用其他文件中的函数或变量。链接器解析符号并修正相关地址，这类地址调整过程与重定位有关。若符号找不到，常见表现是链接时报未定义引用。']},{heading:'2. 链接脚本描述存储布局',body:['链接脚本会描述 Flash、RAM 等存储区域，以及 `.text`、`.rodata`、`.data`、`.bss` 等段如何放置。具体地址、入口点、启动文件期待与 bootloader 布局要和目标芯片匹配，不能复制另一块板子的脚本就直接使用。']},{heading:'3. 用 map 文件排查空间问题',body:['map 文件可以帮助定位段地址、符号与占用大小。RAM 超限时，分别看 `.data`、`.bss`、静态缓冲区和栈堆预算；Flash 超限时，检查代码、常量、库和意外引入的大型组件。']}],['链接器解析符号并安排内存布局。','链接脚本必须符合芯片实际存储器和启动约束。','map 文件帮助定位 Flash/RAM 的占用来源。'],'打开一个固件 map 文件，找出 `.text`、`.data`、`.bss` 的地址和大小，并记录最大的几个符号。','原书第 6 章：重定位、链接脚本、段、符号和存储区域。'),
 lesson('l-gdb-practical','GDB：断点、观察点与调用栈',26,'GDB 可以把程序停在关键时刻，检查真实状态。断点看执行路径，观察点看数据变化，调用栈帮你定位是谁调用了出问题的函数。',[{heading:'1. 先让故障停下来',body:['断点在指定位置暂停程序，单步执行用于观察控制流。观察点可以在目标变量被访问或修改时触发，但硬件观察点的数量、宽度和能力受目标平台限制。']},{heading:'2. 看现场而不是凭感觉猜',body:['发生异常时检查 PC、SP、通用寄存器、调用栈、关键变量和内存内容。优化构建可能改变变量可见性和行号映射；若调用栈不可信，要同时参考反汇编、ELF 符号与 map 文件。']},{heading:'3. 把排障变成可复用流程',body:['固定复现条件，在输入边界、状态转移和错误处理入口设置断点；记录第一次异常时的现场；修复后补上回归测试。不要只单步执行到程序暂时恢复正常，却没有证明根因已消除。']}],['断点、单步、观察点与调用栈解决不同问题。','优化级别与调试符号会影响观察结果。','修复缺陷后要留下复现步骤和回归验证。'],'用调试器定位一次变量意外变化或错误状态转移，记录首次异常的现场。','原书第 7 章：GDB 断点、运行控制与现场检查。')
);

const rc=curriculum.find(c=>c.id==='c-rtos');
rc.lessons.push(
 lesson('l-task-context','上下文切换、任务生命周期与栈',25,'任务切换不是随便换一个函数执行，而是内核保存当前任务的执行现场，再恢复另一个任务的现场。',[{heading:'1. 上下文保存和恢复',body:['上下文包含恢复程序运行所需的寄存器、栈指针和任务状态等信息。哪些内容由硬件自动保存、哪些由软件保存，要查目标 CPU 架构和具体 RTOS 实现。']},{heading:'2. 任务状态变化',body:['任务可能经历创建、就绪、运行、阻塞、挂起、恢复和删除。等待队列、延时、事件和优先级会影响它什么时候重新进入就绪态。把状态变化画出来，比只背 API 名称更容易理解调度行为。']},{heading:'3. 为什么任务栈很重要',body:['任务栈用于函数调用、局部变量和执行现场。深层调用、大局部数组与中断嵌套都会增加用量。应估算最大调用路径，并使用 RTOS 提供的栈溢出检测或高水位统计功能。']}],['任务切换依赖正确保存和恢复执行现场。','阻塞是在等条件，不等于删除任务。','任务栈要按最坏调用路径与中断使用评估。'],'画出一个任务的状态图，并列出它可能使用的栈资源与溢出检测方法。','原书第 20 章：任务状态、上下文保存恢复、调度与栈溢出检测。'),
 lesson('l-rtos-memory','堆、内存池、泄漏与碎片',25,'RAM 是嵌入式系统里的硬约束。动态内存虽然灵活，但长时间运行的设备必须考虑分配失败、资源泄漏和内存碎片。',[{heading:'1. 堆和内存池',body:['堆管理器通常支持不同大小的请求，使用灵活，但耗时和碎片情况取决于算法。固定块内存池预先准备若干同尺寸块，分配更容易预测，但必须规划块大小、数量和满池后的处理策略。']},{heading:'2. 泄漏与碎片',body:['内存泄漏是申请的资源最终没有被释放；碎片是空闲内存分散成不连续的小块，导致总空闲量看起来足够，却无法满足一块较大的连续请求。']},{heading:'3. 建立所有权和统计',body:['优先考虑静态分配或可控的固定池；每次申请都定义失败处理和谁负责释放；在调试版统计当前用量、峰值、分配次数和未释放对象。禁用动态分配并不会自动保证安全，静态缓冲区也要计算容量。']}],['申请成功不代表以后仍有足够内存。','内存池通过固定块换取更可预测的行为。','每类资源都要有明确的所有权和释放路径。'],'设计一个包含 16 个固定大小消息块的内存池，写明满池时的策略和释放规则。','原书第 22 章：堆、内存池、泄漏检测、溢出与碎片。'),
 lesson('l-rtos-device','设备管理与驱动生命周期',24,'驱动不只是读写寄存器，还涉及初始化、资源占用、中断、缓冲区、错误返回和终止化。稳定接口可以让应用层少依赖芯片细节。',[{heading:'1. 设备管理抽象什么',body:['设备管理层可统一注册设备、打开设备、读写数据、设置控制选项和关闭设备等操作。接口应来自真实需求，不能为了抽象而堆出一套复杂的通用框架。']},{heading:'2. 生命周期和资源所有权',body:['注册设备前确认底层时钟与硬件状态；读写时检查长度和错误；关闭或卸载时取消中断注册、停止定时器并释放缓冲区。初始化顺序需遵守模块依赖，清理时则要保证没有其他模块仍在使用该资源。']},{heading:'3. 隔离硬件差异',body:['应用尽量调用稳定的设备能力接口，而不是直接操作一堆寄存器。硬件特有逻辑集中在驱动层，测试时就可以用模拟设备验证上层状态机。']}],['驱动有初始化、运行与清理的完整生命周期。','资源释放顺序要考虑依赖关系和正在使用它的模块。','统一接口有助复用，但需要保持清晰简单。'],'为 UART 驱动列出 init、read/write、control、close 的职责与可能返回的错误。','原书第 23 章：设备管理、中断管理与设备驱动程序。'),
 lesson('l-rtos-timers','软件定时器、超时与实时性',22,'软件定时器适合集中管理超时事件，但其精度、执行上下文和回调时间都可能影响系统实时性。',[{heading:'1. 硬件与软件定时器',body:['硬件定时器由芯片计数并产生事件；软件定时器通常由系统 tick 或专门的定时器任务管理，到期后调用回调或投递事件。前者适合较严格的硬件时序，后者便于组织大量软件超时。']},{heading:'2. 回调时长和上下文',body:['实际执行时刻可能受 tick 分辨率、调度延迟和临界区影响。回调若运行在中断上下文，就必须保持短小；若在定时器任务上下文执行，也不能长时间阻塞统一处理队列。具体行为要查所用 RTOS 文档。']},{heading:'3. 定时器也要管理生命周期',body:['明确何时启动、取消、重启和释放定时器；处理任务删除或设备关闭时遗留的超时回调。串口收帧超时、重试间隔和状态机超时都适合用定时器与显式状态共同管理。']}],['软件定时器精度不等同于硬件定时器。','回调上下文决定可以调用哪些 API。','定时器需要明确的启动、取消和释放规则。'],'为一次传感器采样设计超时恢复流程，标出定时器启动、取消、到期和错误上报。','原书第 24 章：软件定时器、定时误差与实时性。')
);

curriculum.push(
 {id:'c-hardware-engineering',title:'硬件接口与信号完整性',category:'底层原理',level:'基础',duration:'2.5 小时',color:'blue',icon:'cpu',code:'HARDWARE / SIGNAL',desc:'从软硬件边界、引脚电气条件到仪器测量，理解为什么代码看起来正确，板子却可能无法工作。',lessons:[
 lesson('l-signal-integrity','信号完整性：为什么波形会出问题',26,'逻辑分析的前提是物理信号真的能稳定达到高低电平。走线、负载、电容、边沿速度与接地方式都会影响实际波形。',[{heading:'1. 数字信号并非理想方波',body:['真实信号的上升沿和下降沿需要时间，线路和输入引脚存在电容负载。线路较长、负载较重或驱动能力不足时，边沿可能变慢；快速边沿在不合适的布线条件下也可能出现振铃或过冲。']},{heading:'2. 电平与上拉',body:['确认 MCU 与外设的 I/O 电压容限。开漏总线依赖上拉电阻，电阻过大可能让上升沿过慢，过小则增加下拉电流；数值要结合总线速率、总线电容和器件限制判断。']},{heading:'3. 测量方式会影响结果',body:['示波器探头和地线接法会影响测量波形。逻辑分析仪适合数字协议解码；模拟幅度、过冲或振铃等问题通常需要示波器才能看清。']}],['软件配置不能修复所有电气问题。','电平、边沿、负载与上拉会影响通信可靠性。','测量工具的接法也会影响观察结果。'],'检查 I²C 的 SDA/SCL：说明上拉、电容和逻辑电平不匹配分别会造成什么现象。','原书第 2 章：开发活动中的硬件问题与信号完整性。'),
 lesson('l-hardware-debug','板级排障：手册、原理图与波形',22,'外设不工作时，按照固定顺序收集证据，比不停尝试寄存器配置更高效。',[{heading:'1. 先查可信资料',body:['数据手册用于了解资源、电气范围和引脚复用；参考手册解释寄存器、时钟和外设行为；勘误表记录特定芯片版本的已知问题；原理图告诉你引脚实际接到了哪里。']},{heading:'2. 再观察硬件和软件状态',body:['先检查供电与复位，再确认时钟、外设使能和寄存器配置，最后测量引脚波形或通信时序。对总线故障要区分没有时钟、没有应答、数据错误以及中断没有到达。']},{heading:'3. 记录排障证据',body:['保留芯片型号与修订版、固件版本、复现条件、关键寄存器值、波形截图、尝试过的操作和验证结论。这些记录可以复用为以后的排障流程。']}],['先验证硬件前提，再检查寄存器，再测外部波形。','以目标型号的数据手册、参考手册和勘误表为准。','记录现象与排除过程，避免重复试错。'],'为“UART 收不到数据”写一份排查表，从供电、时钟、RX 波形到中断标志逐步验证。','原书第 1—2 章：处理器、输入输出与硬件信号问题。')
 ]},
 {id:'c-abi-assembly',title:'汇编、栈帧与 ABI/EABI',category:'基础知识',level:'进阶',duration:'2.5 小时',color:'slate',icon:'code',code:'ASSEMBLY / ABI',desc:'把 C、CPU 指令、函数参数和栈联系起来，理解底层代码为什么需要遵守统一的二进制约定。',lessons:[
 lesson('l-read-assembly','从 C 代码认识汇编',22,'不用一开始就手写汇编。先把一小段 C 代码和反汇编结果对应起来，就能理解编译器如何使用寄存器、跳转和内存。',[{heading:'1. 观察简单结构',body:['整数运算可能变成寄存器运算，if 语句通常对应比较与条件跳转，循环会形成比较、更新和回跳。优化会改变指令数量和顺序，因此要结合目标架构与编译选项阅读。']},{heading:'2. 读汇编时找什么',body:['先找函数入口和返回、寄存器使用、栈指针变化、条件分支与内存读写。结合调试信息能解释某些变量为什么被优化掉，或者单步时为什么不像 C 源码那样逐行对应。']},{heading:'3. 内联汇编要慎用',body:['内联汇编需要准确声明输入、输出、可能改变的寄存器和内存副作用。只有确实需要特殊指令或已证明普通 C 无法满足需求时再考虑使用。']}],['汇编是机器指令的可读表示。','反汇编要结合处理器架构、优化级别和调试信息。','内联汇编必须正确声明输入、输出和副作用。'],'把含 if、循环和函数调用的小型 C 函数编译成汇编，用注释标出分支、循环与返回路径。','原书第 8 章：汇编语法与嵌入汇编。'),
 lesson('l-abi-eabi','ABI/EABI：函数之间的二进制约定',26,'ABI 是编译好的代码彼此协作时遵守的约定：参数如何传递、返回值如何交付、栈如何对齐，以及目标文件如何描述符号等。',[{heading:'1. 函数调用需要双方说同一种语言',body:['调用方和被调用方必须约定哪些参数放在寄存器、哪些放在栈上，返回值放在哪里，哪些寄存器由函数保存，以及栈帧如何布局。约定不一致时，各部分代码即使单独编译成功，组合后仍可能读错参数或破坏执行现场。']},{heading:'2. EABI 与嵌入式开发',body:['EABI 是面向嵌入式环境的应用二进制接口约定，可能规定基本类型大小与对齐、寄存器用途、栈帧、目标文件格式和库接口等。具体规则与处理器架构、编译器和 ABI 版本有关，应查目标平台文档。']},{heading:'3. 哪些场景会受影响',body:['启动代码、异常入口、内联汇编和预编译第三方库都可能依赖 ABI。更换编译器、CPU 选项或浮点调用约定时，要检查库是否兼容，而不是仅看链接命令能否通过。']}],['ABI 是二进制级的合作约定，不是 C 语法规则。','参数传递、栈帧、寄存器保存和对齐都可能受 ABI 影响。','跨工具链组合库之前先核实目标架构与 ABI 兼容性。'],'画出一个函数调用示意图，标出参数、返回值、栈帧与返回地址，并查明目标平台的调用约定。','原书第 10 章：ABI/EABI、寄存器分配、栈帧与参数传递。')
 ]},
 {id:'c-software-design',title:'软件设计、模块管理与可维护性',category:'工程实践',level:'进阶',duration:'4.5 小时',color:'mint',icon:'layers',code:'DESIGN / MODULE',desc:'从“程序能运行”走向“代码容易理解、容易查错、容易扩展和容易测试”，把原则落实到裸机与 RTOS 项目。',lessons:[
 lesson('l-design-principles','设计原则：清楚、简单、可查错',24,'好的设计让后来阅读、修改和排障的人能够看懂程序的意图。设计不是额外装饰，而是影响软件质量的基础。',[{heading:'1. 以阅读者为中心',body:['命名要传达用途和约束；函数尽量围绕单一职责；异常路径要明确。复杂逻辑可以先画状态图、时序图或模块关系图，再决定代码结构。']},{heading:'2. 简单不等于把所有东西塞在一起',body:['简单意味着减少不必要的概念和隐式规则。避免过早引入多层抽象，也不要将所有功能挤进一个大函数。选择能够解决需求、又能被团队理解的最小设计。']},{heading:'3. 让故障有证据',body:['统计资源用量、错误次数和重要状态变化；定义清楚的失败返回值；为资源建立创建与释放路径。这样遇到现场故障时，系统能提供证据，而不是只能猜测。']}],['设计要服务阅读、修改和排障的人。','优先减少隐式规则和不必要的抽象。','让关键状态、资源与失败原因可观察。'],'选择一段复杂驱动代码，检查命名、函数职责、错误返回、资源释放与日志上下文。','原书第 13 章：软件设计与通用设计原则。'),
 lesson('l-module-management','模块管理：依赖、初始化与终止化',28,'模块不仅是一个文件夹。它应有清晰接口、自己管理的资源、初始化与终止化规则，以及明确的依赖方向。',[{heading:'1. 模块边界',body:['将状态和数据尽量放在负责它们的模块内部，其他模块通过公开接口访问。接口应说明输入、输出、错误和资源所有权，这样修改实现时才不必牵动整个项目。']},{heading:'2. 初始化和清理成对出现',body:['初始化时申请了缓冲区、注册了中断或启动了定时器，就要定义如何释放、注销或停止。模块 B 依赖 A 时通常先初始化 A 再初始化 B；关闭时先停用 B，再清理 A。']},{heading:'3. 分层与分级',body:['层表达较大的职责边界，例如驱动层、平台层和应用层。同一层内部仍可能有先后依赖，可用级别或显式依赖表表达。要避免低层模块反向依赖高层业务逻辑，造成循环依赖。']}],['模块要管理好自己的状态和资源。','初始化与终止化次序需要匹配依赖关系。','分层的价值是限制依赖方向，而非增加目录。'],'为 GPIO、定时器、传感器驱动和应用画依赖图，并列出初始化与终止化顺序。','原书第 14 章：模块层次与级别、注册、系统启动和关闭。'),
 lesson('l-error-management','错误码与日志：让故障有迹可循',26,'可靠的软件不能假设每个操作都会成功。统一表达错误、保留现场信息并规定恢复责任，可以减少排查成本。',[{heading:'1. 让调用方理解错误',body:['接口要区分成功、参数错误、资源不足、超时、硬件无响应或当前状态不允许等情况。错误码需要有稳定定义，不能让同一个数字在不同模块里表达不相关含义。']},{heading:'2. 日志要记录上下文',body:['有效日志通常包括模块、正在执行的操作、错误码以及必要数据，例如目标地址、数据长度、重试次数或当前状态机状态。高频日志要限流，避免日志本身占用过多时间和空间。']},{heading:'3. 规定恢复策略',body:['调用方应根据错误类型决定是否有限重试、返回上层、进入安全状态或停止功能。不要在没有退出条件的循环里无限重试；错误处理从设计初期就应纳入需求。']}],['统一错误码方便模块协作。','日志应回答哪个模块在做什么时为何失败。','错误需要明确检测、上报与恢复策略。'],'为一次 I²C 读取定义四种错误，并为每种错误写下需要记录的上下文和恢复动作。','原书第 15 章：错误表达、错误码和日志管理。'),
 lesson('l-project-layout','目录结构、平台与框架',25,'项目目录可以像书架一样降低检索成本，也能让新人理解模块结构和文件应该放在哪里。',[{heading:'1. 目录体现职责',body:['可按应用、板级支持、设备驱动、平台服务、第三方组件和测试组织文件。新增文件时能快速判断归属，往往说明边界比较清晰。目录不能替代架构设计，但能让设计意图显现出来。']},{heading:'2. 系统库、平台和框架',body:['系统库提供相对独立的通用能力；平台整合基础设施并管理它们的依赖；框架通常还会规定某类应用怎样组织和运行，并提供扩展点。不同项目的命名略有差异，关键是说清各自责任。']},{heading:'3. 避免重复抽象',body:['不要让多个层重复管理同一类资源，也不要让应用到处直接操作芯片寄存器。把通用接口和硬件差异放在合适层次，可以减少改动传播。']}],['目录结构应表达模块职责。','平台整合共用能力，框架会约束应用组织方式。','抽象要解决真实变化，而非增加层数。'],'为一个传感器产品设计目录树，标明应用、板级支持、驱动、平台和测试之间的依赖方向。','原书第 16—17 章：目录结构、系统库、平台与框架。'),
 lesson('l-developability','可开发性设计：让功能更容易实现和测试',25,'可开发性设计的目标是降低新增功能、替换硬件和验证行为的成本。一个常见做法是隔离硬件差异，为测试留下明确入口。',[{heading:'1. 通过设备抽象隔离硬件',body:['如果应用代码到处直接访问某款芯片寄存器，更换 MCU 或在主机测试就很困难。可以定义读取温度、发送数据等能力接口，将寄存器细节留在底层驱动。']},{heading:'2. 让核心逻辑可以独立测试',body:['把算法和状态机与硬件访问适度分离，输入由接口提供，测试时用模拟实现替代真实设备。生产代码和测试应该验证同一份逻辑，而不是各写一份。']},{heading:'3. 抽象需要有成本意识',body:['如果一个功能只用一次、变化概率也很低，引入复杂插件体系可能得不偿失。先说明要隔离的变化点，再设计最小接口。']}],['硬件抽象让应用不必知道寄存器细节。','业务逻辑和硬件访问分离有助于主机侧测试。','抽象的目标是降低变化成本。'],'为温度传感器定义最小设备接口，并用一个假传感器测试越限报警逻辑。','原书第 18 章：可开发性设计与设备抽象层。'),
 lesson('l-design-checklist','把设计原则变成代码检查清单',20,'设计思想只有进入日常开发流程才会产生效果。把原则变成提交前可执行的检查项，能减少反复犯同类错误。',[{heading:'1. 修改代码时自问',body:['函数职责是否明确？命名是否表达意图？失败是否被调用方感知？申请的资源有没有释放路径？模块依赖方向是否合理？关键逻辑是否可以测试？']},{heading:'2. 让机制代替记忆',body:['能自动检查的内容尽量自动化：编译警告、静态分析、单元测试、格式检查、资源统计与构建验证。依赖每个人每次都记得的规则容易遗漏，自动化能降低人为疏忽。']},{heading:'3. 收集反馈以持续改进',body:['记录缺陷类型、返工原因、构建失败和资源峰值，定期观察重复问题。统计的目的不是打分，而是找到设计或流程中可以改进的地方。']}],['把设计原则变成提交前的具体问题。','自动化可减少重复的人为遗漏。','统计信息是改进工程流程的依据。'],'给一个驱动建立不超过十项的自查清单，并挑选三项自动化。','原书第 13 章：可查错性、统计信息、命名与机制化预防错误。')
 ]},
 {id:'c-quality-assurance',title:'质量保证：测试、分析与性能',category:'工程实践',level:'进阶',duration:'4.5 小时',color:'rose',icon:'checkcircle',code:'TEST / ANALYZE / PERF',desc:'建立适合嵌入式项目的质量闭环：单元测试为核心，再结合代码覆盖、静态分析、动态分析和性能测量。',lessons:[
 lesson('l-unit-test','单元测试：一次只验证一个行为',26,'单元测试把程序拆成可独立验证的小行为。它不是项目末尾的补救，而是帮助发现边界条件和回归缺陷的日常工具。',[{heading:'1. 一个测试应该有清楚的预期',body:['准备输入、执行一个行为，再检查实际结果是否符合预期。测试名称说明场景和结果；一次尽量聚焦一个原因，失败时才能快速定位。']},{heading:'2. 嵌入式代码如何测试',body:['协议解析、状态机、数据转换和错误码处理可以放在不直接依赖寄存器的模块里，让它们在开发主机上测试。硬件访问由接口隔离，测试时使用模拟设备验证成功、超时和异常。']},{heading:'3. 覆盖边界与错误路径',body:['除了正常输入，还要检查空缓冲区、长度为零、最大长度、非法命令、超时、资源不足、重复调用和错误恢复。测试数量应由需求风险决定，不是每个函数机械地写同样多用例。']}],['单元测试验证边界清晰的行为。','适度隔离硬件访问，能让逻辑在主机上测试。','不要只测试正常路径。'],'为帧解析函数编写五个测试：有效帧、长度不足、校验失败、未知命令和超长输入。','原书第 27—29 章：单元测试、测试用例与测试框架。'),
 lesson('l-coverage-static','代码覆盖率与静态分析',26,'覆盖率告诉你测试运行时哪些路径被执行；静态分析则寻找潜在错误模式。二者回答不同问题，都不能单独证明程序完全正确。',[{heading:'1. 覆盖率意味着什么',body:['语句覆盖关注代码行是否执行，分支覆盖关注条件的不同结果是否执行。覆盖率低往往意味着测试路径不足；即使覆盖率很高，也可能没有检查正确结果，或遗漏关键输入组合。']},{heading:'2. 静态分析能发现什么',body:['编译器警告和静态分析工具可能提示可疑类型转换、潜在空指针、未初始化数据、越界风险和部分资源管理问题。工具会产生误报，需要分析上下文，并记录确实需要抑制的原因。']},{heading:'3. 用发现结果推动测试完善',body:['优先补充风险较高且尚未覆盖的分支，再处理静态分析警告。将真缺陷、误报和暂时无法修复的问题分类，可以使质量检查持续改进。']}],['覆盖率表示执行情况，不等于正确性。','分支覆盖有助于发现只测单一路径的问题。','静态分析结果要结合上下文分类处理。'],'为一个含两个条件判断的函数列出分支组合，设计测试输入并记录预期结果。','原书第 30—31 章：代码覆盖与静态分析。'),
 lesson('l-dynamic-analysis','动态分析：用运行证据发现缺陷',24,'动态分析在程序运行时观察行为，可以补充代码阅读与静态检查。工具能发现的问题范围取决于平台、工具和测试场景。',[{heading:'1. 关注运行时风险',body:['常见风险包括越界访问、非法内存访问、未定义行为、资源泄漏和生命周期错误。主机侧工具可帮助发现许多 C 语言问题，但不一定覆盖 MCU 的外设、时序和中断问题。']},{heading:'2. 构造最小复现',body:['记录输入、配置、编译选项和失败步骤。偶发问题可先缩小输入范围，建立最小复现，再用动态分析器或调试器确认根因。']},{heading:'3. 结合目标板验证',body:['主机测试不能完全替代目标平台测试。中断、DMA、缓存、寄存器副作用和并发访问仍要结合目标芯片、RTOS 与调试工具验证。']}],['动态分析观察程序真实运行时的行为。','工具检测范围受平台与使用方式限制。','最小复现能降低定位难度。'],'为一个数组边界错误设计可重复测试，记录修复前的现象和修复后的回归结果。','原书第 32 章：动态分析与单元测试的结合。'),
 lesson('l-performance-analysis','性能分析与资源预算',24,'嵌入式性能不只是跑得快。RAM、Flash、CPU 时间、中断延迟、功耗和截止期限往往需要一起考虑。',[{heading:'1. 先定义测量指标',body:['可以测量函数耗时、任务运行时间、最坏响应时间、中断延迟、CPU 使用率、栈高水位和内存占用。没有指标就盲目优化，容易让代码更复杂却没有解决问题。']},{heading:'2. 先测量再优化',body:['记录基线，找出耗时或资源占用最大的路径，再做小幅修改并重复测量。优化后仍要测试正确性和异常路径；不要只凭代码长度或直觉判断性能。']},{heading:'3. 让结果可比较',body:['固定工具链版本、优化选项、输入条件和测量方法。实时系统尤其要关注最坏情况与截止期限，不应只用平均运行时间替代实时性分析。']}],['优化前先定义指标并记录基线。','同时关注时间、空间与实时约束。','相同测量条件让结果更有可比性。'],'为一个数据处理函数设定时间和内存预算，写出测量方法、基线与可接受的最坏情况。','原书第 26、33 章：质量保证方法论与性能分析。')
 ]}
);

const compCourse=curriculum.find(c=>c.id==='c-computer');
compCourse.duration='4.5 小时';
compCourse.lessons.push(lesson('l-mmu-cache','MMU、MPU 与 Cache：地址和速度的边界',24,'地址转换、访问保护与缓存都可能影响程序如何访问内存。先确认芯片具备什么硬件，再决定需要怎样配置。',[{heading:'1. MMU 和 MPU 不是一回事',body:['MMU（内存管理单元）常用于虚拟地址到物理地址的转换，并可能支持进程隔离等机制。许多资源受限的 MCU 没有完整 MMU，但可能提供 MPU，用区域规则限制哪些代码可以访问哪些内存、允许读写还是执行。具体能力由处理器内核决定。']},{heading:'2. Cache 为什么能加速？',body:['Cache 保存近期使用的指令或数据副本，降低 CPU 访问较慢存储器的等待时间。但“CPU 看到的缓存数据”和“DMA 刚写入的 RAM 数据”不一定自动一致；有数据缓存的平台需要按架构与芯片手册执行 clean/invalidate 等维护操作。没有相应缓存的 MCU 不需要照搬这套流程。']},{heading:'3. 实际排查方法',body:['先确认内核是否有 MMU、MPU、I-Cache 或 D-Cache；再看地址区域、访问权限与 cache 属性。若 DMA 数据偶发陈旧、代码更新后行为异常或访问触发 fault，应检查缓冲区属性、对齐与缓存维护要求，而不只是给变量加 volatile。']}],['MMU 负责地址转换，MPU 主要提供区域访问保护；具体能力看内核。','Cache 提升访问效率，但带缓存的 DMA 场景需要关注一致性。','不能把其他处理器的内存管理配置直接复制到目标 MCU。'],'查目标 MCU 内核手册，记录它是否具备 MMU、MPU、I-Cache 和 D-Cache；再说明 DMA 缓冲区需要什么缓存维护。','原书第 1 章：内存管理单元与缓存。'));
const mcuCourse=curriculum.find(c=>c.id==='c-mcu');
mcuCourse.duration='4 小时';
mcuCourse.lessons.push(lesson('l-bootloader','Bootloader 与应用程序交接',26,'Bootloader 是应用程序之前运行的一段固件，常负责更新、校验或选择要启动的应用。它必须与应用程序的内存布局和启动方式配合。',[{heading:'1. Bootloader 通常做什么',body:['它可能选择启动槽位、检查镜像长度与完整性、验证版本或签名、执行固件升级并在失败时回退。具体产品不一定需要所有功能；引导逻辑要和产品的安全、升级及恢复需求匹配。']},{heading:'2. 跳转前要确认什么',body:['Bootloader 与应用需要约定向量表位置、初始栈指针、复位入口、时钟状态、中断状态和外设状态。在 Cortex-M 等平台上，应用通常期望从自己的向量表启动；交接代码必须遵循内核与芯片厂商的启动要求，不能只把 PC 改到某个地址。']},{heading:'3. 常见交接故障',body:['确认链接脚本的应用起始地址与实际烧录地址一致；检查向量表内容、镜像完整性、栈顶是否落在有效 RAM，以及跳转前中断和外设是否处于可接受状态。升级后首启失败应保留恢复路径，避免设备变砖。']}],['Bootloader 和应用程序必须约定内存布局与交接条件。','应用地址变化时要同步检查链接脚本、向量表和烧录配置。','升级机制要考虑镜像校验、失败恢复和断电场景。'],'画出“复位 → Bootloader → 校验/选择镜像 → 应用 Reset_Handler”的启动图，并列出交接前要检查的 5 项条件。','原书第 19 章：引导程序的功能、文件布局与程序加载。'));

const bookRefs={'l-pointer':'原书第 11 章：指针与数组混淆问题及预防。','l-memory':'原书第 9 章：指令段、数据段、栈与堆。','l-volatile':'原书第 12 章：volatile 的使用边界。','l-number':'原书第 1 章：指令与数据。','l-endian':'原书第 1 章：字节序与边界对齐。','l-mmio':'原书第 1 章：输入输出与中断。','l-startup':'原书第 1 章：处理器启动流程。','l-linker':'原书第 6 章：重定位、链接脚本、段、符号与存储区域。','l-toolchain':'原书第 4 章：GCC 工作过程与交叉编译。','l-debug':'原书第 7 章：GDB 断点、运行控制与现场检查。','l-task':'原书第 20 章：任务调度、生命周期与实时性。','l-sync':'原书第 21 章：信号量、互斥锁、事件、队列与死锁。','l-mmu-cache':'原书第 1 章：内存管理单元与缓存。','l-bootloader':'原书第 19 章：引导程序与程序加载。'};

// --- Embedded C: from syntax to object lifetime and firmware memory ---
{course:'c-programming',id:'l-c-types-width',title:'整数、字符、宽度与固定宽度类型',minutes:22,summary:'理解 C 类型决定的不是变量“长什么样”，而是取值范围、转换规则和访问语义。',concept:'先区分“类型表达什么”和“目标平台实际提供什么”。char、short、int、long 的字节数受实现与 ABI 影响；需要明确宽度时优先考虑 stdint.h 中的 uint8_t、int32_t 等类型。sizeof 的结果单位是字节，size_t 则适合表达对象大小与数组长度。',process:'选择类型时，先看数据的数学范围，再看协议/寄存器规定的位宽，最后确认运算过程是否发生整数提升或符号转换。字符数据、原始字节、计数值和地址偏移不应随意混用同一种类型。',pitfall:'不要假设 int 永远是 32 位，也不要用 char 代表所有字节数据；char 的有无符号性由实现决定。打印固定宽度整数时使用合适的格式宏或显式转换，避免格式字符串与实参类型不匹配。',code:String.raw`#include <stdint.h>
#include <stddef.h>

uint8_t  packet_type;
uint16_t sample_count;
uint32_t tick_count;
size_t   buffer_length;

_Static_assert(sizeof(uint32_t) == 4, "uint32_t must be 32 bits");`,explain:['stdint.h 为可用的精确宽度整数类型提供名称；具体类型若不存在，编译环境不会定义它。','size_t 是 sizeof 和对象大小相关接口使用的无符号类型，不能假定它与 uint32_t 总是同宽。','静态断言把平台假设变成编译期检查；条件不成立时尽早失败比运行后才发现更可靠。'],take:['区分对象的类型、位宽与取值范围。','在协议和寄存器字段中明确宽度与有无符号性。','用 sizeof 和静态断言验证关键平台假设。'],exercise:'查看目标交叉编译器的 sizeof 结果，记录 char、short、int、long、指针和 size_t 的大小。',flow:[['需求','范围 / 位宽'],['选择类型','signed / unsigned'],['检查布局','sizeof / ABI'],['使用验证','编译期断言']]},
{course:'c-programming',id:'l-c-integer-conversion',title:'整数提升、类型转换与溢出边界',minutes:25,summary:'理解表达式中类型如何变化，避免符号扩展、截断与溢出造成隐蔽错误。',concept:'C 表达式的结果类型由整数提升、通常算术转换和运算符规则决定。两个 uint8_t 相加通常先提升为 int 再运算；赋回较窄类型时才可能截断。无符号运算按模数回绕；有符号整数溢出通常属于未定义行为，不能依赖“自然回绕”。',process:'排查可疑表达式时，写清每个操作数的类型、提升后的类型、运算结果范围和赋值目标类型。位运算、移位、比较和混合 signed/unsigned 特别需要检查。对外部输入先验证范围，再进行窄化转换。',pitfall:'把负数与无符号数比较，或把大整数截成 uint8_t，都可能得到与直觉不同的结果。不要用溢出来检测业务边界；使用显式上限比较或经过验证的安全算术。',code:String.raw`#include <stdint.h>
#include <stdbool.h>

bool to_u8(uint32_t value, uint8_t *out)
{
    if (out == 0 || value > UINT8_MAX) {
        return false;
    }
    *out = (uint8_t)value;
    return true;
}`,explain:['窄化转换前先比较目标类型最大值，避免静默丢掉高位。','通过返回值表达转换是否成功，比“先强转再检查”可靠。','实际工程还要根据接口契约处理空指针和错误码。'],take:['知道表达式类型不一定等于变量声明类型。','区分无符号回绕和有符号溢出的语言规则。','窄化、长度相加和偏移计算都要做边界检查。'],exercise:'写出一个把 uint32_t 安全转换为 uint16_t 的函数，并测试最大合法值与第一个非法值。',flow:[['声明类型','输入与目标'],['类型提升','确定运算类型'],['范围分析','检查上 / 下界'],['转换验证','失败显式返回']]},
{course:'c-programming',id:'l-c-expressions',title:'表达式、运算符优先级与求值顺序',minutes:18,summary:'把表达式写得明确、可预测，避免依赖优先级猜测或未规定的求值顺序。',concept:'优先级决定表达式如何分组，求值顺序则决定子表达式何时计算；二者不是一回事。括号可以明确意图，但不能修复所有未定义行为。嵌入式代码里，位操作、条件表达式、递增副作用和函数调用混合时尤需谨慎。',process:'读复杂表达式时先加括号表示分组，再检查各子表达式是否修改同一对象、是否存在整数提升，以及短路运算是否影响执行。对寄存器操作、宏参数和边界判断，优先拆成多个有名字的步骤。',pitfall:'不要写 i = i++ + 1 这类对同一对象多次带副作用且顺序不清楚的表达式。宏里要给参数和整体加括号，也要警惕参数被求值多次。',code:String.raw`uint32_t mask = (1u << bit_index);
bool ready = ((status & mask) != 0u);

if (ready && (length >= header_size)) {
    process_frame(buffer, length);
}`,explain:['括号让位移、按位与和比较的意图一目了然。','&& 左边为假时右边不会执行，因此可以在契约清楚时用于分层检查。','process_frame 仍需自行验证 buffer 和长度，不应仅依赖调用点的判断。'],take:['区分运算符优先级与表达式求值顺序。','复杂位表达式加括号并拆分中间步骤。','避免依赖未定义或未指定的副作用顺序。'],exercise:'重写三条包含移位、按位与和比较的表达式，明确括号，并说明每一步的中间类型。',flow:[['原表达式','识别副作用'],['明确分组','加括号 / 临时量'],['检查类型','提升 / 符号性'],['验证结果','测试边界输入']]},
{course:'c-programming',id:'l-c-control-flow',title:'条件、循环与状态控制',minutes:22,summary:'掌握分支与循环的可达性、退出条件和边界，这些是可靠固件控制逻辑的基础。',concept:'if/switch 选择路径，for/while/do-while 重复执行。对固件而言，除了“正常时会怎样”，还要写清超时、错误、取消和停机路径。循环是否有界直接影响最坏执行时间与实时性。',process:'为每个循环指出初始化、继续条件、状态推进和退出条件；为 switch 明确 default；对需要有限响应的等待加入计数或时间截止。使用枚举状态表达协议流程，避免多个布尔值组合出难以分析的状态。',pitfall:'空循环等待硬件标志可能永远不退出，也会浪费 CPU。循环变量边界、无符号减法和 switch 漏掉状态都很常见。若设计本来允许永久运行，也应明确它运行在任务/主循环中，而不是在关键路径无限阻塞。',code:String.raw`bool wait_ready(uint32_t timeout_ticks)
{
    uint32_t start = get_tick();
    while (!device_ready()) {
        if ((uint32_t)(get_tick() - start) >= timeout_ticks) {
            return false;
        }
    }
    return true;
}`,explain:['时间差计算使用无符号差值，在计数器回绕语义得到目标平台保证时可处理 tick 回绕。','timeout_ticks 应有明确单位与有效范围；get_tick 的原子性由平台决定。','硬件状态读取、时钟频率和 tick 来源都需要具体工程实现。'],take:['每个循环都要能解释退出条件。','长时间等待应有超时与失败路径。','状态机常比散落的布尔变量更容易验证。'],exercise:'把一个“等待串口发送完成”的无限 while 改成有超时、有错误返回的接口。',flow:[['状态输入','当前条件'],['分支 / 循环','推进状态'],['退出检查','完成 / 超时'],['返回结果','成功 / 失败']]},
{course:'c-programming',id:'l-c-functions',title:'函数接口、参数、返回值与调用成本',minutes:24,summary:'函数接口决定模块怎样协作，也影响调用现场、栈使用和错误如何向上传递。',concept:'函数声明定义参数类型和返回类型；参数一般按值传递，指针参数让函数可以访问外部对象，但需要约定长度、所有权和是否允许为空。清晰的返回值与错误策略让调用者决定恢复方式。',process:'设计函数时先写出前置条件、成功结果、失败结果和副作用；缓冲区接口同时传指针和长度。不要把隐含状态藏在多个全局变量中。嵌入式实时路径还要关注调用深度、局部对象大小与耗时。',pitfall:'C 不会自动检查数组参数长度；函数参数里写 int data[] 仍会调整为指针。返回局部对象地址、忽略返回错误码、接口的输入输出重叠未说明，都是常见缺陷。',code:String.raw`typedef enum {
    PARSE_OK,
    PARSE_BAD_ARG,
    PARSE_SHORT_BUFFER
} ParseResult;

ParseResult parse_header(const uint8_t *buf,
                         size_t len,
                         uint16_t *type_out);`,explain:['枚举错误码比同时修改多个全局状态更清楚。','const 输入指针表达函数不会通过该指针修改输入数据。','注释或接口文档还需说明 type_out 的空指针条件、缓冲区最小长度和失败时输出是否保持不变。'],take:['参数本身不携带数组长度。','接口应说清前置条件、错误和副作用。','用调用深度和局部变量估计栈压力。'],exercise:'为读取一个传感器 ID 设计函数声明，写清参数、返回值、超时、校验失败与输出参数规则。',flow:[['调用契约','输入 / 前置条件'],['函数执行','局部状态 / 副作用'],['结果分类','成功 / 错误码'],['调用方处理','恢复 / 记录']]},
{course:'c-programming',id:'l-c-scope-storage',title:'作用域、存储期、链接属性与全局变量',minutes:25,summary:'理解名字在哪里可见、对象存活多久、跨文件如何共享，是排查初始化和全局状态问题的前提。',concept:'作用域回答名字在哪个位置可见；存储期回答对象存在多长时间；链接属性回答不同声明是否指向同一实体。auto 局部对象通常随块退出而结束生命周期，static 局部对象贯穿程序运行，全局对象也通常具有静态存储期。static 文件作用域对象限制在当前翻译单元可见。',process:'看到一个变量时分开分析三个问题：谁能访问它、它什么时候创建/销毁、其他 .c 文件能否引用。把不需要公开的函数和变量设为文件私有；头文件通常放声明，某个 .c 文件里放唯一的定义。',pitfall:'在头文件定义普通全局变量可能导致多重定义；返回局部变量地址会造成悬空指针；过多全局可变状态会让并发访问、单元测试和初始化顺序越来越难追踪。',code:String.raw`/* sensor.h: 对外声明 */
extern uint32_t sensor_sample_count;
void sensor_init(void);

/* sensor.c: 唯一定义 */
uint32_t sensor_sample_count;
static uint32_t last_raw_value;`,explain:['extern 声明引用在别处定义的对象；它本身通常不分配另一个定义。','全局变量只应有一个定义，其他翻译单元需要时通过声明引用。','static 文件作用域对象对其他文件隐藏，可减少符号冲突和意外耦合。'],take:['区分作用域、存储期和链接属性。','头文件放接口声明，源文件放唯一的对象定义。','控制全局可变状态的数量与可见范围。'],exercise:'把一个示例工程中的 5 个全局变量分类：哪些需要跨文件访问，哪些适合改为 static，哪些应成为函数参数。',flow:[['名字声明','可见范围'],['对象存储期','存在多久'],['链接属性','跨文件身份'],['封装检查','是否该公开']]},
{course:'c-programming',id:'l-c-arrays-strings',title:'数组、字符串与缓冲区边界',minutes:26,summary:'嵌入式协议、DMA 与外设 FIFO 常依赖字节缓冲区；长度管理比指针声明更重要。',concept:'数组元素连续排列，数组长度在定义处可知；但传进函数后通常只剩下指针。C 字符串以 NUL 终止符结尾，而任意二进制缓冲区不一定有终止符。所有长度都应明确单位：字节数、元素数还是字符数。',process:'读写缓冲区时检查指针、总长度、偏移和本次读写长度。先验证 offset <= total，再用 length <= total - offset 避免 offset + length 自身溢出。处理字符串时确保终止符空间充足，处理协议时不要假设数据里没有 0 字节。',pitfall:'strcpy、sprintf 和未经限制的拼接容易越界；strlen 只能用于有效的 NUL 终止字符串。DMA 写入的数据不能直接假定是字符串。',code:String.raw`bool range_valid(size_t total, size_t offset, size_t count)
{
    if (offset > total) return false;
    return count <= (total - offset);
}

/* 先 range_valid(len, offset, need)，再访问 buf + offset */`,explain:['先判断 offset 是否越界，再做减法，可以避免直接计算 offset + count 溢出。','指针有效性、底层对象容量和并发写入仍由调用者与接口契约负责。','安全检查通过后，才执行 memcpy 或索引访问。'],take:['数组作为函数参数时不会自动传递长度。','字符串和二进制数据是不同的数据契约。','越界检查同时覆盖偏移与长度，明确字节/元素单位。'],exercise:'实现一个从字节缓冲区读取小端 16 位值的函数，处理 null 指针、偏移越界和剩余长度不足。',flow:[['输入缓冲区','指针 + 总长'],['检查范围','偏移 + 长度'],['访问数据','只在有效区间'],['失败处理','不越界读写']]},
{course:'c-programming',id:'l-c-aggregates',title:'结构体、联合体、枚举与位域',minutes:25,summary:'复合类型用于表达消息、驱动配置和状态；必须同时考虑可读性与内存布局规则。',concept:'struct 把多个成员组织成一个对象，enum 给状态命名，union 让多个成员共享同一存储区域。编译器可能在结构体成员之间或末尾插入 padding。位域的布局与分配规则具有实现相关性，不适合直接作为跨平台协议格式。',process:'优先按语义定义类型；把硬件寄存器布局交给官方头文件，协议载荷用显式编码/解码。用 sizeof、offsetof 和静态断言验证本项目 ABI 下的关键结构布局，而不要盲信成员相加结果。',pitfall:'不要把来自网络/Flash 的任意字节强转为 struct 后直接访问，除非对齐、布局、别名、字节序与版本都得到保证。packed 属性不是没有代价的万能修复，可能产生非对齐访问。',code:String.raw`typedef enum { DEV_IDLE, DEV_BUSY, DEV_ERROR } DeviceState;
typedef struct {
    uint8_t  type;
    uint16_t length;
    uint32_t sequence;
} FrameInfo;

/* 布局以目标 ABI 为准 */
_Static_assert(offsetof(FrameInfo, sequence) % 4 == 0,
               "sequence alignment assumption changed");`,explain:['枚举让状态意图比裸数字更明确。','offsetof 用于检查成员在对象中的实际偏移，要求包含 stddef.h。','该静态断言是示例假设，不代表每种 ABI 都必须采用此布局；若条件不满足，应回查设计而非盲目改变编译选项。'],take:['结构体大小可能大于成员大小之和。','enum 可提升状态可读性，union 共享存储。','外部协议要显式解码，不依赖实现相关布局。'],exercise:'为一个协议头定义 struct，然后使用 sizeof/offsetof 检查布局，并写一版不依赖结构体内存布局的字节解码函数。',flow:[['语义建模','字段 / 状态'],['类型组织','struct / enum'],['ABI 布局','padding / 对齐'],['验证协议','显式编解码']]},
{course:'c-programming',id:'l-c-pointer-arithmetic',title:'指针运算、数组衰变与多级指针',minutes:27,summary:'指针运算以所指元素为单位，不是简单地按地址加减字节。',concept:'p + 1 移动到下一个同类型元素，移动字节数为 sizeof(*p)。只有在同一数组对象范围内（或允许的尾后位置）进行相关指针运算才有定义。数组名在大多数表达式中会衰变为首元素指针，但 sizeof array 与 sizeof pointer 的结果不同。',process:'分析指针时写清它指向哪一个对象、对象有多少元素，以及指针目前在数组的哪个位置。多级指针常用于修改调用方的指针或构造二维数据结构；每一层都要有明确的所有权和有效性契约。',pitfall:'不要把两个不相关对象的指针相减，也不要越过数组尾后指针解引用。指针转换不会自动解决对齐、别名或对象生命周期问题。',code:String.raw`uint16_t samples[4] = {10, 20, 30, 40};
uint16_t *p = samples;
uint16_t second = *(p + 1);   /* 20 */
size_t count = sizeof samples / sizeof samples[0];`,explain:['p + 1 指向第二个 uint16_t，而不是固定只加一个字节。','sizeof samples 在数组定义可见处取得整个数组大小；函数参数里的样式不同。','second 的读取有效，因为索引 1 落在 4 个元素的范围内。'],take:['指针加法按所指对象大小缩放。','数组衰变会丢失数组长度信息。','任何多级指针都应逐层检查非空与生命周期。'],exercise:'手算 uint16_t array[8] 中 array、array+3 和 &array[3] 的类型与相对地址关系。',flow:[['数组对象','元素连续存放'],['衰变 / 取址','得到元素指针'],['按元素移动','p + n'],['范围确认','再解引用']]},
{course:'c-programming',id:'l-c-function-pointers',title:'函数指针、回调与驱动接口',minutes:23,summary:'函数指针让驱动、协议处理和状态机在保持统一接口的同时替换具体实现。',concept:'函数指针类型必须与被调用函数的参数和返回类型兼容。回调常用于事件通知、操作表和硬件抽象接口。与数据指针不同，函数指针的表示与转换不能随意套用数据地址规则。',process:'先定义回调签名，再定义注册接口和上下文指针；明确回调从哪个上下文调用、能否阻塞、何时注销，以及被调用对象的生命周期。设备操作表常将 init/read/write 等行为放在一个明确的接口边界。',pitfall:'错误的函数指针强转可能导致未定义行为。把局部变量地址存入长期回调上下文会产生悬空引用；从 ISR 回调调用不允许的阻塞 API 也可能造成死锁。',code:String.raw`typedef void (*event_cb_t)(void *context, uint32_t event);

typedef struct {
    event_cb_t on_event;
    void *context;
} EventSink;

void notify(const EventSink *sink, uint32_t event)
{
    if (sink != NULL && sink->on_event != NULL) {
        sink->on_event(sink->context, event);
    }
}`,explain:['回调签名把参数和返回类型固定下来。','context 把每个订阅者自己的状态传入回调，避免依赖单一全局变量。','代码演示空值检查；并发注册/注销和对象生命周期仍需额外同步。'],take:['函数指针必须匹配调用约定与签名。','上下文指针适合承载实例状态，但需保证生命周期。','写清回调调用上下文与阻塞限制。'],exercise:'设计一个传感器驱动接口，要求支持两种不同型号，并用函数指针操作表隔离差异。',flow:[['定义签名','参数 / 返回值'],['注册回调','函数 + context'],['事件触发','明确调用上下文'],['生命周期','取消注册 / 同步']]},
{course:'c-programming',id:'l-c-macros-headers',title:'头文件、宏、条件编译与翻译单元',minutes:23,summary:'头文件组织接口，预处理器在编译前展开宏和条件分支，构建选项会影响最终代码。',concept:'每个 .c 文件通常独立预处理、编译为目标文件，再由链接器组合。头文件保护宏避免重复包含；函数声明、类型和常量可以放头文件，普通全局对象一般只在一个源文件定义。宏是文本替换，既不遵循普通函数的类型检查，也可能重复求值。',process:'阅读工程构建时，确认 include 搜索路径、编译宏、目标 CPU 选项和源文件列表。把配置宏集中起来，避免不同模块以不同宏定义解释同一头文件。小的行为优先考虑 static inline 函数而不是复杂宏。',pitfall:'头文件里的非 static 函数定义可能导致多重定义；宏参数没有括号可能改变运算结果；同一个宏在不同源文件取值不同会让结构布局和 ABI 不一致。',code:String.raw`#ifndef SENSOR_H
#define SENSOR_H
#include <stdint.h>

#define ARRAY_COUNT(a) (sizeof(a) / sizeof((a)[0]))
void sensor_init(void);

#endif`,explain:['include guard 防止同一翻译单元重复展开头文件。','ARRAY_COUNT 只适用于真正的数组且使用点必须能看到数组类型；传入指针会得到错误结果。','构建系统必须统一影响公共类型布局的宏定义。'],take:['头文件定义接口，源文件定义实现。','宏是预处理文本替换，注意类型与重复求值。','条件编译选项可能改变 ABI 与功能路径。'],exercise:'找出一个工程中的三个编译宏，记录它们在哪里定义、哪些文件会看到、分别改变了什么行为。',flow:[['源文件','独立翻译单元'],['预处理','展开宏 / include'],['编译','目标文件'],['链接','符号组合']]},
{course:'c-programming',id:'l-c-const',title:'const、volatile 与类型限定的使用边界',minutes:23,summary:'理解只读意图与可观察访问是两种不同约束，避免把限定符当作内存保护或同步机制。',concept:'const 限制通过特定限定类型的左值修改对象；volatile 约束编译器对相应访问的处理，使访问按语言规则保持可观察。const 不一定意味着对象位于 ROM，volatile 也不会自动保证原子性、线程安全或处理器内存屏障。',process:'设计接口时将输入参数声明为指向 const 的指针；寄存器定义按照器件头文件使用正确限定符；对 ISR/任务共享状态另外分析原子性与同步。关注 const 和 volatile 放在指针本身还是所指对象上的差别。',pitfall:'volatile uint32_t *p 表示指向 volatile uint32_t 的指针；uint32_t * volatile p 表示指针变量自身 volatile。两者含义不同。不能通过强制转换随意移除 const，也不能用 volatile 代替 mutex/atomic。',code:String.raw`const uint8_t *input;          /* 不能通过 input 修改所指字节 */
uint8_t * const fixed_ptr = 0; /* 指针本身不可改：仅演示类型含义 */
volatile const uint32_t *status; /* 常见只读状态寄存器形式 */`,explain:['const 限制的是通过该表达式修改对象的能力，并不独自决定物理内存属性。','指针本身的 const 与所指对象的 const 是不同层次。','状态寄存器最终定义以设备厂商头文件和寄存器访问语义为准。'],take:['const 与 volatile 解决不同问题。','注意限定符作用在指针本身还是所指对象。','同步、原子性和硬件访问顺序需单独设计。'],exercise:'分别声明“指向只读数据的指针”“不可重新赋值的指针”“指向 volatile 计数值的指针”，用自己的话解释每种限定。',flow:[['对象访问','谁会改数据'],['限定类型','const / volatile'],['编译器约束','可修改 / 可观察'],['并发需求','另行同步']]},
{course:'c-programming',id:'l-c-undefined-behavior',title:'未定义行为、越界与安全 C 编程',minutes:27,summary:'编译器优化基于语言规则；一旦程序进入未定义行为，不能依赖调试构建下碰巧出现的结果。',concept:'越界访问、空指针解引用、有符号溢出、使用生命周期结束的对象、错误格式字符串等，可能违反 C 语言规则。未定义行为不是一种可预测的错误码，优化后的表现可能与未优化构建完全不同。',process:'建立输入检查、长度验证、所有权和错误返回的习惯；开启合理编译警告；在主机侧对不依赖硬件的逻辑使用静态分析、单元测试和动态检测。目标板测试还需要覆盖中断、外设、副作用和时序场景。',pitfall:'不要把“在我的板子上可以运行”当作定义保证。警告清零也不能证明没有未定义行为；对工具告警应分析原因而不是无条件屏蔽。',code:String.raw`bool copy_bytes(uint8_t *dst, size_t dst_len,
                const uint8_t *src, size_t src_len)
{
    if (dst == NULL || src == NULL) return false;
    if (src_len > dst_len) return false;
    /* 工程中还需定义重叠内存是否允许 */
    memcpy(dst, src, src_len);
    return true;
}`,explain:['先验证指针和长度，再进行任何内存访问。','memcpy 不适用于源/目标重叠区域；若接口允许重叠需要明确使用 memmove 或其他规则。','返回值让调用方知道复制是否发生，减少未检查的隐式失败。'],take:['未定义行为不能靠观察一次结果来推断。','长度、生命周期、对齐和别名都是安全边界。','警告、测试和静态分析应组合使用。'],exercise:'审核一段数组处理代码，按“越界、空指针、整数溢出、生命周期、重叠区域”五类逐项检查。',flow:[['输入条件','指针 / 长度'],['规则验证','范围 / 生命周期'],['执行操作','仅在有效时'],['测试证据','警告 / 边界用例']]},
{course:'c-programming',id:'l-c-stack-frame',title:'函数调用、栈帧与栈预算',minutes:24,summary:'理解函数调用如何使用栈、返回地址与寄存器保存，才能分析局部数组、中断嵌套和栈溢出。',concept:'调用约定决定参数、返回值和寄存器保存方式；编译器可能将变量放寄存器，也可能放入栈帧。栈使用不仅取决于局部变量，还取决于调用深度、递归、保存寄存器、异常现场和编译器生成代码。',process:'估计最深调用链而不是只检查单个函数；特别关注大局部数组、递归、深层日志格式化和中断嵌套。使用链接 map、编译器栈使用报告、栈填充高水位或保护区检测验证预算，并留出最坏情况余量。',pitfall:'静态局部变量不占用每次调用的自动栈，但会占用静态存储。把大数组改为全局变量虽可降低栈压力，却引入共享状态和重入问题，不能只做机械替换。',code:String.raw`void parse_packet(const uint8_t *buf, size_t len)
{
    uint8_t header[8]; /* 每次调用可能需要栈空间 */
    if (buf == NULL || len < sizeof header) return;
    memcpy(header, buf, sizeof header);
    handle_header(header);
}`,explain:['header 的储存位置和具体栈帧布局由编译器与 ABI 决定。','handle_header 可能继续调用其他函数，栈预算应覆盖整条最深路径。','递归或 ISR 嵌套还会增加最坏栈消耗。'],take:['单个函数的局部变量总量不等于系统最大栈使用。','计算最深调用链、异常嵌套和编译器保存现场。','用高水位与工具报告验证估算。'],exercise:'找出固件里最大的三个局部数组，估算其调用路径，并提出一个不会引入竞态的栈减量方案。',flow:[['函数调用','建立调用现场'],['栈帧','局部量 / 保存寄存器'],['嵌套调用','峰值累加'],['高水位检查','验证预算']]},
{course:'c-programming',id:'l-c-heap',title:'动态内存、分配失败与碎片化',minutes:24,summary:'动态内存适合生命周期不固定的数据，但长期运行的固件需要考虑失败、碎片与执行时间。',concept:'malloc/free 从堆中分配与释放内存；长期运行时，分配大小和释放顺序可能造成碎片，分配延迟也可能不可预测。很多固件在启动阶段一次性分配，或使用固定大小对象池/静态缓冲区以获得可预测性。',process:'先明确对象生命周期和最大并发数量，再选择静态数组、对象池、固定块内存或动态分配。每次分配都要处理失败；每个对象必须有明确唯一释放责任。对实时关键路径，评估分配器最坏执行时间和碎片风险。',pitfall:'忘记释放会泄漏；释放两次或释放后使用会损坏堆；分配大小计算溢出可能导致缓冲区小于预期。把所有动态分配一概视为禁止也不精确，关键是建立可验证的策略。',code:String.raw`typedef struct { uint8_t data[64]; } MessageBlock;
/* 实时路径中可考虑固定块池，而不是反复 malloc/free */
MessageBlock *block = message_pool_get();
if (block == NULL) {
    report_resource_exhausted();
    return;
}
process_message(block);
message_pool_put(block);`,explain:['固定块池把对象尺寸和最大数量显式化，降低碎片与分配延迟变化。','取出和归还接口仍需定义线程安全、所有权和错误处理规则。','如果实际采用 malloc/free，仍必须检查 NULL 并保证所有路径释放。'],take:['动态分配要分析失败、生命周期和碎片。','实时路径优先使用可预测、可测量的资源策略。','固定池也需要严格的所有权与并发规则。'],exercise:'给一个每秒处理消息的任务定义最大同时在途消息数，并比较静态数组、固定块池与 malloc 的优缺点。',flow:[['申请对象','尺寸 / 生命周期'],['分配策略','堆 / 固定池'],['使用期间','唯一所有者'],['回收与统计','失败 / 碎片']]},
{course:'c-programming',id:'l-c-memory-sections',title:'从 C 变量到 .text、.rodata、.data、.bss',minutes:28,summary:'把变量声明、目标文件段、链接布局和启动初始化连在一起，理解固件内存占用从哪里来。',concept:'函数机器码常进入 .text，常量可能进入 .rodata，带非零初值的静态对象通常进入 .data，零初始化或未显式初始化的静态对象通常进入 .bss。最终分段受编译器、链接器、选项和目标格式影响；段名只是常见约定。',process:'编译后查看对象文件和最终 ELF 的 section、symbol 与 map；比较优化前后变化；再核对链接脚本把这些段放到 Flash 还是 RAM。理解 .data 的初始值通常需要在非易失映像中存储，并在启动时复制到 RAM。',pitfall:'不要只看 BIN 文件大小推算 RAM；.bss 往往不会在原始 BIN 中按同样方式占据文件空间，但运行时占 RAM。常量被优化掉或合并也会改变占用统计。',code:String.raw`const char banner[] = "ready";  /* 常见为只读数据 */
uint32_t retry_limit = 3;      /* 常见为 .data */
static uint32_t event_count;   /* 常见为 .bss */

void run_task(void) {          /* 机器码通常位于 .text */
    /* ... */
}`,explain:['这些段归属是典型情况，不是所有工具链都必须完全相同。','event_count 的静态存储期意味着启动时需要处于规定的初始值，常由启动代码清零 .bss 实现。','用 ELF 工具和 map 文件验证目标工程的真实布局，不要单靠变量声明猜测。'],take:['区分 Flash 映像占用与运行时 RAM 占用。','.data 常需加载初值，.bss 常需启动清零。','以 ELF、map 和链接脚本为实际证据。'],exercise:'编写一个包含初始化全局变量、零初始化数组、只读字符串和函数的最小程序，比较它们在目标 ELF/map 中的位置。',flow:[['C 对象','属性 / 初值'],['编译器','生成 section'],['链接器','映射存储区'],['启动代码','复制 / 清零']]},
{course:'c-programming',id:'l-c-isr-shared-data',title:'主循环、中断与任务之间共享 C 数据',minutes:27,summary:'异步访问的共享数据需要考虑原子性、竞态与同步协议，不能只依赖 volatile。',concept:'当主循环、ISR 或多个 RTOS 任务共享对象时，读、写和读改写可能互相穿插。volatile 主要约束编译器对特定访问的优化，不自动保证复合操作不可分割，也不为跨核/设备访问建立所有需要的内存次序。',process:'先确定共享数据的所有读写者、数据宽度、对齐和执行上下文；再选用平台保证的原子操作、短临界区、队列或单生产者/单消费者协议。ISR 中应使用适合中断上下文的 API，避免阻塞锁。',pitfall:'即使自然对齐的 32 位读写在某个 MCU 上原子，也不能推断所有复合表达式都原子；多个上下文同时执行 counter++ 可能丢失更新。',code:String.raw`/* 示意：ISR 只发布事件，主循环处理重逻辑 */
static volatile bool event_pending;

void peripheral_isr(void)
{
    clear_device_irq();
    event_pending = true;
}

void main_loop(void)
{
    if (event_pending) {
        /* 真实并发代码需要按平台确保取出/清除过程安全 */
        handle_event();
        event_pending = false;
    }
}`,explain:['示例展示“ISR 做短工作、主循环做重工作”的结构，但布尔标志的读改写竞争需要根据平台保证进一步处理。','若事件可能发生多次，单一 bool 会合并事件；应选择计数器、队列或位图等匹配语义的数据结构。','在 RTOS 中优先使用该 RTOS 明确支持的 ISR-safe 通知/队列接口。'],take:['volatile 不等于原子操作和线程同步。','选择同步原语前先列全共享读写者。','区分“事件可合并”与“每次事件都不能丢”的语义。'],exercise:'分别为“按键变化只需通知一次”和“DMA 完成每笔数据都要处理”选择共享数据方案，并说明事件会不会合并。',flow:[['异步事件','ISR / 任务'],['共享状态','读 / 写 / 改'],['同步协议','原子 / 临界区 / 队列'],['验证竞态','高频 / 并发测试']]},
// --- Computer fundamentals: numerical representation, CPU, memory, bus, faults ---
{course:'c-computer',id:'l-binary-hex',title:'位、字节、二进制与十六进制换算',minutes:20,summary:'先建立最小数据单位与进位制直觉，之后才能可靠阅读寄存器、内存地址和调试器输出。',concept:'bit 只有 0/1；8 bit 通常构成 1 byte。二进制每位权重是 2 的幂，十六进制每位对应 4 bit。地址、掩码和调试值经常用十六进制表达，是因为它能紧凑地映射到二进制位组。',process:'将十六进制每一位替换为对应 4 位二进制，再按位权相加得到十进制。看寄存器时分 nibble、byte 和 bit 编号；注意手册中 bit 0 通常指最低有效位。',pitfall:'十六进制 0x10 是十进制 16，不是 10；位编号、字节偏移和寄存器偏移是不同概念。打印时保留必要前导零有助于观察字段宽度。',code:String.raw`/* 0xA5 = 1010 0101b */
uint8_t value = 0xA5u;
uint8_t high_nibble = (uint8_t)(value >> 4); /* 0x0A */
uint8_t low_nibble  = (uint8_t)(value & 0x0Fu); /* 0x05 */`,explain:['高 4 位右移到最低位位置，结果为 10。','低 4 位通过 0x0F 掩码保留，结果为 5。','示例还需确保输入位宽与掩码宽度符合真实字段定义。'],take:['能在二进制、十六进制和十进制之间转换。','区分 bit 编号、字节偏移和寄存器偏移。','用位掩码把字段拆开验证。'],exercise:'把 0x3C、0xA5、0x80 分别转为 8 位二进制，并指出每个值置位了哪些 bit。',flow:[['原始值','二进制位串'],['分组','4 bit / 1 hex'],['换算','位权相加'],['字段检查','bit / byte / offset']]},
{course:'c-computer',id:'l-logic-bits',title:'布尔逻辑、逻辑运算与按位运算',minutes:21,summary:'逻辑运算回答条件真假，按位运算处理每一位；混淆二者会造成寄存器判断错误。',concept:'逻辑 &&、||、! 产生真假结果并具有短路求值；按位 &、|、^、~ 对整数每一位操作。位掩码的设计需要同时考虑操作数位宽、无符号性和字段位置。',process:'判断某位是否置位时使用 (value & mask) != 0；需要所有掩码位都置位时用 (value & mask) == mask。构造掩码时确保移位量合法，清位时仅在该寄存器允许普通读改写的前提下使用 value &= ~mask。',pitfall:'value && mask 只判断二者是否都非零，并不检查指定 bit。对具有写 1 清零、读清或硬件副作用的寄存器，普通读改写可能产生错误。',code:String.raw`uint32_t status = read_status();
uint32_t mask = (1u << 5);

bool bit5_set = ((status & mask) != 0u);
bool all_set  = ((status & 0x03u) == 0x03u);`,explain:['按位与的结果保留两个操作数共同为 1 的位。','比较结果产生布尔值，适合写入条件表达式。','位移前应确认移位量小于操作数位宽且掩码类型合适。'],take:['逻辑运算用于真假条件，按位运算用于位模式。','判断一位与判断一组位的表达式不同。','寄存器写入语义决定是否可用读改写。'],exercise:'给定状态寄存器值 0xA6，判断 bit1、bit2、bit5 是否置位，并构造清除 bit5 的掩码。',flow:[['位模式','value / mask'],['按位运算','AND / OR / XOR'],['比较结果','是否置位'],['寄存器规则','确认副作用']]},
{course:'c-computer',id:'l-fixed-float',title:'定点数、浮点数与量化误差',minutes:22,summary:'嵌入式算法常在精度、性能和资源之间权衡，数值格式选择必须与误差预算一致。',concept:'整数或定点数把数值按约定比例缩放，精度和溢出范围由比例与位宽决定；浮点数通常采用符号、指数和有效数表示，能覆盖较大范围但不能精确表达所有十进制数。ADC 工程值换算、滤波和控制算法都需要关注量化、舍入与饱和。',process:'先确定输入范围、允许绝对/相对误差和可接受的最坏执行时间；再选择浮点或定点。定点需要规定缩放因子、小数位数、乘法中间位宽、舍入和饱和策略。浮点则要测试接近零、大/小值和累积误差。',pitfall:'整数除法会截断；先做乘法再除法可能溢出；不同编译器/目标上的浮点硬件和库成本不同。不要把 float 转 uint16_t 前的越界行为交给直觉处理。',code:String.raw`/* Q-format 示例：以 1000 为比例表示三位小数 */
int32_t temperature_milli = 23750; /* 表示 23.750 */
int32_t delta_milli = 125;
temperature_milli += delta_milli;
/* 换算显示时再做除法/余数处理 */`,explain:['数值含义依赖约定比例，所有接口必须共享同一尺度。','中间运算要检查最大值，防止乘加溢出。','示例只是定点表示思路，真实算法要定义舍入、饱和与单位。'],take:['数值格式按范围、精度、速度与工具链选择。','定点数需要统一缩放和溢出规则。','验证输入边界与累计误差，不能只测典型值。'],exercise:'为 0–3.3 V、精度 1 mV 的电压值设计整数表示，说明比例、最大值和转换公式。',flow:[['工程需求','范围 / 精度'],['数值格式','定点 / 浮点'],['运算规则','舍入 / 溢出'],['误差验证','边界 / 累积']]},
{course:'c-computer',id:'l-mcu-mpu',title:'微处理器、微控制器与 SoC 的边界',minutes:18,summary:'理解不同器件整合了哪些资源，才能判断系统启动、外部存储和软件层次需要做什么。',concept:'微控制器通常将 CPU、Flash、SRAM 和外设集成到单芯片，适合控制与低功耗场景；微处理器系统常依赖外部 DRAM、存储与复杂板级初始化；SoC 则可能同时包含多核 CPU、GPU、加速器和外设。命名存在行业差异，真正重要的是资源边界。',process:'读芯片产品资料时列出内核、片上 Flash/RAM、外部内存控制器、启动介质、时钟/电源域、外设和调试接口。确认启动 ROM/Boot mode、外部存储初始化与应用运行环境由哪一层软件负责。',pitfall:'不要把某颗 MCU 的启动模型直接套到带外部 DRAM 的应用处理器；也不要假设“片上存储”意味着所有内存都在 CPU 可直接访问的同一区域。',code:String.raw`/* 建立目标平台资源表，而不是假设所有芯片相同 */
struct platform_resources {
    size_t flash_bytes;
    size_t sram_bytes;
    bool has_external_dram;
    bool has_mmu;
    bool has_data_cache;
};`,explain:['资源表是需求梳理示例，不是实际芯片寄存器定义。','has_mmu 和 has_data_cache 需查目标核和 SoC 资料，不能由产品名称推断。','对复杂 SoC 还要考虑安全域、地址映射和启动固件分工。'],take:['从实际集成资源理解 MCU/MPU/SoC，而非只记名称。','启动、内存与软件栈由硬件资源决定。','查数据手册、参考手册和处理器内核手册。'],exercise:'为自己想学习的一款芯片建立资源表，列出 CPU、Flash、SRAM、外部存储需求、MMU/MPU 和调试接口。',flow:[['芯片类别','MCU / MPU / SoC'],['资源清单','CPU / memory / I/O'],['启动责任','ROM / Bootloader'],['软件架构','裸机 / RTOS / OS']]},
{course:'c-computer',id:'l-fetch-decode',title:'指令、数据与取指—译码—执行',minutes:22,summary:'理解处理器如何重复执行指令，能把 C 代码、汇编、寄存器和总线访问联系起来。',concept:'编译器把 C 语句转换为目标 ISA 的指令序列。处理器取指、译码并执行这些指令，但现代内核可能采用流水线、乱序执行、预测和缓存，因此不能把“每条 C 语句等于一条机器指令”当成事实。指令与数据最终都以位模式存储。',process:'选择一个简单函数，查看编译器生成的汇编；把变量加载、运算、条件跳转和函数调用分别标出来。比较不同优化等级，观察指令数和寄存器分配变化。若性能有要求，再结合周期计数或逻辑分析测量真实目标上的行为。',pitfall:'调试构建和优化构建中，变量位置与语句顺序可能明显不同；汇编单步的一步也未必对应一条 C 源代码行。不要仅凭源码行数估计实时延迟。',code:String.raw`uint32_t clamp_u32(uint32_t value, uint32_t limit)
{
    if (value > limit) return limit;
    return value;
}
/* 用目标工具链反汇编：objdump -d -S firmware.elf */`,explain:['编译器可能将比较和条件返回转为不同指令模式。','-S 输出混合源代码与汇编可用于关联源码和机器指令。','命令前缀和具体参数取决于工具链，需使用目标架构版本的 objdump。'],take:['C 语句与机器指令不是一一对应。','汇编帮助理解执行流、寄存器和内存访问。','性能判断要测目标机器而非只数源码行。'],exercise:'编译一个包含 if/else 和数组访问的函数，比较 -O0 与 -O2 的反汇编并解释最明显的三处差异。',flow:[['源代码','表达意图'],['编译与链接','生成 ISA 指令'],['处理器','取指 / 执行'],['观测结果','寄存器 / 内存']]},
{course:'c-computer',id:'l-address-space',title:'地址、内存映射与地址空间',minutes:24,summary:'地址是访问对象或外设的定位方式；地址空间分区决定什么地址对应什么硬件资源。',concept:'在 MCU 中，Flash、SRAM、外设寄存器和系统控制空间往往通过地址区间区分。CPU 发出地址后，片上总线/译码逻辑决定目标区域。地址并不一定等于物理 RAM 位置：带 MMU 的系统可能存在虚拟地址与物理地址转换。',process:'查目标芯片内存映射表，记录各区域起始地址、大小、访问属性和保留用途；再对应链接脚本的 MEMORY 区域、启动向量表和外设基地址。确认地址是否对齐、是否可执行、是否由安全/特权配置限制访问。',pitfall:'把任意数字强转成指针不会让地址变成有效内存。错误地址可能导致总线 fault；有些地址读取会触发外设副作用。不要把虚拟地址、物理地址、偏移量和 C 指针混为一谈。',code:String.raw`/* 地址常量必须来自目标芯片手册/官方头文件 */
#define PERIPH_BASE_ADDR 0x40000000u
#define GPIO_OFFSET      0x00020000u
#define GPIO_BASE_ADDR   (PERIPH_BASE_ADDR + GPIO_OFFSET)
/* 真正的寄存器定义应使用芯片厂商头文件 */`,explain:['示例展示基地址加偏移的思维模型，不代表任何具体芯片的 GPIO 地址。','真实工程优先使用官方寄存器定义，避免基地址或访问宽度错误。','MMU/MPU 与安全状态会额外影响地址能否被当前代码访问。'],take:['地址空间是硬件资源的地图。','偏移、地址、指针和虚拟地址有不同含义。','任意数值地址不代表可安全解引用。'],exercise:'画出目标芯片的 Flash、SRAM、外设和系统区域简图，并把链接脚本的代码区/数据区标到图上。',flow:[['地址请求','CPU 发起访问'],['地址译码','匹配区域'],['目标资源','Flash / RAM / I/O'],['访问属性','权限 / 副作用']]},
{course:'c-computer',id:'l-memory-types',title:'Flash、SRAM、ROM、EEPROM 与存储特性',minutes:22,summary:'不同存储介质的容量、速度、掉电保持、擦写寿命和访问方式不同，影响固件数据放置。',concept:'Flash 通常非易失，擦除粒度往往大于写入粒度；SRAM 易失、访问快且适合作为运行数据；ROM/启动 ROM 可能包含出厂代码；EEPROM 或模拟 EEPROM 常用于少量持久参数。具体器件限制必须看数据手册，不能按名称推断所有时序。',process:'把数据分为代码、常量、实时可变状态和掉电要保留参数；分别选择合适介质。对 Flash 持久化需要考虑擦写次数、掉电中断、页擦除、写放大、校验和回滚。运行期 RAM 预算需包括静态对象、堆、栈和 DMA 缓冲区。',pitfall:'频繁更新一个 Flash 单元可能耗尽擦写寿命；把初始化常量拷贝到 RAM 可能节省执行时间但增加 RAM 占用；未考虑掉电过程可能破坏参数记录。',code:String.raw`typedef struct {
    uint32_t version;
    uint32_t payload_length;
    uint32_t crc32;
} StoredHeader;
/* 持久化协议还应定义双槽、校验、版本与掉电恢复 */`,explain:['持久化存储不是简单 memcpy 到某个地址；必须遵守写入/擦除粒度和时序。','头部记录版本与长度，便于升级和读取前校验。','可靠写入常设计双槽或日志式更新以应对掉电，但具体方式取决于介质。'],take:['按访问速度、非易失性与寿命选择存储。','Flash 写入/擦除受硬件粒度与寿命限制。','掉电恢复、版本迁移和完整性要一起设计。'],exercise:'为一个需要保存 20 个配置参数的设备选择存储介质，定义更新频率、掉电安全和校验策略。',flow:[['数据用途','代码 / 状态 / 配置'],['介质选择','Flash / SRAM / EEPROM'],['访问约束','速度 / 擦写寿命'],['可靠策略','校验 / 掉电恢复']]},
{course:'c-computer',id:'l-bus-architecture',title:'地址总线、数据总线、控制信号与等待状态',minutes:24,summary:'CPU 与存储器/外设之间的访问受总线宽度、仲裁、时钟和等待周期影响。',concept:'“总线”是访问请求、地址、数据和控制信息的传输/协同机制，不同处理器的内部互连结构并不相同。CPU 与外围设备速度差异、总线竞争、时钟域跨越和外部存储器时序都可能增加等待时间。',process:'读芯片架构图时确认主设备、从设备、总线矩阵或桥接层、DMA 与 CPU 如何争用资源。若访问变慢，区分指令/数据 cache miss、Flash wait state、外部总线时序、DMA 竞争和外设响应延迟。',pitfall:'数据手册中的 CPU 主频不等于每次内存访问都在一个周期内完成。DMA 与 CPU 同时访问同一 SRAM/总线可能引发延迟变化，需要结合芯片架构和真实测量。',code:String.raw`/* 性能实验的思路：在访问前后测量时间 */
uint32_t start = cycle_counter_read();
consume_memory(buffer, length);
uint32_t elapsed = cycle_counter_read() - start;
/* 计数器、溢出和编译器屏障要求由目标平台决定 */`,explain:['先有测量假设，再区分是哪一级等待，而不是仅看 CPU 频率。','cycle_counter_read 和可能的屏障需要目标架构提供。','重复测量并控制 cache 状态、输入规模与中断负载，才能比较。'],take:['总线与存储系统决定访问延迟的一部分。','主频不等于固定指令/访存耗时。','CPU、DMA 与外设可能竞争共享资源。'],exercise:'列出一个固件读取外部传感器并经 DMA 写入 RAM 的数据路径，指出可能产生等待或争用的三个位置。',flow:[['请求发起','CPU / DMA'],['互连仲裁','地址 / 控制'],['目标响应','RAM / 外设'],['性能影响','等待 / 竞争']]},
{course:'c-computer',id:'l-alignment',title:'内存对齐、非对齐访问与结构体 padding',minutes:24,summary:'对齐约束影响访问效率、指令合法性、ABI 布局和 DMA 缓冲区可用性。',concept:'对象通常有对齐要求，地址必须满足类型或平台规定的边界。编译器可能在结构体成员之间加入 padding，确保后续成员对齐。某些内核允许非对齐访问但变慢，某些访问类型会 fault；DMA 和 cache 操作还可能要求额外边界对齐。',process:'先查目标 ABI 和内核对非对齐访问的要求，再用 sizeof/offsetof 检查结构布局。协议数据从字节流解码时可逐字节拼合，或 memcpy 到已对齐的局部对象后再处理；DMA 缓冲区按驱动要求对齐并预留长度。',pitfall:'packed 结构体可能导致不对齐字段访问；强制类型转换不能自动对齐地址。把结构体直接映射为二进制报文还会同时遇到 padding 和端序问题。',code:String.raw`struct Example {
    uint8_t  tag;
    uint32_t value;
    uint16_t length;
};
/* sizeof(struct Example) 由目标 ABI 决定 */
size_t off_value = offsetof(struct Example, value);`,explain:['value 前面可能插入 padding，使其符合 uint32_t 对齐。','offsetof 和 sizeof 能验证当前工具链实际布局。','协议字段应该按字节解码，避免把 ABI 内存布局误当线缆格式。'],take:['对齐是对象地址与访问约束，不只是性能技巧。','结构体 padding 由 ABI 决定。','外部数据流与 C 对象布局需分开处理。'],exercise:'在目标编译器上打印三个结构体的 sizeof 和 offsetof，调整成员顺序后比较大小并解释原因。',flow:[['对象类型','对齐需求'],['编译器布局','padding / offset'],['内存访问','可用 / fault / 变慢'],['校验方式','sizeof / offsetof']]},
{course:'c-computer',id:'l-debug-breakpoints',title:'断点、观察点与处理器调试机制',minutes:21,summary:'调试器通过软件断点、硬件比较器或调试接口观察程序运行，理解机制可避免误判。',concept:'软件断点可能通过替换指令实现；硬件断点/观察点依赖处理器调试资源，数量通常有限。观察点可在特定地址被读写时停住程序。暂停 CPU 不一定暂停所有外设或 DMA，因此现场中的硬件状态可能仍发生变化。',process:'先用 PC 对应指令定位当前代码；再检查调用栈和相关变量。观察共享缓冲区时，可用硬件观察点捕捉意外写入；涉及 DMA/缓存时同时记录外设状态和 buffer 内容。优化构建下要结合反汇编理解源码行映射。',pitfall:'断点可能改变时序，导致实时故障不复现；调试器显示的变量可能已优化掉或不是内存中的当前副本。硬件断点资源有限，插入过多可能失败。',code:String.raw`/* GDB 示例，需用适配目标的调试器 */
break Reset_Handler
break main
continue
info registers
bt
watch shared_state`,explain:['启动断点帮助判断是否执行到 Reset_Handler 和 main。','watch 语法与硬件资源受目标调试器支持情况影响。','对时间敏感问题，考虑 GPIO 标记、trace 或非侵入测量方式补证。'],take:['断点、观察点和日志分别有不同观测成本。','优化代码调试时要看反汇编和寄存器。','暂停内核不一定冻结所有硬件活动。'],exercise:'在一个演示程序里给变量设置观察点，找出它第一次被修改的位置，并记录停机时 PC 与调用栈。',flow:[['设置观测点','地址 / 指令'],['运行程序','调试接口监测'],['触发暂停','PC / 内存变化'],['确认原因','调用栈 / 现场']]},
{course:'c-computer',id:'l-fault-exception',title:'Fault、异常入口与崩溃现场',minutes:25,summary:'硬件异常和访问 fault 是系统留下的诊断证据；能保存与解读现场可以大幅缩短定位时间。',concept:'非法地址访问、权限违规、未定义指令、栈错误等可能触发异常或 fault。处理器通常保存部分异常现场，并提供异常原因寄存器；具体异常类型、优先级与自动保存内容依架构而异。',process:'设计故障处理时保留堆栈帧、PC/LR、状态寄存器和 fault status/address 寄存器；保证诊断代码尽量短小且可在崩溃环境中安全执行。重启前把关键现场存入受保护的日志区域，注意不要在 fault handler 中调用复杂、可能再次 fault 的服务。',pitfall:'只打印“HardFault”无法定位原因；处理栈本身已损坏时，普通 C 代码可能无法安全展开。寄存器含义必须按照具体内核手册解释，不同异常可能使用不同堆栈指针。',code:String.raw`/* 架构相关的异常处理伪代码 */
void fault_handler_c(const FaultFrame *frame)
{
    crash_log.pc = frame->pc;
    crash_log.lr = frame->lr;
    crash_log.status = read_fault_status();
    persist_crash_log();
    request_safe_reset();
}`,explain:['FaultFrame 和寄存器读取函数是架构相关封装，并非通用 C 接口。','日志存储需考虑递归 fault、堆栈损坏和写入耗时。','现场格式应带版本和完整性校验，方便后续工具解码。'],take:['保存 PC、返回地址和 fault 状态能提供定位证据。','异常现场布局与堆栈选择由架构规定。','fault handler 应短小、避免再次触发故障。'],exercise:'设计一份崩溃记录结构，至少包含固件版本、PC、LR、SP、fault 原因和校验值，并说明如何在下次启动时读出。',flow:[['故障条件','访问 / 指令 / 权限'],['异常入口','硬件保存现场'],['记录状态','PC / LR / fault'],['恢复策略','安全停机 / 复位']]},
{course:'c-computer',id:'l-cache-dma',title:'Cache、一致性与 DMA 缓冲区所有权',minutes:27,summary:'在带数据缓存的平台上，DMA 与 CPU 可能看到不同的新旧数据，需要按方向管理缓存一致性。',concept:'Cache 保存内存数据副本以减少访问延迟。在非硬件一致性的 DMA 系统里，CPU 写入缓存但尚未写回 RAM，外设可能读到旧值；DMA 写入 RAM 后，CPU 也可能继续读到缓存中的旧副本。并非每个 MCU 都有 D-Cache，也并非每个 DMA 场景都要手动维护。',process:'先查看内核/SoC 是否有 D-Cache，以及 DMA 缓冲区位于哪个内存区域。明确传输方向：CPU→DMA 常需确保新数据对设备可见；DMA→CPU 常需在完成后按平台要求使 CPU 不再使用过期缓存。再处理地址/长度对齐、内存屏障、缓存行共享和缓冲区所有权。',pitfall:'在 DMA 传输中途清理或失效缓存、缓冲区与其他数据共享缓存行，以及忘记 CPU/DMA 所有权交接，都可能丢数据。不要在无缓存平台照搬 cache API，也不要用 volatile 代替 cache 维护。',code:String.raw`/* 概念流程：具体 API 依芯片/RTOS */
prepare_tx_buffer(tx, len);
cache_clean_for_device(tx, len);
start_dma_tx(tx, len);
wait_dma_done();

start_dma_rx(rx, len);
wait_dma_done();
cache_invalidate_for_cpu(rx, len);
consume_rx_buffer(rx, len);`,explain:['发送方向示意为写回或清理 CPU 生成的数据，确保设备能看到新内容。','接收方向的维护顺序与具体 cache/ DMA API 及平台规则相关，应使用官方驱动推荐流程。','还要保证缓冲区对齐和长度覆盖正确的缓存行，并明确传输完成前 CPU 不应非法访问。'],take:['Cache 一致性问题只在相关硬件/内存属性组合下出现。','先分清 DMA 传输方向，再选择维护操作。','对齐、缓存行共享和所有权交接同样重要。'],exercise:'画出 CPU 发送和 DMA 接收两条时间线，逐步标注缓冲区所有权、cache 维护和数据读取时机。',flow:[['CPU / DMA','两个观察者'],['数据方向','发送 / 接收'],['缓存维护','clean / invalidate'],['所有权交接','完成事件后访问']]},
{course:'c-computer',id:'l-memory-protection',title:'MPU/MMU：访问权限、区域与内存保护',minutes:24,summary:'内存保护机制可限制错误代码访问关键区域，但功能与配置方式取决于处理器能力。',concept:'MPU 通常按区域配置读写、执行和特权访问权限；MMU 还常负责虚拟地址到物理地址转换，并支持更复杂的隔离。许多 MCU 只有 MPU 或没有相关单元。权限配置需要与链接布局、任务栈、DMA 区域和异常处理协同。',process:'先列出代码、只读常量、普通 RAM、外设和共享缓冲区，再根据内核区域数量、粒度与属性配置区域。逐一验证合法访问成功、越权访问触发预期 fault，并确认异常处理不会依赖被保护区域的无效内容。',pitfall:'MPU 区域通常有对齐、粒度或数量限制；区域优先级/重叠规则依架构而异。给整个 RAM 开放所有访问会削弱保护，过度严格又可能破坏启动或 DMA。',code:String.raw`/* 配置思路伪代码，非通用寄存器接口 */
region_configure(CODE_REGION,  READ_ONLY | EXECUTE);
region_configure(DATA_REGION,  READ_WRITE | NO_EXECUTE);
region_configure(PERIPH_REGION, DEVICE_MEMORY | PRIVILEGED_ONLY);
mpu_enable();`,explain:['代码区只读可降低意外写入，数据区禁执行可降低某些风险。','外设区域应使用正确的设备内存属性，并按目标芯片权限设计。','宏与 API 都是示意，配置顺序和 barrier 要求由架构手册决定。'],take:['MPU 与 MMU 功能不同。','权限粒度、区域数量和重叠规则都有限制。','保护配置需要用合法和非法访问测试验证。'],exercise:'为一个裸机固件画出代码、数据、栈和外设区域，提出最小访问权限策略，并指出需要验证的反例。',flow:[['资源分区','代码 / RAM / I/O'],['权限策略','读 / 写 / 执行'],['配置约束','区域 / 对齐'],['故障验证','合法与越权访问']]},
// --- MCU startup: from reset conditions to C runtime and deployable image ---
{course:'c-mcu',id:'l-reset-sources',title:'复位源、启动模式与复位后的初始状态',minutes:21,summary:'上电复位、软件复位、看门狗和低压复位可能有不同保留状态，启动代码需要考虑来源差异。',concept:'复位可能由上电、外部引脚、看门狗、软件请求、低电压检测或调试器触发。不同复位源对 SRAM 保留、外设状态、复位标志和启动模式的影响由芯片定义。某些芯片先执行 ROM boot code，再进入用户 Flash 的启动代码。',process:'查参考手册中 Reset and clock control / boot configuration 章节；在启动早期读取并保存复位原因寄存器，按数据手册规定清除标志；再进入正常初始化。对于看门狗复位要保存关键诊断证据，并避免启动故障导致复位循环。',pitfall:'不要假设所有复位都会清零全部 RAM，也不要假设 RAM 一定保留。复位标志可能需要特定顺序读取/清除；调试器复位方式也可能与上电行为不同。',code:String.raw`uint32_t reset_reason = platform_read_reset_flags();
crash_log.reset_reason = reset_reason;
platform_clear_reset_flags(reset_reason);

if (reset_reason & RESET_WATCHDOG) {
    record_watchdog_restart();
}`,explain:['函数名和标志位是平台抽象示意。','如果复位原因用于故障归因，应在覆盖前写入安全存储。','记录逻辑本身不能无限阻塞启动，否则可能形成复位循环。'],take:['先确定复位来自哪里，再推断初始状态。','复位原因寄存器的读取与清除规则依芯片而异。','观察看门狗复位循环时保存可持续读取的现场。'],exercise:'在目标芯片参考手册里找出至少三种复位源，记录复位标志、RAM 保留和启动地址的行为。',flow:[['复位来源','POR / WDT / SW'],['硬件复位','寄存器 / RAM 状态'],['读取标志','保存原因'],['启动策略','初始化 / 诊断']]},
{course:'c-mcu',id:'l-vector-table',title:'向量表、Reset_Handler 与异常入口',minutes:24,summary:'向量表把异常编号映射到初始栈信息和处理函数地址，是启动与异常处理的关键结构。',concept:'处理器复位后按架构定义读取特定位置。以 Cortex-M 为例，向量表第一个字是初始 MSP，第二个字是 Reset_Handler 入口，后面是异常/中断处理函数地址。其他架构的机制可能不同；链接脚本与启动文件要与硬件期望吻合。',process:'查看启动汇编/向量表定义、链接脚本中的向量段位置，以及 ELF 中向量表的实际内容。核对初始栈顶属于有效 RAM，Reset_Handler 地址位于可执行映像，并确认向量表重定位时使用了正确的地址和对齐方式。',pitfall:'向量表偏移不匹配、弱定义 handler 名称错误、错误的栈顶地址或链接地址与烧录地址不一致，都会导致无法到达 main。不要直接复制其他芯片系列的向量表。',code:String.raw`/* 概念化 Cortex-M 向量表，实际布局由启动文件和链接脚本提供 */
__attribute__((section(".isr_vector")))
const uintptr_t vector_table[] = {
    (uintptr_t)&__StackTop,
    (uintptr_t)Reset_Handler,
    (uintptr_t)NMI_Handler,
    (uintptr_t)HardFault_Handler
};`,explain:['section 属性和数组排列是编译器扩展与具体启动文件约定，不是可移植 C 通用机制。','向量表一般还需要完整异常项、设备中断项和架构要求的对齐。','实际工程优先使用芯片厂商启动代码，并用 map/objdump 验证其位置。'],take:['向量表与启动文件/链接脚本必须一致。','初始栈指针与复位入口都要落在合法地址。','向量机制和布局必须按目标 ISA 与芯片手册确认。'],exercise:'查看目标工程的 startup 文件和 map 文件，定位向量表、栈顶符号和 Reset_Handler 地址。',flow:[['复位触发','硬件入口规则'],['读取向量表','SP / Reset_Handler'],['启动处理器','进入入口地址'],['异常分派','handler 地址表']]},
{course:'c-mcu',id:'l-data-bss-init',title:'.data 复制、.bss 清零与 C 对象初值',minutes:25,summary:'理解 C 语言静态对象初值为何需要启动代码兑现，避免 main 前使用未初始化的运行环境。',concept:'带非零初值的静态存储期对象需要在运行期拥有对应初值；常见固件会把初始镜像保存在 Flash，在启动时复制到 RAM。零初始化对象常放在 .bss 并于启动时清零。这个过程通常发生在 main 之前，且必须与链接脚本给出的源/目标边界吻合。',process:'查看启动代码中从 load address 向运行地址复制 .data 的循环，以及清零 .bss 的循环。确认循环端点、单位和大小计算没有错误，且栈与执行环境在调用 C 函数前已满足 ABI 要求。',pitfall:'若 .data 复制范围少了结尾，变量会保留随机值；若 .bss 清零范围错了，未初始化的全局状态可能影响早期启动。不能在 C 运行环境建立前调用依赖全局初值或栈的复杂代码。',code:String.raw`/* 伪代码：符号由链接脚本定义 */
for (uint32_t *dst = &__data_start, *src = &__data_load;
     dst < &__data_end; ) {
    *dst++ = *src++;
}
for (uint32_t *p = &__bss_start; p < &__bss_end; ) {
    *p++ = 0u;
}`,explain:['__data_load 指向初值在映像中的位置，__data_start/end 指 RAM 运行区间。','符号类型、地址含义与循环单位必须和目标链接脚本匹配。','真实启动文件可能使用汇编或字节/字大小复制，并需满足架构对启动现场的要求。'],take:['.data 需要加载初值，.bss 通常需要清零。','复制与清零边界来自链接器符号。','main 前的初始化顺序是可执行系统的必要组成部分。'],exercise:'在 map 文件和启动代码中找到 .data 的加载地址、运行地址与 .bss 范围，解释每个符号的作用。',flow:[['链接脚本','定义边界符号'],['Flash 初值','.data load image'],['启动初始化','复制 / 清零'],['C 运行期','对象初值有效']]},
{course:'c-mcu',id:'l-clock-init',title:'时钟树、外设时钟与初始化顺序',minutes:23,summary:'系统时钟和外设时钟决定计时、通信波特率、功耗与启动稳定性，不能只看 CPU 主频。',concept:'芯片常含多个时钟源、PLL、分频器和总线时钟域。CPU、定时器、UART、ADC 与 USB 可能使用不同的时钟路径。启用外设前可能需要打开对应总线时钟并等待 ready 标志；时钟切换时要遵守稳定时间和切换顺序。',process:'根据时钟树画出时钟源→PLL→总线分频→外设时钟的路径；从目标频率反推参数，并按手册设置 Flash wait state、电压范围和振荡器准备时间。配置后读取时钟状态或测量引脚输出，确认实际频率。',pitfall:'以为所有外设时钟等于 CPU 时钟会导致波特率、定时器和采样率偏差。PLL 未锁定、外部晶振未就绪或 Flash wait state 配置不当可能造成启动不稳定。',code:String.raw`/* 伪流程，函数名需要换成芯片 HAL/CMSIS 实现 */
select_safe_clock();
configure_flash_latency(target_hclk);
start_external_oscillator();
wait_until_oscillator_ready();
configure_pll_and_dividers();
switch_system_clock_to_pll();`,explain:['先选安全来源，再配置闪存延迟与 PLL，属于常见而非所有芯片统一的顺序。','每个步骤的超时与失败策略都应明确。','外设定时计算要使用该外设实际时钟，不要直接套 CPU 频率。'],take:['外设频率由时钟树决定，不一定等于 CPU 主频。','等待时钟稳定要有可诊断的失败路径。','配置顺序按目标芯片参考手册执行。'],exercise:'画出目标 MCU 的 SYSCLK、HCLK、APB/AHB 和定时器/UART 时钟路径，并算出一个常用波特率的分频。',flow:[['时钟源','内部 / 外部'],['PLL / 分频','生成各域频率'],['状态验证','ready / lock'],['外设配置','频率参数']]},
{course:'c-mcu',id:'l-runtime-init',title:'C 运行库初始化、构造函数与 main 之前的工作',minutes:22,summary:'main 是 C 应用入口，却通常不是复位后的第一段代码；运行库还可能要准备堆、库状态和初始化函数。',concept:'启动代码在硬件复位后设置基本执行环境，之后通常完成 .data/.bss 初始化并调用系统初始化与运行库初始化，最终调用 main。若使用 C++，还可能涉及全局对象构造；C 项目也可能依赖库初始化表或半主机设置。具体链路由工具链和运行库决定。',process:'从 Reset_Handler 开始单步，阅读其调用链，确认何处设置栈、复制/清零段、配置时钟、初始化库以及调用 main。更换链接脚本、标准库或启动文件时，检查对应初始化符号是否保留且顺序正确。',pitfall:'自定义 Reset_Handler 时漏掉运行库初始化，可能导致库函数或静态状态异常；在栈未准备好前调用普通 C 函数也可能失败。不要把某一工具链的符号名当成所有工具链通用。',code:String.raw`/* 典型概念顺序，不是可直接替换厂商启动文件的代码 */
Reset_Handler:
    establish_stack
    copy_data_and_zero_bss
    call_system_init
    call_runtime_init
    call_main`,explain:['代码是流程清单，用于阅读启动汇编；不是 C 语言，也不是通用汇编语法。','system init 和 runtime init 的位置、名称与是否存在都依项目而异。','如果 main 未命中断点，沿启动调用链逐步验证每一步。'],take:['main 前存在硬件与运行库初始化。','启动文件、链接脚本和库版本需要彼此匹配。','从 Reset_Handler 单步比猜测“为什么没进 main”更高效。'],exercise:'把目标工程 Reset_Handler 的真实调用链画成图，给每个步骤加一条“如何验证成功”的证据。',flow:[['复位入口','Reset_Handler'],['运行环境','栈 / 段初始化'],['系统与库','时钟 / runtime'],['应用入口','main']]},
{course:'c-mcu',id:'l-elf-hex-bin',title:'ELF、HEX、BIN 与烧录地址',minutes:22,summary:'不同固件产物保留的信息不同；烧录工具如何放置镜像必须与链接地址一致。',concept:'ELF 常含段、符号、重定位结果与调试信息；Intel HEX 带地址记录和校验信息；BIN 通常是原始字节序列，往往需要额外指定烧录起始地址。转换产物不自动修正错误的链接地址。',process:'用 readelf/objdump/size 或目标工具检查 ELF 的入口、section 和地址；查看 HEX 地址记录；对 BIN 明确它对应的 Flash 偏移和填充/保留区域。比较链接脚本、Bootloader 分区表、烧录配置与应用向量表位置。',pitfall:'把 BIN 写到错误地址会使向量表和程序绝对地址不匹配。HEX 转 BIN 可能填充地址空洞而增大文件；不应仅靠文件大小判断映像是否适合目标槽位。',code:String.raw`# 工具名称随工具链变化，以下为常见 GNU 工具示例
arm-none-eabi-size firmware.elf
arm-none-eabi-objdump -h firmware.elf
arm-none-eabi-objcopy -O ihex firmware.elf firmware.hex
arm-none-eabi-objcopy -O binary firmware.elf firmware.bin`,explain:['size 看常见段规模，objdump -h 看 section 与 VMA/LMA。','objcopy 将 ELF 转为烧录格式，并不会替你判断链接布局是否正确。','工具前缀、格式名称和选项需要与交叉工具链版本匹配。'],take:['ELF 通常适于调试与分析，HEX/BIN 常用于烧录。','BIN 常需单独知道加载地址。','链接地址、镜像槽位与烧录地址必须一致。'],exercise:'从一个固件 ELF 生成 HEX 和 BIN，记录三个文件的信息差异，并验证目标应用起始地址与链接脚本一致。',flow:[['链接输出','ELF / 符号'],['转换格式','HEX / BIN'],['烧录配置','地址 / 分区'],['板上验证','向量表 / 启动']]},
{course:'c-mcu',id:'l-startup-debug',title:'启动故障定位：从复位到 main 的分层检查',minutes:25,summary:'当应用无法启动时，沿着可观察证据分层排查，避免在高层反复修改业务代码。',concept:'启动链路可视为一组必须满足的前置条件：复位入口正确、向量表可读、栈有效、段初始化成功、时钟可用、运行库完成、main 可达。只要某一步不满足，后续代码就不会按预期执行。',process:'先确认程序是否被正确烧录以及烧录地址；再看 PC 是否停在复位向量或 Reset_Handler；检查初始 SP、向量表与链接符号；在 data/bss 初始化、SystemInit、运行库和 main 逐点下断点。若停在 fault，保存 PC/LR/SP 和 fault 状态后再归因。',pitfall:'反复修改 main 中的代码对尚未到达 main 的故障没有帮助；调试器 reset 模式、启动脚选择、调试接口和看门狗也可能改变症状。每次只改变一个条件，并记录哪一步的证据发生变化。',code:String.raw`/* 启动检查表的伪代码 */
assert_image_address_matches_linker();
assert_vector_table_is_valid();
assert_initial_stack_is_in_ram();
assert_data_bss_init_completed();
assert_clock_and_runtime_ready();
assert_main_reached();`,explain:['检查表把启动流程转化为可以逐项确认的条件。','实际断言通常无法直接放进最早期启动代码，可改用调试器断点和故障记录。','每个断点命中与否本身就是证据，可缩小故障区间。'],take:['先确认是否进入 Reset_Handler，再确认 main。','链接地址、向量表、栈和初始化区间需互相一致。','采用一次只改一个变量的分层排查。'],exercise:'假设程序停在 HardFault 且没有进入 main，按“烧录—向量表—SP—段初始化—时钟—运行库”的次序写出最小排查清单。',flow:[['烧录与复位','地址 / boot mode'],['入口和栈','vector / SP'],['初始化','data / bss / clock'],['到达 main','断点 / fault log']]}
];

foundationSpecs.unshift({course:'c-programming',id:'l-c-program-structure',title:'一个 C 程序怎样组织和运行',minutes:20,summary:'从 main、头文件、源文件和最小构建过程入门，知道代码如何从文本变成可执行固件。',concept:'C 源文件是编译器处理的输入之一。头文件通常提供类型、宏和函数声明；源文件放函数定义；main 是常见的应用入口，但嵌入式芯片通常先执行启动代码，再进入 main。嵌入式程序往往不靠操作系统替它完成硬件初始化。',process:'从一个最小函数开始，理解预处理、编译、汇编、链接和烧录的分工。头文件包含路径、编译宏、目标 CPU、链接脚本和启动文件都会影响最终产物。先把一个最小程序成功编译，再逐步加入一个变量、一个函数和一个模块。',pitfall:'“编译成功”不代表链接成功，也不代表程序已经烧录或能在目标板运行。托管环境的 main 返回行为与裸机 main 的常见运行方式也不同，需按项目运行时约定设计。',code:String.raw`#include <stdint.h>

static uint32_t boot_count;

int main(void)
{
    boot_count++;
    for (;;) {
        /* 裸机主循环示意 */
    }

function makeFoundationLesson(s) {
 const l = lesson(s.id, s.title, s.minutes, s.summary, [
  {heading:'1. 先建立模型',body:[s.concept]},
  {heading:'2. 从机制走到实践',body:[s.process]},
  {heading:'3. 边界条件与排查',body:[s.pitfall]}
 ], s.take, s.exercise, '');
 l.stage = s.stage || '';
 l.teachingAsset = {
  diagramTitle:s.title,
  nodes:s.flow,
  codeTitle:'示例：' + s.title,
  language: /arm-none-eabi-|objdump|objcopy/.test(s.code) ? 'Shell' : (s.code.trim().startsWith('Reset_Handler:') ? '启动流程伪代码' : 'C / 伪代码'),
  code:s.code,
  explanations:s.explain,
  note:'示例用于说明原理。伪函数、寄存器地址、启动汇编、缓存 API 和工具命令都可能依平台而变；实际工程应以目标 MCU 参考手册、ABI、启动文件和工具链文档为准。'
 };
 return l;
}
