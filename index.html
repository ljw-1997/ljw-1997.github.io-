<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1c3025" />
<meta name="description" content="我的学习工作台：可编辑的知识地图、每日记录与个人知识库。" />
<title>我的学习站 · 学习工作台</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" aria-label="我的学习站"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9 2.8v3.7M15 2.8v3.7M9 17.5v3.7M15 17.5v3.7M2.8 9h3.7M2.8 15h3.7M17.5 9h3.7M17.5 15h3.7M10 10h4v4h-4z"/></svg></div><div class="brand-copy"><div class="brand-title">我的学习站</div><div class="brand-sub">MY LEARNING SPACE</div></div></div>
    <div class="nav-label">工作台 WORKSPACE</div>
    <nav class="nav-list" aria-label="主导航">
      <button class="nav-item active" data-action="navigate" data-page="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg>学习总览</button>
      <button class="nav-item" data-action="navigate" data-page="learning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20M8 7h8M8 10h6"/></svg>学习地图</button>
      <button class="nav-item" data-action="navigate" data-page="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>每日记录</button>
    </nav>
    <div class="nav-label">知识资产 KNOWLEDGE</div>
    <nav class="nav-list">
      <button class="nav-item" data-action="navigate" data-page="resources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 13a5 5 0 0 0 7.1 0l2-2A5 5 0 0 0 12 3.9l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1"/></svg>资源收藏</button>
      <button class="nav-item" data-action="navigate" data-page="knowledge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M8 7h8M8 11h8M8 15h5"/><path d="M4 5.5v13"/></svg>我的知识库</button>
    </nav>
    <div class="nav-label">个人设置 PERSONAL</div>
    <nav class="nav-list"><button class="nav-item" data-action="navigate" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8.1 8.1 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8.1 8.1 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7.5 7.5 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8.1 8.1 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8.1 8.1 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7.5 7.5 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"/></svg>偏好与数据</button></nav>
    <div class="sidebar-bottom"><div class="focus-card"><div class="focus-top"><span>✦</span> 个人知识空间</div><p>课时、笔记与学习记录都可以自己编辑，修改后会自动保存在当前浏览器。</p><div class="focus-progress"><span id="sidebar-learning-progress" style="width:0%"></span></div></div><div class="local-note"><span class="local-dot"></span>本地保存 · 由你掌控</div></div>
  </aside>
  <div class="mobile-nav-backdrop" id="mobile-nav-backdrop" aria-hidden="true"></div>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left"><button class="mobile-menu" id="mobile-menu" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="breadcrumbs"><span>我的学习站</span><span>/</span><strong id="breadcrumb-title">学习总览</strong></div></div>
      <div class="topbar-right"><form id="global-search" class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input name="q" aria-label="搜索笔记、课程和资源" placeholder="搜索课程、笔记、资源…" /></form><div class="today-label" id="top-date"></div><div class="avatar" id="avatar-initial">我</div></div>
    </header>
    <main class="main" id="main" aria-live="polite"></main>
  </div>
</div>
<div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script src="./workspace-schema.js"></script>
<script src="./app.js"></script>
<script src="./sync-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script src="./sync-client.js"></script>
</body>
</html>
